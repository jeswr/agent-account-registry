# Routing table for the SELF-MANAGED registry target (jeswr/agent-account-registry).
# PUBLIC — no account information. Same schema + consumer contract as sparq's
# orchestration/routing.toml: the dispatch PLAN clones this repo and reads this file BY THE
# ROUTING POINTER in policy/repos.toml, and route-resolve.py / policy-resolve.py resolve a
# triaged issue's role/labels to a MODEL fallback-chain + agent.
#
# PRECEDENCE (consumer contract, identical to sparq): security-label overrides > explicit role >
# [defaults], evaluated top-to-bottom, FIRST MATCH WINS. The `[[route]]` blocks with `match_labels`
# (the security surfaces) are listed FIRST and win over the role blocks below them.
#
# match_labels SEMANTICS: a rule matches if ANY of the issue's labels CONTAINS any listed keyword
# as a SUBSTRING. This is ALSO the signal the review-lane ARM-SIDE security classifier consults, so
# the trust-surface areas below are load-bearing for the arm gate, not only for model selection: a
# review that approves an issue matched here is routed to a HUMAN arm (needs:user), never
# auto-armed. THIS repo is the orchestration trust plane, so its worker/dispatch/set-up-account/
# review-loop/groom areas ARE security surfaces.
#
# WHICH CODE ACTUALLY READS THESE KEYWORDS (#578 AC5 — this note said "dispatch-claim.py
# _security_flagged" too, and that was never true; the doc and the code now agree):
#   * THE ARM GATE, and it is the one that matters: review-fix.yml's resolve step calls
#     policy-resolve.routing_security_keywords(<target>) — a FAIL-CLOSED union of every
#     match_labels keyword in the target's routing — and threads it into worker-pr.py
#     security_flagged(..., extra_keywords=...) / live_security_flagged. That is what withholds
#     the auto-arm from a trust-surface PR.
#   * dispatch-claim.py `_security_flagged` does NOT read this table. It stamps the PLAN row's
#     advisory `security` boolean from its OWN built-in SECURITY_KEYWORDS plus the `trust:*` label
#     prefix, and that boolean is never consulted by any dispatch decision (in particular it plays
#     no part in fix-chain selection — #578 constrains that from the resolved ROUTE instead).
#     Threading the target's keywords into it would mean handing a HOSTILE target's routing table
#     to the pure PLAN enumerator to compute a field nothing reads.
# Also mirrored, deliberately and by a self-test rather than by this comment: scripts/triage.py's
# SEC_KEYWORDS must stay IDENTICAL to the match_labels list below.

# ---------------------------------------------------------------------------------------------------
# [models] — the catalog. Mirrors sparq's catalog so the shared account_pool + cross-provider
# review/fix chains resolve identically. A model alias -> provider + harness + concrete provider
# model id + credential format.
[models.haiku]
provider = "anthropic"
harness = "claude"
provider_model = "claude-haiku-4-5"
credential_format = "claude-oauth-token"
[models.sonnet]
provider = "anthropic"
harness = "claude"
provider_model = "claude-sonnet-4-6"
credential_format = "claude-oauth-token"
# DEPRECATED 2026-07-26 (maintainer: "deprecate the use of fable and opus entirely in favour of
# opus5"): [models.opus] (claude-opus-4-8) and [models.fable] (claude-fable-5) were REMOVED from
# this catalog. opus5 is the sole anthropic tier. Enforced, not conventional — scripts/
# policy-resolve.py rejects an unknown model in any chain, and scripts/deprecated-models.py is the
# shared register that dispatch-claim / worker-pr / review-fix are all pinned against.
[models.opus5]
provider = "anthropic"
harness = "claude"
provider_model = "claude-opus-5"      # Opus 5 (maintainer directive 2026-07-24): replaces BOTH
                                       # fable (claude-fable-5) AND opus (claude-opus-4-8) as the
                                       # primary model on every task where they were used — opus5
                                       # is now the TOP anthropic tier. The old tiers stay in every
                                       # chain as TAIL FALLBACKS only (degradation path: an opus5
                                       # capacity outage parks work gracefully instead of stalling
                                       # single-model chains). Probe-verified live 2026-07-24
                                       # (`claude --model claude-opus-5 -p` -> OK).
credential_format = "claude-oauth-token"
[models.terra]
provider = "openai"
harness = "codex"
provider_model = ""                    # EMPTY = omit --model: the codex CLI default tracks the account's
                                       # supported model. A literal placeholder here ("TBD") reached
                                       # `codex exec --model TBD` in every terra fleet worker -> API 400 /
                                       # degraded no-tool-call fallback ("model produced no repository
                                       # changes", 8/8 uniform 2026-07-18). Set a concrete id only once
                                       # verified against the worker account type.
credential_format = "codex-auth-json"
[models.sol]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-sol"         # Frontier codex model (maintainer 2026-07-18): leads impl/ci/site
                                       # chains (credit abundance) + reviews anthropic-authored content.
credential_format = "codex-auth-json"
[models.luna]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-luna"        # Second codex tier (opus<luna<fable<opus5<sol, 2026-07-24:
                                       # opus5 is the top ANTHROPIC tier; sol keeps the global
                                       # frontier slot — cross-provider order unchanged); sol's
                                       # fallback.
credential_format = "codex-auth-json"

# ---------------------------------------------------------------------------------------------------
# [#285] [agents] — AGENT CAPABILITIES. The MACHINE-READABLE declaration of what each persona's
# checked-in brief (`.claude/agents/<name>.md`, loaded by worker-live.sh as the system prompt)
# authorises. `fix_capable` answers exactly ONE question: may this persona be handed a lane that
# MUTATES the checkout?
#
# WHO READS IT: review-fix.yml's resolve step, via policy-resolve.agent_fix_capable. The fix lane
# adopts the SOURCE ISSUE's own route persona ONLY when it is declared `fix_capable = true` here.
# It is a DECLARATION and not an inference: the form this replaced (review round 1) compared the
# route's agent NAME against the persona the `role = "review"` row selects, which adopts any OTHER
# verdict-only persona under a different name AND makes the reviewer adoptable the moment that row
# is repointed — neither has anything to do with what the brief actually permits.
#
# FAIL-CLOSED BY CONSTRUCTION: an undeclared agent, a malformed row, and any value that is not the
# boolean `true` all read as NOT fix-capable, so the lane keeps its `--role impl` implementer. A
# target with no [agents] table adopts no route persona at all.
#
# ONCE THIS TABLE EXISTS, IT BINDS THE FALLBACK TOO (policy-resolve.agent_fix_refused). The persona
# the lane finally PUBLISHES — the route's if it was adopted, otherwise the `--role impl` one —
# must be declared `fix_capable = true` here, so an omitted, renamed or malformed `role = "impl"`
# declaration fails the resolve job closed instead of shipping an undeclared persona to
# `worker-live.sh fix` as a "known fix-capable" fallback. DECLARE A ROW FOR EVERY AGENT YOUR ROUTES
# NAME. Only a target with NO [agents] table at all keeps the pre-declaration behaviour.
#
# KEPT HONEST BY A TEST, not by this comment: dispatch-claim.py's L3b-agent rows read the REAL
# briefs and require every `fix_capable = false` persona to declare itself verdict-only, every
# `fix_capable = true` persona's brief to say it edits the checkout, and every agent named by any
# route below (and by [defaults]) to be declared here at all.
[agents.registry-impl]
fix_capable = true
[agents.registry-ci]
fix_capable = true
[agents.registry-docs]
fix_capable = true
[agents.registry-researcher]
fix_capable = true
# The ONE verdict-only persona. Read-only tools (Read/Glob/Grep), writes nothing but
# `.review-verdict.json`, brief states its job is "never a fix" — handing it to `worker-live.sh
# fix` instructs the fixer not to edit the PR at all, so a compliant model produces no diff.
[agents.registry-reviewer]
fix_capable = false

[defaults]
model_chain = ["opus5", "sol"]
agent = "registry-impl"

# ---------------------------------------------------------------------------------------------------
# SECURITY-LABEL OVERRIDES (first-match; win over role). On the trust plane the orchestration
# surfaces themselves are soundness surfaces: any issue whose labels touch dispatch / worker /
# set-up-account / review-loop / groom runs on Opus 5 (opus-4.8 as tail fallback, 2026-07-24 — the
# fallback exists so an opus5 capacity outage degrades to the previous soundness tier instead of
# stalling the chain) and, on chain-exhaustion, ESCALATES to a human
# (needs:user) rather than degrading to a weaker/cross-provider model. `escalate = true` is
# consumed by dispatch (escalate_starved) AND the substring keywords here are read by the review
# lane's arm-side classifier so an approved trust-surface PR is HUMAN-armed, never auto-armed.
#
# WHAT THE OVERRIDE DOES *NOT* DECIDE (#1397): the PERSONA. With `persona_from_role = true` both
# resolvers take `agent` from the issue's ROLE row whenever it declares one, and fall back to the
# `agent` below only for a ROLELESS issue. A security override answers "how much soundness does
# this surface need?" — chain, escalate, and the arm-side keyword union. It does not answer "is
# this run supposed to WRITE code?"; the `role:*` label does. While it did, every trust-plane
# IMPLEMENTATION issue ({role:impl, area:worker|review-loop|dispatch|groom|set-up-account}) was
# dispatched under `.claude/agents/registry-reviewer.md` — Read/Glob/Grep, byte-identical tree, "a
# single honest verdict, never a fix" — so the areas this repo most needs implemented were the ones
# instructed not to. `role:review`/`role:soundness` still resolve to registry-reviewer through
# their own rows, and the keyword list below is untouched, so the arm gate is exactly as it was.
#
# DECLARED HERE, NOT DEFAULTED IN A RESOLVER, and that is load-bearing: PLAN runs the TARGET's own
# scripts/route-resolve.py while CLAIM runs the registry's scripts/policy-resolve.py, and
# dispatch-claim._route_matches requires EXACT equality of `agent`. A rule only one side
# implemented would raise RouteDivergenceError for every matched issue on every tick. Because the
# rule is DATA, a target whose table omits it (sparq-org/sparq today) keeps the pre-#1397 behaviour
# on BOTH sides — mirror this key into a target's own routing.toml only once its briefs carry the
# `capability:` declaration (AGENTS.md) and its route-resolve.py copy reads the key.
#
# `security` (PR #595 review finding 1) is a Phase-1 trigger in its OWN right, not only via an
# area:* section: scripts/triage.py maps the `kind:security` label to the trust-plane role
# (TRUST_PLANE_ROLE), and before this keyword existed such an issue matched NO security rule — so
# {priority:P1, area:usage, kind:security} resolved to the plain impl route (["sol", "opus5",
# "fable", "opus"] / registry-impl / escalate = false): trust-plane work on a non-escalated,
# AUTO-ARMABLE chain. The label is the durable signal, so the trigger belongs here (Phase 1),
# where BOTH resolvers and the arm-side classifier read it. triage.py's SEC_KEYWORDS must stay
# IDENTICAL to this list — its self-test asserts the equality and enumerates every trust-plane
# kind, so dropping this keyword turns the enrolled suite red.
[[route]]
match_labels = [
  "dispatch", "worker", "set-up-account", "review-loop", "groom",
  "zk", "mpc", "crypto", "auth", "e2ee", "security",
]
model_chain = ["opus5"]
agent = "registry-reviewer"    # ROLELESS issues only (#1397) — a role:* label directs the persona.
escalate = true
persona_from_role = true       # #1397, see "WHAT THE OVERRIDE DOES *NOT* DECIDE" above.

# ---------------------------------------------------------------------------------------------------
# ROLE ROUTES. OPUS 5 is the primary code-writer (maintainer directive 2026-07-26: "Opus5 should
# be prioritised over sol on all tasks for which they are both possible implementors; except for
# GUI work where sol should remain prioritised"). sol remains the cross-provider fallback on those
# routes, so an Anthropic outage does not stall them. `role:impl` is the ONE EXCEPTION since
# 2026-07-26: sol was removed from it outright on the registry #738 measurement (see that route).
#
# These chains LED WITH SOL until 2026-07-26, under the 2026-07-18 "credit abundance" directive
# taken during a high-sol-availability window. That steer never expired, and because
# select-and-claim.choose_account walks `model_chain` IN ORDER and takes the first available
# account, a sol-first literal won every route on every tick regardless of later availability.
# The mechanism was the chain ORDER, not a heuristic — hence the fix is the order.
#
# THE `area:gui` CARVE-OUT DOES NOT APPLY HERE: this repo has no `area:gui` (its UI surface is
# `area:dashboard` -> role:site). The maintainer scoped the carve-out to "area:gui work" only, so
# this repo's site/dashboard route takes the opus5-first default. Flagged in the PR body.
#
# docs -> sol-led (the separate docs-writing directive); role=docs is still the ONLY surface where
# the docs-only alias terra/sonnet may appear — policy-resolve.py rejects them in any other route.

# [OPUS-5] `role:impl` IS OPUS5-ONLY SINCE 2026-07-26 — sol was REMOVED, not demoted.
#
# MAINTAINER DECISION 2026-07-26, taken on the measurement in registry #738: "Remove sol from impl
# fallback." This is a change from PREFERENCE to EXCLUSION and it applies to `role:impl` ONLY. The
# standing 2026-07-26 directive ("Opus5 prioritised over sol on all tasks where both are possible
# implementors; except GUI work where sol remains prioritised") still governs every other route, so
# `role:site` / `role:ci` / `role:perf` keep sol as a fallback and `role:docs` keeps its sol LEAD.
#
# WHAT WAS MEASURED (registry #738, `worker.yml`, n=74 runs in a 3h24m window, labels reconstructed
# as-of each run's timestamp):
#   * `role:impl` first-attempt yield — the SAME route, the same agent brief, the same prompt —
#     sol 7/40 = 18%, opus5 12/14 = 86%.
#   * 4 of 4 issues where a sol run left the tree unchanged and opus5 later ran THAT SAME issue,
#     opus5 produced a PR (sparq#2411, #2639, #3110, #3210). No counterexample either way.
#   * Every issue-side axis (body length, epic origin, priority, named paths) has ~4x less
#     explanatory power than the model axis; opus5 converted 6/7 on its shortest-body quartile,
#     median body length 26 characters.
#   * Budget exhaustion is REFUTED as the cause: the longest no-diff model step in the window was
#     177s against a 90-minute worker timeout. sol stops VOLUNTARILY, at ~60s median.
#
# WHY EXCLUSION AND NOT MERELY SECOND PLACE. `select-and-claim.choose_account` walks `model_chain`
# IN ORDER and takes the first AVAILABLE account, so a second rung is not a tie-break — it is what
# serves the request whenever the first rung's accounts are busy. opus5 holds an account ~17 min per
# run and sol clears in ~1 min, so during any dispatch burst the low-yield rung served the majority
# of `role:impl` work. Ordering could not fix that; only removing the rung can.
#
# THE EXIT (the same shape `role:research` uses, and for the same reason). A single-rung chain with
# no `escalate` has NO exit: on an opus5 capacity outage the item defers, and defers again, with no
# human ever notified. So this route escalates. `escalate = true` is consumed by
# `dispatch-claim.escalate_starved` + `escalate_persist_decision`: the FIRST starved tick counts
# `escalate-tier-starved-transient`, keeps the issue `status:deferred` and auto-retries; only
# CONTINUOUS starvation past ESCALATE_PERSIST_SECONDS is promoted to the MACHINE-owned
# `status:parked` soft hold, which lifts by itself when capacity returns. It is never `needs:user`
# — capacity starvation is not a human question (park_policy.py defect 1).
[[route]]
role = "impl"
model_chain = ["opus5"]
agent = "registry-impl"
escalate = true

# [FABLE-5] STANDING RULE — UI/front-end ownership (maintainer decision 2026-07-17): UI/front-end
# surfaces route to the openai/codex model chain (original-builder ownership: GPT-5.6 codex built
# the registry dashboard, e4098b9). Repos onboarded to the registry inherit this default — mirror
# this route (sol-led site chain; terra is docs-only, 2026-07-18) into each target's routing.toml
# (sparq's already carries it).
# Deliberately a ROLE route, not match_labels: the arm-side security classifier (review-fix.yml)
# unions ALL match_labels keywords, so UI keywords there would human-arm every UI PR.
[[route]]
role = "site"
model_chain = ["opus5", "sol"]
agent = "registry-impl"

# [FABLE-5] STANDING RULE — frontier-tier CI/infrastructure authorship (maintainer decision
# 2026-07-17, same standing-rule pattern as the UI→codex route above): ALL CI/infrastructure work
# — .github/workflows, gate aggregators, orchestration plumbing, the self-draining pipeline itself
# — is authored by a FRONTIER-tier model only: sol (GPT-5.6 codex) or the anthropic frontier tier
# (opus5 primary since 2026-07-24; fable retained as its tail fallback).
# Cheaper tiers (sonnet/haiku) no longer author infra — and terra/sonnet are docs-only
# (2026-07-18); cross-provider review is unchanged.
# FRONTIER-ONLY chain rather than a floor marker: the routing schema has no floor/pin field (the
# fix-floor pin is a review-loop concept, dispatch-claim.py), and chain exhaustion at the claim
# step already DEFERS the item (retried next tick) instead of degrading — see dispatch-claim's
# "a starved pinned chain DEFERS (defer-not-fallback)" self-test. NOT `escalate = true` (that
# flips a starved item to needs:user; this rule wants defer+retry). On THIS repo most infra
# surfaces (dispatch/worker/set-up-account/review-loop/groom) are trust surfaces matched by the
# security override above, whose CHAIN still WINS (opus + human arm) — correct and unchanged;
# the PERSONA comes from this row (#1397), so a trust-surface CI issue runs registry-ci; role:ci
# covers the residual CI plumbing (.github/workflows etc., triage labels area:ci/area:workflows).
# Repos onboarded to the registry inherit this rule — mirror a frontier-only `role = "ci"` chain
# into each target's routing.toml (sparq-org/sparq carries it, PR #3422).
[[route]]
role = "ci"
model_chain = ["opus5", "sol"]
agent = "registry-ci"

# [OPUS-5] research was ["opus5", "fable", "opus"] until 2026-07-26. Retiring the two tail rungs
# left a ONE-RUNG chain with no `escalate` — i.e. no exit at all: on an opus5 capacity outage the
# item could only defer forever, with no human ever notified. Deprecating a fallback has to come
# with an exit, so research now escalates like the other single-rung chains.
[[route]]
role = "research"
model_chain = ["opus5"]
agent = "registry-researcher"
escalate = true

# [OPUS-5] docs KEEPS its sol lead — that is the separate 2026-07-26 docs-writing directive
# ("deprecate sonnet and haiku for docs writing in favor of gpt 5.6 sol"), not the implementor
# preference below. haiku led this chain until 2026-07-26.
[[route]]
role = "docs"
model_chain = ["sol", "opus5"]
agent = "registry-docs"

# Review / soundness: Opus-5-led (opus-4.8 tail fallback, directive 2026-07-24 — the fallback is a
# degradation path so an opus5 capacity outage parks work instead of stalling the chain); escalate
# to a human on chain exhaustion (never fall to a weaker
# model). The review chain proper is computed cross-provider by dispatch-claim.py; this row exists
# so a `role:review`/`role:soundness` issue resolves + so policy-resolve escalate is set.
[[route]]
role = "review"
model_chain = ["opus5"]
agent = "registry-reviewer"
escalate = true

[[route]]
role = "soundness"
model_chain = ["opus5"]
agent = "registry-reviewer"
escalate = true
