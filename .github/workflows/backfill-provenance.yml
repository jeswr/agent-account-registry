# Manual recovery for worker PRs missing their registry provenance record — the #96 outage
# population (worker succeeded, the provenance job's protected-master write failed) and any
# pre-migration stragglers. Runs scripts/backfill-provenance.py, which reconstructs the
# implementer identity ONLY from trusted run-log lines — the failed provenance job's own command
# and env echoes (REQUIRED, and bound to this PR by `--pr` or `HEAD_BRANCH`), corroborated by the
# claim job's lease line — job-prefix-anchored so model output can never forge it, and writes
# records to the `ledger` data-plane branch. Both worker.yml invocation shapes are read (#712).
# A PR it cannot resolve is reported with a SPECIFIC reason (log unreadable / no anchored source /
# sources disagree / partial evidence / binding mismatch / author mismatch) and left fail-closed
# invisible — the reasons are distinct because the responses are. Recording provenance and
# converting a PR to draft are INDEPENDENT actions (#726): a PR already in the merge queue, armed,
# or `review:pass` is recorded but never drafted, because drafting evicts it from the queue.
# DRY RUN unless apply=true — EXCEPT on the schedule, which always applies (see below).
#
# [registry #710] IT IS NO LONGER MANUAL-ONLY, AND THAT IS THE POINT. A worker PR whose provenance
# job failed reserves the `__global__` partition in dispatch-claim.busy_packages_of_pulls, which
# defers EVERY issue-lane row fleet-wide. Until this schedule existed, the only exit from that state
# was a human noticing and dispatching this workflow by hand — so one failed API read at the end of
# one worker run bought an open-ended dispatch outage. A hold whose only exit is a human is not an
# exit. The schedule bounds the damage at one cron period, for every enabled policy target, without
# weakening the fail-closed reader by a single line: it repairs the DATA, exactly as designed.
#
# WHY IT CONVERGES EVEN THOUGH THE CAUSE IS AN EXHAUSTED API BUDGET: a scheduled run that is itself
# rate-limited fails loudly and the next period retries, in a different budget window. The in-job
# bounded retry (scripts/gh_retry.py) cannot span a primary rate-limit window; this can.
name: backfill-provenance
run-name: backfill-provenance ${{ github.event_name == 'schedule' && 'ALL enabled targets apply=true' || format('{0} apply={1}', inputs.target_repo, inputs.apply) }}

on:
  schedule:
    # Every 20 minutes. The dispatch tick floor is 10 minutes (#822), so a lost record now costs
    # at most ~2 ticks of `__global__` reservation instead of an unbounded wait for a human.
    #
    # THE BUDGET, MEASURED — because this workflow spends the same `github.token` installation
    # budget whose exhaustion loses the records, and an earlier revision of this comment claimed
    # the :9/:29/:49 offset "is not competing with the tick for the budget", which is FALSE. An
    # offset changes only WHEN the requests land; it cannot reduce an HOURLY total by one request.
    # It is kept for burst separation and nothing else. The real answer is the cost:
    #
    #   yardstick (scripts/dispatch-tick-floor.py, measured): a dispatch tick costs 613 requests,
    #     the 10-min floor caps that at 6/h = 3678/h, and OBSERVED_SAFE_REQUESTS_PER_HOUR is 4291
    #     (OBSERVED_BREAKING is 7969) — so ~613 requests/h of headroom exist for everything else.
    #
    #   this schedule, steady state: 1 pull-listing request per target per pass and nothing else,
    #     because the existing-record probes now read from the ledger/default-branch CHECKOUTS
    #     (see the checkout steps below). 2 targets x 3 passes = ~6 requests/h, ~1% of headroom.
    #     Before that change it was ~93 per pass = ~279/h, i.e. ~46% of the headroom, permanently.
    #
    #   this schedule, worst case (the outage it repairs — every open worker PR recordless): the
    #     irreducible per-PR cost is the run-log read (3) + the commit listing (1) + the record
    #     write's own live CAS probes (3). At 73 open worker PRs that is ~512 requests for the
    #     ONE pass that repairs them; the next two passes are back to ~1. ~518/h, inside headroom.
    - cron: '9,29,49 * * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target owner/repository (must be enabled in policy/repos.toml)
        required: true
        default: sparq-org/sparq
        type: string
      apply:
        description: Write records + convert to draft (false = dry run)
        required: false
        default: false
        type: boolean
      no_draft_convert:
        description: >-
          Record provenance ONLY, never touch draft state. Belt-and-braces over the review-state
          predicate, which already refuses to draft a queued/armed/review:pass PR (issue #726).
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: backfill-provenance
  cancel-in-progress: false

jobs:
  # [registry #710] The `inputs` context is EMPTY on a schedule event — `workflow_dispatch`'s
  # `default:` does NOT apply — so a scheduled run must derive its own target list and apply flag.
  # That resolution is `backfill-provenance.resolve_dispatch_inputs`, a PURE function with its own
  # red tests, deliberately NOT a `${{ a && 'x' || y }}` ternary: a ternary can only ever be
  # asserted structurally, and string-equality on an expression proves the text is there, never
  # that it evaluates the way the comment claims. This job holds NO secret.
  resolve:
    name: Resolve enabled policy targets + the apply flag
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      apply: ${{ steps.resolve.outputs.apply }}
    steps:
      - name: Checkout private registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REPO: ${{ inputs.target_repo }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python3 scripts/backfill-provenance.py --self-test
          python3 - <<'PY'
          import importlib.util, json, os, tomllib
          spec = importlib.util.spec_from_file_location(
              "backfill", "scripts/backfill-provenance.py")
          backfill = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(backfill)
          # The ENABLED policy rows are the only admissible targets, read from the protected
          # default-branch checkout this job is pinned to. Each matrix leg re-enforces its own row
          # anyway (defence in depth) — this list only decides WHICH legs exist.
          rows = tomllib.load(open("policy/repos.toml", "rb")).get("repos", {})
          enabled = sorted(name for name, row in rows.items()
                           if isinstance(row, dict) and row.get("enabled") is True)
          targets, apply_changes = backfill.resolve_dispatch_inputs(
              os.environ["EVENT_NAME"], os.environ.get("TARGET_REPO", ""),
              os.environ.get("APPLY", ""), enabled)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"targets={json.dumps(targets)}\n")
              out.write(f"apply={'true' if apply_changes else 'false'}\n")
          print(f"resolved targets={targets} apply={apply_changes} "
                f"event={os.environ['EVENT_NAME']}")
          PY

  backfill:
    name: Backfill missing provenance records (ledger branch)
    needs: resolve
    # The salt is a secret: refuse to run from any non-default ref (a modified branch copy of
    # this workflow must never see it — the sol-audit arbitrary-ref class).
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    strategy:
      # One target's failure must never cancel another's repair — the whole point is that every
      # enabled target gets a machine exit, not that the first one does.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SECRET-EXFIL GUARD (issue #101): reads PROVENANCE_SALT, which lives in the `dispatch-secrets`
    # environment (deployment-branch policy: default branch only) — full rationale on the `claim`
    # job in dispatch.yml. Complements (does not replace) the in-file ref guard above.
    environment: dispatch-secrets
    permissions:
      contents: write   # ledger-branch record PUTs via github.token
      actions: read     # worker run-log reads (the identity source)
    steps:
      - name: Checkout private registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # [registry #710] The `ledger` data plane, ON DISK. Every open worker PR needs an
      # "is it already recorded?" read, and each of those used to be a Contents API request
      # against `github.token` — MEASURED 93 per scheduled pass across the two enabled targets,
      # spent on the same installation budget whose exhaustion is what loses the records in the
      # first place. `actions/checkout` fetches over the git protocol and costs that budget
      # NOTHING, so the whole probe stage becomes free. The default-branch copy (the legacy
      # pre-ledger record location) is the checkout above, at the workspace root.
      - name: Checkout the ledger data plane (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ledger
          path: ledger-data
          persist-credentials: false

      - name: Checkout public target for protected routing data (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.target }}
          path: target-routing
          persist-credentials: false

      - name: Enforce the policy row (enabled target + ITS validated routing pointer)
        id: policy
        env:
          TARGET_REPO: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::unsafe target repo'; exit 1; }
          python3 - <<'PY'
          import os, sys, tomllib
          from pathlib import Path, PurePosixPath
          target = os.environ["TARGET_REPO"]
          row = tomllib.load(open("policy/repos.toml", "rb")).get("repos", {}).get(target)
          # Only an ENABLED policy target may be backfilled (sol r1: syntax-only checking
          # permitted provenance pre-seeding for arbitrary public repositories), and the
          # routing file comes from the row's validated pointer, never a hardcoded path.
          if not isinstance(row, dict) or row.get("enabled") is not True:
              raise SystemExit(f"::error::{target} is not an enabled policy target")
          routing = row.get("routing")
          if not isinstance(routing, str) or not routing:
              raise SystemExit("::error::policy row carries no routing pointer")
          root = Path("target-routing").resolve()
          resolved = root.joinpath(*PurePosixPath(routing).parts).resolve()
          resolved.relative_to(root)  # traversal guard — raises on escape
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"routing_file=target-routing/{routing}\n")
          PY

      - name: Backfill (self-test first; dry run unless apply=true)
        env:
          GH_TOKEN: ${{ github.token }}
          # Raw handles never appear in output — the script prints only the salted hash. A
          # non-draft PR needing conversion is WARNed with the manual command (github.token
          # has no target write; the outage population is already draft).
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          TARGET_REPO: ${{ matrix.target }}
          # RESOLVED, never `inputs.apply` — which is EMPTY on a schedule event and would make the
          # cron a dry run, i.e. a machine exit that repairs nothing (registry #710).
          APPLY: ${{ needs.resolve.outputs.apply }}
          NO_DRAFT_CONVERT: ${{ inputs.no_draft_convert }}
          ROUTING_FILE: ${{ steps.policy.outputs.routing_file }}
        # NO `continue-on-error`, and the exit code is deliberately NOT swallowed: exit 2 means
        # open worker PRs are still holding `__global__` after this pass, which is an active
        # fleet-wide dispatch outage and must red the run. `set -e` propagates it; the script has
        # already emitted the `::error` annotation naming the population.
        run: |
          set -euo pipefail
          python3 scripts/backfill-provenance.py --self-test
          # --ledger-records / --master-records serve the existing-record probes from the two
          # checkouts above instead of the Contents API: 0 `github.token` requests where there
          # were 1-2 per open worker PR (registry #710). The script REFUSES a root that is
          # missing or carries no provenance directory, so a broken checkout fails this pass
          # loudly instead of reading every record as absent.
          args=(--target-repo "$TARGET_REPO" --registry-repo "$GITHUB_REPOSITORY" \
                --routing-file "$ROUTING_FILE" \
                --ledger-records ledger-data --master-records .)
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          if [[ "$NO_DRAFT_CONVERT" == "true" ]]; then args+=(--no-draft-convert); fi
          python3 scripts/backfill-provenance.py "${args[@]}"
