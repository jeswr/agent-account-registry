# The registry's own required PR gate. The onboarded review lane arms a PR with
# the sha-bound enablePullRequestAutoMerge mutation (allow_auto_merge is enabled live on the
# repo; never `gh pr merge --auto`, which direct-merges — sol r4 on #334); that latch only merges when
# a REQUIRED status check named `gate` is green. This workflow IS that check — a `pull_request`
# job literally named `gate` running the registry-selftest suite (python --self-test + actionlint).
# It is also the authoritative check dispatch-claim.py's CI_GATE_CHECK reads (name == "gate").
#
# The orchestrator requires this via a ruleset AFTER push (documented in the commit message):
#   required_status_checks context 'gate'; NO require-pull-request rule (direct pipeline pushes —
#   worker/review-fix branch pushes — must stay allowed). Do NOT create the ruleset here.
#
# Least privilege: contents:read only (the gate reads code + runs tests; it never writes). Actions
# are SHA-pinned, and the gate enforces that policy on itself (sol audit #221): every non-local
# `uses:` reference in every workflow must be a full 40-hex commit pin — actionlint does not check
# that, so without the assertion a regression to a mutable tag would pass this REQUIRED check.
# PyYAML is installed version- and hash-locked for the same reason: a mutable PyPI release must not
# be able to break or influence the gate. actionlint is fetched as a pinned release binary verified
# against the release's published sha256 (the raven-actions installer broke under the runner's
# forced Node-24 migration, and `go install` is checksum-free — a pinned+checksummed direct
# download is the sturdiest option). That pin lives in ONE place, scripts/actionlint.pin (#431),
# which this gate and the worker lane's scripts/worker-live.sh both parse, so a bump is a single
# edit and the two lint lanes can never drift onto different actionlints.
name: pr-gate

on:
  pull_request:
    # `edited` and `converted_to_draft` are here for the advisory step below (#1115), and only for
    # it: the two facts that step diagnoses — the closing references in the TITLE/BODY, and
    # DRAFTNESS — are the only inputs to this job that change without the head sha changing, so
    # without these two activity types the note is delivered once at `opened` and then goes stale
    # against the very edit it asks the author to make. Concretely: a pull that opens with one
    # valid reference and later edits it away, or adds a second, is never warned; a ready pull
    # converted BACK to a draft never gets the draft explanation (`ready_for_review` only covers
    # the other direction); and an author who repairs a warned body gets no clean run to confirm
    # it, leaving the warning as the last word.
    #
    # THE COST, STATED. Each added type is a full `gate` run at an UNCHANGED head, so this trades
    # runner time for the advisory being true whenever it is displayed. It is bounded: nothing in
    # this repository edits a pull body or title in code (the lanes write COMMENTS and LABELS), and
    # `converted_to_draft` fires on the arm lane's fail-closed `gh pr ready --undo` restore, which
    # is per-arm-failure, not per-tick. NOT a correctness change either way — `gate` is required and
    # sha-bound, so an extra run at the same head can only re-derive the same verdict, and the
    # concurrency group below already resolves the ready/undo churn pair the same way it resolves a
    # push burst (cancel the older run; `_live_repair_gate` is newest-run-wins, so a cancelled twin
    # cannot decide a head whose real run is newer).
    #
    # Membership is PINNED by `pr-body-ref.py --self-test`'s workflow-seam assertion, as an exact
    # set: dropping either of these two silently restores the stale-advisory hole, and adding a
    # type nobody argued for is equally a change to what this required gate runs on.
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      # [issue #920] BEFORE any assertion runs, say WHICH TREE is about to be graded. GitHub does
      # not recompute `refs/pull/N/merge` when the base branch moves, so a green here can be
      # evidence about a composition that no longer exists — #888 (a stricter check) and #900 (a
      # violation of it) were both graded green against pre-#888 trees and composed red on master
      # for over an hour. The report is deliberately first: the stale-base reading is most needed
      # on the runs that go on to FAIL, and a later step never prints. Report-only by design (see
      # the script header); the hard-gate options are repository settings and the maintainer's.
      # The name is QUOTED: an unquoted plain scalar ends at ` #`, so the issue reference would be
      # parsed as a trailing comment and the step would render under a truncated name.
      - name: "Report whether this run graded the tree the PR will land on (#920)"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 scripts/gate-staleness.py --head-sha "$PR_HEAD_SHA" --base-ref "$PR_BASE_REF"

      - name: Install PyYAML for the workflow-yaml lint (version + hash locked)
        run: |
          set -euo pipefail
          # A REQUIRED gate must not depend on a mutable release (sol audit #221): pin the exact
          # version AND its PyPI sha256 digests (manylinux cp312 x86_64 + aarch64 wheels).
          # --only-binary forbids a fallback sdist build, whose isolated build deps pip would
          # download WITHOUT hash-checking.
          cat > "$RUNNER_TEMP/gate-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/gate-requirements.txt"

      - name: Advisory — can the review lane enumerate this pull? (ANNOTATION ONLY, never blocking)
        # [issue #1115] The ONE step in this REQUIRED job that must not be able to fail it, and the
        # only one carrying `continue-on-error`. Two INDEPENDENT controls, because they fail in
        # different places: the script returns 0 on every RUNTIME path (asserted by its own
        # --self-test, which drives the entry point over an unreadable event path and an unparseable
        # policy), and this key covers what that cannot — an IMPORT-time failure in one of the four
        # sibling modules the script loads, which would otherwise red the gate for every pull in the
        # repository before `main()` is ever reached. Same shape as worker.yml's annotation-only
        # steps; NOT the shape dispatch.yml forbids, which is about a step that decides something.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Measured with #937 merged: of the 17 live orchestrator-class open pulls, 8 refuse
          # `no-issue-reference` and 6 are drafts — the lane admits 1, and that one is #937 itself.
          # Both are one-edit-recoverable refusals that nothing ever told the author about, so the
          # note is delivered here, on the pull, while it is being written
          # (research/657-orchestrator-provenance-minting.md §10).
          #
          # Placed AFTER the PyYAML install and BEFORE the network-bound actionlint fetch: it needs
          # the author to get the note even when the gate reds later for an unrelated reason, and
          # its sibling imports must not be the first thing in the job to touch a missing dep.
          #
          # It warns only where auto-mint-provenance is GUARANTEED to refuse (see the soundness
          # argument in the script header) — no false alarms — and it grants, admits and writes
          # nothing; auto-mint-provenance stays the sole authority.
          #
          # The payload is read from $GITHUB_EVENT_PATH BY THE SCRIPT, so no GitHub expression
          # interpolation of the attacker-controlled PR title/body reaches this shell at all — the
          # two values below are runner-set environment variables, not workflow expressions. (This
          # comment deliberately spells no empty expression literal: `run:` bodies are expanded
          # before the shell sees them, comments included, and a REQUIRED gate is the wrong place to
          # rely on the parser tolerating one.) No author text is ever echoed
          # into the annotation stream (which is a control channel — a body carrying `::error::`
          # would otherwise forge a gate failure). No network call and no `gh`: the check reads the
          # raw title and body with the reader's own imported grammar and nothing else.
          python3 scripts/pr-body-ref.py check \
            --event-path "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"

      - name: Install actionlint (pinned release, sha256-verified)
        run: |
          set -euo pipefail
          # [issue #431] The version + tarball checksum are read from scripts/actionlint.pin — the
          # SINGLE SOURCE shared with scripts/worker-live.sh's _ensure_actionlint. They used to be
          # hard-coded in both lanes, so a bump could land in one and leave the two lint lanes on
          # DIFFERENT actionlints; a bump is now one edit, and worker-live.sh's --self-test asserts
          # this step still reads the pin file and carries no version/checksum literal of its own.
          # The file is PARSED, never sourced: each key must appear exactly once and its value must
          # match that key's exact shape, so a missing/duplicated/malformed pin refuses here rather
          # than fetching an artifact this step could not verify. The pins stay checked in and are
          # never env-supplied.
          pin=scripts/actionlint.pin
          pin_value() {
            local key=$1 pattern=$2
            local keyed
            keyed=$(grep -c -E "^${key}=" -- "$pin") || return 1
            [ "$keyed" = 1 ] || return 1
            grep -E "^${key}=${pattern}\$" -- "$pin" | cut -d= -f2-
          }
          ver=$(pin_value ACTIONLINT_VERSION '[0-9]+(\.[0-9]+)*') \
            || { echo "::error::$pin: ACTIONLINT_VERSION missing, duplicated or malformed"; exit 1; }
          sha256=$(pin_value ACTIONLINT_TARBALL_SHA256_LINUX_AMD64 '[0-9a-f]{64}') \
            || { echo "::error::$pin: ACTIONLINT_TARBALL_SHA256_LINUX_AMD64 missing, duplicated or malformed"; exit 1; }
          bin_sha256=$(pin_value ACTIONLINT_BIN_SHA256_LINUX_AMD64 '[0-9a-f]{64}') \
            || { echo "::error::$pin: ACTIONLINT_BIN_SHA256_LINUX_AMD64 missing, duplicated or malformed"; exit 1; }
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -C "$RUNNER_TEMP/actionlint-bin" -xzf /tmp/actionlint.tar.gz actionlint
          # [issue #849] BOTH digests, as scripts/worker-live.sh's _fetch_pinned_actionlint_unpack
          # already does: a verified tarball does not prove a correct EXTRACTED binary (partial
          # extraction, tar quirk). Verified BEFORE $GITHUB_PATH, so a mismatch kills the gate here
          # rather than putting an unverified binary on PATH for the lint step to execute.
          echo "${bin_sha256}  $RUNNER_TEMP/actionlint-bin/actionlint" | sha256sum -c -
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Run the full registry self-test suite (sandboxed — no self-test may reach the real gh)
        run: |
          set -euo pipefail
          base_manifest="$RUNNER_TEMP/base-selftest-suite.txt"
          base_retirements="$RUNNER_TEMP/base-selftest-retirements.txt"
          # [issue #920] THE PROTECTED BASELINE IS READ FROM THE GRADED BASE — `HEAD^1` of the
          # checked-out merge commit — NOT `github.event.pull_request.base.sha`. They are DIFFERENT
          # COMMITS: GitHub does not recompute `refs/pull/N/merge` when the base branch moves
          # (#920 measured a graded base 24 commits and 12 hours behind master on #756), while the
          # event field is re-read per `pull_request` event, so the two drift apart by exactly the
          # staleness gate-staleness.py reports one step above.
          #
          # THAT DRIFT IS A FALSE RED, AND IT IS THE WHOLE POPULATION. This baseline exists to
          # refuse a pull request that DROPS an enrolled entry. An entry ENROLLED on the base
          # branch after this merge ref was composed is absent from the graded tree through no act
          # of the pull request — and against an event-field baseline it reads as "removed without
          # prior base-branch retirement approval". `print-selftest-suite` then exits non-zero,
          # `suite` is never assigned, and this required gate reds for EVERY open pull request
          # composed before that enrolment, none of which can fix it from its own diff. Comparing
          # the graded tree against the base it was actually composed with is the same refusal for
          # a real removal — the merge result still lacks the entry the graded base has — and no
          # refusal at all for an addition the pull request never saw.
          #
          # FAIL CLOSED on anything that is not the two-parent merge commit: a `ref:` override or a
          # non-`pull_request` checkout makes `HEAD^1` some unrelated commit, and a baseline
          # derived from the wrong tree is precisely what this step must not do. (The same operand,
          # read the same way, is what gate-staleness.py and compose-gate.py already grade from.)
          base=$(git rev-parse --verify --quiet "HEAD^1^{commit}" || true)
          head_parent=$(git rev-parse --verify --quiet "HEAD^2^{commit}" || true)
          third_parent=$(git rev-parse --verify --quiet "HEAD^3^{commit}" || true)
          if [ -z "$base" ] || [ -z "$head_parent" ] || [ -n "$third_parent" ]; then
            echo "::error::HEAD is not the two-parent refs/pull/N/merge commit this gate grades; refusing to derive the self-test suite"
            exit 1
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::graded base commit $base is unresolvable; refusing to derive the self-test suite"
            exit 1
          fi
          # Bootstrap only: the introducing PR's base has no shared manifest yet, so its current
          # complete manifest is the protected baseline. Every later PR reads the graded base's copy.
          if git cat-file -e "$base:scripts/selftest-suite.txt" 2>/dev/null; then
            git show "$base:scripts/selftest-suite.txt" > "$base_manifest"
          else
            cp scripts/selftest-suite.txt "$base_manifest"
          fi
          if git cat-file -e "$base:scripts/selftest-retirements.txt" 2>/dev/null; then
            git show "$base:scripts/selftest-retirements.txt" > "$base_retirements"
          else
            : > "$base_retirements"
          fi
          suite=$(bash scripts/worker-live.sh print-selftest-suite "$base_manifest" "$base_retirements")
          n=0
          # Every enrolled self-test runs through worker-live.sh's `run-selftest` SANDBOX, never
          # directly: it puts a refusing `gh` shim first on PATH and reds if any self-test reached
          # the real binary. Two suites wrote to production in one night with a green gate, so the
          # control sits OUTSIDE the process rather than inside it. This loop is asserted verbatim
          # by worker-live.sh's self-test — a direct invocation reintroduced here fails that check.
          escapes="$RUNNER_TEMP/gh-escape-report.txt"
          : > "$escapes"
          for s in $suite; do
            echo "== self-test $s =="
            bash scripts/worker-live.sh run-selftest "$s" 2>&1 | tee -a "$escapes"
            ((n += 1))
          done
          [[ "$n" -gt 0 ]] || { echo "::error::self-test suite ran vacuously"; exit 1; }
          # INDEPENDENT CHANNEL. The loop above trusts run-selftest's EXIT STATUS, so an edit that
          # suppresses that status (`run_enrolled_selftest "$2" || true`) greens this step while the
          # escape still happens — measured: the refusal row fires and the command still exits 0.
          # Suppressing the status does NOT suppress the OUTPUT, so assert on the output too. These
          # two signals fail independently; one silenced does not silence the other.
          if grep -q '^::error::gh-escape ' "$escapes"; then
            echo "::error::a self-test reached the real gh — see the gh-escape rows above"
            exit 1
          fi
          echo "ran $n self-tests"

      # [issue #1304] The suite above graded `refs/pull/N/merge` — a real composition ref, but one
      # GitHub does NOT recompute when the base moves. On #756 that ref was composed from a base tip
      # 24 commits and 12 hours behind master, and the recorded green was never invalidated: the
      # check-run binds to the PR HEAD sha, which does not move when the base does, and
      # `rulesets: []` + `strict: false` mean nothing requires a re-run. #920's gate-staleness step
      # above REPORTS that; #940's arm-side guard REFUSES on it. Both compare SHAs. Neither answers
      # the question that decides whether the staleness matters — does the composition still PASS?
      #
      # MEASURED on the real #756 against the real tip 45ada45a4: the merge is textually CLEAN, both
      # sides pass their self-tests ALONE, and the composition fails two of them. That mode is
      # invisible today — `git merge` succeeding is exactly what hides it.
      #
      # This step is the ENFORCEMENT, and it needs no repository setting: `gate` is already the one
      # required context the arming latch waits on, so a composition break redding this step reds a
      # REQUIRED check and `enablePullRequestAutoMerge` cannot fire. `strict: true` and a merge queue
      # (#920's options (1) and (2)) remain the maintainer's calls and are NOT taken here.
      #
      # ⚠️ ONLY a SEMANTIC break reds. A textual conflict with the moved base is the author's routine
      # problem — already visible as `mergeable_state: DIRTY`, already the conflict-resolver's lane —
      # and redding every open PR the moment master moves textually is how a check gets switched off
      # in a day. It is a `::warning::` and exits 0. The two modes are never one red.
      #
      # COST: zero when the graded base already IS the live tip (one `rev-parse`, no tests). When
      # stale it re-runs only the OVERLAP — enrolled entries either side touched since the merge base
      # — from the local object store. NO API CALL on any route, which matters while `groom` is
      # shedding ~22% of its runs to `403 rate limit exceeded`.
      - name: "Grade the composition PR ⊕ the CURRENT base tip, not the frozen merge ref (#1304)"
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 scripts/compose-gate.py --base-ref "$PR_BASE_REF"

      - name: bash -n every shell script
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/*.sh; do
            echo "== bash -n $f =="
            bash -n "$f"
          done

      - name: node --check every dashboard renderer script
        run: |
          set -euo pipefail
          # [issue #613] dashboard/app.js is the LAST hop on the public surface — dashboard-gen's
          # decision-22 privacy assertions and its fail-closed availability semantics are
          # re-implemented defensively in JS — and NO gate looked at it. `node --check` parses
          # without executing, so it is safe on untrusted PR head content. Both failure modes are
          # fail-closed: no node, or no file swept, refuses rather than reporting a vacuous pass.
          shopt -s nullglob
          command -v node >/dev/null 2>&1 \
            || { echo "::error::node is unavailable; refusing to skip the dashboard renderer parse"; exit 1; }
          n=0
          for f in dashboard/*.js dashboard/*.mjs dashboard/*.cjs; do
            echo "== node --check $f =="
            node --check "$f"
            ((n += 1))
          done
          [[ "$n" -gt 0 ]] || { echo "::error::dashboard renderer parse ran vacuously (no dashboard/*.js found)"; exit 1; }
          echo "parsed $n dashboard script(s)"

      - name: actionlint + yaml-parse every workflow
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            echo "== yaml-parse $f =="
            python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
          done
          echo "== actionlint =="
          actionlint -color

      - name: Assert every workflow-passed CLI flag is declared by its script
        run: |
          set -euo pipefail
          # PR #595 finding 2 (the TEST-VACUITY class, repo-wide): retriage.yml passed
          # `--known-labels` to a parser that never declared it, so EVERY scheduled sweep exited 2
          # with "unrecognized arguments" — invisible to the enrolled suite, whose self-tests called
          # the planner function directly. Nothing structural stopped the whole class, so assert it
          # statically: every `--flag` a workflow (or a workflow-invoked shell script) passes to a
          # `scripts/*.py` must be DECLARED there — an argparse add_argument or one of the argv-style
          # membership tests this repo uses. A literal merely mentioned in a docstring or a test
          # assertion does not count (that is why the check is AST-based, not a grep). Scanning zero
          # invocations is itself a failure (fail closed), mirroring the pin check below.
          python3 - <<'PY'
          import ast, glob, pathlib, re, sys

          INVOCATION = re.compile(
              r"python3\s+(?:\"?\$?\{?[\w./$-]*\}?/)?(?:registry(?:-snapshot)?/)?"
              r"scripts/([\w.-]+\.py)([^\n]*)")
          FLAG = re.compile(r"(?<![\w-])--[a-z][a-z0-9-]*")
          # A PASSTHROUGH subcommand hands the rest of its argv verbatim to another program, so the
          # flags after it are not the script's own contract: `gh_retry.py read <gh args...>`.
          PASSTHROUGH = {("gh_retry.py", "read")}

          def declared_flags(source):
              flags, tree = set(), ast.parse(source)

              def literals(nodes):
                  return {n.value for n in nodes if isinstance(n, ast.Constant)
                          and isinstance(n.value, str) and n.value.startswith("--")}

              def mentions_argv(node):
                  return any((isinstance(n, ast.Attribute) and n.attr == "argv")
                             or (isinstance(n, ast.Name) and n.id == "argv")
                             for n in ast.walk(node))

              for node in ast.walk(tree):
                  if isinstance(node, ast.Call):
                      name = getattr(node.func, "attr", getattr(node.func, "id", ""))
                      if name == "add_argument" or (name in {"index", "count"}
                                                    and mentions_argv(node.func)):
                          flags |= literals(node.args)
                  elif isinstance(node, ast.Compare) and mentions_argv(node):
                      flags |= literals([node.left, *node.comparators])
              return flags

          pairs, bad, cache = set(), [], {}
          for path in sorted(glob.glob(".github/workflows/*.yml")) + sorted(glob.glob("scripts/*.sh")):
              text = "\n".join(
                  line for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines()
                  if not line.strip().startswith("#")).replace("\\\n", " ")
              for match in INVOCATION.finditer(text):
                  script, tail = match.group(1), match.group(2)
                  if (script, (tail.split() or [""])[0]) in PASSTHROUGH:
                      continue
                  for flag in FLAG.findall(tail):
                      pairs.add((script, flag, path))
          for script, flag, path in sorted(pairs):
              source = pathlib.Path("scripts") / script
              if not source.exists():
                  bad.append(f"{path} invokes scripts/{script}, which does not exist")
                  continue
              if script not in cache:
                  cache[script] = declared_flags(source.read_text(encoding="utf-8"))
              if flag not in cache[script]:
                  bad.append(f"{path}: scripts/{script} is passed {flag}, "
                             "which the script never declares")
          for entry in bad:
              print(f"::error::workflow/CLI signature drift — {entry}")
          if bad:
              sys.exit(1)
          if not pairs:
              print("::error::CLI flag check scanned zero workflow script invocations (fail closed)")
              sys.exit(1)
          print(f"CLI flag check OK: {len(pairs)} workflow-passed flags are declared by their scripts")
          PY

      - name: Assert every non-local action reference is pinned to a 40-hex commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          # actionlint does NOT enforce commit-pinning, so a regression from a 40-hex pin to a
          # mutable tag would otherwise pass this required gate (sol audit #221). Walk every
          # parsed workflow and reject any non-local `uses:` whose ref is not exactly 40 hex
          # (docker refs must pin a sha256 digest). Scanning zero references is itself a
          # failure — a parser regression must not turn this assertion vacuous (fail closed).
          python3 - .github/workflows/*.yml .github/workflows/*.yaml <<'PY'
          import re, sys, yaml

          def walk(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "uses" and isinstance(value, str):
                          yield value
                      else:
                          yield from walk(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from walk(item)

          total, bad = 0, []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as fh:
                  doc = yaml.safe_load(fh)
              for ref in walk(doc):
                  if ref.startswith("./"):
                      continue  # local action: already pinned by this PR's own commit
                  total += 1
                  if ref.startswith("docker://"):
                      ok = re.search(r"@sha256:[0-9a-f]{64}$", ref)
                  else:
                      ok = re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", ref)
                  if not ok:
                      bad.append(f"{path}: uses: {ref}")
          for entry in bad:
              print(f"::error::action reference is not commit-pinned (need @<40-hex sha>): {entry}")
          if bad:
              sys.exit(1)
          if total == 0:
              print("::error::pin check scanned zero non-local action references (fail closed)")
              sys.exit(1)
          print(f"pin check OK: all {total} non-local 'uses:' references are 40-hex pinned")
          PY
