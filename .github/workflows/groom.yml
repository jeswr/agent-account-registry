# [GPT-5.6] REG-5 grooming sweep: repairs dead-lease in-progress issues, closed-unmerged-PR
# orphans, exhausted attempt budgets, and stale worker PRs. The cron was enabled after the REG-4
# staged pilot proved target writes end-to-end (issues #2407–#2416 flowed; PRs #2417–#2421
# merged) — groom is the ONLY crash-recovery path, so scheduled runs are load-bearing for
# autonomy. The minute offset avoids same-minute lease-ledger CAS contention with
# groom-leases.yml's */15 cron (both writers are CAS-safe; this is contention reduction).
name: groom

on:
  workflow_dispatch:
  schedule:
    - cron: '7-59/15 * * * *'

permissions: {}

concurrency:
  group: registry-groom
  cancel-in-progress: false

jobs:
  groom:
    name: Reclaim and repair orchestration state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY + PROVENANCE_SALT, which
    # live in the `dispatch-secrets` environment (deployment-branch policy: default branch only)
    # — full rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      actions: read       # inspect registry worker run state
      contents: write     # CAS data/leases.json + read data/model-health.json (both on the `ledger` branch)
      issues: write       # upsert/close the model-access health alert issues (model-health decide)
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Provenance records live on the unprotected `ledger` data-plane branch (issue #96):
      # master's required `gate` check rejects every direct contents-API PUT, so post-outage
      # records exist ONLY at this ref — a master-only read would orphan-park every
      # ledger-recorded draft. The master checkout keeps the pre-outage copies as fallback.
      # Fails the job LOUDLY if the ledger branch is missing.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      # This runs master's checked-in validator against the checked-out ledger Git tree, so content
      # on the unprotected branch cannot weaken or bypass the canonical path/type/mode allowlist.
      - name: Assert the ledger branch is still data-only
        run: python3 scripts/ledger-invariant.py ledger

      # [OPUS-5] ROUTING-CATALOG SKEW REPORT. An account record and the target routing catalogs that
      # must be able to route it live in DIFFERENT repositories on different merge schedules, and
      # nothing compared them: the 2026-07-26 yield incident (a pool account whose record omitted
      # `harness`, so every claim on it burned a lease and then died at worker.yml's fail-closed
      # boundary) had to be diagnosed from a live log capture because no periodic check named the
      # offending account. This step names them, every sweep.
      #
      # DELIBERATELY REPORT-ONLY, and deliberately in groom (the repair sweep) rather than in
      # dispatch: the enforcing boundaries already exist and stay where they are (policy-resolve
      # rejects an unknown model in a chain, the catalog read drops an unroutable record, worker.yml
      # re-proves every field before a secret is exposed). A reporter wired into the dispatch hot
      # path that could fail would be a new outage surface — which is why this is also
      # continue-on-error: a skew report must never abort the dead-lease release that follows it.
      # `--fail-on-skew` is the opt-in gate mode and is NOT used here.
      #
      # It needs no new TOKEN: the ambient token reads this repo's own account issues, and every
      # enabled target's routing.toml is public. It DOES need PROVENANCE_SALT — privacy (locked
      # decision 22a/22b): the report references an account only by its salted provenance
      # fingerprint, never by handle, so without the salt in context every row collapses to one
      # withheld marker and the report cannot identify the offending record. The salt is already
      # read by this job (see the SECRET-EXFIL GUARD note above); no new secret is introduced.
      - name: Report account-catalog / target-routing skew
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          python3 scripts/select-and-claim.py --audit-catalog \
            --repo "$GITHUB_REPOSITORY" --policy-file policy/repos.toml

      # [OPUS-5] BURNED-SLOT REPORT (issue #245). set-up-account takes atomic ownership of an
      # account slot by creating `refs/acct-claims/acctNN` before the `gh secret set` upsert, and a
      # run that fails AFTER claiming deliberately KEEPS its claim — releasing it would let a
      # different credential overwrite an in-flight one. Burned slots are safe but INVISIBLE:
      # nothing counted them, so a broker whose enrolments keep failing burns numbers with no
      # signal at all. These two steps name them, every sweep.
      #
      # LEAST-EXPOSURE FILTER (audit-2026-07-17, the dispatch.yml `acct-secrets` pattern): only
      # this tiny inline step ever sees `toJSON(secrets)`, and only NAMES leave it — the report
      # process below never receives a secret value. Post-#101 the ACCTNN_TOKEN secrets live in the
      # `dispatch-secrets` environment this job is bound to (and the repo scope is provably empty —
      # dispatch.yml's secrets-guard), so the job's own secrets context IS the canonical inventory
      # and no REGISTRY_SECRETS_PAT is introduced here.
      #
      # continue-on-error on BOTH steps, like the skew report above: a hygiene report must never
      # abort the dead-lease release that follows it. A failed filter leaves this output EMPTY and
      # the report then REFUSES (fail closed) rather than reporting every claimed slot as burned.
      - name: Derive the ACCTNN_TOKEN secret-name inventory (names only)
        id: acct-slots
        continue-on-error: true
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          # NAMES ONLY — no secret VALUE is ever read, printed or written out of this step.
          names = sorted(
              name for name in json.loads(os.environ["ALL_SECRETS"])
              if re.fullmatch(r"ACCT[0-9]+_TOKEN", name)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              # Compact single-line JSON — GITHUB_OUTPUT is line-based.
              output.write(f"names={json.dumps(names, separators=(',', ':'))}\n")
          print(f"derived {len(names)} ACCTNN_TOKEN secret name(s)")
          PY

      # REPORT-ONLY, and there is no gate mode: groom must never delete a claim ref, because
      # deletion re-opens exactly the credential-overwrite race the claim exists to close. The
      # ambient token suffices — claim refs and account issues are public on this repo — and the
      # burned slots it names back no account, so no handle-privacy question arises (decision 22b).
      - name: Report orphaned account-slot claim refs
        continue-on-error: true
        env:
          REGISTRY_GH_TOKEN: ${{ github.token }}
          ACCT_SECRET_NAMES: ${{ steps.acct-slots.outputs.names }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$REGISTRY_GH_TOKEN"
          python3 scripts/groom.py --report-orphan-claims \
            --registry-repo "$GITHUB_REPOSITORY"

      # Per-owner target token mint (issue #168): policy enables targets under TWO distinct owners
      # (sparq-org, jeswr), so a SINGLE App token scoped to one owner 404s every read and fails
      # every write on the other owner's repo — aborting the sweep before dead leases are released.
      # dispatch.yml already mints one token per owner; groom now does the same. groom.py
      # --print-owner-repos (self-tested, review round 1) collects EVERY enabled repo per owner —
      # not one representative repo, which would mint a token that 404s the owner's OTHER enabled
      # repos — and fails LOUD unless the enabled owner set is exactly {sparq-org, jeswr}, so a
      # policy change adding a third owner fails here instead of silently dropping that owner's
      # token (which would reintroduce the wrong-owner-token bug). Repo names are not secret; tee
      # keeps the minted scope visible in the run log.
      # [#1573] The estate already computes this population every executed dispatch tick and
      # reports it ONLY to a workflow log. This routes it to the same upsert-and-close ops-alert
      # transport the ci-latency/plan/usage alerts use. It changes NO gate.
      - name: Alert on parked PRs only a human can clear (#1573)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
        run: |
          set -euo pipefail
          python3 scripts/park-stock-alert.py --self-test
          python3 scripts/park-stock-alert.py

      - name: Resolve enabled target repos per owner from policy
        id: owners
        run: |
          set -euo pipefail
          python3 scripts/groom.py --print-owner-repos --policy-file policy/repos.toml \
            | tee -a "$GITHUB_OUTPUT"

      # Each mint is continue-on-error: a missing install for one owner only DEFERS that owner's
      # issue/PR repair (groom.py skips it loudly); dead-lease release and the other owner's
      # grooming still run — the whole sweep is never aborted by one owner's credential gap.
      - name: Mint sparq-org target-scoped maintenance App token (pinned)
        id: target-token-sparq
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: sparq-org
          repositories: ${{ steps.owners.outputs.sparq_names }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mint jeswr target-scoped maintenance App token (pinned)
        id: target-token-jeswr
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: jeswr
          repositories: ${{ steps.owners.outputs.jeswr_names }}
          permission-issues: write
          permission-pull-requests: write

      # [OPUS-5] PER-OWNER MINT-OUTCOME MARKER (issue #269). The two mints above are
      # continue-on-error and that is right — one owner's credential gap must never abort the sweep
      # before dead leases are released. But it also means a PERMANENT gap (the App install removed
      # from an owner, its key rotated out, a policy repo the install does not grant) presents as a
      # GREEN tick forever, while groom.py defers that owner's ENTIRE issue/PR repair on every one
      # of them and says so only in a log line nobody reads. These two steps are the only cross-run
      # record of that; the `mint-gap` watchdog job below reads the artifact NAMES — never their
      # contents, so no download and no token — and pages once an owner has been skipped on
      # SKIP_STREAK_THRESHOLD consecutive ticks.
      #
      # THE NAME IS NOT PROVENANCE (review round 1). `/repos/{repo}/actions/artifacts` is
      # repository-WIDE and a `pull_request` run executes the PR branch's OWN workflow files, so
      # anyone who can open a PR here could publish an artifact called `groom-mint-tick.ok-jeswr`.
      # The watchdog therefore counts a marker only when its run is in a set it derives
      # independently from the groom workflow's own runs listing: this workflow file BY PATH, on
      # the DEFAULT BRANCH, triggered by `schedule` (the one trigger that cannot be aimed at a
      # ref). A marker uploaded by the `workflow_dispatch` runs this file also declares is
      # deliberately NOT evidence — excluding it can only ever delay a page, never fabricate one.
      #
      # THE NAME IS THE WHOLE SIGNAL, and its grammar is asserted from BOTH sides
      # (scripts/groom-mint-alert.py's TICK_MARKER_PREFIX/MARKER_OK/MARKER_SKIP against this very
      # step, by its --self-test):
      #     groom-mint-tick ( .ok-<owner> | .skip-<owner> )*
      # A GitHub login is [A-Za-z0-9-]+, so `.` cannot occur inside one and separates
      # unambiguously. Recording the `.ok-` side too is what makes RECOVERY observable: an owner
      # that mints again — or that this workflow stops minting for at all — stops appearing in any
      # skip set, which is the close signal. Owner logins are not secret: policy/repos.toml is
      # public, the resolve step above already tees them into this log, and groom.py prints the
      # same skip line. Nothing token-derived is readable here — the name keys on
      # `steps.<mint>.outcome`, NEVER on `.outputs.token`.
      #
      # DELIBERATELY NO `if:`. The default success() guard IS the "this tick reached the mint
      # stage" predicate: both mints are continue-on-error so they cannot suppress this step, while
      # a failure in an earlier non-continue-on-error step (the ledger data-only invariant sweep,
      # the per-owner repo resolve) does — and a tick that never attempted a mint is not evidence
      # of a mint gap. `if: always()` here would turn every ledger-invariant failure into a false
      # "both owners skipped" tick. continue-on-error, though, is on BOTH steps and matters as
      # much: this is an observability aid standing in front of the only crash-recovery path in
      # the system, and it must never be the reason dead leases go unreleased.
      - name: Name this tick's per-owner mint-outcome marker
        id: mint-marker
        continue-on-error: true
        env:
          SPARQ_MINT_OUTCOME: ${{ steps.target-token-sparq.outcome }}
          JESWR_MINT_OUTCOME: ${{ steps.target-token-jeswr.outcome }}
        run: |
          set -euo pipefail
          name=groom-mint-tick
          for entry in "sparq-org=${SPARQ_MINT_OUTCOME:-}" "jeswr=${JESWR_MINT_OUTCOME:-}"; do
            owner="${entry%%=*}"
            outcome="${entry#*=}"
            if [[ "$outcome" == "success" ]]; then
              name="$name.ok-$owner"
            else
              name="$name.skip-$owner"
            fi
          done
          echo "name=$name" | tee -a "$GITHUB_OUTPUT"

          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/groom-mint-tick.txt"

      # The `if:` guard is the one case the naming step cannot cover: if IT failed (it is
      # continue-on-error), the name is empty and an unnamed upload would fail noisily for no
      # signal. A tick with no marker is simply not counted — the watchdog reads a missing tick as
      # absent evidence, never as a skipped owner, so a dropped marker delays a page and can never
      # fabricate one.
      - name: Upload this tick's mint-outcome marker (pinned)
        id: mint-marker-upload
        if: ${{ steps.mint-marker.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.mint-marker.outputs.name }}
          path: ${{ runner.temp }}/groom-mint-tick.txt
          if-no-files-found: error
          # One day is ~96 ticks at this cron — far more history than the streak threshold can
          # consume, and the self-test asserts that relationship rather than trusting the number.
          retention-days: 1

      # The {owner: token} JSON map is assembled INSIDE this step from the mint outputs (review
      # round 1): the assembled secret map never transits GITHUB_OUTPUT, and a mint that reported
      # success without delivering a token fails LOUD here instead of silently deferring every
      # target repair on every run. Failed/skipped mints stay absent from the map — that owner's
      # grooming defers loudly inside groom.py, never a wrong-owner token.
      - name: Sweep dead leases, stale issues, exhausted attempts, and stale PRs
        id: sweep
        env:
          REGISTRY_GH_TOKEN: ${{ github.token }}
          # Per-owner target App tokens (issue #168): groom.py resolves the token for each target
          # repo's OWNER, so a repo under a second owner is never read/written with the wrong token.
          SPARQ_TOKEN: ${{ steps.target-token-sparq.outputs.token }}
          JESWR_TOKEN: ${{ steps.target-token-jeswr.outputs.token }}
          SPARQ_MINT_OUTCOME: ${{ steps.target-token-sparq.outcome }}
          JESWR_MINT_OUTCOME: ${{ steps.target-token-jeswr.outcome }}
          # An App INSTALLATION token cannot call GET /user; groom resolves the bot identity from
          # the public /users/<slug>[bot] endpoint instead (the worker.yml canary fix). The same App
          # is installed on both owners, so the slug is identical — take it from whichever mint won.
          APP_SLUG: ${{ steps.target-token-sparq.outputs.app-slug || steps.target-token-jeswr.outputs.app-slug }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$REGISTRY_GH_TOKEN"
          [[ -z "${SPARQ_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$SPARQ_TOKEN"
          [[ -z "${JESWR_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$JESWR_TOKEN"
          if [[ "${SPARQ_MINT_OUTCOME:-}" == "success" && -z "${SPARQ_TOKEN:-}" ]]; then
            echo "::error::sparq-org token mint succeeded but no token reached this step"
            exit 1
          fi
          if [[ "${JESWR_MINT_OUTCOME:-}" == "success" && -z "${JESWR_TOKEN:-}" ]]; then
            echo "::error::jeswr token mint succeeded but no token reached this step"
            exit 1
          fi
          TARGET_GH_TOKENS="$(python3 - <<'PY'
          import json
          import os

          tokens = {}
          if os.environ.get("SPARQ_TOKEN"):
              tokens["sparq-org"] = os.environ["SPARQ_TOKEN"]
          if os.environ.get("JESWR_TOKEN"):
              tokens["jeswr"] = os.environ["JESWR_TOKEN"]
          print(json.dumps(tokens, separators=(",", ":")))
          PY
          )"
          export TARGET_GH_TOKENS
          python3 scripts/groom.py --self-test
          python3 scripts/groom.py \
            --registry-repo "$GITHUB_REPOSITORY" \
            --policy-file policy/repos.toml \
            --policy-resolver scripts/policy-resolve.py \
            --bot-slug "$APP_SLUG" \
            --ledger-root ledger

      # Model-access health decision (registry #32): the groom sweep already runs on schedule, so it
      # is the natural place to evaluate the health record window and raise/close alerts (keeps
      # dispatch.yml lean). Reads data/model-health.json + the enabled provider->account fleet, then
      # upserts ONE ops-alert issue per (condition, provider). An unreadable ledger exits NONZERO
      # (every reader fails loud, review r3); continue-on-error keeps the maintenance sweep alive
      # while this step goes visibly red. Account identifiers stay salted (decision 22a).
      - name: Decide + raise/close model-access health alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c) + the #39 fix: ALERT_REPO without ALERT_TOKEN
          # falls back to the registry repo (never dropped silently). Identifiers stay salted.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          # Salt to map enabled account handles -> the salted hashes stored in the ledger, so the
          # provider-capped ("every enabled account") decision can be computed.
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          # The full registry gate already executes model-health's self-test. Do not replay its
          # intentional malformed-record/refused-pair fixtures on every live Groom tick: those
          # expected-negative cases emit GitHub ::error:: annotations and were indistinguishable
          # from a dropped production relay (#512). Producer/relay integration is covered by
          # worker-live.sh's stateful contract fixture against this unchanged validator.
          python3 scripts/model-health.py decide --policy-file policy/repos.toml

  # [OPUS-5] WATCH THE WATCHER, half (b): is the metrics snapshot still being DELIVERED?
  #
  # metrics.yml's own `metrics-alert` job catches a metrics job that RAN and FAILED. It structurally
  # cannot catch a metrics job that never ran: a cron that silently under-delivers produces no
  # failed job to key on, and no workflow can detect its own non-execution. Delivery here is
  # measurably imperfect — on the live ring at 2026-07-27T15:50Z, 24 snapshots spanned 550.0 min
  # (23.91 min effective cadence against a */15 schedule, 30.0 min worst gap).
  #
  # So the staleness assertion is hosted HERE, in a different workflow on an independent schedule.
  # That makes the watchers a RING rather than a chain, and a chain of watchers always terminates in
  # an unwatched one:
  #   metrics job FAILS     -> metrics.yml   `metrics-alert`
  #   metrics never RUNS    -> groom.yml     `metrics-stale`      (this job)
  #   groom never RUNS      -> dashboard.yml `cron-keepalive`     (re-dispatches groom.yml at 1800s)
  #   dashboard never RUNS  -> metrics.yml   `dashboard-publish`  (staleness fallback)
  # Deliberately NOT hosted in dashboard.yml: registry #656 (dashboard live-refresh) is in flight
  # there, and dashboard.yml already hosts the fleet-wide cron keepalive, which would make one
  # workflow the single point of failure for two independent liveness mechanisms.
  #
  # NO `needs:` and NO `if:`, on purpose and asserted by scripts/metrics-alert.py's self-test over
  # every groom outcome: a watchdog suppressed by the failure of the sweep it happens to share a
  # workflow file with is not a watchdog. It reads ONE public JSON file's timestamp and holds
  # contents:read + issues:write — no arming, no merging, no label writes of any kind.
  metrics-stale:
    name: WATCHDOG (is the metrics snapshot still being delivered?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads ALERT_TOKEN/ALERT_REPO, so it is bound to the
    # default-branch-only `dispatch-secrets` environment where those secrets live, exactly like the
    # `groom` and `groom-alert` jobs.
    environment: dispatch-secrets
    # Repair authority, never admission authority. Pinned by the self-test.
    permissions:
      contents: read  # the two sparse checkouts below (script inputs + the published snapshot)
      issues: write   # upsert/close the rolling snapshot-staleness ops-alert issue
    steps:
      # Same input set as metrics.yml's `metrics-alert` job: the script, plus the three files its
      # --self-test asserts against (both workflow YAMLs for the `if:`/`needs:`/permissions/call-site
      # seam, and scripts/metrics.py for the cross-file contract that the path read here is the path
      # the collector writes). Missing inputs fail LOUD rather than silently skipping the checks.
      - name: Check out ONLY the watchdog's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/metrics-alert.py
            scripts/metrics.py
            .github/workflows/metrics.yml
            .github/workflows/groom.yml
          sparse-checkout-cone-mode: false

      # The snapshot metrics.py CAS-publishes (scripts/metrics.py PUBLISHED_PATH) lives on the
      # unprotected `ledger` data-plane branch. Read-only, one file. If this checkout fails the job
      # goes red and the run is visibly broken; if it succeeds but the file is absent, the script
      # treats that as STALE (fail-closed) rather than as healthy.
      - name: Check out ONLY the published metrics snapshot from the ledger branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false
          sparse-checkout: data/metrics.json
          sparse-checkout-cone-mode: false

      - name: Alert maintainer if the published metrics snapshot has gone stale
        id: metrics-stale
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          # The collector's own published file, in the ledger worktree checked out above. The
          # self-test cross-checks this against scripts/metrics.py's PUBLISHED_PATH, so the two
          # cannot drift into a permanent false page.
          SNAPSHOT_PATH: ledger/data/metrics.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39). The body carries only a timestamp, an
          # age and two run links — no account handles, no ledger content — so the registry-repo
          # fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/metrics-alert.py --self-test
          python3 registry/scripts/metrics-alert.py --stale-check

  # WATCH THE DISPATCHER (issue #819). dispatch.yml already has a per-run failure alert — the
  # `plan-alert` job — and it fired ZERO times during the 2026-07-27 stall. Measured on run
  # 30295860510 and repeated on every failing tick from 18:26:17Z: PLAN `failure` (HTTP 403 on an
  # authenticated read), GUARD `failure` (cannot resolve the repository default branch, over the
  # SAME exhausted request budget), CLAIM `skipped`, ALERT `skipped`. That alert is gated on
  # `needs.secrets-guard.result == 'success'` — correctly, since it mounts ALERT_TOKEN and must not
  # run while the secret-exfil settings are unverified (issue #101) — so the one class of outage
  # that stops the whole pipeline is exactly the class that also disables its alarm. The gate
  # cannot be loosened; the alarm has to live outside the workflow it watches.
  #
  # Hosted here for the same reason `metrics-stale` is: groom.yml runs on an independent schedule,
  # is not dispatch, and is itself watched by dashboard.yml's cron keepalive. It costs two API
  # reads per groom tick.
  #
  # NO `needs:` and NO `if:`, on purpose and asserted by scripts/dispatch-stall-alert.py's
  # self-test: a watchdog suppressed by the failure of the sweep it shares a file with is not a
  # watchdog — which is the defect above, restated. It reads two listings and holds
  # contents:read + actions:read + issues:write — no arming, no merging, no label writes.
  dispatch-stall:
    name: WATCHDOG (is the dispatcher still completing ticks?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads ALERT_TOKEN/ALERT_REPO, so it is bound to the
    # default-branch-only `dispatch-secrets` environment where those secrets live, exactly like
    # `groom`, `groom-alert` and `metrics-stale`.
    environment: dispatch-secrets
    # Repair authority, never admission authority. Pinned by the self-test.
    permissions:
      actions: read   # list dispatch's artifacts + run conclusions (the two signals)
      contents: read  # the sparse checkout below
      issues: write   # upsert/close the two rolling ops-alert issues
    steps:
      # The script, plus every file its --self-test asserts against: dispatch.yml and groom.yml for
      # the `if:`/`needs:`/permissions/call-site seam and the two cron cadences, and
      # dispatch-tick-floor.py for the cross-file threshold contract (the failure-streak threshold
      # is denominated in TICKS, and how long N ticks take is set entirely by the #819 floor).
      # Missing inputs fail LOUD rather than silently skipping the checks.
      # KEEP THIS LIST IN SYNC — REQUIRED_FILES in scripts/dispatch-stall-alert.py is asserted
      # against this very block.
      - name: Check out ONLY the watchdog's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/dispatch-stall-alert.py
            scripts/dispatch-tick-floor.py
            .github/workflows/dispatch.yml
            .github/workflows/groom.yml
          sparse-checkout-cone-mode: false

      # PyYAML backs the workflow-parse assertions (regex-over-YAML is how five permissive
      # misparses got into the secrets guard). Probe first so the runner image's own copy is used
      # when present; the install path is version + sha256 locked to the identical pins pr-gate
      # and the secrets guard use.
      - name: Ensure PyYAML for the watchdog's workflow-parse assertions
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML already present; no install needed"
            exit 0
          fi
          cat > "$RUNNER_TEMP/stall-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/stall-requirements.txt"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Alert maintainer if the dispatch pipeline has stalled
        id: dispatch-stall
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39). The body carries only counts, an age
          # and two run links — no account handles, no ledger content, no byte of any target
          # payload — so the registry-repo fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/dispatch-stall-alert.py --self-test
          python3 registry/scripts/dispatch-stall-alert.py

  # FAIL-LOUD alert for a HARD GROOM failure (issue #176). The model-access health decision is the
  # LAST step of the `groom` job under the default success() guard, and every other repair happens
  # inside that same job — so when an EARLIER step fails or is cancelled (ledger data-only invariant
  # sweep, a target-token mint, the main sweep's dead-lease CAS / target-repo errors, or the
  # 15-minute timeout), the health evaluator is SKIPPED and nothing raises an alarm: a persistent
  # groom failure means crash-recovery has stopped AND health alerts are no longer evaluated, yet it
  # presents only as skipped steps on a cron nobody watches. This standalone job keys on
  # `needs.groom.result` and, on failure/cancelled, upserts a rolling `ops-alert` issue @-mentioning
  # the maintainer via the SAME ALERT_REPO/ALERT_TOKEN routing (locked decision 22c); it auto-closes
  # on an explicit GROOM success. It downloads no sweep artifact and reads only the job RESULT, so no
  # token or ledger data reaches it.
  # [OPUS-5] CI EXECUTION-LATENCY WATCHDOG (companion to sparq-org/sparq#4810). Maintainer-asked
  # for alerting when runners are not picked up for crons or delayed for other dispatches. The
  # existing ring (dispatch-stall / metrics-stale / cron-keepalive / triage-stock) watches NAMED
  # lanes for LIVENESS; none of them measures execution LATENCY, and a full-tree grep for
  # latenc|duration|elapsed|run_started_at|percentile over every script on master finds no
  # workflow-run-duration or queue-wait consumer. Three modes: a scheduled lane firing below what
  # GitHub will actually deliver (this mode produces NO artifact — there is no run to inspect), a run
  # held in `queued` past a measured threshold (runner availability proper — MEASURED here:
  # seven pr-gate runs held 12.8-99.5 min inside 00:58Z-02:24Z on 2026-07-28), and a run
  # `in_progress` past its own lane's measured duration (it consumes capacity while looking healthy).
  #
  # Hosted here with NO `needs:` and NO `if:`, exactly like metrics-stale and dispatch-stall: a
  # watcher hosted inside the watched job cannot observe the watched job's absence. The alert step is
  # `continue-on-error: true` so a watchdog fault can never red the grooming sweep. The signal is one
  # rolling `ops-alert` per mode, closed on explicit recovery. It holds `issues: write` and nothing
  # that could label a PR — in particular it never applies `needs:user` or any other hold.
  ci-latency:
    name: WATCHDOG (is CI execution latency inside its measured band?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads ALERT_TOKEN/ALERT_REPO (the private-alert routing
    # secrets), so it is bound to the default-branch-only `dispatch-secrets` environment where those
    # secrets live, exactly as groom-alert and dispatch-stall are.
    environment: dispatch-secrets
    permissions:
      actions: read    # list workflow runs + live run state
      contents: read   # minimum for the sparse checkout below
      issues: write    # upsert/close the rolling ci-latency ops-alert issues
    steps:
      # KEEP IN SYNC with REQUIRED_FILES in scripts/ci-latency-alert.py — the self-test asserts
      # both directions, so dropping an input reds instead of making the YAML-seam assertions
      # silently unreachable on the live path. `.github/workflows` is an INPUT, not incidental:
      # M1 derives each lane's expectation from the workflow files themselves, and
      # `policy/repos.toml` is the one M3's execution-overrun floor is derived from
      # (1.5x the longest `worker_timeout_minutes`) — the self-test reds if they diverge.
      - name: Check out ONLY the watchdog's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-latency-alert.py
            scripts/selftest-suite.txt
            .github/workflows/groom.yml
            .github/workflows
            policy/repos.toml
          sparse-checkout-cone-mode: false
      - name: Ensure PyYAML for the watchdog's workflow parsing
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML already present; no install needed"
            exit 0
          fi
          cat > "$RUNNER_TEMP/ci-latency-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/ci-latency-requirements.txt"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      # A detector is never trusted to watch anything before it has proved itself on this tick's
      # code, so the self-test runs FIRST and is NOT continue-on-error.
      - name: Self-test the CI execution-latency watchdog (hermetic fixtures)
        run: python3 registry/scripts/ci-latency-alert.py --self-test
      - name: Alert maintainer if CI execution latency is outside its measured band
        id: ci-latency
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          ALERT_REPO: ${{ secrets.ALERT_REPO }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
        run: python3 registry/scripts/ci-latency-alert.py

  # [OPUS-5] WATCH THE CREDENTIALS (issue #269). A DEFER THAT NEVER ENDS IS AN OUTAGE WEARING A
  # GREEN CHECK. The issue #168 fix made each per-owner target-token mint continue-on-error, so a
  # missing install on one owner only defers that owner's issue/PR repair — correct, fail-closed,
  # and completely invisible: the job succeeds, every step is green, and the only evidence is
  # groom.py's `skip target grooming for <owner>/<repo>` log line. `groom-alert` cannot see it (it
  # keys on the groom job RESULT, which is `success`), so a removed install would stop the registry
  # self-grooming half its target surface indefinitely with nothing to page on.
  #
  # This job closes that hole with the same posture dispatch-stall uses one job above: alarm on the
  # CONDITION, not on the run. It derives a per-owner consecutive-skip streak from the marker NAMES
  # the `groom` job uploads (no download, no token, no secret) and upserts one rolling `ops-alert`
  # per owner past the threshold, auto-closing on the first tick that mints again.
  #
  # It costs THREE reads, and the first two are the provenance check, not overhead: the artifacts
  # listing is repository-wide and an artifact name is author-controlled text, so the repo's default
  # branch and the groom workflow's own scheduled runs on it are read FIRST and a marker counts only
  # if its run is in that set. Any of the three refused = no validated evidence = neither a page nor
  # a close (see ALLOWED_TICK_EVENTS in scripts/groom-mint-alert.py).
  #
  # NO `needs:` and NO `if:`, on purpose and asserted by scripts/groom-mint-alert.py's self-test —
  # a watchdog suppressed by the failure of the sweep it shares a workflow file with is not a
  # watchdog. The stated cost of that choice: this job runs CONCURRENTLY with `groom`, so the
  # current tick's marker may not be uploaded yet and detection can lag by one tick (~15 min
  # against a credential gap that no longer recovers on its own). It holds contents:read +
  # actions:read + issues:write — no arming, no merging, no label writes of any kind.
  mint-gap:
    name: WATCHDOG (can groom still mint a target token for every owner?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads ALERT_TOKEN/ALERT_REPO, so it is bound to the
    # default-branch-only `dispatch-secrets` environment where those secrets live, exactly like
    # `groom`, `groom-alert`, `metrics-stale`, `dispatch-stall` and `ci-latency`.
    environment: dispatch-secrets
    # Repair authority, never admission authority. Pinned by the self-test.
    permissions:
      actions: read   # list this repo's artifacts AND the groom runs that validate them
      contents: read  # the sparse checkout below
      issues: write   # upsert/close the rolling per-owner ops-alert issues
    steps:
      # KEEP THIS LIST IN SYNC — REQUIRED_FILES in scripts/groom-mint-alert.py is asserted against
      # this very block, in both directions, so a trimmed checkout reds instead of making the
      # YAML-seam assertions silently unreachable on the live path. groom.yml is an INPUT, not
      # incidental: the artifact-name grammar and the streak threshold are both contracts against
      # it, and the self-test reds if either side drifts.
      - name: Check out ONLY the watchdog's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/groom-mint-alert.py
            scripts/selftest-suite.txt
            .github/workflows/groom.yml
          sparse-checkout-cone-mode: false

      # PyYAML backs the workflow-parse assertions (regex-over-YAML is how five permissive
      # misparses got into the secrets guard). Probe first so the runner image's own copy is used
      # when present; the install path is version + sha256 locked to the identical pins pr-gate,
      # dispatch-stall and ci-latency use.
      - name: Ensure PyYAML for the watchdog's workflow-parse assertions
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML already present; no install needed"
            exit 0
          fi
          cat > "$RUNNER_TEMP/mint-gap-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/mint-gap-requirements.txt"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # A detector is never trusted to watch anything before it has proved itself on this tick's
      # code, so the self-test runs FIRST and is NOT continue-on-error.
      - name: Self-test the mint-gap watchdog (hermetic fixtures)
        run: python3 registry/scripts/groom-mint-alert.py --self-test

      - name: Alert maintainer if an owner's target-token mint keeps failing
        id: mint-gap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39). The body carries only an OWNER LOGIN
          # (public in policy/repos.toml and already in this run log), two counts and two run links
          # — no provider account handle, no ledger content, no byte of any remote payload — so the
          # registry-repo fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: python3 registry/scripts/groom-mint-alert.py

  groom-alert:
    name: ALERT (hard GROOM-job failure)
    needs: [groom]
    # Runs every tick regardless of the GROOM result so a healthy GROOM can auto-close a prior
    # alert; scripts/groom-alert.py keys on needs.groom.result — close happens ONLY on an explicit
    # success (a skipped GROOM is not a recovery), and a success tick with no open alert does only a
    # bare `gh issue list`, so a green tick stays cheap and side-effect-free.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): this job reads ALERT_TOKEN/ALERT_REPO (the private-alert
    # routing secrets), so — like the `groom` job — it is bound to the default-branch-only
    # `dispatch-secrets` environment where those secrets live. It only ever runs from the default
    # branch (schedule/workflow_dispatch), so the branch policy never starves it.
    environment: dispatch-secrets
    permissions:
      contents: read  # minimum for the sparse checkout below — the job runs a script from the repo
      issues: write   # upsert/close the rolling groom-failure ops-alert issue
    steps:
      # The alert logic lives in scripts/groom-alert.py, but only that one file is needed —
      # sparse-checkout scopes the working copy to it, pinned and with no persisted token, so
      # nothing else from the repo reaches this job.
      - name: Check out ONLY scripts/groom-alert.py (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: scripts/groom-alert.py
          sparse-checkout-cone-mode: false

      - name: Alert maintainer that the scheduled GROOM job hard-failed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          GROOM_RESULT: ${{ needs.groom.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39): scripts/groom-alert.py routes to a
          # maintainer-set PRIVATE ALERT_REPO only when ALERT_TOKEN can write there; otherwise the
          # registry repo under the ambient token. The body carries NO account handles (it reports
          # only the groom job RESULT + run link), so that fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/groom-alert.py --self-test
          python3 registry/scripts/groom-alert.py
