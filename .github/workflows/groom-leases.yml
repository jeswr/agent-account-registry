# [OPUS-4.8] Lease groomer (review C3 companion): a cron that CAS-removes expired leases from the
# ledger so a crashed/cancelled worker's slot is freed. Necessary counterpart to the lease allocator —
# without it, a dead worker's lease lingers until nothing reclaims it.
# Also reclaims the short-TTL `review:`/`fix:` leases (20/60 min) from the cross-provider review
# loop, so a crashed reviewer never pins a scarce codex slot: the dispatch sweep's stuck-state
# reconciler then re-emits the PR (or escalates it to needs-user) on a later tick.
name: groom-leases
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # CAS-update data/leases.json on the `ledger` data-plane branch (issue #28)

# Scheduler-singleton semantics (#559 dup-dispatch storms; registry #563 adoption item 1): this
# cron previously had NO concurrency group, so an overlapping fire (cron + keepalive/manual kick)
# ran two concurrent ledger CAS writers — the #558 write-burst trigger. A singleton group with
# cancel-in-progress:false makes a new fire QUEUE behind a live run (GitHub keeps exactly one
# pending run, superseding older pendings) instead of duplicating or cancel-storming.
concurrency:
  group: groom-leases-singleton
  cancel-in-progress: false

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reclaim expired leases
        run: python3 scripts/select-and-claim.py --reclaim --repo "${{ github.repository }}"
