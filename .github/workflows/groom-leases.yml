# [OPUS-4.8] Lease groomer (review C3 companion): a cron that CAS-removes expired leases from the
# ledger so a crashed/cancelled worker's slot is freed. Necessary counterpart to the lease allocator —
# without it, a dead worker's lease lingers until nothing reclaims it.
# Also reclaims the short-TTL `review:`/`fix:` leases (20/60 min) from the cross-provider review
# loop, so a crashed reviewer never pins a scarce codex slot: the dispatch sweep's stuck-state
# reconciler then re-emits the PR (or escalates it to needs-user) on a later tick.
#
# The reclaim is NO LONGER BLIND (issue #35). A lease whose holder run is still ACTIVE has its
# expiry RENEWED instead of dropped — this cron is the ledger's heartbeat. It has to renew rather
# than merely skip, because every duplicate-suppression consumer reads `expires_at > now` and not
# the row's presence, so an expired-but-present row would suppress nothing. Reading the holder
# run's status is what `actions: read` below is for; a dead/absent run, a run outside the
# lease-holding workflows, a holder with no run id, and any lease past its renewal ceiling are all
# still reclaimed exactly as before. When the probe itself fails (403/5xx) the decision waits for
# the next tick, and the row is HELD on a short grace expiry meanwhile — for the same reason: a
# deferral that left the row expired would defer nothing and would re-open the double-dispatch on
# any transient API blip. The renewal ceiling still bounds it.
name: groom-leases
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # CAS-update data/leases.json on the `ledger` data-plane branch (issue #28)
  actions: read     # read the holder run's status before reclaiming its lease (issue #35)

# Scheduler-singleton semantics (#559 dup-dispatch storms; registry #563 adoption item 1): this
# cron previously had NO concurrency group, so an overlapping fire (cron + keepalive/manual kick)
# ran two concurrent ledger CAS writers — the #558 write-burst trigger. A singleton group with
# cancel-in-progress:false makes a new fire QUEUE behind a live run (GitHub keeps exactly one
# pending run, superseding older pendings) instead of duplicating or cancel-storming.
concurrency:
  group: groom-leases-singleton
  cancel-in-progress: false

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reclaim expired leases
        run: python3 scripts/select-and-claim.py --reclaim --repo "${{ github.repository }}"
