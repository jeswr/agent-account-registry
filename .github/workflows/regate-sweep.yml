# Issue #927: when a master-side gate fix lands, nothing un-reds the PRs it unblocks. #917 repaired
# #910 on master and repaired NOTHING already open — 7 of 37 PRs stayed red on a bug that no longer
# existed. This sweeper moves the branch of every PR whose `gate` failure is ATTRIBUTABLE to a
# declared master-side repair (orchestration/gate-repairs.json), and stops there: it never arms.
#
# It moves the branch rather than re-running the job because `gh run rerun` re-tests the SAME tree —
# GitHub does not recompute a stale merge ref (#920), so the fix is not present in what is graded.
#
# The whole attribution argument lives in scripts/regate-sweep.py's header. Read it before widening
# anything here: a sweeper that rebases every red PR burns CI and hides real failures.
name: regate-sweep

on:
  workflow_dispatch:
  schedule:
    # Three ticks an hour, which is the TICKS_PER_HOUR the script's drain arithmetic is asserted
    # against. These minutes must be free of every other registry cron; that is NOT restated here
    # as a list, because the list went stale (#1046). It is DERIVED from the tree by
    # ci-latency-alert.py's `schedule_minute_map` and asserted in regate-sweep.py's
    # `_test_workflow_seam`, so repointing any lane in this directory reds the gate.
    #
    # These were :09/:29/:49 until the derivation was turned on and reported what the hand-copied
    # list had never included: latch-watchdog runs :09/:19/:29/:39/:49/:59, i.e. this sweeper had
    # been landing on top of it on ALL THREE ticks.
    - cron: '4,24,44 * * * *'

permissions: {}

concurrency:
  group: registry-regate-sweep
  # NOT cancel-in-progress: a tick cancelled between `update-branch` and its marker comment would
  # leave a moved head with no idempotence record, and the next tick would move it again.
  cancel-in-progress: false

jobs:
  sweep:
    name: Re-qualify PRs a master-side gate fix already unblocked
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # App secrets live only in this environment, whose default-branch deployment policy rejects a
    # dispatch of a modified non-default-branch copy of this workflow before the mint can read them.
    environment: dispatch-secrets
    permissions:
      contents: read
    steps:
      # No `ref:` — the repair declaration is read from the DEFAULT BRANCH. A pull request must not
      # be able to declare itself attributable, and pinning a ref here would be exactly that hole.
      - name: Checkout the registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # KEEP THIS LIST IN SYNC — REQUIRED_FILES + REQUIRED_DIRS in scripts/regate-sweep.py are
          # asserted against this very block, so a trimmed checkout reds the gate instead of
          # silently disabling the self-test's YAML-seam assertions.
          #
          # `.github/workflows` is an INPUT, not incidental: the cron-collision assertion DERIVES
          # every other lane's minutes from the workflow files themselves (#1046), and with the
          # directory dropped it would compare this cron against one lane and pass vacuously.
          # ci-latency-alert.py owns that derivation, which is why it is checked out too.
          sparse-checkout: |
            scripts/regate-sweep.py
            orchestration/gate-repairs.json
            scripts/selftest-suite.txt
            scripts/ci-latency-alert.py
            .github/workflows/regate-sweep.yml
            .github/workflows

      - name: Set up Python (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install the YAML parser the self-test asserts the workflow seam with
        run: python3 -m pip install --disable-pip-version-check pyyaml

      # NOT continue-on-error, and NOT `github.token`. A push made with a workflow's own
      # GITHUB_TOKEN does not trigger `pull_request` workflows, so a branch moved under it would
      # never re-run `pr-gate` — every sweep would move heads and re-qualify nothing, silently.
      # The App installation token does trigger them, which is the entire mechanism.
      - name: Mint the registry App token (contents+PRs write, this repository only)
        id: registry-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: jeswr
          repositories: agent-account-registry
          permission-contents: write        # push the moved branch
          permission-pull-requests: write   # marker comment + remove the arming label

      - name: Self-test, then re-qualify at most five PRs
        id: sweep
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          APP_SLUG: ${{ steps.registry-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # The marker scan only counts comments THIS App wrote. Without the slug an unrestricted
          # scan would let anyone able to comment pin a PR out of the class permanently.
          [[ -n "${APP_SLUG:-}" ]] || { echo '::error::the App mint delivered no slug'; exit 1; }
          python3 registry/scripts/regate-sweep.py --self-test
          python3 registry/scripts/regate-sweep.py \
            --repo "$GITHUB_REPOSITORY" \
            --repairs-file registry/orchestration/gate-repairs.json \
            --max-moves 5 \
            --lookback-hours 24 \
            --bot-slug "$APP_SLUG" \
            --apply
