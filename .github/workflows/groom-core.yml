# [SPARQ agent] REG-5 grooming core: repairs dead-lease in-progress issues, closed-unmerged-PR
# orphans, exhausted attempt budgets, and stale worker PRs. Extracted as an independently ingested
# recovery lane for #2076 after the watchdog-heavy workflow remained rejected with zero jobs under
# a fresh filename. #2256 makes this a manual fallback: groom-sweep.yml is the single scheduled
# owner of the same full repair, avoiding duplicate API walks while retaining this known-ingesting
# shape for explicit incident recovery.
name: groom-core

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-groom
  cancel-in-progress: false

jobs:
  groom:
    name: Reclaim and repair orchestration state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY + PROVENANCE_SALT, which
    # live in the `dispatch-secrets` environment (deployment-branch policy: default branch only)
    # — full rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      actions: read       # inspect registry worker run state
      contents: write     # CAS data/leases.json + read data/model-health.json (both on the `ledger` branch)
      issues: write       # upsert/close the model-access health alert issues (model-health decide)
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Provenance records live on the unprotected `ledger` data-plane branch (issue #96):
      # master's required `gate` check rejects every direct contents-API PUT, so post-outage
      # records exist ONLY at this ref — a master-only read would orphan-park every
      # ledger-recorded draft. The master checkout keeps the pre-outage copies as fallback.
      # Fails the job LOUDLY if the ledger branch is missing.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      # This runs master's checked-in validator against the checked-out ledger Git tree, so content
      # on the unprotected branch cannot weaken or bypass the canonical path/type/mode allowlist.
      - name: Assert the ledger branch is still data-only
        run: python3 scripts/ledger-invariant.py ledger

      # [OPUS-5] ROUTING-CATALOG SKEW REPORT. An account record and the target routing catalogs that
      # must be able to route it live in DIFFERENT repositories on different merge schedules, and
      # nothing compared them: the 2026-07-26 yield incident (a pool account whose record omitted
      # `harness`, so every claim on it burned a lease and then died at worker.yml's fail-closed
      # boundary) had to be diagnosed from a live log capture because no periodic check named the
      # offending account. This step names them, every sweep.
      #
      # DELIBERATELY REPORT-ONLY, and deliberately in groom (the repair sweep) rather than in
      # dispatch: the enforcing boundaries already exist and stay where they are (policy-resolve
      # rejects an unknown model in a chain, the catalog read drops an unroutable record, worker.yml
      # re-proves every field before a secret is exposed). A reporter wired into the dispatch hot
      # path that could fail would be a new outage surface — which is why this is also
      # continue-on-error: a skew report must never abort the dead-lease release that follows it.
      # `--fail-on-skew` is the opt-in gate mode and is NOT used here.
      #
      # It needs no new TOKEN: the ambient token reads this repo's own account issues, and every
      # enabled target's routing.toml is public. It DOES need PROVENANCE_SALT — privacy (locked
      # decision 22a/22b): the report references an account only by its salted provenance
      # fingerprint, never by handle, so without the salt in context every row collapses to one
      # withheld marker and the report cannot identify the offending record. The salt is already
      # read by this job (see the SECRET-EXFIL GUARD note above); no new secret is introduced.
      - name: Report account-catalog / target-routing skew
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          python3 scripts/select-and-claim.py --audit-catalog \
            --repo "$GITHUB_REPOSITORY" --policy-file policy/repos.toml

      # [OPUS-5] BURNED-SLOT REPORT (issue #245). set-up-account takes atomic ownership of an
      # account slot by creating `refs/acct-claims/acctNN` before the `gh secret set` upsert, and a
      # run that fails AFTER claiming deliberately KEEPS its claim — releasing it would let a
      # different credential overwrite an in-flight one. Burned slots are safe but INVISIBLE:
      # nothing counted them, so a broker whose enrolments keep failing burns numbers with no
      # signal at all. These two steps name them, every sweep.
      #
      # LEAST-EXPOSURE FILTER (audit-2026-07-17, the dispatch.yml `acct-secrets` pattern): only
      # this tiny inline step ever sees `toJSON(secrets)`, and only NAMES leave it — the report
      # process below never receives a secret value. Post-#101 the ACCTNN_TOKEN secrets live in the
      # `dispatch-secrets` environment this job is bound to (and the repo scope is provably empty —
      # dispatch.yml's secrets-guard), so the job's own secrets context IS the canonical inventory
      # and no REGISTRY_SECRETS_PAT is introduced here.
      #
      # continue-on-error on BOTH steps, like the skew report above: a hygiene report must never
      # abort the dead-lease release that follows it. A failed filter leaves this output EMPTY and
      # the report then REFUSES (fail closed) rather than reporting every claimed slot as burned.
      - name: Derive the ACCTNN_TOKEN secret-name inventory (names only)
        id: acct-slots
        continue-on-error: true
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          # NAMES ONLY — no secret VALUE is ever read, printed or written out of this step.
          names = sorted(
              name for name in json.loads(os.environ["ALL_SECRETS"])
              if re.fullmatch(r"ACCT[0-9]+_TOKEN", name)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              # Compact single-line JSON — GITHUB_OUTPUT is line-based.
              output.write(f"names={json.dumps(names, separators=(',', ':'))}\n")
          print(f"derived {len(names)} ACCTNN_TOKEN secret name(s)")
          PY

      # REPORT-ONLY, and there is no gate mode: groom must never delete a claim ref, because
      # deletion re-opens exactly the credential-overwrite race the claim exists to close — nor a
      # `refs/acct-requests/` binding (#1260), because deleting one re-opens the resume gap #534
      # closes. The ambient token suffices — claim refs, binding refs and account issues are all
      # public on this repo — and the burned slots it names back no account, so no handle-privacy
      # question arises (decision 22b); a binding ref is only ever counted, never printed.
      # NOTE: set-up-account.yml does not write a binding yet (that ships with #534), so this step
      # reports `bindings=0` and says outright that the zero is not evidence about any burned slot.
      - name: Report orphaned account-slot claim refs
        continue-on-error: true
        env:
          REGISTRY_GH_TOKEN: ${{ github.token }}
          ACCT_SECRET_NAMES: ${{ steps.acct-slots.outputs.names }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$REGISTRY_GH_TOKEN"
          python3 scripts/groom.py --report-orphan-claims \
            --registry-repo "$GITHUB_REPOSITORY"

      # Per-owner target token mint (issue #168): policy enables targets under TWO distinct owners
      # (sparq-org, jeswr), so a SINGLE App token scoped to one owner 404s every read and fails
      # every write on the other owner's repo — aborting the sweep before dead leases are released.
      # dispatch.yml already mints one token per owner; groom now does the same. groom.py
      # --print-owner-repos (self-tested, review round 1) collects EVERY enabled repo per owner —
      # not one representative repo, which would mint a token that 404s the owner's OTHER enabled
      # repos — and fails LOUD unless the enabled owner set is exactly {sparq-org, jeswr}, so a
      # policy change adding a third owner fails here instead of silently dropping that owner's
      # token (which would reintroduce the wrong-owner-token bug). Repo names are not secret; tee
      # keeps the minted scope visible in the run log.
      - name: Resolve enabled target repos per owner from policy
        id: owners
        run: |
          set -euo pipefail
          python3 scripts/groom.py --print-owner-repos --policy-file policy/repos.toml \
            | tee -a "$GITHUB_OUTPUT"

      # Each mint is continue-on-error: a missing install for one owner only DEFERS that owner's
      # issue/PR repair (groom.py skips it loudly); dead-lease release and the other owner's
      # grooming still run — the whole sweep is never aborted by one owner's credential gap.
      - name: Mint sparq-org target-scoped maintenance App token (pinned)
        id: target-token-sparq
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: sparq-org
          repositories: ${{ steps.owners.outputs.sparq_names }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mint jeswr target-scoped maintenance App token (pinned)
        id: target-token-jeswr
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: jeswr
          repositories: ${{ steps.owners.outputs.jeswr_names }}
          permission-issues: write
          permission-pull-requests: write

      # The {owner: token} JSON map is assembled INSIDE this step from the mint outputs (review
      # round 1): the assembled secret map never transits GITHUB_OUTPUT, and a mint that reported
      # success without delivering a token fails LOUD here instead of silently deferring every
      # target repair on every run. Failed/skipped mints stay absent from the map — that owner's
      # grooming defers loudly inside groom.py, never a wrong-owner token.
      - name: Sweep dead leases, stale issues, exhausted attempts, and stale PRs
        id: sweep
        env:
          REGISTRY_GH_TOKEN: ${{ github.token }}
          # Per-owner target App tokens (issue #168): groom.py resolves the token for each target
          # repo's OWNER, so a repo under a second owner is never read/written with the wrong token.
          SPARQ_TOKEN: ${{ steps.target-token-sparq.outputs.token }}
          JESWR_TOKEN: ${{ steps.target-token-jeswr.outputs.token }}
          SPARQ_MINT_OUTCOME: ${{ steps.target-token-sparq.outcome }}
          JESWR_MINT_OUTCOME: ${{ steps.target-token-jeswr.outcome }}
          # An App INSTALLATION token cannot call GET /user; groom resolves the bot identity from
          # the public /users/<slug>[bot] endpoint instead (the worker.yml canary fix). The same App
          # is installed on both owners, so the slug is identical — take it from whichever mint won.
          APP_SLUG: ${{ steps.target-token-sparq.outputs.app-slug || steps.target-token-jeswr.outputs.app-slug }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$REGISTRY_GH_TOKEN"
          [[ -z "${SPARQ_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$SPARQ_TOKEN"
          [[ -z "${JESWR_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$JESWR_TOKEN"
          if [[ "${SPARQ_MINT_OUTCOME:-}" == "success" && -z "${SPARQ_TOKEN:-}" ]]; then
            echo "::error::sparq-org token mint succeeded but no token reached this step"
            exit 1
          fi
          if [[ "${JESWR_MINT_OUTCOME:-}" == "success" && -z "${JESWR_TOKEN:-}" ]]; then
            echo "::error::jeswr token mint succeeded but no token reached this step"
            exit 1
          fi
          TARGET_GH_TOKENS="$(python3 - <<'PY'
          import json
          import os

          tokens = {}
          if os.environ.get("SPARQ_TOKEN"):
              tokens["sparq-org"] = os.environ["SPARQ_TOKEN"]
          if os.environ.get("JESWR_TOKEN"):
              tokens["jeswr"] = os.environ["JESWR_TOKEN"]
          print(json.dumps(tokens, separators=(",", ":")))
          PY
          )"
          export TARGET_GH_TOKENS
          python3 scripts/groom.py --self-test
          python3 scripts/groom.py \
            --registry-repo "$GITHUB_REPOSITORY" \
            --policy-file policy/repos.toml \
            --policy-resolver scripts/policy-resolve.py \
            --bot-slug "$APP_SLUG" \
            --ledger-root ledger

      # Model-access health decision (registry #32): the groom sweep already runs on schedule, so it
      # is the natural place to evaluate the health record window and raise/close alerts (keeps
      # dispatch.yml lean). Reads data/model-health.json + the enabled provider->account fleet, then
      # upserts ONE ops-alert issue per (condition, provider). An unreadable ledger exits NONZERO
      # (every reader fails loud, review r3); continue-on-error keeps the maintenance sweep alive
      # while this step goes visibly red. Account identifiers stay salted (decision 22a).
      - name: Decide + raise/close model-access health alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c) + the #39 fix: ALERT_REPO without ALERT_TOKEN
          # falls back to the registry repo (never dropped silently). Identifiers stay salted.
          # #432 round 1: the configured pair selects the DESTINATION, but the DETAILED body
          # (fleet/failure counts, reset hints, diagnostics) additionally requires a POSITIVELY
          # VERIFIED private destination — distinct from this registry repo AND confirmed
          # `"private": true` by a live GET /repos/{ALERT_REPO} read under ALERT_TOKEN. Token
          # presence alone is NOT verification; every other shape redacts to a generic signal.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          MAINTAINER_HANDLE: jeswr
          # Salt to map enabled account handles -> the salted hashes stored in the ledger, so the
          # provider-capped ("every enabled account") decision can be computed.
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          # The full registry gate already executes model-health's self-test. Do not replay its
          # intentional malformed-record/refused-pair fixtures on every live Groom tick: those
          # expected-negative cases emit GitHub ::error:: annotations and were indistinguishable
          # from a dropped production relay (#512). Producer/relay integration is covered by
          # worker-live.sh's stateful contract fixture against this unchanged validator.
          python3 scripts/model-health.py decide --policy-file policy/repos.toml
