# Registry self-management: issue triage + untrusted-input quarantine for
# jeswr/agent-account-registry. Mirrors the sparq target's .github/workflows/triage-issue.yml
# trust-gate pattern: on a new/edited/re-labelled issue, trust-gate by the AUTHOR's repo permission
# with an EXACT-MATCH trust for jeswr (the maintainer) and for the registry orchestrator App bot; a
# third-party author is quarantined (trust:untrusted) and its content is NEVER inspected. A trusted
# author's issue is statically triaged (role/priority/status) by scripts/triage.py — no model call.
# CLEARING that quarantine is authorized by the EVENT ACTOR's own write+ permission or by a write+
# 👍 REACTION on the issue, never by the event's TYPE: `triage` permission can move labels but is
# not trusted here, so a triage-role actor stripping `trust:untrusted` — or leaving a 👍 — gets it
# restored. The actor rule alone is not durable (it can only hold on the event that carries the
# label move, so the next edit re-quarantines); the reaction is ISSUE state and survives (#1009).
# The trust step and the quarantine step carry the whole argument between them.
#
# Minimal by design (do not over-build): reuses the sparq template and the registry's own
# scripts/triage.py. actionlint-clean; least privilege (issues:write, contents:read only).
name: triage-issue

on:
  issues:
    # PREVENTION, not only recovery (#607). `labeled`/`unlabeled` are DISTINCT issue event types;
    # without them, stripping a `priority:*` / `role:*` / `area:*` label off a `status:ready` issue
    # re-ran no classifier at all (the original #178 mechanism) and the issue stayed stranded until
    # retriage's 30-minute sweep (#586) picked it up. With them the classifier recomputes AT the
    # moment of the regression. The sweep REMAINS the fail-closed backstop — a run can be cancelled
    # by the concurrency group below, or never fire at all for a write made with the repository's
    # own token (see next paragraph) — this trigger just stops the issue being stranded meanwhile.
    #
    # NO SELF-TRIGGER LOOP, for two INDEPENDENT reasons. (1) This job writes labels with
    # `github.token`, and GitHub does not start workflow runs from events the repository
    # GITHUB_TOKEN emitted — the same documented rule dispatch.yml's dead `workflow_run` doorbell
    # measured on 2026-07-17 (zero deliveries). (2) Even if that rule ever changed, `triage()` is a
    # FIXED POINT (`add - labels` / `remove & labels`), so a replay over its own post-state plans
    # NOTHING and `live_gh`'s editor issues no `gh` call at all for an empty mutation: the cascade
    # terminates after one step. Both properties are pinned by `scripts/triage.py --self-test`.
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  issues: write
  contents: read

concurrency:
  # [#1325] CROSS-ISSUE DEBOUNCE ON THE LABEL FAN-OUT. The per-issue group collapses repeated
  # events on ONE issue, which is right — and it is NO protection at all against N DISTINCT issues
  # being touched at once. MEASURED: a bulk relabel of 37 issues (routine work — #1324 asks a lane
  # to drain the untriaged pool exactly this way) became 37 distinct groups, hence ~47 concurrently
  # EXECUTING triage runs, each spending from the installation's SHARED HOURLY github.token
  # request budget. The budget went to zero, dispatch's GUARD job failed closed on it (correctly,
  # and it refuses to be re-run), and PLAN executed no tick for the rest of the hour. A cheap bulk
  # write denied service to the whole fleet.
  #
  # So `labeled` — the burst-prone event, and the one a bulk relabel emits — collapses into ONE
  # repo-wide group. `cancel-in-progress: false` on that group is what makes this a BUDGET fix and
  # not merely a churn fix: GitHub holds at most one run in progress plus ONE pending run per
  # group and cancels any earlier PENDING run, so a 37-issue relabel EXECUTES at most two runs and
  # every other one is cancelled before it spends a single API call. Nothing is cancelled mid-write.
  #
  # `unlabeled` IS DELIBERATELY NOT COLLAPSED, and that asymmetry is the fail-closed half of this
  # change. `unlabeled` is the event that carries a `trust:untrusted` STRIP, and the quarantine
  # step's restore of that label (#607 / PR #998 r1 f1) is the control that stops a triage-role
  # actor clearing the hard gate ready-issues.py / curate-frontier.py / dispatch-claim.py read on
  # an issue whose AUTHOR is untrusted. Collapsing it would let an unrelated burst cancel that
  # restore, and the retriage sweep CANNOT stand in: its lanes only ever SKIP an untrusted author
  # (`untrusted-author`), they never re-apply quarantine. So the strip event keeps its own
  # per-issue group and its own run, always — as do opened/edited/reopened, so a human filing or
  # editing an issue is never queued behind a bulk operation.
  #
  # What the collapse costs is per-issue classification for the coalesced `labeled` events. The
  # retriage sweep (#586, :07/:37) is the fail-closed backstop this file's header already names
  # for exactly this reason — "a run can be cancelled by the concurrency group below".
  #
  # Both expressions are EVALUATED, not pattern-matched, by `scripts/triage.py --self-test`: it
  # extracts them from this file and resolves them over the workflow's whole `types:` set, so an
  # inverted branch, a collapsed `unlabeled`, or a reverted `cancel-in-progress` reds a row that
  # names the policy rather than merely comparing a string to itself.
  group: ${{ github.event.action == 'labeled' && 'triage-label-fanout' || format('triage-{0}', github.event.issue.number) }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

env:
  # Exact-match trusted logins. The maintainer, plus the registry orchestrator App bot login (an
  # App is never a collaborator, so the permission probe returns none and its worker-follow-up
  # issues would be wrongly quarantined). A repo variable lets the maintainer set the concrete App
  # slug post-install; the fallback is the documented default. NO blanket [bot] trust.
  MAINTAINER_LOGIN: jeswr
  APP_BOT_LOGIN: ${{ vars.REGISTRY_APP_BOT_LOGIN || 'agent-account-registry[bot]' }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
      # The login that emitted THIS event, and which event it is. On opened/edited/reopened the
      # actor is normally the author; on labeled/unlabeled it is whoever moved the labels, which
      # the author's trust says NOTHING about (PR #998 r1 f1). Both are judged below.
      ACTOR: ${{ github.event.sender.login }}
      ACTION: ${{ github.event.action }}
      # The issue's REAL GitHub issue type, straight from the event payload (#598). This step used
      # to pass the LITERAL `--type task`, so `ROLE_BY_TYPE["task"]` always resolved and the
      # area-derived role default added for #225 could never fire in production — it was
      # defence-in-depth against a caller that did not exist. Passing the payload's own value makes
      # it load-bearing: an UNTYPED issue, and one whose type is outside ROLE_BY_TYPE, now derive
      # their role from the issue's `area:*` instead of being silently rewritten to `task`
      # (-> role:impl). Concretely: an untyped `area:docs` issue reaches the docs chain, which is
      # the derivation #225 declared and this caller was overriding.
      # This expression is EMPTY when the issue carries no type — `triage.normalize_issue_type`
      # keeps it empty (GitHub's own "no type" answer) and `_role` falls through to the area map.
      # Read through env and quoted at the use site, never interpolated into the shell: issue-type
      # names are org-owned rather than author-owned, but the untrusted-input posture is uniform.
      ISSUE_TYPE: ${{ github.event.issue.type.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trust-gate the AUTHOR and the label-event ACTOR (exact-match maintainer/App, else repo permission)
        id: trust
        run: |
          set -euo pipefail
          # Exact-match trust for the maintainer and the registry App bot login — never a blanket
          # [bot] trust (a spoofed bot-suffixed author from some other App must not pass).
          # WRITE+ ONLY: `triage` and `read` are deliberately NOT trusted, and `triage` is exactly
          # the permission that can move an issue's labels — see the ACTOR probe below.
          trust_of() {
            if [ "$1" = "$MAINTAINER_LOGIN" ] || [ "$1" = "$APP_BOT_LOGIN" ]; then
              echo 1
              return
            fi
            perm=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo 1 ;;
              *) echo 0 ;;
            esac
          }
          author_trusted=$(trust_of "$AUTHOR")
          if [ "$ACTOR" = "$AUTHOR" ]; then
            actor_trusted="$author_trusted"
          else
            actor_trusted=$(trust_of "$ACTOR")
          fi
          echo "trusted=$author_trusted" >> "$GITHUB_OUTPUT"
          # MAINTAINER APPROVAL, read from the issue's 👍 REACTIONS (#1009). The actor rule below is
          # real but NOT DURABLE: it can only be true on the event that carries the label move, so
          # the third party's next `edited` re-derives the decision from the AUTHOR's trust and
          # re-quarantines an issue the maintainer had deliberately released. A reaction is ISSUE
          # state, not event state, so it is re-read and re-honoured on every event.
          # ANYONE CAN REACT ON A PUBLIC REPO. An unfiltered reaction read is the sparq #4743 shape,
          # so triage.py hands back CANDIDATE logins only and each one goes through `trust_of` — the
          # SAME exact-match/write+ probe the author and the actor get, with no second spelling of
          # the trust rule in this step (#958). A `read`/`triage`-role or drive-by 👍 counts for
          # nothing. The read is an idempotent GET, so it takes gh_retry's bounded backoff.
          # THE FALLBACK DIRECTION IS DELIBERATE and is the one place a fallback belongs in this
          # step: an unreadable reaction list yields NO candidates, hence NOT approved, which can
          # only ever ADD quarantine. (The decision call below still has none — see there.)
          # THE PROBE CAP IS NOT ORDERABLE BY THE ATTACKER (PR #1628 r1 f1, r2 f1). Candidates are
          # capped because each one costs a permission call on a list a drive-by controls — but
          # capping a SORTED list alone let 50 sock-puppet logins that sort earlier bury a real 👍,
          # reporting NOT approved and re-quarantining on the next edit. Two things stop that now.
          # The two EXACT-MATCH identities below are handed to the filter as cap-exempt and probed
          # first; `trust_of` answers for them BY NAME, so hoisting them costs no API call at all.
          # And EVERY OTHER candidate is intersected with the repository's own COLLABORATOR ROSTER
          # before the cap applies — r1 hoisted only the two exact-match logins, which left every
          # other write/maintain/admin collaborator inside the prefix a flooder chooses. Roster
          # membership is the owner's to write and no reactor's, so the capped set is no longer
          # third-party input; and since `trust_of` can only answer write+ for an exact-match login
          # or a collaborator, intersecting drops no approval that could ever have been granted.
          # A FAILED ROSTER READ narrows the run to the exact-match identities (announced by the
          # filter) rather than reopening the flood — the fail-closed direction.
          approved=0
          roster=$(mktemp)
          python3 scripts/gh_retry.py read api "repos/$REPO/collaborators" --paginate > "$roster" || : > "$roster"
          reactors=$(python3 scripts/gh_retry.py read api "repos/$REPO/issues/$NUM/reactions" --paginate \
            | python3 scripts/triage.py --approval-reactors --collaborators "$roster" \
                --priority-login "$MAINTAINER_LOGIN" --priority-login "$APP_BOT_LOGIN") || reactors=""
          while IFS= read -r reactor; do
            [ -n "$reactor" ] || continue
            if [ "$(trust_of "$reactor")" = "1" ]; then
              approved=1
              break
            fi
          done <<< "$reactors"
          echo "maintainer_approved=$approved" >> "$GITHUB_OUTPUT"
          # ONE definition of the quarantine rule, and it lives in Python where the self-test can
          # EXECUTE it over the whole (event x author-trust x actor-trust x approval) matrix — a
          # second copy spelled as a workflow `if:` expression would be a mutually-masking duplicate
          # (AGENTS.md pre-flight 4) that no test could kill. No `|| <fallback>` here for the same
          # reason: if the decision cannot be computed the step goes RED and the job stops, which is
          # the only honest outcome — a fallback would be that second definition.
          quarantine=$(python3 scripts/triage.py --quarantine-decision --action "$ACTION" --author-trusted "$author_trusted" --actor-trusted "$actor_trusted" --maintainer-approved "$approved")
          echo "quarantine=$quarantine" >> "$GITHUB_OUTPUT"

      # PR #595 finding 5: the QUARANTINE labels are a TRUST BOUNDARY, so their write is fail-loud.
      # It used to carry `|| true`: a failed edit left third-party content with NO trust:untrusted
      # and NO status:untriaged while the job reported success — silently un-quarantined, and
      # invisible even to the bidirectional (#586) retriage sweep: BOTH of its lanes are keyed on a
      # status attestation (status:untriaged for promote, status:ready for re-park/repair) and such
      # an issue carries neither, so retriage.plan calls it not-retriageable. The edit now fails
      # the step (`set -e`, no `|| true`) and a post-read PROVES both labels landed before it goes
      # green. Only the courtesy NOTIFICATION stays best-effort — it is not a state transition, and
      # it emits a ::warning rather than vanishing. scripts/triage.py --self-test statically
      # asserts this shape so the `|| true` cannot come back on the label write.
      #
      # AUTHORIZED BY THE ACTOR, NEVER BY THE EVENT TYPE (#607; PR #998 r1 f1). The first cut of
      # #607 exempted `labeled`/`unlabeled` from the quarantine write on the premise that only a
      # triage/write actor can emit one, so no third party could. That premise contradicts this
      # workflow's OWN trust rule: `triage` is not write+, so a triage-role collaborator is
      # UNTRUSTED here — and triage permission is precisely the permission that manages labels.
      # With the exemption, such an actor could strip `trust:untrusted` and nothing would put it
      # back, clearing the hard gate that ready-issues.py / curate-frontier.py / dispatch-claim.py
      # read, on an issue whose AUTHOR is still untrusted. So the decision is now taken from the
      # ACTOR's own permission: `steps.trust.quarantine` is 0 only when the author is trusted, when
      # a WRITE+ login has 👍-approved the issue (#1009 — standing evidence that survives the next
      # content event, which the actor rule cannot), or when a WRITE+ actor asserted the label set
      # on a label event (the deliberate un-quarantine).
      # Every other event — including an `unlabeled` by a triage-role or drive-by actor — RESTORES
      # `trust:untrusted` and `status:untriaged` via the idempotent `--add-label` write below.
      # The rule itself is a single Python function so it is executable and testable; see
      # `quarantine_required()` in scripts/triage.py, pinned by its `--self-test` truth table.
      - name: Quarantine + notify (untrusted author)
        # The `id:` is what `scripts/triage.py --self-test` extracts this step's body by so it can
        # RUN it against a stubbed GitHub (#999) — a pattern-matched shell guard is not pinned
        # (AGENTS.md pre-flight 6). Renaming it reds that section rather than silently skipping it.
        id: quarantine
        if: steps.trust.outputs.quarantine == '1'
        run: |
          set -euo pipefail
          # THE LABEL WRITE IS IDEMPOTENT; THE COURTESY COMMENT WAS NOT (#999). `--add-label` of a
          # label already present is a no-op, but `gh issue comment` appends unconditionally: every
          # `edited` event on an ALREADY-quarantined third-party issue posted another identical
          # notice, so an author editing their own body three times collected three copies.
          # The label write, its fail-loud posture (no swallowed failure) and its post-read
          # verification come FIRST and are untouched: nothing about the courtesy notice may delay
          # or withhold the quarantine.
          gh issue edit "$NUM" -R "$REPO" --add-label trust:untrusted --add-label status:untriaged
          post=$(python3 scripts/gh_retry.py read issue view "$NUM" -R "$REPO" --json labels \
            --jq '[.labels[].name]|join(",")')
          for required in trust:untrusted status:untriaged; do
            case ",$post," in
              *",$required,"*) : ;;
              *) echo "::error title=quarantine #$NUM::$required did NOT land (labels now: $post) — refusing to report success on an un-quarantined third-party issue"; exit 1 ;;
            esac
          done
          # [PR #1565 r1] THE DE-DUPLICATION READS THE NOTICE, NEVER THE LABEL. #999's first cut
          # skipped the notice when `trust:untrusted` was already present pre-write — but the label
          # is not evidence that a comment exists, and it is the only state remembered, so a single
          # miss became PERMANENT silence: this job's own `cancel-in-progress` group can kill a run
          # between the verified label write above and the post below, and the post is best-effort
          # anyway. Either one left the label set and no notice, and every later event then skipped.
          # So the question asked is the one that matters — does an AUTHENTIC notice comment exist?
          # `quarantine_notice_posted()` answers it author-filtered and line-anchored; the marker
          # and the body live only in that module, so there is no second copy here to drift (#958).
          # THE FALLBACK DIRECTION IS DELIBERATE: this read is courtesy plumbing, so a failure
          # yields an empty verdict, which degrades to POSTING (at worst a duplicate) — never to a
          # withheld label write and never to a suppressed notice.
          notified=$(python3 scripts/gh_retry.py read issue view "$NUM" -R "$REPO" --json comments \
            | python3 scripts/triage.py --quarantine-notice-posted) || notified=""
          if [ "$notified" = "1" ]; then
            echo "::notice title=quarantine #$NUM::the quarantine notice is already posted on this issue — the labels are re-asserted above, the notice is NOT re-posted"
          else
            notice=$(python3 scripts/triage.py --quarantine-notice-body)
            gh issue comment "$NUM" -R "$REPO" --body "$notice" \
              || echo "::warning title=quarantine #$NUM::the quarantine notice comment failed to post; the quarantine LABELS are verified in place, so the issue is not acted on — a later event on this issue will retry the notice"
          fi

      # `--apply` owns the whole read -> plan -> mutate sequence FAIL-CLOSED (registry #582).
      # It replaces the previous per-label `gh issue edit ... || true` loops, which applied the
      # role ADD and the role STRIP independently and swallowed both failures: the add of the
      # non-existent `role:soundness` failed, the strip of `role:impl` succeeded, and the issue
      # landed `status:ready` with NO role — silently undispatchable and unrecoverable. The applier
      # now adds + VERIFIES the replacement role label before stripping anything, and re-reads the
      # issue afterwards to assert exactly one `role:*` survives. NO `|| true`: an invariant or
      # post-condition failure must turn this step RED, not strand an issue quietly.
      - name: Static triage (trusted author)
        if: steps.trust.outputs.trusted == '1'
        run: python3 scripts/triage.py --apply --repo "$REPO" --number "$NUM" --type "$ISSUE_TYPE"
