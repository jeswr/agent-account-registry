# Registry self-management: issue triage + untrusted-input quarantine for
# jeswr/agent-account-registry. Mirrors the sparq target's .github/workflows/triage-issue.yml
# trust-gate pattern: on a new/edited issue, trust-gate by the AUTHOR's repo permission with an
# EXACT-MATCH trust for jeswr (the maintainer) and for the registry orchestrator App bot login; a
# third-party author is quarantined (trust:untrusted) and its content is NEVER inspected. A trusted
# author's issue is statically triaged (role/priority/status) by scripts/triage.py — no model call.
#
# Minimal by design (do not over-build): reuses the sparq template and the registry's own
# scripts/triage.py. actionlint-clean; least privilege (issues:write, contents:read only).
name: triage-issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  # Exact-match trusted logins. The maintainer, plus the registry orchestrator App bot login (an
  # App is never a collaborator, so the permission probe returns none and its worker-follow-up
  # issues would be wrongly quarantined). A repo variable lets the maintainer set the concrete App
  # slug post-install; the fallback is the documented default. NO blanket [bot] trust.
  MAINTAINER_LOGIN: jeswr
  APP_BOT_LOGIN: ${{ vars.REGISTRY_APP_BOT_LOGIN || 'agent-account-registry[bot]' }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trust-gate the author (exact-match maintainer/App, else repo permission)
        id: trust
        run: |
          set -euo pipefail
          # Exact-match trust for the maintainer and the registry App bot login — never a blanket
          # [bot] trust (a spoofed bot-suffixed author from some other App must not pass).
          if [ "$AUTHOR" = "$MAINTAINER_LOGIN" ] || [ "$AUTHOR" = "$APP_BOT_LOGIN" ]; then
            echo "trusted=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "trusted=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "trusted=0" >> "$GITHUB_OUTPUT" ;;
          esac

      # PR #595 finding 5: the QUARANTINE labels are a TRUST BOUNDARY, so their write is fail-loud.
      # It used to carry `|| true`: a failed edit left third-party content with NO trust:untrusted
      # and NO status:untriaged while the job reported success — silently un-quarantined, and
      # invisible to retriage (which only revisits status:untriaged). The edit now fails the step
      # (`set -e`, no `|| true`) and a post-read PROVES both labels landed before the step goes
      # green. Only the courtesy NOTIFICATION stays best-effort — it is not a state transition, and
      # it emits a ::warning rather than vanishing. scripts/triage.py --self-test statically
      # asserts this shape so the `|| true` cannot come back on the label write.
      - name: Quarantine + notify (untrusted author)
        if: steps.trust.outputs.trusted != '1'
        run: |
          set -euo pipefail
          gh issue edit "$NUM" -R "$REPO" --add-label trust:untrusted --add-label status:untriaged
          post=$(python3 scripts/gh_retry.py read issue view "$NUM" -R "$REPO" --json labels \
            --jq '[.labels[].name]|join(",")')
          for required in trust:untrusted status:untriaged; do
            case ",$post," in
              *",$required,"*) : ;;
              *) echo "::error title=quarantine #$NUM::$required did NOT land (labels now: $post) — refusing to report success on an un-quarantined third-party issue"; exit 1 ;;
            esac
          done
          gh issue comment "$NUM" -R "$REPO" \
            --body "> 🤖 SPARQ agent — this issue is from a non-collaborator, so it is **quarantined** (\`trust:untrusted\`) and its content is not acted on. A maintainer can approve it by adding a 👍 reaction." \
            || echo "::warning title=quarantine #$NUM::the quarantine notice comment failed to post; the quarantine LABELS are verified in place, so the issue is not acted on"

      # `--apply` owns the whole read -> plan -> mutate sequence FAIL-CLOSED (registry #582).
      # It replaces the previous per-label `gh issue edit ... || true` loops, which applied the
      # role ADD and the role STRIP independently and swallowed both failures: the add of the
      # non-existent `role:soundness` failed, the strip of `role:impl` succeeded, and the issue
      # landed `status:ready` with NO role — silently undispatchable and unrecoverable. The applier
      # now adds + VERIFIES the replacement role label before stripping anything, and re-reads the
      # issue afterwards to assert exactly one `role:*` survives. NO `|| true`: an invariant or
      # post-condition failure must turn this step RED, not strand an issue quietly.
      - name: Static triage (trusted author)
        if: steps.trust.outputs.trusted == '1'
        run: python3 scripts/triage.py --apply --repo "$REPO" --number "$NUM" --type task
