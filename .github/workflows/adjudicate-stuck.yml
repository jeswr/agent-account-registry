# [registry #446] The stuck-escalation auto-adjudicator sweep.
#
# 36 PRs (19 sparq + 17 registry) were terminally parked on `review:needs-user` with nothing able
# to resolve them, so the active review set drained and merges stopped. This cron drains the
# machine-owned half of that population and labels the rest.
#
# WHAT THIS RUN CAN DO: post a comment, move `review:needs-user` -> `review:needs` on a PR, and
# clear a PROVABLY machine-applied `needs:user` from its source issue. That is the whole surface.
# It does not run target code, does not touch a diff, a test, a gate, or a verdict, and cannot arm
# or merge anything — the adjudication itself is the cross-provider review round the re-admission
# buys, and the existing arm gate still owns every arm decision. See scripts/adjudicate-stuck.py.
name: adjudicate-stuck

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'write (default: dry run — plan and explain, mutate nothing)'
        type: boolean
        default: false
      limit:
        description: 'max PRs to act on per target repo (0 = no cap)'
        type: string
        default: '5'
  schedule:
    # Explicit off-peak minutes, the throttling-resistant convention every privileged cron here
    # uses. :09/:39 avoids dispatch (:03/:13/...), groom (:07/:22/...), retriage (:07/:37),
    # conflict-resolver (:01/:21/:41), curate (:17/:47), metrics (:11/:26/...) and the :00/:15
    # dashboard pair, so the sweep never contends with a maintenance tick for the same PR.
    - cron: '9,39 * * * *'

permissions: {}

concurrency:
  group: registry-adjudicate-stuck
  cancel-in-progress: false

jobs:
  plan:
    name: Enumerate enabled targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout private registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The self-test runs BEFORE anything fans out: an adjudicator whose refusal guards are not
      # green must not sweep a single repository. It is the same manifest-enrolled suite entry the
      # registry-selftest gate runs, so this cannot drift from the gate.
      - name: Verify the adjudication policy
        run: python3 scripts/adjudicate-stuck.py --self-test

      # One matrix entry per `enabled = true` policy row, so each sweep job below mints a token
      # scoped to exactly the one repository it touches instead of an owner-wide one.
      - name: Resolve enabled targets from policy
        id: targets
        run: |
          set -euo pipefail
          python3 scripts/adjudicate-stuck.py --print-matrix \
            --policy-file policy/repos.toml | tee -a "$GITHUB_OUTPUT"

  sweep:
    name: Adjudicate ${{ matrix.repo }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # REGISTRY_ADMIN_APP_ID/KEY live in the default-branch-restricted environment the other
    # privileged crons use. That server-side policy rejects a manual dispatch of a MODIFIED
    # non-default-branch copy of this workflow before either secret can be read — which is what
    # stops a PR branch from teaching this sweep to clear a human hold.
    environment: dispatch-secrets
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout private registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # Recorded review verdicts live on the unprotected `ledger` data-plane branch (issue #96);
      # the master checkout above keeps the pre-outage copies. The sweep reads the LATEST recorded
      # verdict to count blocking findings, and an unreadable record blocks a trust surface, so a
      # missing ledger degrades toward leaving parks with the maintainer — never toward draining
      # one it could not assess.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      - name: Ledger checkout is data-only (trust guard)
        run: python3 registry/scripts/ledger-invariant.py ledger

      # The target's OWN routing table is the source of the trust-surface keyword union the
      # arm-side classifier uses (policy-resolve.routing_security_keywords). Checked out from the
      # public target with no token, exactly as review-fix.yml's resolve job does.
      - name: Checkout public target for protected routing data (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repo }}
          path: target-routing
          persist-credentials: false

      # Least privilege, and narrower than the owner-wide mints groom/conflict-resolver take: one
      # repository, issues:write for the label/comment writes, pull-requests:read for the head
      # snapshot. NO contents write — this sweep never pushes.
      - name: Mint adjudication App token for ${{ matrix.repo }} (pinned)
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-issues: write
          permission-pull-requests: read

      - name: Sweep terminally parked PRs
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          APP_SLUG: ${{ steps.target-token.outputs.app-slug }}
          # The cron drains; a manual dispatch defaults to a DRY RUN so the population and every
          # per-PR reason can be read before anything is written.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
          LIMIT: ${{ inputs.limit || '5' }}
        run: |
          set -euo pipefail
          [[ -n "${TARGET_TOKEN:-}" ]] || { echo '::error::no target App token was minted'; exit 1; }
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          [[ -n "${APP_SLUG:-}" ]] || { echo '::error::the token mint reported no App slug'; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo '::error::--limit must be a non-negative integer'; exit 1; }
          apply_flag=()
          [[ "$APPLY" != "true" ]] || apply_flag=(--apply)
          # An App INSTALLATION token cannot call GET /user, so the bot identity comes from the
          # mint's slug (the worker.yml canary fix). Receipts are trusted from THIS login only:
          # get it wrong and every marker reads as third-party and the sweep refuses everything —
          # which is the safe direction, not a silent widening.
          python3 registry/scripts/adjudicate-stuck.py \
            "${apply_flag[@]}" \
            --repo "$TARGET_REPO" \
            --bot-login "${APP_SLUG}[bot]" \
            --token "$TARGET_TOKEN" \
            --policy-file registry/policy/repos.toml \
            --target-root target-routing \
            --verdict-root ledger/orchestration/review-verdicts \
            --verdict-root registry/orchestration/review-verdicts \
            --limit "$LIMIT"
