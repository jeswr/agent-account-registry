name: retriage

on:
  schedule:
    # Explicit minutes avoid the degraded scheduling GitHub applies to */N expressions.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-retriage
  cancel-in-progress: false

env:
  MAINTAINER_LOGIN: jeswr
  APP_BOT_LOGIN: ${{ vars.REGISTRY_APP_BOT_LOGIN || 'agent-account-registry[bot]' }}

jobs:
  retriage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify retriage planner
        run: python3 scripts/retriage.py --self-test

      # PR #595 findings 3 + 6. The sweep no longer touches labels itself: it plans NOTHING and
      # mutates NOTHING in shell. `scripts/retriage.py --apply` owns the whole
      # read -> plan -> add-and-verify -> strip -> revision-bound post-read -> repair sequence
      # (the same applier `triage.py --apply` uses), because the previous shell version:
      #   * sent the adds AND removals through ONE opaque `gh issue edit` with no proof that the
      #     replacement `role:*` label exists or landed before the incumbent was stripped — the
      #     exact #582 shape (add fails, strip succeeds, issue ends status:ready with no role);
      #   * ran under `set -e`, so a partial failure exited the step and SKIPPED the post-read;
      #   * `exit 1`-ed on a detected zero-role post-state without restoring the incumbent or
      #     demoting status:ready — leaving the terminal state live AND aborting the rest of the
      #     sweep before those issues' post-conditions ran;
      #   * ACCEPTED multiple role labels, which route-resolve rejects (AmbiguousRoleError).
      # A per-issue failure is now recorded and the sweep CONTINUES; the step turns red once, after
      # the loop. Every READ goes through the shared bounded-retry layer; MUTATIONS stay
      # single-attempt + fail-loud inside the applier (gh_retry's hard scope rule).
      # scripts/retriage.py --self-test statically asserts all of this against this file.
      - name: Sweep at most 40 untriaged issues
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/retriage"
          mkdir -p "$tmp"
          # Shared bounded-retry layer for IDEMPOTENT READS (scripts/gh_retry.py — one tuned copy,
          # registry #563 item 4): a transient 5xx/429/secondary-403 blip on the label-set oracle,
          # the issue list, or a permission probe costs a bounded retry instead of the whole tick.
          # Its `read` CLI structurally refuses anything that is not a read, so a mutation can never
          # acquire replay semantics by being routed through this wrapper.
          gh_read() { python3 scripts/gh_retry.py read "$@"; }
          # registry #582: give the planner the repo's ACTUAL label set so it can never plan an add
          # of a label that does not exist (nor a strip of the last role:* label for one). Without
          # it, `role:soundness` — absent from this repo — stranded promoted issues role-less.
          known=$(gh_read label list -R "$REPO" --limit 500 --json name --jq '[.[].name]|join(",")')
          gh_read issue list -R "$REPO" --state open --label status:untriaged --limit 40 \
            --json number,author,body,labels,updatedAt > "$tmp/untriaged.json"
          jq -c 'sort_by(.updatedAt) | .[]' "$tmp/untriaged.json" > "$tmp/issues.jsonl"

          failed=0
          while IFS= read -r issue; do
            number=$(jq -r .number <<<"$issue")
            author=$(jq -r .author.login <<<"$issue")
            permission=none
            if [ "$author" != "$MAINTAINER_LOGIN" ] && [ "$author" != "$APP_BOT_LOGIN" ]; then
              permission=$(gh_read api "repos/$REPO/collaborators/$author/permission" \
                --jq .permission 2>/dev/null || echo none)
            fi
            if python3 scripts/retriage.py --apply --repo "$REPO" --number "$number" \
                 --maintainer "$MAINTAINER_LOGIN" --app-bot "$APP_BOT_LOGIN" \
                 --permission "$permission" --known-labels "$known" <<<"$issue"; then
              echo "retriage #$number: ok"
            else
              echo "::error title=retriage #$number::fail-closed retriage FAILED — the issue did not satisfy the single-role post-condition (registry #582); see the applier warnings above"
              failed=1
            fi
          done < "$tmp/issues.jsonl"
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more issues failed their fail-closed retriage post-condition (registry #582)"
            exit 1
          fi
