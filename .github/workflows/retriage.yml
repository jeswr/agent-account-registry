name: retriage

on:
  schedule:
    # Explicit minutes avoid the degraded scheduling GitHub applies to */N expressions.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-retriage
  cancel-in-progress: false

env:
  MAINTAINER_LOGIN: jeswr
  APP_BOT_LOGIN: ${{ vars.REGISTRY_APP_BOT_LOGIN || 'agent-account-registry[bot]' }}

jobs:
  retriage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify retriage planner
        run: python3 scripts/retriage.py --self-test

      # BOTH directions of the drift sweep (#586) share ONE snapshot and ONE apply path, so the
      # promotion lane and the re-park lane can never drift apart:
      #   * status:untriaged -> promote once the label set is triage-complete (#415).
      #   * status:ready     -> re-park/repair once the readiness engine provably cannot enumerate
      #                         it (the label-lost half of #178: nothing on master recovered it).
      # The snapshot is REAL cursor pagination with a runaway ceiling and an explicit per-run cap;
      # `retriage.py --snapshot` fails closed (non-zero) on a partial page, so `set -e` aborts the
      # step BEFORE any write rather than mistaking a truncated board for "nothing to do".
      - name: Sweep the untriaged and status:ready boards (at most 80 issues)
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/retriage"
          mkdir -p "$tmp"
          for label in status:untriaged status:ready; do
            gh api --paginate --slurp \
              "repos/$REPO/issues?state=open&labels=$label&per_page=100" \
              > "$tmp/pages-${label#status:}.json"
          done
          jq -s 'add' "$tmp/pages-untriaged.json" "$tmp/pages-ready.json" > "$tmp/pages.json"
          python3 scripts/retriage.py --snapshot --cap 80 \
            < "$tmp/pages.json" > "$tmp/issues.jsonl"

          while IFS= read -r issue; do
            number=$(jq -r .number <<<"$issue")
            author=$(jq -r .author.login <<<"$issue")
            permission=none
            if [ "$author" != "$MAINTAINER_LOGIN" ] && [ "$author" != "$APP_BOT_LOGIN" ]; then
              permission=$(gh api "repos/$REPO/collaborators/$author/permission" \
                --jq .permission 2>/dev/null || echo none)
            fi
            decision=$(python3 scripts/retriage.py \
              --maintainer "$MAINTAINER_LOGIN" --app-bot "$APP_BOT_LOGIN" \
              --permission "$permission" <<<"$issue")
            action=$(jq -r .action <<<"$decision")
            case "$action" in
              promote|repark|repair) ;;
              *)
                echo "skip #$number: $(jq -r .reason <<<"$decision")"
                continue
                ;;
            esac

            args=()
            while IFS= read -r label; do args+=(--add-label "$label"); done \
              < <(jq -r '.add[]' <<<"$decision")
            while IFS= read -r label; do args+=(--remove-label "$label"); done \
              < <(jq -r '.remove[]' <<<"$decision")
            # An action with no label write is unreachable by construction (every accepted action
            # carries drift) — treat it as a planner bug and write NOTHING rather than issuing a
            # bare `gh issue edit`.
            if [ "${#args[@]}" -eq 0 ]; then
              echo "skip #$number: $action carried no label write"
              continue
            fi
            gh issue edit "$number" -R "$REPO" "${args[@]}"
            echo "$action #$number: +[$(jq -r '.add | join(",")' <<<"$decision")]" \
              "-[$(jq -r '.remove | join(",")' <<<"$decision")]"
          done < "$tmp/issues.jsonl"
