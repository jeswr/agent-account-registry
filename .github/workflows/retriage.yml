name: retriage

on:
  schedule:
    # Explicit minutes avoid the degraded scheduling GitHub applies to */N expressions.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-retriage
  cancel-in-progress: false

env:
  MAINTAINER_LOGIN: jeswr
  APP_BOT_LOGIN: ${{ vars.REGISTRY_APP_BOT_LOGIN || 'agent-account-registry[bot]' }}

jobs:
  retriage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify retriage planner
        run: python3 scripts/retriage.py --self-test

      # BOTH directions of the drift sweep (#586) share ONE snapshot and ONE apply path, so the
      # promotion lane and the re-park lane can never drift apart:
      #   * status:untriaged -> promote once the label set is triage-complete (#415).
      #   * status:ready     -> re-park/repair once the readiness engine provably cannot enumerate
      #                         it (the label-lost half of #178: nothing on master recovered it).
      # The board is fetched page by page with an explicit REQUEST ceiling (max_pages below), and
      # completeness is proved by reading until a page comes back short — a board too large for the
      # ceiling fails the step closed rather than being swept partially. `retriage.py --snapshot`
      # then validates the SHAPE of those pages (fail closed, non-zero, so `set -e` aborts before
      # any write) and hands back THIS run's window: an explicit per-run cap whose offset ROTATES
      # by the run number, so a capped board cannot starve its tail (#605 review findings 1 + 2).
      #
      # PR #595 findings 3 + 6. The sweep no longer touches labels itself: it plans NOTHING and
      # mutates NOTHING in shell. `scripts/retriage.py --apply` owns the whole
      # read -> plan -> add-and-verify -> strip -> revision-bound post-read -> repair sequence
      # for EVERY lane above (the same applier `triage.py --apply` uses), because the previous
      # shell version:
      #   * sent the adds AND removals through ONE opaque `gh issue edit` with no proof that the
      #     replacement `role:*` label exists or landed before the incumbent was stripped — the
      #     exact #582 shape (add fails, strip succeeds, issue ends status:ready with no role);
      #   * ran under `set -e`, so a partial failure exited the step and SKIPPED the post-read;
      #   * `exit 1`-ed on a detected zero-role post-state without restoring the incumbent or
      #     demoting status:ready — leaving the terminal state live AND aborting the rest of the
      #     sweep before those issues' post-conditions ran;
      #   * ACCEPTED multiple role labels, which route-resolve rejects (AmbiguousRoleError).
      # A per-issue failure is now recorded and the sweep CONTINUES; the step turns red once, after
      # the loop. Every READ goes through the shared bounded-retry layer; MUTATIONS stay
      # single-attempt + fail-loud inside the applier (gh_retry's hard scope rule).
      # scripts/retriage.py --self-test statically asserts all of this against this file.
      - name: Sweep the untriaged and status:ready boards (at most 80 issues)
        # `id:` so retriage.py's self-test can EXTRACT and EXECUTE this exact step body against a
        # stubbed `gh_retry`/applier (#605 review round 2): the pagination ceiling, the
        # completeness proof, the page-shape guard and the truncation break are SHELL guards, and
        # every one of them survived the previous purely-textual assertions.
        id: sweep
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/retriage"
          mkdir -p "$tmp"
          # Shared bounded-retry layer for IDEMPOTENT READS (scripts/gh_retry.py — one tuned copy,
          # registry #563 item 4): a transient 5xx/429/secondary-403 blip on the label-set oracle,
          # the board pages, or a permission probe costs a bounded retry instead of the whole tick.
          # Its `read` CLI structurally refuses anything that is not a read, so a mutation can never
          # acquire replay semantics by being routed through this wrapper.
          gh_read() { python3 scripts/gh_retry.py read "$@"; }
          # registry #582: give the planner the repo's ACTUAL label set so it can never plan an add
          # of a label that does not exist (nor a strip of the last role:* label for one). Without
          # it, `role:soundness` — absent from this repo — stranded promoted issues role-less.
          known=$(gh_read label list -R "$REPO" --limit 500 --json name --jq '[.[].name]|join(",")')
          # #605 review finding 2: `--paginate --slurp` pulled EVERY page into a file BEFORE any
          # ceiling could look at it, so the "runaway ceiling" bounded neither requests nor memory
          # — it only refused to mutate afterwards — and a genuinely TRUNCATED sequence was
          # undetectable (a well-formed board missing its last page reads exactly like a short
          # board). Page explicitly instead, with a REAL request ceiling, and prove completeness the
          # only way the API offers: keep going until a page comes back short. A board that does not
          # fit inside the ceiling fails the step CLOSED — a board we could not read completely must
          # never be mistaken for "nothing to do".
          max_pages=20     # retriage.SWEEP_MAX_PAGES * 100 issues per label lane
          for label in status:untriaged status:ready; do
            lane=${label#status:}
            page=1
            while : ; do
              out="$tmp/page-$lane-$page.json"
              gh_read api "repos/$REPO/issues?state=open&labels=$label&per_page=100&page=$page" \
                > "$out"
              # #605 review round 2: the previous claim here — "a non-array payload fails here,
              # under set -e" — was simply FALSE. `jq 'length'` accepts objects, strings and null
              # (2 / 9 / 0 respectively), so an error document like {"message":"Not Found"} scored
              # 2, compared `-lt 100`, broke out of the loop and was swept as a complete board.
              # The type IS the guard now, and it is asserted by an executed self-test row.
              if ! jq -e 'type == "array"' "$out" > /dev/null; then
                echo "::error::the $label board page $page is not a JSON array — refusing to sweep a board this run could not read (fail closed)"
                exit 1
              fi
              got=$(jq 'length' "$out")
              if [ "$got" -lt 100 ]; then
                break
              fi
              if [ "$page" -ge "$max_pages" ]; then
                echo "::error::the $label board is larger than ${max_pages} pages (>= $((max_pages * 100)) issues) — refusing to sweep a board this run could not read completely (fail closed)"
                exit 1
              fi
              page=$((page + 1))
            done
          done
          # Each page file is already a JSON array, so slurping them yields the list-of-pages shape
          # `--snapshot` validates. Glob order is irrelevant: it flattens and re-orders by number.
          jq -s '.' "$tmp"/page-*.json > "$tmp/pages.json"
          # --rotation makes the per-run window ROTATE (#605 review finding 1): a fixed
          # oldest-updated window filled with permanent no-op skips and starved the rest of the
          # board forever. GITHUB_RUN_NUMBER is monotonic per workflow, so consecutive runs advance
          # the window over a stable (issue-number) ordering with no cursor state to persist. The
          # windows are NOT disjoint unless the cap divides the board (#605 review round 4): the
          # wrapping window re-visits the head. What is guaranteed is coverage of an unchanged board
          # within ceil(total/cap) runs — progress, not a per-issue deadline.
          python3 scripts/retriage.py --snapshot --cap 80 --rotation "$GITHUB_RUN_NUMBER" \
            < "$tmp/pages.json" > "$tmp/issues.jsonl"

          failed=0
          while IFS= read -r issue; do
            number=$(jq -r .number <<<"$issue")
            author=$(jq -r .author.login <<<"$issue")
            permission=none
            if [ "$author" != "$MAINTAINER_LOGIN" ] && [ "$author" != "$APP_BOT_LOGIN" ]; then
              permission=$(gh_read api "repos/$REPO/collaborators/$author/permission" \
                --jq .permission 2>/dev/null || echo none)
            fi
            # ONE call per issue for ALL THREE lanes: the applier re-reads the live labels, plans
            # (promote / repark / repair, else skip) and mutates fail-closed. It PRINTS the decision,
            # so a skip stays attributable without the shell ever deciding anything itself.
            if python3 scripts/retriage.py --apply --repo "$REPO" --number "$number" \
                 --maintainer "$MAINTAINER_LOGIN" --app-bot "$APP_BOT_LOGIN" \
                 --permission "$permission" --known-labels "$known" <<<"$issue"; then
              echo "retriage #$number: ok"
            else
              echo "::error title=retriage #$number::fail-closed retriage FAILED — the issue did not satisfy the single-role post-condition (registry #582); see the applier warnings above"
              failed=1
            fi
          done < "$tmp/issues.jsonl"
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more issues failed their fail-closed retriage post-condition (registry #582)"
            exit 1
          fi

  # FAIL-LOUD alert for a HARD RETRIAGE failure (issue #577). Retriage is the ONLY path that returns
  # `status:untriaged` issues to dispatch (issue #415, built to end the stranding outage #414
  # measured), and until now it had NO alert leg at all — unlike the dispatch PLAN cron
  # (scripts/plan-alert.py) and the groom cron (scripts/groom-alert.py). The sweep goes red two ways
  # and NEITHER had an alert leg: a HARD abort under `set -euo pipefail` — the label-set read, the
  # page-shape or request-ceiling guard, or a `retriage.py --self-test`/`--snapshot` regression —
  # which can strike PART-WAY through, leaving some issues promoted and the rest stranded; or the
  # post-loop `exit 1` raised once a per-issue applier failed its fail-closed post-condition (#582).
  # Either way the only other signal is the untriaged count growing on the dashboard. The
  # dashboard keepalive does not cover it either: it re-dispatches workflows whose last run is
  # STALE, and a cron that runs punctually every tick and FAILS every time is never stale.
  #
  # This standalone job keys on `needs.retriage.result` and, on failure/cancelled, upserts a rolling
  # `ops-alert` issue @-mentioning the maintainer via the SAME ALERT_REPO/ALERT_TOKEN routing
  # (locked decision 22c) — ONE alert issue, re-used, never one per tick; it auto-closes on an
  # explicit RETRIAGE success. It reads only the job RESULT, so no issue content reaches it.
  retriage-alert:
    name: ALERT (hard RETRIAGE-sweep failure)
    needs: [retriage]
    # Runs every tick regardless of the sweep result so a healthy sweep can auto-close a prior
    # alert; scripts/retriage-alert.py keys on needs.retriage.result — close happens ONLY on an
    # explicit success (a skipped RETRIAGE is not a recovery), and a success tick with no open alert
    # does only a bare `gh issue list`, so a green tick stays cheap and side-effect-free. Without
    # this always() GitHub implicitly success()-gates the job and the FAILING tick — the only one
    # that matters — would skip the alert entirely.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): this job reads ALERT_TOKEN/ALERT_REPO (the private-alert
    # routing secrets), so — like the groom-alert job — it is bound to the default-branch-only
    # `dispatch-secrets` environment where those secrets live. It only ever runs from the default
    # branch (schedule/workflow_dispatch), so the branch policy never starves it.
    environment: dispatch-secrets
    permissions:
      contents: read  # minimum for the sparse checkout below — the job runs a script from the repo
      issues: write   # upsert/close the rolling retriage-failure ops-alert issue
    steps:
      # The alert logic lives in scripts/retriage-alert.py plus the shared destination router
      # scripts/alert_route.py — only those two files are needed, so sparse-checkout scopes the
      # working copy to them, pinned and with no persisted token. Dropping alert_route.py from this
      # list makes the script die loudly rather than guess at the routing decision.
      - name: Check out ONLY the alert scripts (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/retriage-alert.py
            scripts/alert_route.py
          sparse-checkout-cone-mode: false

      - name: Alert maintainer that the scheduled RETRIAGE sweep hard-failed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          RETRIAGE_RESULT: ${{ needs.retriage.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39): scripts/alert_route.py routes to a
          # maintainer-set PRIVATE ALERT_REPO only when ALERT_TOKEN can write there; otherwise the
          # registry repo under the ambient token. The body carries NO account handles (it reports
          # only the sweep RESULT + run link), so that fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/alert_route.py --self-test
          python3 registry/scripts/retriage-alert.py --self-test
          python3 registry/scripts/retriage-alert.py
