# [SPARQ agent] INDEPENDENT ingestion-rejection alarm (registry #1706).
#
# WHY A SEPARATE FILE. `ci-latency-alert.py` already classifies this exact condition
# (`rejected-zero-jobs`), but it is invoked from groom-sweep.yml — and on 2026-08-01 groom itself
# was ingestion-rejected, so the detector went down with the lane it watches.
# A 9h dispatch outage and a 19h groom outage both passed unnoticed as a result. An alarm
# whose availability correlates with the fault is worse than none, because auditing "do we
# detect this?" returns yes.
#
# So this lane depends on NOTHING: no checkout of the registry scripts, no shared step, no
# environment. Its only inputs are the runs API and `github.token`. A new file's own
# rejection costs only itself, which is why this is a new file rather than a step added to
# a healthy workflow.
#
# WHAT IT WATCHES. For each critical lane, the most recent run's `jobs.total_count`. Zero
# jobs means GitHub created the run and executed nothing — the file was refused. That is
# indistinguishable from a quiet repo unless something explicitly looks, which is the whole
# point: this alarms on ABSENCE, not on a bad thing appearing.
name: ingestion-alarm

on:
  workflow_dispatch:
  schedule:
    # Offset from the other sweeps so ticks do not pile up.
    - cron: '11,41 * * * *'

permissions: {}

concurrency:
  group: ingestion-alarm
  cancel-in-progress: false

jobs:
  check:
    name: zero-jobs check across critical lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check each lane's latest run for jobs == 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CRITICAL_LANES="dispatch.yml groom-sweep.yml worker.yml review-fix.yml"
          no_completed_marker() { printf ' %s(no completed run)' "$1"; }

          # Dependency-free executable seam tests: a typo or future edit that drops the recovery
          # lane, or that turns an absent run back into a silent pass, fails this alarm itself.
          [ "$CRITICAL_LANES" = "dispatch.yml groom-sweep.yml worker.yml review-fix.yml" ]
          [ "$(no_completed_marker groom-sweep.yml)" = " groom-sweep.yml(no completed run)" ]

          BAD=""
          for wf in $CRITICAL_LANES; do
            # ONLY the latest COMPLETED run. A queued/in-progress run legitimately has no
            # jobs yet, and treating "no jobs YET" as "no jobs EVER" is the exact conflation
            # this alarm exists to detect — the first version made that mistake and flagged a
            # pending dispatch run as rejected.
            id=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1&status=completed" \
                   -q '.workflow_runs[0].id // empty' || true)
            if [ -z "$id" ]; then
              echo "$wf: no completed run"
              BAD="$BAD$(no_completed_marker "$wf")"
              continue
            fi
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" -q '.total_count' || echo unknown)
            concl=$(gh api "repos/$REPO/actions/runs/$id" -q '.conclusion // .status' || echo unknown)
            echo "$wf: run=$id conclusion=$concl jobs=$jobs"
            if [ "$jobs" = "0" ]; then BAD="$BAD $wf(run $id)"; fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::INGESTION REJECTED —$BAD"
            # The code fences are SINGLE-quoted, which is all that is ever needed here: a run: body
            # is a YAML block scalar, not a nested shell string, so the quote-dance spelling this
            # replaces bought nothing and cost correctness. Bash read ITS backticks as a command
            # substitution, which swallowed the $BAD argument -- the list of rejected lanes, the one
            # fact the alarm exists to report -- rendered a garbage token in its place and wrote a
            # command-not-found line to stderr. shellcheck sees it (SC2288/SC2027/SC2006), and the
            # required gate runs shellcheck through actionlint, so the mangling was gate-visible.
            printf '%s\n' \
              "> 🤖 **SPARQ agent** — I am @jeswr's agent for the jeswr/sparq RDF/SPARQL engine. @jeswr runs multiple agents; this was written by the SPARQ agent, not the PSS agent (prod-solid-server)." "" \
              "**Ingestion rejection detected.** These lanes' most recent runs executed ZERO jobs:" "" \
              '```' "$BAD" '```' "" \
              "\`action_required\` + \`jobs=0\` means GitHub created the run and ran nothing — the workflow FILE was refused. This is silent: no failing check, no red, just lanes not running." "" \
              "Mechanism is unexplained across 9+ instances (#1566); a 10-candidate elimination table is on #1706. groom is the ONLY crash-recovery path, so its rejection is never cosmetic." "" \
              "⚠️ Verify any fix by \`jobs > 0\`, never by colour." > /tmp/body.md
            # UPSERT, never blind-create. This lane ticks every 30 min; an unconditional
            # `issue create` would file a duplicate EVERY tick for as long as the outage
            # lasts, and each issue event fans out into workflow runs that spend the shared
            # API budget. A recurring alarm that floods the tracker is a second outage.
            EXISTING=$(gh issue list --repo "$REPO" --state open --limit 20 \
                         --search "ingestion rejection in:title" \
                         --json number -q '.[0].number // empty' || true)
            if [ -n "$EXISTING" ]; then
              echo "alarm already open as #$EXISTING — commenting instead of duplicating"
              gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/body.md || true
              exit 1
            fi
            gh issue create --repo "$REPO" \
              --title "⚠️ ingestion rejection: lanes running ZERO jobs" \
              --label "priority:P1,area:dispatch,role:impl,from:agent" \
              --body-file /tmp/body.md || true
            exit 1
          fi
          echo "all lanes ingesting (jobs > 0)"
