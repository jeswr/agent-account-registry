# [OPUS-4.8] Web-login broker (review-hardened S5): a maintainer opens a "set up new account" issue
# labelled `set-up-account`; the broker posts a sign-in URL/code, captures the token, and stores it.
#
# Hardening vs the GPT-5.6 review: actor AND author must be admin/maintain; the secrets-write PAT is
# required BEFORE any login (no capturing a credential we can't store); actions are SHA-pinned and the
# CLI is version-pinned with no curl-to-shell; enrollments are serialized; provider is structured
# (a provider:* label, no silent default); the token is never echoed (only `gh secret set < file`);
# an always() step shreds all auth state.
#
# `|| true` DISPOSITION (PR #595 finding 5 audit — the repo-wide sweep for swallowed label/state
# mutations; tightened again by #616 review finding 5). NO `gh issue comment` in this workflow is
# `|| true`-swallowed any more: every notification comment now falls back to an explicit
# `::warning title=set-up-account::` line, so a comment that cannot post is VISIBLE in the run
# rather than silently erasing the only issue-side explanation of a refusal or an activation. Their
# fail direction is unchanged and still safe — each sits inside a fail-closed `fail()`/`reject()`
# helper that follows it with an explicit `exit 1`, or reports an outcome whose STATE transition is
# separately fail-loud and post-read verified (the status:pending -> status:available flip below
# fails the step and then PROVES the flip landed). A comment that cannot post must not resurrect an
# aborted enrollment or mask a verified transition. The two courtesy `gh issue close` calls and the
# label-create ensure-exists pair carry their own inline justifications. NO label mutation in this
# repo is `|| true`-swallowed any more (triage-issue.yml's quarantine write was the last one).
#
# COMPLETION fixes (audit-2026-07-17): the captured secret is stored on THIS registry repo — the
# only place any consumer reads it (worker.yml `secrets[secret_ref]`, the dispatch usage probe,
# fingerprint-accounts; the old sparq-org/sparq write registered accounts nothing could use). The
# account issue now carries the `models:` line read_accounts requires (an account with empty models
# is silently invisible to the allocator), the broker validates its own registration through the
# real read_accounts parser, and the handle's policy/repos.toml account_pool grant is carried by the
# broker itself so no human policy edit is left dangling. HISTORICAL: that grant was originally a
# direct contents-API compare-and-swap (rebase-retry) PUT to `master`. That path is RETIRED — branch
# protection rejects every github-actions[bot] PUT to `master`, so it could never land (#185). The
# append now goes out as a CHECKED PR on an `account-pool/*` branch and the account is created
# `status:pending`, non-allocatable until that PR MERGES; see PENDING-THEN-ACTIVATE (#185) and
# GRANT-SCOPING (#579) below for the two-phase flow that replaced the CAS.
#
# STALE-SNAPSHOT fix (#186, hardened after review round 1 of #236): the handle/secret in `meta`
# are only a pre-login HINT. A re-read before the write is still a TOCTOU check, so the store step
# instead takes ATOMIC ownership of the slot by creating `refs/acct-claims/<handle>` — git ref
# creation is first-writer-wins on the server, and claims are never deleted (a failed run burns its
# slot instead of releasing it, so a retry can never overwrite an in-flight credential). The slot is
# derived from the COMPLETE union (fully paginated, never a capped page) of claim refs, acctNN issue
# titles in ANY state, and ACCTNN_TOKEN secret names at BOTH scopes — repository AND the
# dispatch-secrets environment, the post-#101 canonical home (an env-only token with no claim ref
# or issue would otherwise be invisible and the broker would burn its claim ref on an occupied
# slot); if any listing fails, freeness cannot be proven and the run fails closed. The claim-ref namespace is the canonical allocation record every
# automated account writer must claim in BEFORE writing; downstream steps consume the claimed slot
# via steps.store.outputs, not the stale snapshot.
#
# CONFIDENTIAL-CHALLENGE fix (#181): the device code / sign-in URL is a REDEEMABLE authorization
# challenge — on this PUBLIC repo, posting it in an issue comment (or a run log, or a job summary)
# lets any observer redeem it FIRST and bind an attacker-controlled provider account, whose captured
# credential this broker would then trust and store. So the challenge is NEVER surfaced in the clear:
# the broker proves the requesting maintainer has an encryption-capable GitHub-published GPG key
# BEFORE any login starts (fail closed, like the secrets preflight), then delivers the challenge
# ENCRYPTED to that key — only the holder of the matching private key can recover the code, and the
# plaintext challenge never leaves the runner.
#
# PENDING-THEN-ACTIVATE fix (#185): `master` carries required-status-check (`gate`) branch
# protection that REJECTS every github-actions[bot] contents-API PUT (data/README.md), so the old
# direct account_pool PUT to `master` could NEVER land — after six retries the job aborted, leaving
# a stored credential + a `status:available` account issue that was absent from policy, with the
# close/failure steps skipped. That is an account the allocator's available-gate treats as live but
# which no lease can use, plus a burned slot and a request issue stuck on the sign-in message. So
# enrollment is now TWO-PHASE and fail closed: (1) the account issue is created `status:pending`
# (read_accounts still catalogs it, but choose_account's available-gate skips it AND it is not yet
# in account_pool — doubly non-allocatable), and the account_pool change goes out as a CHECKED PR on
# a feature branch (never a `master` PUT); (2) the account is ACTIVATED (status:pending ->
# status:available, request issue closed) only AFTER that PR merges — by the `activate` job in this
# file, on `pull_request: closed`(merged) for an `account-pool/*` head branch, which re-verifies the
# handle is genuinely in MERGED `master` account_pool before it flips anything. An `always()` alarm
# reports every partial enrollment state with explicit recovery (the credential capture is
# irreversible — claims are never released, #186 — so recovery is forward, never a silent abort).
#
# IDEMPOTENT-RESUME fix (#211): a partial enrollment (credential stored + status:pending issue
# created, but no merged account_pool PR) used to make the retry WORSE than the failure:
# re-applying `set-up-account` started a fresh login and allocated a fresh `max(acctNN)+1` slot,
# orphaning the first (irreversible) capture instead of completing its transaction. Now a
# `reconcile` step runs before any preflight/login: it enumerates the OPEN acctNN issues bound to
# THIS request via their `request_issue:` body line (fully paginated; a failed listing fails
# closed — proceeding blind could mint exactly the duplicate slot this fix prevents) and, when
# exactly one bound handle exists, skips login/store/register and re-enters the pipeline at
# validate -> account_pool PR -> report with that SAME handle. One request converges on one
# stable handle before any completion is reported; two+ bound handles are ambiguous identity and
# fail closed. Resume additionally requires PROOF the referenced credential is REAL (review
# round 1 of #533): the issue's secret_ref must be the exact broker-minted `${HANDLE}_TOKEN`
# binding AND the named secret must be readable (PAT-scoped GET) in the dispatch-secrets
# environment — an account issue can outlive a deleted or never-created secret, and resuming on
# the secret_ref LINE alone would flip status:available around a credential no worker can use.
# A 404, a missing PAT, or an unprovable probe fails closed before resume is ever granted.
#
# REGISTRATION IS NEVER THE SOURCE OF A DUPLICATE (#394): the two activation paths were hardened
# (round 2 of #383) to refuse unless EXACTLY ONE exact-title account issue exists, but that is
# defensive-only — the register step still called `gh issue create` without proving the title was
# free, and GitHub permits duplicate issue titles, so a retried or partially-recovered enrollment
# could itself MINT the second `acctNN` record that wedges the account permanently (neither path
# will relabel an arbitrary one, and the slot's claim ref is never released). Registration now
# refuses cheaply on an already-taken title, and after `gh issue create` RE-READS — through the
# strongly-consistent issues API, fully paginated, pull requests excluded — to prove the issue it
# just created is the SOLE exact-title match. On any other outcome (a duplicate that landed
# concurrently, or a listing that cannot be read) it RETRACTS ITS OWN record — renamed out of the
# `acctNN` namespace, `account` label removed, closed — and fails. Retraction is deterministic
# because the retracting run is the only writer that knows which issue it created.
#
# WHAT THAT DOES *NOT* ESTABLISH — read this before trusting the word "unique" below (review round
# 2 of #394). An exact issue title is NOT a write-gated capability on a public repo: anyone can
# open an issue with any title, and `.github/ISSUE_TEMPLATE/account.yml` applies the `account`
# label on their behalf, so even the label is not a capability barrier. GitHub offers no atomic
# create-if-title-absent, and the claim ref (#186) serializes only writers INSIDE the protocol.
# So NO read — before the create, after it, or any further one added later — can make "exactly one
# exact-title issue" a DURABLE property: a duplicate may land after the post-create proof and
# before this step exits, or an hour after it exits. The guarantee is therefore bounded, and is
# stated that way deliberately: this protocol never ITSELF leaves a second record, and never
# reports success over an ambiguity it can observe. A duplicate filed afterwards by a writer
# outside the protocol stays possible and is NOT prevented — which is exactly why both activation
# paths keep their exactly-one gate (they REFUSE; they never mis-activate an arbitrary record) and
# why the always() alarm's register branch carries the recovery: a re-apply allocates a FRESH slot,
# because the conflicting title is in the slot union. A durable create-once identity has to be
# bound to something a public writer cannot forge — the write-gated `refs/acct-claims/` namespace,
# or the created issue number recorded in it — rather than to a title. That is a cross-cutting
# redesign of the identity contract (#186 claim refs, both activation paths, select_account_issues'
# `acct<digits>` title grammar) and is tracked separately rather than smuggled in here.
#
# GRANT-SCOPING fix (#579, re-filed from #190; the closed PR #260 preserves six prior review
# rounds): enrollment used to append the new handle to EVERY `account_pool` row in
# policy/repos.toml — one unanchored global regex substitution over all rows, disabled and future
# rows included — and then "prove" the write with an EXISTENTIAL check ("some row now contains the
# handle"). `account_pool` IS the credential-authorization boundary (policy-resolve validates it,
# select-and-claim.claim() filters on it, worker.yml independently re-checks it), so one web
# sign-in silently granted the credential to every enabled target, and a partial or wrong-row edit
# satisfied the postcondition. Enrollment is now EXPLICITLY SCOPED, with every decision in the
# shared, self-tested helper scripts/grant-account.py:
#   * the request must carry `grant:<owner>/<repo>` labels; no label => no enrollment (refused
#     BEFORE any login, like the other preflights), and an unparseable grant label is a refusal,
#     never an ignored one;
#   * every target must be an `enabled = true` row of the policy being edited (never created,
#     never defaulted);
#   * the append touches ONLY those rows' account_pool lines, located by their own table header;
#   * the postcondition is EXACT and PER-TARGET, proved by PARSING the proposed document (each
#     requested row lists the handle exactly once, every other row byte-identical) — including on
#     the "already present / no-op" path and in the post-merge `activate` job, so a duplicate or a
#     pre-existing entry can never be reported as a successful grant;
#   * SHAPE IS NOT PROVENANCE (#616 review finding 1): on the no-op path the membership must also be
#     accounted for by a MERGED `account-pool/<handle>` PR into master whose diff is that one policy
#     document and nothing else — otherwise a handle seeded into the policy by any other means would
#     let a freshly captured credential skip the checked PR and activate inline;
#   * and the post-merge `activate` job re-runs the TWO-DOCUMENT postcondition against the merged
#     commit's first parent (#616 review finding 2) — verify_membership alone cannot see the
#     non-target rows, and feature branches are unprotected, so a branch push after the pre-PR proof
#     would otherwise merge and activate outside every scoping check;
#   * the authorization is RE-READ LIVE immediately before the policy write and must EXACTLY equal
#     the pre-login snapshot — the sign-in takes minutes, and a target removed during that window
#     fails closed;
#   * untrusted issue text (labels, bodies) crosses into these privileged `run:` blocks as DATA
#     (JSON/env), never interpolated — this workflow's App token holds contents:write, and PR #260
#     round 4 was a shell-injection blocker on exactly that interpolation.
name: set-up-account
on:
  issues:
    types: [labeled]
  # #185 phase 2: the `activate` job fires when an account_pool PR merges. `pull_request` (NOT
  # `push` — no workflow in this repo triggers on push; that non-execution property is load-bearing
  # for the ledger branch, data/README.md) runs the base-ref (master) copy of this file.
  pull_request:
    types: [closed]

permissions: {}

jobs:
  login:
    if: github.event_name == 'issues' && github.event.label.name == 'set-up-account'
    runs-on: ubuntu-latest
    # Serialize enrollments (a header-level hardening) without also serializing activations.
    concurrency:
      group: set-up-account-login
      cancel-in-progress: false
    permissions:
      issues: write     # register the pending account issue, comment/close the request issue
      contents: read    # checkout only — the account_pool PR branch/PUT/PR use the scoped App token
      # (pull-requests write is NOT granted to github.token: a GITHUB_TOKEN-authored PR would not
      #  trigger pr-gate. The App token minted below carries contents+pull-requests write instead.)
    # REGISTRY_SECRETS_PAT's canonical home is the dispatch-secrets environment (post-#101 the
    # repo scope must stay EMPTY — the secrets-guard fails dispatch closed otherwise), so the
    # broker job must be env-bound to resolve it. `issues: labeled` events run on the default
    # branch, which the environment's custom deployment-branch policy admits.
    environment: dispatch-secrets
    timeout-minutes: 20
    # #188: NO job-level GH_TOKEN. A job-wide token is inherited by every step — including the npm
    # install and the third-party provider login CLIs, which have no business holding an issues:write
    # + contents:write registry token. The token is instead granted per-step, ONLY on the steps that
    # call the GitHub API with the default identity; the install/login steps get none (and explicitly
    # clear any GitHub credential variable). Checkout runs with persist-credentials:false so the
    # checkout credential is not left in .git/config for that same untrusted code to read.
    steps:
      # The `runner` context is not valid in job-level env (it invalidated the whole workflow —
      # GitHub refused to parse the file, so the broker never fired). Derive LOGIN_DIR in a step.
      - name: Resolve LOGIN_DIR under the runner temp dir
        run: echo "LOGIN_DIR=$RUNNER_TEMP/login" >> "$GITHUB_ENV"

      - name: Trust gate — actor AND author must be admin/maintain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for u in "${{ github.actor }}" "${{ github.event.issue.user.login }}"; do
            perm=$(gh api "repos/${{ github.repository }}/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain) ;;
              *) echo "::error::$u lacks admin/maintain (got '$perm') — refusing"; exit 1 ;;
            esac
          done

      # Checkout moved AHEAD of the secrets preflight (#187): the preflight below imports
      # scripts/pat-validity.py to run the authoritative store-capability probe, so the tree must be
      # on disk first. Checkout is read-only and runs only after the trust gate has admitted the actor.
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # #188: do not persist the checkout credential into .git/config — npm lifecycle code and the
          # third-party provider CLIs run against this checkout and must never be able to read a
          # repository-write git credential (the repo-wide convention; every other checkout does this).
          persist-credentials: false

      # #211: a retry after a PARTIAL enrollment (credential stored + status:pending issue created,
      # but no merged account_pool PR) must COMPLETE that transaction, not open a second one — the
      # old path started a fresh login and allocated a fresh slot, orphaning the first irreversible
      # capture. The register step stamps `request_issue: <n>` into every account issue body
      # precisely so the handle bound to THIS request is findable. Enumeration is fully paginated
      # over the OPEN acctNN issues (a closed account issue is deliberately retired — never
      # resumed); a failed listing means "no prior enrollment" cannot be proven, so it fails closed
      # rather than minting the duplicate slot this step exists to prevent. Exactly one bound
      # handle -> resume: login/store/register are skipped (their work is done) and the pipeline
      # re-enters at validate -> account_pool PR -> report with the SAME handle. Two+ bound
      # handles -> ambiguous identity -> fail closed (never guess which transaction to complete).
      # Resume is granted only after the bound issue's secret_ref is proven to name a REAL
      # credential in the dispatch-secrets environment (review round 1 of #533) — see the
      # existence probe below.
      - name: Reconcile a prior partial enrollment for this request (#211)
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          # The resume-existence probe reads dispatch-secrets environment secret METADATA
          # (names only, never values), which github.token cannot — same PAT + Environments:
          # read grant the store step's absence probe uses.
          REGISTRY_PAT: ${{ secrets.REGISTRY_SECRETS_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! raw=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100"); then
            echo "::error::could not enumerate account issues — cannot prove request #$ISSUE has no prior partial enrollment (fail closed)"; exit 1
          fi
          # `--paginate` emits one JSON array per page; jq iterates each top-level array, so no
          # slurp is needed and no page is silently dropped. The `[[:space:]]*$` tolerates the
          # CRLF a web-UI edit can introduce.
          bound=$(printf '%s' "$raw" | jq -r --arg req "$ISSUE" '
            .[] | select(has("pull_request") | not)
                | select(.title | test("^acct[0-9]+$"))
                | select([.labels[].name] | any(. == "status:pending" or . == "status:available"))
                | select((.body // "") | test("(?m)^request_issue:[[:space:]]*" + $req + "[[:space:]]*$"))
                | .number')
          count=$(printf '%s' "$bound" | grep -c '^[0-9]' || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::request #$ISSUE is bound to $count account issues ($(printf '%s' "$bound" | tr '\n' ' ')) — ambiguous identity, refusing to enroll or resume (fail closed)"; exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "no prior enrollment bound to request #$ISSUE — proceeding with a fresh enrollment"
            exit 0
          fi
          num=$(printf '%s' "$bound" | head -1)
          handle=$(gh issue view "$num" -R "$REPO" --json title --jq .title)
          body=$(gh issue view "$num" -R "$REPO" --json body --jq .body)
          secret=$(printf '%s\n' "$body" | sed -n 's/^secret_ref:[[:space:]]*\([A-Za-z0-9_]*\).*/\1/p' | head -1)
          models=$(printf '%s\n' "$body" | sed -n 's/^models:[[:space:]]*\(.*\)$/\1/p' | head -1 | tr -d '\r')
          fmt=$(printf '%s\n' "$body" | sed -n 's/^credential_format:[[:space:]]*\([A-Za-z0-9._-]*\).*/\1/p' | head -1)
          # #579: the authorized target set recorded on the bound account issue. It is the RESUMED
          # request's authorization snapshot — the grant step below requires it to still equal the
          # live `grant:` labels — so a record without a readable `grant_targets:` line cannot be
          # resumed (its grant could never be proven). The body crosses into python as env DATA.
          if ! targets=$(ACCOUNT_BODY="$body" python3 - <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location(
              "registry_grant_account", "scripts/grant-account.py")
          grant = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(grant)
          try:
              print(json.dumps(grant.parse_record_line(os.environ["ACCOUNT_BODY"])))
          except grant.GrantError as exc:
              print(str(exc), file=sys.stderr)
              sys.exit(1)
          PY
          ); then
            echo "::error::account issue #$num ($handle) is bound to request #$ISSUE but its authorized target repositories cannot be read (see above) — a grant that cannot be proven must not be resumed (fail closed). Add a valid \`grant_targets:\` line to the issue body, then re-apply set-up-account."; exit 1
          fi
          if [ -z "$secret" ]; then
            echo "::error::account issue #$num ($handle) is bound to request #$ISSUE but carries no secret_ref line — a malformed record can be neither resumed nor safely superseded (fail closed). Fix the issue body, then re-apply set-up-account."; exit 1
          fi
          # Review round 1 of #533: the secret_ref LINE proves nothing about the CREDENTIAL — an
          # account issue can outlive its secret (deleted during manual recovery, or never
          # successfully created), and a resume that trusts the line alone would validate
          # metadata, open the account_pool PR and eventually flip status:available around a
          # credential no worker can use. Resume therefore requires the reference to be proven
          # REAL: (a) the secret_ref must be the exact broker-minted binding for THIS handle
          # (`${handle^^}_TOKEN` — the same shape account-usage.py enforces; anything else is a
          # tampered or hand-edited record that cannot be trusted), and (b) the named secret
          # must EXIST in the dispatch-secrets environment — the post-#101 canonical home every
          # consumer resolves from — proven by the same PAT-scoped GET the store step's absence
          # probe uses. Only an authenticated success proves existence; a 404 means the
          # credential is GONE, and a missing PAT or any other probe outcome means existence
          # cannot be proven — all fail closed BEFORE resume is granted, so
          # validate/account_pool-PR/activation stay unreachable.
          if [ "$secret" != "${handle^^}_TOKEN" ]; then
            echo "::error::account issue #$num ($handle) carries secret_ref '$secret' but the broker-minted binding for $handle is '${handle^^}_TOKEN' — a mismatched credential binding cannot be resumed (fail closed). Fix the issue body, then re-apply set-up-account."; exit 1
          fi
          if [ -z "${REGISTRY_PAT:-}" ]; then
            echo "::error::REGISTRY_SECRETS_PAT is unavailable, so it cannot be proven that secret $secret still exists in the dispatch-secrets environment — refusing to resume (fail closed). Restore the PAT (see the preflight guidance), then re-apply set-up-account."; exit 1
          fi
          if probe=$(GH_TOKEN="$REGISTRY_PAT" gh api "repos/$REPO/environments/dispatch-secrets/secrets/$secret" 2>&1); then
            echo "resume preflight: secret $secret exists in the dispatch-secrets environment"
          elif printf '%s' "$probe" | grep -q 'HTTP 404'; then
            echo "::error::account issue #$num ($handle) references secret $secret, which does NOT exist in the dispatch-secrets environment — resuming would activate an account with no usable credential (fail closed). Either restore the secret and re-apply set-up-account to resume, or close account issue #$num (its slot stays burned by design; claims are never released) and re-apply for a fresh enrollment."; exit 1
          else
            echo "::error::could not prove secret $secret exists in the dispatch-secrets environment (the probe failed for a non-404 reason) — refusing to resume (fail closed). Re-apply set-up-account to retry."; exit 1
          fi
          {
            printf 'resume=true\n'
            printf 'handle=%s\n' "$handle"
            printf 'secret=%s\n' "$secret"
            printf 'models=%s\n' "$models"
            printf 'fmt=%s\n' "${fmt:-unknown}"
            printf 'targets=%s\n' "$targets"
          } >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" -R "$REPO" \
            --body "♻️ Resuming the existing enrollment of **$handle** for this request — its credential is already captured, so there is no new sign-in and no new slot. Completing validation and the account_pool policy PR now." || echo "::warning title=set-up-account::the resume notice failed to post — the refusal/outcome above is the authoritative record"
          echo "resuming $handle (account issue #$num) for request #$ISSUE — login/store/register are skipped"

      # [#579] AUTHORIZATION PREFLIGHT — which repositories may use this account. `account_pool` is
      # the credential-authorization boundary, so the request must NAME its targets: one
      # `grant:<owner>/<repo>` label per repository, each an `enabled = true` row of the CHECKED-OUT
      # policy/repos.toml. This runs BEFORE the secrets preflight and the login (like every other
      # fail-closed gate here): a request with no authorization choice must never reach a
      # credential capture, because that capture is irreversible. On the #211 resume path the bound
      # account issue's recorded target set must ALSO still equal the live labels — a resumed
      # enrollment inherits its original authorization, and a changed one is a refusal.
      # The resolved set is the pre-login SNAPSHOT; the policy-write step re-reads the labels LIVE
      # and requires exact equality (the sign-in can take ~13 minutes).
      # Untrusted label names cross into python as JSON in env — never interpolated into this
      # privileged run: block (PR #260 round 4 blocker).
      - name: Authorize the target repositories from the request's grant labels (#579)
        id: grant
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          RESUME: ${{ steps.reconcile.outputs.resume }}
          RECORDED: ${{ steps.reconcile.outputs.targets }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/grant-authorize.err"
          if ! targets=$(python3 - 2>"$err" <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location(
              "registry_grant_account", "scripts/grant-account.py")
          grant = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(grant)
          with open("policy/repos.toml", encoding="utf-8") as fh:
              policy = fh.read()
          labels = json.loads(os.environ["LABELS_JSON"])
          snapshot = (json.loads(os.environ["RECORDED"] or "[]")
                      if os.environ.get("RESUME") == "true" else None)
          try:
              print(json.dumps(grant.authorize(labels, policy, snapshot)))
          except grant.GrantError as exc:
              print(str(exc), file=sys.stderr)
              sys.exit(1)
          PY
          ); then
            reason=$(cat "$err" 2>/dev/null || true)
            gh issue comment "$ISSUE" -R "$REPO" \
              --body "❌ Enrollment refused — this request carries no valid authorization for a target repository: ${reason:-the grant labels could not be resolved}. \`account_pool\` in \`policy/repos.toml\` is the allow-list every enforcement point checks, so an account is granted ONLY to the repositories the request explicitly names — never to all of them by default. **Fix:** add one \`grant:<owner>/<repo>\` label per authorized repository (each must be an \`enabled = true\` row of \`policy/repos.toml\`), then re-apply the \`set-up-account\` label. No login was started and no credential was captured." || echo "::warning title=set-up-account::the enrollment-refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            echo "::error::no valid grant:<owner>/<repo> authorization on request #$ISSUE — refusing to enroll (fail closed)"; exit 1
          fi
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
          echo "authorized target repositories for request #$ISSUE: $targets"

      # The workflow's own github.token cannot write Actions secrets; REGISTRY_SECRETS_PAT is the
      # jeswr-owned fine-grained PAT on THIS registry repo (already proven by the rotation
      # write-back in worker-live.sh). Post-#101 it lives in the dispatch-secrets environment
      # (this job is env-bound to resolve it). LEAST-PRIVILEGE GRANTS (sol review round 4 of
      # #275): repository Secrets: READ (the store step only LISTS repo-scope secrets and GETs
      # the candidate name for the both-scopes absence probe — it never writes at repo scope)
      # + Environments: READ AND WRITE (the env public-key read `gh secret set --env` performs
      # and the store step's env-secret union listing sit under Environments: read; the
      # env-secret PUT under Environments: write).
      #
      # PRESENCE ALONE IS NOT ENOUGH (#187, round-4 finding 1): a revoked, expired, read-only, or
      # wrong-repository PAT passes a nonempty check, then the store step discovers only at
      # `gh secret set` that it cannot store the ALREADY-captured credential — which the always()
      # cleanup then shreds, an irreversible loss for the maintainer who was waiting on the flow. So
      # store-capability is proven HERE, before any login starts or a sign-in URL is surfaced, by
      # invoking the AUTHORITATIVE probe scripts/pat-validity.py exposes — the SAME GET /user +
      # dispatch-secrets public-key read + repo-scope Secrets listing + disposable canary env-WRITE
      # the weekly validity cron (#37) and the store step depend on, one source of truth rather than a
      # hand-rolled duplicate that could drift. It requires a valid WRITE verdict: a read-only PAT
      # (env write denied) is `insufficient-scope`, a revoked/expired/missing one `invalid`, and a
      # throttled/unreachable probe `network-unknown` — NONE proves the captured credential is
      # storable, so all fail closed. `expiring-soon` still writes the canary TODAY (it is `valid`
      # within the calendar-expiry warning window), so enrollment proceeds — rotation is the weekly
      # alert's job, not a reason to refuse a store that works now.
      - name: Preflight — REGISTRY_SECRETS_PAT present AND store-capable, before any login (#187)
        # #211 resume: nothing is stored on the resume path (github.token + App token only), so
        # proving store-capability would be a needless canary write.
        if: steps.reconcile.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # for the fail() issue comment; the probe uses REGISTRY_PAT
          REGISTRY_PAT: ${{ secrets.REGISTRY_SECRETS_PAT }}
        run: |
          set -euo pipefail
          fail() {
            gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
              --body "❌ $1 Refusing to start login — no sign-in URL is surfaced until the broker has proven it can store what the login captures (fail closed). **Fix:** mint a fine-grained PAT on \`${{ github.repository }}\` with repository **Secrets: read** + **Environments: read and write** (least privilege — the broker only lists/reads repo-scope secrets and writes environment secrets), store it with \`gh secret set REGISTRY_SECRETS_PAT --repo ${{ github.repository }} --env dispatch-secrets\` (the dispatch-secrets ENVIRONMENT is its canonical home — a repo-scope copy would re-trip the secrets-guard), then re-apply the \`set-up-account\` label." || echo "::warning title=set-up-account::the secrets-preflight refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            exit 1
          }
          # Invoke pat-validity.py's probe() directly (as the register/validate steps import
          # select-and-claim.py) — probe() performs the reads + canary write and returns a verdict but
          # does NO alerting (that is main()'s job). A crashed/unreachable probe -> `network-unknown`
          # -> fail closed. Only the verdict CLASS crosses back to the shell; the free-text detail can
          # name credential lifecycle and stays out of this public workflow log (and the log line
          # below never echoes the raw verdict token — `expiring-soon` would disclose calendar
          # lifecycle, which #204/#432 keep out of public surfaces).
          verdict=$(python3 - <<'PY' || true
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location(
              "registry_pat_validity", "scripts/pat-validity.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.probe(os.environ.get("REGISTRY_PAT"), os.environ["GITHUB_REPOSITORY"])
          sys.stdout.write(result["verdict"])
          PY
          )
          case "$verdict" in
            valid|expiring-soon)
              echo "preflight: REGISTRY_SECRETS_PAT proven store-capable via pat-validity.probe (GET /user + dispatch-secrets public-key read + repo Secrets listing + authoritative canary env-write)" ;;
            invalid)
              fail "\`REGISTRY_SECRETS_PAT\` is missing, revoked, expired, or malformed — it does not authenticate, so a captured token could not be stored." ;;
            insufficient-scope)
              fail "\`REGISTRY_SECRETS_PAT\` authenticates but is under-scoped to store the captured credential — it cannot write a \`dispatch-secrets\` environment secret and/or list repository-scope secrets." ;;
            *)
              fail "\`REGISTRY_SECRETS_PAT\` store-capability could not be proven (the probe reached no verdict — throttled or the GitHub API was unavailable), so the broker will not capture a credential it may be unable to store." ;;
          esac

      - name: Determine provider (structured — no silent default)
        id: meta
        # #211 resume: provider/models/handle come from the bound account issue, not a fresh hint.
        if: steps.reconcile.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # #579: label names are UNTRUSTED text and this step holds an issues:write token, so they
          # cross as JSON in env — never `join(github.event.issue.labels.*.name)` interpolated into
          # this `run:` script, which would execute a label named `$(...)` (the PR #260 round-4
          # blocker class). Exactly ONE provider label is required: the old loop let the last
          # matching label win, so a request labelled with BOTH providers silently picked one.
          #
          # #263: that property is now EXECUTED, not claimed in prose. Labels are applicable by
          # anyone with TRIAGE permission while the trust gate above only vets the triggering actor
          # and the issue author for admin/maintain, so a pre-applied hostile label name was code
          # execution in a job holding issues:write + contents:write that gates the
          # REGISTRY_SECRETS_PAT steps — a far lower bar than that gate exists to enforce. So
          # grant-account.py --self-test renders THIS step's expressions the way the runner renders
          # them (textually, before bash parses a word), takes LABELS_JSON from the env: block
          # below rather than supplying its own, runs the fragment with a label named
          # `$(touch <canary>)` and FAILS if the canary appears. The harness is proved real by
          # firing the same label through the deleted inline form, where the canary MUST appear.
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          # >>> provider-label — EXECUTED by scripts/grant-account.py --self-test. #616 review round
          # 2 (MAJOR): this predicate had NO test at all, so replacing the body with `true`,
          # restoring last-label-wins (`.[-1]` instead of the length-1 requirement) or dropping the
          # `unique` all passed. These sentinels delimit the fragment the self-test extracts and runs
          # against label fixtures; removing either makes that extraction FAIL CLOSED. `$LABELS_JSON`
          # is its only input and `$prov` its only output.
          prov=$(printf '%s' "$LABELS_JSON" | jq -r '
            [.[] | select(. == "provider:openai" or . == "provider:anthropic")] | unique
            | if length == 1 then (.[0] | ltrimstr("provider:")) else "" end')
          if [ -z "$prov" ]; then
            gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
              --body "❌ Add exactly one \`provider:openai\` or \`provider:anthropic\` label (never both), then re-apply \`set-up-account\`." || echo "::warning title=set-up-account::the provider-label refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            exit 1
          fi
          # <<< provider-label
          # >>> provider-defaults — EXECUTED by scripts/grant-account.py --self-test. Both routing
          # values every minted record carries are derived HERE, from `$prov` alone, so the two
          # per-provider defaults cannot drift apart or be reintroduced as a literal downstream.
          # These sentinels delimit the fragment the self-test extracts and runs; removing either
          # makes that extraction FAIL CLOSED. `$prov` is its only input, `$models`/`$workers`
          # its only outputs.
          #
          # models: the line the allocator requires (read_accounts drops model-less accounts),
          # mirroring orchestration/routing.toml's [models] catalog. openai mints the FULL codex
          # alias set [sol, luna, terra]: select-and-claim's choose_account requires exact alias
          # membership, so a terra-only record would defer every sol/luna claim forever (sol r2
          # finding 1). anthropic mints [opus5, fable, opus, sonnet, haiku] — opus5 added
          # 2026-07-24 (Opus 5 is the new primary anthropic tier; an account without the alias
          # could never serve an opus5-led claim).
          #
          # workers: the per-provider parallelism the maintainer states for a plan of each kind
          # (#278: openai 12, anthropic 4). The old hard-coded `max_concurrent_workers: 1` in the
          # register step below was a fleet-capacity defect, not a safety floor — it capped every
          # broker-minted account at a single concurrent worker regardless of provider, and
          # choose_account's cap gate then refused every further claim against an account with
          # spare capacity. An operator may still narrow a specific account by editing its record;
          # this is only the mint-time default.
          if [ "$prov" = openai ]; then
            models='[sol, luna, terra]'; workers=12
          else
            models='[opus5, fable, opus, sonnet, haiku]'; workers=4
          fi
          # <<< provider-defaults
          # handle/secret here are only a PRE-LOGIN RESERVATION HINT: the login below can take ~13 min,
          # during which another (non-serialized) writer may claim this number, so the store step
          # derives the real slot from complete live state and atomically claims it (an acct-claims
          # ref) before writing (#186). This hint only makes a retry converge on the same slot.
          # `--limit 500` is LOAD-BEARING (#238): gh caps `issue list` at 30 results by default, so
          # without it this `max` undercounts once >30 acctNN issues exist and the hint points at an
          # already-taken slot. 500 matches select-and-claim.py's read_accounts/audit_catalog window.
          n=$(gh issue list -R "${{ github.repository }}" --state all --limit 500 --json title \
                --jq '[.[].title|select(test("^acct[0-9]+$"))|ltrimstr("acct")|tonumber]|max // 0' 2>/dev/null || echo 0)
          {
            printf 'provider=%s\n' "$prov"
            printf 'models=%s\n' "$models"
            printf 'workers=%s\n' "$workers"
            printf 'handle=acct%02d\n' "$((n+1))"
            printf 'secret=ACCT%02d_TOKEN\n' "$((n+1))"
          } >> "$GITHUB_OUTPUT"

      - name: Install provider CLI (version-pinned, fail on error)
        if: steps.reconcile.outputs.resume != 'true'
        run: |
          set -e
          # #188: no GitHub token reaches npm or any package lifecycle script. The job sets no
          # job-level GH_TOKEN and this step is granted none, but clear every GitHub credential
          # variable explicitly here too (defence in depth) so untrusted install-time code can never
          # observe a repository-write token.
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          if [ "${{ steps.meta.outputs.provider }}" = "openai" ]; then
            npm i -g @openai/codex@0.144.1
          else
            npm i -g @anthropic-ai/claude-code@2.1.177
          fi

      # #181: the device code / sign-in URL is a REDEEMABLE authorization challenge — anyone who reads
      # it before the maintainer does can complete the device flow against an attacker-controlled
      # provider account, whose credential this broker would then capture, trust and store. On a PUBLIC
      # repo an issue comment (and the run log, and the job summary) is world-readable, so the challenge
      # must never appear there in the clear. Deliver it through a maintainer-only channel: encrypt it
      # to the requesting maintainer's own GitHub-published GPG key (the requester is already trust-gated
      # to admin/maintain above), so only the holder of the matching private key can read it. Prove a
      # usable, encryption-capable key exists HERE, before any login starts (fail closed, mirroring the
      # secrets preflight) — a login whose challenge we cannot deliver confidentially must never run.
      - name: Preflight — requester has a confidential-delivery key, before any login
        if: steps.reconcile.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTER: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$LOGIN_DIR"; chmod 700 "$LOGIN_DIR"
          keyfile="$LOGIN_DIR/recipient.asc"
          # Fetch the requester's PUBLIC GPG keys (armored) via the API — never any private material.
          # Zero keys, an API error, or an empty body all fail closed (no challenge is ever surfaced).
          if ! gh api "users/$REQUESTER/gpg_keys" \
                 --jq '.[].raw_key | select(. != null and . != "")' > "$keyfile" 2>/dev/null \
             || ! [ -s "$keyfile" ]; then
            gh issue comment "$ISSUE" -R "$REPO" \
              --body "❌ Cannot deliver the sign-in challenge confidentially: \`@$REQUESTER\` has no public GPG key on GitHub. On a public repository the device code / sign-in URL is a redeemable authorization challenge and must never be posted in the clear (any observer could redeem it first and bind an attacker-controlled account), so no login was started. **Fix:** add a GPG key to your GitHub account (Settings → SSH and GPG keys), then re-apply the \`set-up-account\` label — the challenge will be encrypted to that key and you decrypt it locally with \`gpg -d\`." || echo "::warning title=set-up-account::the GPG-key refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            echo "::error::requester has no GPG key — cannot deliver challenge confidentially, refusing (fail closed)"; exit 1
          fi
          # Import into an isolated, disposable keyring under LOGIN_DIR (shredded by the always() step).
          export GNUPGHOME="$LOGIN_DIR/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          if ! gpg --batch --import "$keyfile" >/dev/null 2>&1; then
            gh issue comment "$ISSUE" -R "$REPO" \
              --body "❌ \`@$REQUESTER\`'s published GPG key could not be imported, so the sign-in challenge cannot be encrypted to it. No login was started (fail closed). **Fix:** ensure a valid GPG public key is on your GitHub account, then re-apply \`set-up-account\`." || echo "::warning title=set-up-account::the GPG-import refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            echo "::error::requester GPG key failed to import — refusing (fail closed)"; exit 1
          fi
          # Prove at least one imported key can actually ENCRYPT (a sign-only / malformed key would
          # otherwise fail only AFTER the login started and the challenge was already in hand). Persist
          # the exact fingerprint that works so the login step encrypts to that same recipient.
          for fpr in $(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr"{print $10}'); do
            if printf 'probe' | gpg --batch --yes --trust-model always -a -e -r "$fpr" >/dev/null 2>&1; then
              printf '%s' "$fpr" > "$LOGIN_DIR/recipient.fpr"; break
            fi
          done
          if ! [ -s "$LOGIN_DIR/recipient.fpr" ]; then
            gh issue comment "$ISSUE" -R "$REPO" \
              --body "❌ \`@$REQUESTER\`'s published GPG key cannot be used to encrypt (no encryption-capable key/subkey). The sign-in challenge cannot be delivered confidentially, so no login was started (fail closed). **Fix:** publish an encryption-capable GPG key on GitHub, then re-apply \`set-up-account\`." || echo "::warning title=set-up-account::the GPG-encryption refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            echo "::error::no encryption-capable GPG key for requester — refusing (fail closed)"; exit 1
          fi
          echo "preflight: challenge will be delivered encrypted to @$REQUESTER's GPG key"

      - name: Device login + deliver encrypted sign-in, capture token
        id: login
        # #211 resume: the credential is already captured — a second login would orphan it.
        if: steps.reconcile.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # used ONLY by the gh issue comment below, never by the CLI
          REQUESTER: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$LOGIN_DIR/gnupg"   # the keyring the preflight imported the recipient into
          # #188: the provider login CLI (and any child it spawns) must NOT inherit the repository-write
          # GitHub token — only the `gh issue comment` in this step needs it. Launch account-login.sh
          # with every GitHub credential variable stripped from its environment; GH_TOKEN stays set for
          # the gh command that posts the encrypted challenge.
          env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
            bash scripts/account-login.sh "${{ steps.meta.outputs.provider }}" "$LOGIN_DIR" 780 &
          BR=$!
          for _ in $(seq 1 40); do [ -s "$LOGIN_DIR/signin.txt" ] && break; sleep 2; done
          if [ -s "$LOGIN_DIR/signin.txt" ]; then
            # #181: NEVER post the raw challenge — on a public repo it is world-readable and redeemable.
            # Encrypt it to the requester's GPG key (proven present + encryption-capable by the preflight)
            # and post only the ASCII-armored ciphertext. gpg reads the plaintext from a file and writes
            # ciphertext to a file, so the challenge is never an argv, a pipe echoed to the log, or a summary.
            recipient=$(cat "$LOGIN_DIR/recipient.fpr" 2>/dev/null || true)
            if [ -z "$recipient" ]; then
              echo "::error::no imported GPG recipient at login time — refusing to surface challenge (fail closed)"
              kill "$BR" 2>/dev/null || true
              echo "status=fail" >> "$GITHUB_OUTPUT"; exit 1
            fi
            gpg --batch --yes --trust-model always -a -e -r "$recipient" \
              -o "$LOGIN_DIR/signin.asc" "$LOGIN_DIR/signin.txt"
            # shellcheck disable=SC2016  # single-quoted printf FORMAT (markdown backticks) is deliberate
            gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
              --body "$(printf '### Sign in to register this account (challenge encrypted to @%s)\n\nThe device code / sign-in URL is a redeemable authorization challenge; on a public repo it is never posted in the clear (any observer could redeem it first and bind an attacker-controlled account). It is encrypted to your GitHub GPG key — save the block below to a file and run `gpg -d`, then complete the sign-in:\n\n```\n%s\n```\n\n_Only continue if you started this. The token is captured and stored as a secret; it is never printed._' "$REQUESTER" "$(cat "$LOGIN_DIR/signin.asc")")"
          fi
          if wait "$BR"; then echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "status=fail" >> "$GITHUB_OUTPUT"; fi

      # [OPUS-4.8] #191: reject an enrollment whose CAPTURED credential format is incompatible with
      # the routing aliases the account will declare — BEFORE the irreversible secret write. The
      # Anthropic login broker falls back to `claude-credentials-json` when `claude setup-token`
      # leaves a credentials file but prints no `sk-ant-` token (account-login.sh:61-62); every
      # current anthropic alias in orchestration/routing.toml declares `claude-oauth-token`, so such
      # an account enrolls successfully yet every worker claim of it dies at worker.yml's "credential
      # format conflicts with protected routing" gate — an unusable account that still burns a slot.
      # The post-store read_accounts validation only checks `models` is nonempty, so it passes this
      # through. Assert here that the captured format equals the declared credential_format of EVERY
      # alias in the account's models list, failing closed on any mismatch / unknown alias / missing
      # format, so an incompatible credential is never stored (works for both providers).
      - name: Reject a credential format incompatible with the routing aliases (fail closed, pre-store)
        if: steps.login.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ steps.meta.outputs.models }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fmt=$(cat "$LOGIN_DIR/credential_format" 2>/dev/null || true)
          reject() {
            gh issue comment "$ISSUE" -R "$REPO" \
              --body "❌ Captured credential format \`${fmt:-<none>}\` is incompatible with the routing aliases for this account ($1). The account was **not** registered (no secret stored). $2" || echo "::warning title=set-up-account::the credential-format refusal explanation failed to post — the refusal/outcome above is the authoritative record"
            echo "::error::$1 — refusing to store (fail closed)"; exit 1
          }
          [ -n "$fmt" ] || reject "no credential_format was captured" "Re-apply \`set-up-account\` to retry the login."
          CAPTURED_FMT="$fmt" MODELS="$MODELS" python3 - <<'PY' || reject "the captured format is not compatible with every declared alias" "Fix the login so it yields a routing-compatible credential (e.g. a \`claude-oauth-token\`), or reconcile orchestration/routing.toml."
          import os, sys, tomllib
          with open("orchestration/routing.toml", "rb") as fh:
              catalog = tomllib.load(fh).get("models", {})
          captured = os.environ["CAPTURED_FMT"]
          aliases = [m.strip() for m in os.environ["MODELS"].strip().strip("[]").split(",") if m.strip()]
          if not aliases:
              print("no declared aliases to validate against", file=sys.stderr); sys.exit(1)
          for alias in aliases:
              meta = catalog.get(alias)
              if not meta or not meta.get("credential_format"):
                  print(f"alias {alias!r} has no credential_format in routing.toml", file=sys.stderr); sys.exit(1)
              if meta["credential_format"] != captured:
                  print(f"alias {alias!r} requires {meta['credential_format']!r} but captured {captured!r}",
                        file=sys.stderr); sys.exit(1)
          print(f"credential format {captured!r} is compatible with every declared alias: {aliases}")
          PY

      - name: Claim slot atomically (acct-claims ref) + store token — fail closed
        id: store
        if: steps.login.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}   # default-identity refs/issues API; PAT probes override inline
          REGISTRY_PAT: ${{ secrets.REGISTRY_SECRETS_PAT }}
          RESERVED_HANDLE: ${{ steps.meta.outputs.handle }}
        run: |
          set -euo pipefail
          # #186 stale-snapshot fix, hardened after review round 1 of #236. `meta` picked the slot
          # from a snapshot taken BEFORE a login lasting up to ~13 min, and the concurrency group
          # serializes only this workflow's own runs — NOT manual account creation or other writers.
          # Proceeding blind would OVERWRITE a live credential (`gh secret set` is an upsert) and
          # mint a DUPLICATE acctNN title (GitHub permits duplicate titles). A re-read immediately
          # before the write is STILL a TOCTOU check, so ownership is taken atomically instead:
          # creating `refs/acct-claims/acctNN` is first-writer-wins on the server — exactly one
          # writer can ever create a given ref — and claims are NEVER deleted (a run that fails
          # after claiming burns its slot rather than releasing it, so a different credential can
          # never overwrite an in-flight one). The acct-claims namespace is the canonical allocation
          # record; every automated account writer MUST create its claim ref before writing a secret
          # or an acctNN issue. Out-of-band manual writes cannot be forced through this protocol;
          # they are caught by deriving the slot from the COMPLETE union of claim refs, acctNN issue
          # titles in ANY state, and ACCTNN_TOKEN secret names at BOTH scopes (repository AND the
          # dispatch-secrets environment — the post-#101 canonical home; an env-only stray must be
          # visible BEFORE the irreversible claim, not first at the absence probe) — each fully
          # paginated, because any capped listing silently treats every unseen slot as free — plus a
          # secret-absence probe right before the upsert. If any listing fails, freeness cannot be
          # proven -> fail closed. The pre-login hint is reused when still free so a retry converges
          # on the same slot.
          reserved=${RESERVED_HANDLE#acct}; reserved=$((10#$reserved))
          claimed=""
          for attempt in 1 2 3 4 5; do
            if ! claim_nums=$(gh api --paginate "repos/${{ github.repository }}/git/matching-refs/acct-claims/" \
                   --jq '.[].ref | select(test("^refs/acct-claims/acct[0-9]+$")) | ltrimstr("refs/acct-claims/acct")'); then
              echo "::error::could not list acct-claims refs — refusing to store (fail closed)"; exit 1
            fi
            if ! issue_nums=$(gh api --paginate "repos/${{ github.repository }}/issues?state=all&per_page=100" \
                   --jq '.[] | select(has("pull_request") | not) | .title | select(test("^acct[0-9]+$")) | ltrimstr("acct")'); then
              echo "::error::could not enumerate every account issue — refusing to store (fail closed)"; exit 1
            fi
            if ! secret_nums=$(GH_TOKEN="$REGISTRY_PAT" gh api --paginate "repos/${{ github.repository }}/actions/secrets?per_page=100" \
                   --jq '.secrets[].name | select(test("^ACCT[0-9]+_TOKEN$")) | ltrimstr("ACCT") | rtrimstr("_TOKEN")'); then
              echo "::error::could not enumerate existing secrets — refusing to store (fail closed)"; exit 1
            fi
            # Post-cutover (#101) ACCTNN_TOKEN secrets live in the dispatch-secrets ENVIRONMENT,
            # so the union MUST enumerate that scope too (sol round-6 finding 3): an env-only
            # token with no claim ref or issue yet would otherwise be invisible here, the broker
            # would create the claim ref IRREVERSIBLY (claims are never deleted) and only then
            # fail at the env absence-probe below — permanently burning the slot. Fully
            # paginated, same PAT (its Environments read+write grant is proven by the preflight
            # canary write; env-secret listing sits under Environments: read).
            if ! env_secret_nums=$(GH_TOKEN="$REGISTRY_PAT" gh api --paginate "repos/${{ github.repository }}/environments/dispatch-secrets/secrets?per_page=100" \
                   --jq '.secrets[].name | select(test("^ACCT[0-9]+_TOKEN$")) | ltrimstr("ACCT") | rtrimstr("_TOKEN")'); then
              echo "::error::could not enumerate dispatch-secrets environment secrets — refusing to store (fail closed)"; exit 1
            fi
            taken=$(printf '%s\n%s\n%s\n%s\n' "$claim_nums" "$issue_nums" "$secret_nums" "$env_secret_nums" \
                      | jq -Rn '[inputs | select(test("^[0-9]+$")) | tonumber]')
            n=$(jq -n --argjson t "$taken" --argjson r "$reserved" \
                  'if ($t | index($r)) then (([$t[], 0] | max) + 1) else $r end')
            cand=$(printf 'acct%02d' "$n")
            # First-writer-wins claim: 422 "already exists" means we lost a race -> re-derive.
            # Any OTHER failure is indistinguishable from "claim state unknown" -> fail closed.
            if out=$(gh api "repos/${{ github.repository }}/git/refs" \
                       -f ref="refs/acct-claims/$cand" -f sha="$GITHUB_SHA" 2>&1); then
              claimed=$n
              break
            fi
            if ! printf '%s' "$out" | grep -qi 'already exists'; then
              echo "::error::claim-ref creation for $cand failed for a non-collision reason — refusing to store (fail closed)"; exit 1
            fi
            echo "slot $cand was claimed concurrently; re-deriving (attempt $attempt)"
          done
          if [ -z "$claimed" ]; then
            echo "::error::could not obtain an account-slot claim after 5 attempts — refusing to store (fail closed)"; exit 1
          fi
          HANDLE=$(printf 'acct%02d' "$claimed")
          SECRET_NAME=$(printf 'ACCT%02d_TOKEN' "$claimed")
          # Last probe before the irreversible upsert: the claim defeats every protocol-observing
          # writer; this narrows the residual out-of-protocol (manual) window to probe->set. Only an
          # explicit 404 proves absence — any other outcome (exists, network error) refuses.
          if probe=$(GH_TOKEN="$REGISTRY_PAT" gh api "repos/${{ github.repository }}/actions/secrets/$SECRET_NAME" 2>&1); then
            echo "::error::secret $SECRET_NAME already exists despite an owned claim (out-of-band write) — refusing to overwrite (fail closed)"; exit 1
          fi
          if ! printf '%s' "$probe" | grep -q 'HTTP 404'; then
            echo "::error::could not prove $SECRET_NAME is absent — refusing to store (fail closed)"; exit 1
          fi
          # Post-#101 the canonical home is the `dispatch-secrets` environment: probe it too
          # (BOTH scopes must 404 — a repo-scope stray would trip the secrets-guard, an env
          # stray means the claim protocol was bypassed).
          if envprobe=$(GH_TOKEN="$REGISTRY_PAT" gh api "repos/${{ github.repository }}/environments/dispatch-secrets/secrets/$SECRET_NAME" 2>&1); then
            echo "::error::secret $SECRET_NAME already exists in the dispatch-secrets environment despite an owned claim — refusing to overwrite (fail closed)"; exit 1
          fi
          if ! printf '%s' "$envprobe" | grep -q 'HTTP 404'; then
            echo "::error::could not prove $SECRET_NAME is absent from the dispatch-secrets environment — refusing to store (fail closed)"; exit 1
          fi
          # The secret lives on THIS registry repo, in the `dispatch-secrets` ENVIRONMENT
          # (post-#101): worker.yml/review-fix.yml resolve secrets[secret_ref] from env-bound
          # jobs, and the rotation write-back targets the same environment. A repo-scope write
          # would re-trip the secrets-guard. Never echo the token — gh reads the file.
          GH_TOKEN="$REGISTRY_PAT" gh secret set "$SECRET_NAME" -R "${{ github.repository }}" --env dispatch-secrets < "$LOGIN_DIR/token"
          # #185: the `gh secret set` above is the IRREVERSIBLE capture. The account issue is NOT
          # created here and is NEVER marked available in this job — the next step registers it
          # `status:pending`, and activation waits for the account_pool PR to merge (fail closed: an
          # account absent from account_pool must never be allocatable). Publish the CLAIMED slot so
          # every downstream step uses it, not the stale pre-login snapshot.
          {
            printf 'handle=%s\n' "$HANDLE"
            printf 'secret=%s\n' "$SECRET_NAME"
          } >> "$GITHUB_OUTPUT"

      # #185: register the account in a NON-available pending state. read_accounts still catalogs it
      # (title + body parse), but choose_account's available-gate skips it (no status:available) AND
      # it is not yet in account_pool — doubly non-allocatable until the policy PR merges. The
      # `request_issue:` line links back so the `activate` job can close the request on merge (the
      # account body parser ignores unknown keys, so this is safe to add). It is also the #211
      # reconcile key: an exact `request_issue: <n>` line is how a retried run finds the one handle
      # already bound to its request instead of allocating a fresh slot — keep the format stable.
      - name: Register the account issue in a status:pending state (#185)
        id: register
        if: steps.login.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ steps.meta.outputs.provider }}
          MODELS: ${{ steps.meta.outputs.models }}
          WORKERS: ${{ steps.meta.outputs.workers }}
          HANDLE: ${{ steps.store.outputs.handle }}
          SECRET_NAME: ${{ steps.store.outputs.secret }}
          ISSUE: ${{ github.event.issue.number }}
          GRANT_TARGETS: ${{ steps.grant.outputs.targets }}
        run: |
          set -euo pipefail
          fmt=$(cat "$LOGIN_DIR/credential_format" 2>/dev/null || echo unknown)
          harness=$([ "$PROVIDER" = openai ] && echo codex || echo claude)
          # #579: record the authorized target repositories ON the account record. The post-merge
          # `activate` job runs on a different event with no access to this request's labels, so
          # this line is what it re-proves the merged account_pool against (per-target, exactly
          # once). Every entry is shape-validated by format_record_line before it is written, and
          # select-and-claim._parse_account ignores unknown keys, so the schema guard below still
          # accepts the record.
          grant_line=$(python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location(
              "registry_grant_account", "scripts/grant-account.py")
          grant = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(grant)
          print(grant.format_record_line(json.loads(os.environ["GRANT_TARGETS"])))
          PY
          )
          # #278: `max_concurrent_workers` is the per-provider default the `meta` step derived, never
          # a literal here. It must not reach the record EMPTY: select-and-claim._parse_account maps
          # a non-numeric value to 1 SILENTLY (it is not a schema error), so a missing meta output
          # would re-mint the cap-1 account this fixed instead of failing — and the credential is
          # already captured and stored by this point, so a silently degraded record is the worst
          # outcome available. Fail closed on the empty value.
          : "${WORKERS:?the meta step derived no max_concurrent_workers for this provider}"
          body=$(printf 'provider: %s\nharness: %s\nmodels: %s\ncredential_format: %s\nmax_concurrent_workers: %s\nsecret_ref: %s\nrequest_issue: %s\n%s\nnotes: registered via set-up-account broker; pending account_pool PR merge\n' "$PROVIDER" "$harness" "$MODELS" "$fmt" "$WORKERS" "$SECRET_NAME" "$ISSUE" "$grant_line")
          # Validate the exact bytes about to be persisted through the allocator's schema guard.
          # A malformed producer output must fail this step before gh can create a corrupt record.
          printf '%s\n' "$body" | python3 scripts/select-and-claim.py \
            --validate-account-record --account-handle "$HANDLE"
          # >>> register-uniqueness — EXECUTED by scripts/grant-account.py --self-test (#394).
          # REGISTRATION MUST NOT BE THE SOURCE OF A DUPLICATE. Both activation paths (the inline
          # one below and the post-merge `activate` job) require EXACTLY ONE exact-title account
          # issue, so a second `acctNN` record wedges the account permanently: neither path will
          # relabel an arbitrary one, and no automated recovery can tell them apart. The store step
          # proved this slot free from the COMPLETE union (claim refs + acctNN titles in any state +
          # ACCTNN_TOKEN secrets at both scopes) and then took the claim ref, which defeats every
          # protocol-observing writer — but any writer OUTSIDE the protocol (a hand-filed issue;
          # anyone can open an issue on a public repo, and the `account` issue FORM even applies the
          # `account` label for them) can still land an `acctNN` title afterwards.
          #
          # READ THE SCOPE OF THIS GUARD BEFORE EXTENDING IT (review round 2). It is NOT a
          # create-once primitive and cannot be turned into one by adding reads: GitHub has no
          # atomic create-if-title-absent, the claim ref does not serialize writers outside the
          # protocol, and no read can observe a write that happens after it. So an outside duplicate
          # landing after the post-create re-read — before this step exits, or an hour later — is
          # NOT prevented here, and the self-test EXECUTES that interleaving rather than leaving it
          # to prose. What is enforced is narrower and still worth having: this run never itself
          # leaves a second record, and never reports success over an ambiguity it can observe. The
          # pre-create read is a cheap early refusal on an already-taken title (never a proof); the
          # post-create re-read is the accountability check on OUR OWN write — the record counts as
          # registered only if we are the SOLE exact-title match at that moment, and on anything
          # else (a duplicate that landed concurrently, or a listing that cannot be read) we RETRACT
          # the one issue whose number this run knows, out of the `acctNN` namespace, and fail
          # closed. That retraction is deterministic and terminates: an outside writer runs no
          # protocol and retracts nothing, and no second protocol run can hold this slot's claim
          # ref. Duplicates this cannot see remain the activation paths' exactly-one gate to refuse
          # (fail closed, never mis-activate) with recovery on the always() alarm — and a durable
          # fix means binding identity to the write-gated `refs/acct-claims/` namespace instead of
          # to a title, which is a separate redesign (see the file header).
          #
          # Read through the ISSUES API, not `gh issue list --search`: the search index is eventually
          # consistent, and a title created seconds ago — exactly the window this guards — may not be
          # in it yet. Fully paginated (a capped page silently proves nothing), pull requests
          # excluded (they share the issues namespace), and the exact-title comparison is done over
          # the projected `<number> <title>` lines with the handle crossing into awk as DATA.
          exact_title_issues() {
            gh api --paginate "repos/${{ github.repository }}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | "\(.number) \(.title)"' \
              | awk -v handle="$HANDLE" 'NF == 2 && $2 == handle { print $1 }'
          }
          if ! prior=$(exact_title_issues); then
            echo "::error::could not enumerate this repository's issues, so it cannot be proven that no account issue titled '$HANDLE' already exists — refusing to register (fail closed)"; exit 1
          fi
          if [ -n "$prior" ]; then
            echo "::error::account issue(s) titled '$HANDLE' already exist ($(printf '%s' "$prior" | tr '\n' ' ')) — a second record for one slot is ambiguous identity that no activation path can resolve, so refusing to register a duplicate (fail closed)"; exit 1
          fi
          # gh issue create needs the label to pre-exist; ensure it idempotently.
          # PR #595 finding 5 audit — `|| true` JUSTIFIED here: `gh label create` fails when the
          # label ALREADY exists (the normal case), which is precisely the state we want, and the
          # outcome is VERIFIED downstream and fail-loud — the `gh issue create --label` call below
          # (no `|| true`) fails the step if either label is genuinely absent. This is an idempotent
          # ensure-exists, not a state transition, so nothing is silently swallowed.
          gh label create status:pending -R "${{ github.repository }}" \
            -c EBECA4 -d "account captured, awaiting account_pool PR merge before activation" 2>/dev/null || true
          gh label create account -R "${{ github.repository }}" \
            -c 1D76DB -d "model-account catalog record" 2>/dev/null || true
          # registry issue + comment use the workflow's own github.token (same-owner)
          created=$(gh issue create -R "${{ github.repository }}" \
            --title "$HANDLE" \
            --label account --label "provider:$PROVIDER" --label status:pending \
            --body "$body")
          number=${created##*/}
          case "$number" in
            ''|*[!0-9]*)
              echo "::error::gh issue create returned no issue number (got '$created'), so the record it created cannot be re-proven unique and cannot be retracted — refusing to treat '$HANDLE' as registered (fail closed). MANUAL recovery: confirm at most one issue titled '$HANDLE' exists before any re-apply"; exit 1 ;;
          esac
          # Retract THIS run's own record and fail. Renaming is what actually resolves the
          # ambiguity: both activation paths match on the EXACT title, so a merely closed or
          # unlabelled duplicate would still wedge them. Dropping `account` removes the catalog
          # marker select_account_issues keys on, and closing takes it out of read_accounts (which
          # lists open issues only) — together the retracted issue can never be read as an account.
          retract() {
            if gh issue edit "$number" -R "${{ github.repository }}" \
                 --title "$HANDLE (retracted duplicate registration, #394)" \
                 --remove-label account --remove-label status:pending \
               && gh issue close "$number" -R "${{ github.repository }}" \
                 --comment "Retracted by set-up-account: $1"; then
              echo "::error::$1 — this run RETRACTED its own record (issue #$number: renamed out of the '$HANDLE' namespace, \`account\` label removed, closed), so no ambiguous pair of trusted records remains. Re-apply set-up-account to enroll on a FRESH slot (this slot's claim ref stays burned by design)"
            else
              echo "::error::$1 — AND retracting this run's own record DID NOT COMPLETE. Issue #$number may still be titled '$HANDLE' and carry the \`account\` label, which is the ambiguous identity every activation path refuses. MANUAL recovery required: rename #$number out of the '$HANDLE' namespace, drop its \`account\` label and close it, so at most one '$HANDLE' record remains, then re-apply set-up-account"
            fi
            exit 1
          }
          if ! after=$(exact_title_issues); then
            retract "the record just created could not be re-proven unique: this repository's issues could not be enumerated after \`gh issue create\`, so create-once is unproven"
          fi
          if [ "$after" != "$number" ]; then
            retract "an account issue titled '$HANDLE' was registered concurrently by a writer outside this protocol (exact-title matches after create: $(printf '%s' "$after" | tr '\n' ' '); expected only #$number)"
          fi
          # <<< register-uniqueness

      - name: Validate the registration through the real allocator parser
        id: validate
        if: steps.login.outputs.status == 'ok' || steps.reconcile.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # read_accounts shells out to `gh issue list`
          NEW_HANDLE: ${{ steps.store.outputs.handle || steps.reconcile.outputs.handle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location(
              "registry_select_and_claim", "scripts/select-and-claim.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          handle = os.environ["NEW_HANDLE"]
          accounts = {a["handle"]: a for a in module.read_accounts(os.environ["GITHUB_REPOSITORY"])}
          account = accounts.get(handle)
          if account is None or not account.get("models"):
              raise SystemExit(
                  f"registration validation FAILED: {handle} is invisible to read_accounts "
                  "(missing or empty models line) — the allocator could never select it")
          print(f"registration validated: {handle} models={account['models']}")
          PY

      # #185: the account_pool PR must be opened by a NON-GITHUB_TOKEN identity — a PR opened with
      # the workflow's own GITHUB_TOKEN does NOT trigger `pull_request` workflows (GitHub's recursion
      # guard), so `pr-gate` would never run, the required `gate` check would never post, and the PR
      # could never merge (nor would activation ever fire). Mint the SAME scoped GitHub App token the
      # review lane uses (REGISTRY_ADMIN_APP_ID/KEY live in the dispatch-secrets environment this job
      # is bound to), scoped to THIS repo with only contents+PR write.
      - name: Mint an App token for the account_pool PR (this repo; contents+PR write) (#185)
        id: app-token-pool
        if: steps.login.outputs.status == 'ok' || steps.reconcile.outputs.resume == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # SEAM(#325): the account-pool list is slated to move to a PRIVATE location; until then
      # policy/repos.toml account_pool is the single allow-list every enforcement point checks
      # (policy-resolve validation, claim()'s pool filter, worker.yml's independent re-check). #185:
      # a direct contents-API PUT to `master` is REJECTED by required-status-check branch protection
      # (data/README.md), so the append goes out as a CHECKED PR on an `account-pool/<handle>`
      # feature branch (branches other than master are unprotected). The App-authored PR runs the
      # `gate` check; on merge the `activate` job flips the account status:pending ->
      # status:available.
      #
      # #579: the handle is appended ONLY to the account_pool rows this request is authorized for —
      # never to every row. Every scoping decision lives in the shared, self-tested helper
      # scripts/grant-account.py (nothing here knows the document's location, so this survives the
      # #325 relocation), and the sequence is:
      #   1. read master's policy (the PR merge base);
      #   2. RE-READ the request's `grant:` labels LIVE and require them to still equal the
      #      pre-login snapshot — the sign-in can take ~13 minutes, so the authorization that was
      #      captured must be re-proved immediately before the write (a removed target fails
      #      closed). The App token below carries only contents+pull-requests write, so the issue
      #      read runs under the workflow's own token and the label names come back as DATA;
      #   3. render the ROW-SCOPED edit and prove the EXACT per-target postcondition by parsing the
      #      proposed document (each requested row lists the handle exactly once; every other row
      #      byte-identical; nothing else in the file moved) — a `subn` count proves nothing about
      #      WHICH rows changed;
      #   4. on the "already present in master" no-op path, prove the same exactness with
      #      verify_membership BEFORE reporting a landed grant (an existential check would accept a
      #      wrong-row or duplicate entry);
      #   5. after the PUT, re-read the BRANCH blob and re-prove it — the bytes the PR carries, not
      #      just the bytes we computed, must satisfy the postcondition.
      - name: Open a checked account_pool PR (never a master PUT) (#185)
        id: policy_pr
        # #211 resume re-enters here: the branch/PUT/PR logic below is idempotent (reuses the
        # branch, skips an already-applied edit, reuses an open PR, emits pr=none when master
        # already carries the handle), so a resumed run converges instead of duplicating.
        if: steps.login.outputs.status == 'ok' || steps.reconcile.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-pool.outputs.token }}
          # The issue read for the LIVE authorization re-check (#579 step 2): the App token has no
          # issues scope, so the label read runs under the workflow's own least-privilege token.
          ISSUE_TOKEN: ${{ github.token }}
          NEW_HANDLE: ${{ steps.store.outputs.handle || steps.reconcile.outputs.handle }}
          GRANT_TARGETS: ${{ steps.grant.outputs.targets }}
          REQUEST_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import importlib.util
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/")[0]
          handle = os.environ["NEW_HANDLE"]
          request_issue = os.environ["REQUEST_ISSUE"]
          # The pre-login authorized set, as DATA. An absent/empty value cannot authorize anything:
          # authorize() then refuses on "no authorized target set was captured" (fail closed).
          snapshot = json.loads(os.environ.get("GRANT_TARGETS") or "[]")
          if not re.fullmatch(r"acct[0-9a-z]{2,}", handle):
              raise SystemExit("unsafe handle")
          path = "policy/repos.toml"

          # #579: every scoping/postcondition decision comes from the shared helper (self-tested;
          # the checkout ran long before this step, so the import cannot race it — PR #260 round 6).
          spec = importlib.util.spec_from_file_location(
              "registry_grant_account", "scripts/grant-account.py")
          grant = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(grant)
          # One source of truth for the grant branch namespace: `activate` keys off it and the
          # provenance proof below treats it as the carrier of a reviewed grant.
          branch = grant.grant_branch(handle)

          def proven(fn, *args):
              """Run one grant decision, turning any unprovable outcome into a refusal."""
              try:
                  return fn(*args)
              except grant.GrantError as exc:
                  raise SystemExit(f"::error::account_pool grant refused (fail closed): {exc}")

          def run(args, input_str=None, check=True, env=None):
              result = subprocess.run(args, capture_output=True, text=True, input=input_str,
                                      env=env)
              if check and result.returncode != 0:
                  raise SystemExit(f"{args[:3]} failed: {result.stderr.strip()}")
              return result

          def gh_api(args, input_doc=None, check=True):
              return run(["gh", "api", *args],
                         input_str=json.dumps(input_doc) if input_doc is not None else None,
                         check=check)

          def gh_pages(args):
              """Every page of a paginated list endpoint, flattened. `--slurp` keeps `--paginate`'s
              one-array-per-page output a single JSON document; a capped read would silently make an
              absent record look like a proven negative."""
              pages = json.loads(gh_api([*args, "--paginate", "--slurp"]).stdout)
              return [entry for page in pages for entry in page]

          def set_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"{key}={value}\n")

          # Compute the appended policy from master's current content (the PR merge base).
          document = json.loads(gh_api([f"repos/{repo}/contents/{path}?ref=master"]).stdout)
          text = base64.b64decode("".join(document["content"].split())).decode()

          # (#579 step 2) RE-PROVE the authorization from LIVE issue state, immediately before the
          # write. Fully paginated; the names cross back as DATA (one per line), and the read uses
          # the workflow's own token because the App token holds no issues scope. Anything but exact
          # equality with the pre-login snapshot — a target dropped or added during the sign-in
          # window — is a refusal, never a silently narrowed grant.
          issue_env = {**os.environ, "GH_TOKEN": os.environ["ISSUE_TOKEN"]}
          live = run(["gh", "api", "--paginate",
                      f"repos/{repo}/issues/{request_issue}/labels", "--jq", ".[].name"],
                     env=issue_env).stdout.splitlines()
          targets = proven(grant.authorize,
                           [name.strip() for name in live if name.strip()], text, snapshot)

          # (#579 step 3) The ROW-SCOPED edit. render_grant edits only these rows' account_pool
          # lines and re-proves the exact per-target postcondition on the result (it refuses a
          # policy the resolver could not parse, too), so no `subn` count is ever trusted.
          new_text = proven(grant.render_grant, text, handle, targets)
          if new_text == text:
              # (#579 step 4) Already in master's account_pool for every requested target (a prior
              # run's PR merged) — activation may proceed with no PR, but ONLY after the same exact
              # per-target proof: the old existential check reported a wrong-row entry, a partial
              # grant, or a pre-existing DUPLICATE as a success.
              proven(grant.verify_membership, text, handle, targets)
              # #616 review finding 1: SHAPE IS NOT PROVENANCE. verify_membership proves the handle
              # occurs exactly once in each authorized row and nowhere else; it cannot prove HOW it
              # got there. Without the check below, a handle already seeded into the policy by any
              # other means (a hand edit, a leftover row from a retired account, an unrelated merged
              # PR) would let a freshly captured credential skip the CHECKED account_pool PR
              # entirely and activate inline — the two-phase review checkpoint (#185) silently
              # bypassed on exactly the path that reports a "successful grant". So the membership
              # must be accounted for by a MERGED `account-pool/<handle>` PR into master whose diff
              # is that one policy document and nothing else. Not provable => refuse: the account
              # stays status:pending and the always() alarm hands the case to a human (the capture is
              # irreversible, so recovery is forward, never a silent inline activation).
              pulls = gh_pages([f"repos/{repo}/pulls?head={owner}:{branch}&state=all&per_page=100"])
              merged = proven(grant.merged_grant_prs, pulls, handle)
              # #616 review round 2: the branch name plus the changed-file list prove the SHAPE of
              # the provenance, NOT that the PR added THIS handle — and picking `merged[-1]` assumed
              # the newest merged PR on the branch was the grant. Every merged candidate is now
              # examined and each requested target must be traced to one that provably granted THAT
              # ROW.
              #
              # #616 review round 4 (MAJOR 3): the diff-level proof carries no row identity, so a
              # historical checked PR that added the handle to row C validated later UNCHECKED
              # membership in rows A and B once C was cleaned up — zero current targets traced to a
              # checked PR, while the notice claimed "membership traced to a checked PR". Row
              # identity comes from each candidate's OWN pre/post documents (its merge commit and
              # that commit's first parent), which is the same two-document proof the live path uses;
              # `trace_membership_provenance` then requires EVERY requested target to appear in some
              # candidate's established rows. Any read that fails here aborts the step (`check=True`)
              # — a provenance we cannot read is a refusal, never an assumption.
              candidates = []
              for candidate in merged:
                  meta = json.loads(gh_api([f"repos/{repo}/pulls/{candidate}"]).stdout)
                  merge_sha = meta.get("merge_commit_sha")
                  if not isinstance(merge_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", merge_sha):
                      raise SystemExit(
                          "::error::account_pool grant refused (fail closed): merged PR "
                          f"#{candidate} reports no usable merge commit, so the rows it granted "
                          "cannot be established")
                  parents = json.loads(
                      gh_api([f"repos/{repo}/commits/{merge_sha}"]).stdout).get("parents") or []
                  if not parents or not isinstance(parents[0], dict):
                      raise SystemExit(
                          "::error::account_pool grant refused (fail closed): merge commit "
                          f"{merge_sha} of PR #{candidate} has no first parent")
                  def policy_at(ref):
                      return base64.b64decode("".join(json.loads(gh_api(
                          [f"repos/{repo}/contents/{path}?ref={ref}"]).stdout)["content"].split())
                      ).decode()
                  candidates.append({
                      "number": candidate,
                      "changed": gh_pages([f"repos/{repo}/pulls/{candidate}/files?per_page=100"]),
                      "before": policy_at(parents[0]["sha"]),
                      "after": policy_at(merge_sha),
                  })
              evidence = proven(grant.trace_membership_provenance, handle, targets, candidates,
                                path)
              print(f"{handle} already granted to exactly {targets} in master account_pool; every "
                    f"one of those rows was established by a merged, row-scoped grant PR "
                    f"({evidence}) — no new PR needed. NOTE: that traces each row to a checked PR, "
                    "not the CURRENT bytes of the row (an unchecked later edit could have removed "
                    "and re-added the handle); today's shape is proved by verify_membership above.")
              set_output("pr", "none")
              raise SystemExit(0)

          # Create the feature branch at master HEAD and PUT the edit on THAT branch. Feature
          # branches are unprotected, so this never touches master directly. Both are idempotent so
          # a retried job converges rather than erroring.
          base_sha = json.loads(gh_api([f"repos/{repo}/git/ref/heads/master"]).stdout)["object"]["sha"]
          mk = gh_api([f"repos/{repo}/git/refs", "-f", f"ref=refs/heads/{branch}",
                       "-f", f"sha={base_sha}"], check=False)
          if mk.returncode != 0 and "already exists" not in mk.stderr.lower():
              raise SystemExit(f"could not create branch {branch}: {mk.stderr.strip()}")
          # PUT against the branch tip; re-read the branch's blob sha (a reused branch already holds
          # the edit or a stale sha), and skip if the branch already carries the change.
          bmeta = json.loads(gh_api([f"repos/{repo}/contents/{path}?ref={branch}"]).stdout)
          branch_text = base64.b64decode("".join(bmeta["content"].split())).decode()
          if branch_text != new_text:
              gh_api([f"repos/{repo}/contents/{path}", "-X", "PUT", "--input", "-"],
                     input_doc={
                         "message": f"register {handle} in account_pool (set-up-account broker)",
                         "content": base64.b64encode(new_text.encode()).decode(),
                         "sha": bmeta["sha"],
                         "branch": branch,
                     })

          # (#579 step 5) Re-read the BRANCH blob and prove THOSE bytes — the document the PR
          # actually carries, not just the one computed above — satisfy the exact per-target
          # postcondition against master. A PUT that landed on the wrong branch, a concurrent
          # writer, or a reused branch carrying an unrelated edit is caught here, before any PR
          # claims the grant is scoped.
          landed = json.loads(gh_api([f"repos/{repo}/contents/{path}?ref={branch}"]).stdout)
          landed_text = base64.b64decode("".join(landed["content"].split())).decode()
          proven(grant.verify_grant, text, landed_text, handle, targets)

          # Reuse an open PR for this branch on a retry; otherwise open one.
          existing = json.loads(gh_api(
              [f"repos/{repo}/pulls?head={owner}:{branch}&state=open"]).stdout)
          if existing:
              number = existing[0]["number"]
          else:
              body = (f"Adds `{handle}` to the `policy/repos.toml` account_pool of the repositories "
                      f"this enrollment was authorized for — and no others (#579).\n\n"
                      f"account_handle: {handle}\nrequest_issue: {request_issue}\n"
                      f"{grant.format_record_line(targets)}\n\n"
                      f"On merge, the `activate` job re-proves that every target above lists "
                      f"`{handle}` exactly once in the MERGED policy, then flips `{handle}` "
                      f"status:pending -> status:available and closes #{request_issue}. This is a "
                      f"trust-surface change (account_pool is the allocator allow-list) — it merges "
                      f"only when `gate` is green.")
              created = json.loads(gh_api(
                  [f"repos/{repo}/pulls", "-X", "POST", "--input", "-"],
                  input_doc={"title": f"Register {handle} in account_pool",
                             "head": branch, "base": "master", "body": body}).stdout)
              number = created["number"]
          set_output("pr", str(number))
          print(f"account_pool PR #{number} open for {handle}")
          PY

      - name: Comment PENDING (or activate inline if already in account_pool) on the request issue (#185)
        id: activate_inline
        if: steps.login.outputs.status == 'ok' || steps.reconcile.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HANDLE: ${{ steps.store.outputs.handle || steps.reconcile.outputs.handle }}
          SECRET: ${{ steps.store.outputs.secret || steps.reconcile.outputs.secret }}
          MODELS: ${{ steps.meta.outputs.models || steps.reconcile.outputs.models }}
          RESUME_FMT: ${{ steps.reconcile.outputs.fmt }}
          PR: ${{ steps.policy_pr.outputs.pr }}
          ISSUE: ${{ github.event.issue.number }}
          # #579: the authorized target set, for the audit trail in the notices below. It is a
          # validated owner/repo list (never raw label text) and is used only as report data — the
          # binding proof happened in the policy-write step.
          TARGETS: ${{ steps.grant.outputs.targets }}
        run: |
          set -euo pipefail
          # #211 resume: no LOGIN_DIR capture exists — the format recorded on the account issue is
          # authoritative for the already-stored credential.
          fmt=$(cat "$LOGIN_DIR/credential_format" 2>/dev/null || echo "${RESUME_FMT:-unknown}")
          if [ "${PR:-none}" = none ] || [ -z "${PR:-}" ]; then
            # Handle already in master account_pool (a prior run's PR merged) — policy is in place,
            # so activate INLINE. This is a real state transition (identical in consequence to the
            # `activate` job), so it FAILS CLOSED rather than claiming a false success on a transient
            # API/permission failure (review round 1 of #383): require EXACTLY ONE exact-title account
            # issue, require it status:pending (or idempotently already status:available), perform the
            # label flip WITHOUT suppressing failure, and RE-READ status:available before commenting
            # success or closing the request. Any failure exits non-zero and is surfaced by the
            # always() alarm via this step's `activate_inline` outcome, not swallowed as success.
            mapfile -t nums < <(gh issue list -R "${{ github.repository }}" --state all --search "\"$HANDLE\" in:title" \
                    --json number,title --jq ".[]|select(.title==\"$HANDLE\")|.number")
            if [ "${#nums[@]}" -ne 1 ]; then
              echo "::error::expected exactly one account issue titled '$HANDLE' in any state, found ${#nums[@]} — refusing to activate (fail closed)"; exit 1
            fi
            num=${nums[0]}
            labels=$(gh issue view "$num" -R "${{ github.repository }}" --json labels --jq '[.labels[].name]|join(" ")')
            case " $labels " in
              *" status:available "*)
                echo "$HANDLE (issue #$num) already status:available — idempotent re-run, nothing to flip" ;;
              *" status:pending "*)
                gh issue edit "$num" -R "${{ github.repository }}" \
                  --remove-label status:pending --add-label status:available
                after=$(gh issue view "$num" -R "${{ github.repository }}" --json labels --jq '[.labels[].name]|join(" ")')
                case " $after " in
                  *" status:available "*) : ;;
                  *) echo "::error::label flip for $HANDLE (issue #$num) did not land (labels now: $after) — refusing to claim activation (fail closed)"; exit 1 ;;
                esac ;;
              *)
                echo "::error::issue #$num for $HANDLE is neither status:pending nor status:available (labels: $labels) — refusing to activate (fail closed)"; exit 1 ;;
            esac
            # PR #595 finding 5 audit — the STATE transition that matters (status:pending ->
            # status:available) is fail-loud AND post-read verified above. What remains here is the
            # courtesy close of the REQUEST issue: a failure leaves it OPEN, which is the safe
            # direction (visible, hand-closable, and it never un-quarantines or un-labels anything),
            # so it stays non-fatal — but it now emits a ::warning instead of vanishing silently.
            gh issue comment "$ISSUE" -R "${{ github.repository }}" \
              --body "✅ Account **$HANDLE** registered and activated: secret \`$SECRET\` (format \`$fmt\`), \`models: $MODELS\`, already present in the \`policy/repos.toml\` account_pool of its authorized targets \`$TARGETS\` (and no other row), with that membership traced to a merged, checked \`account-pool/$HANDLE\` PR — flipped to \`status:available\`. Closing." \
              || echo "::warning title=set-up-account::activation notice comment failed to post on #$ISSUE"
            gh issue close "$ISSUE" -R "${{ github.repository }}" \
              || echo "::warning title=set-up-account::could not close request issue #$ISSUE (it stays open — close it by hand)"
          else
            gh issue comment "$ISSUE" -R "${{ github.repository }}" \
              --body "⏳ Account **$HANDLE** captured (secret \`$SECRET\` stored, format \`$fmt\`, \`models: $MODELS\`) and registered **status:pending** — NOT yet allocatable. Policy PR #$PR adds \`$HANDLE\` to the \`policy/repos.toml\` account_pool of its authorized targets \`$TARGETS\` only; **merge #$PR to activate** — the \`activate\` job then flips it to \`status:available\` and closes this request. This stays open until then." || echo "::warning title=set-up-account::the pending-activation notice failed to post — the refusal/outcome above is the authoritative record"
          fi

      - name: Report failure
        # #211: on the resume path no login ran, so a skipped login step is not a sign-in timeout.
        if: steps.reconcile.outputs.resume != 'true' && steps.login.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
            --body "⚠️ Sign-in did not complete in time (device code expires ~15 min). Re-apply \`set-up-account\` to retry." || echo "::warning title=set-up-account::the sign-in timeout notice failed to post — the refusal/outcome above is the authoritative record"

      # #185: after a captured credential (login ok), report EVERY partial enrollment state so a
      # human can recover — never a silent abort. Ordered by how far the pipeline got; the first
      # incomplete stage wins. A fully-consistent enrollment (secret + pending issue + validated +
      # PR) is quiet. The capture is irreversible (claims are never released, #186), so every
      # recovery is forward.
      - name: Alarm on partial enrollment state (always) (#185)
        id: alarm
        if: always() && (steps.login.outputs.status == 'ok' || steps.reconcile.outputs.resume == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RESUME: ${{ steps.reconcile.outputs.resume }}
          HANDLE: ${{ steps.store.outputs.handle || steps.reconcile.outputs.handle }}
          SECRET: ${{ steps.store.outputs.secret || steps.reconcile.outputs.secret }}
          STORE: ${{ steps.store.outcome }}
          REGISTER: ${{ steps.register.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          POLICY_PR: ${{ steps.policy_pr.outcome }}
          ACTIVATE_INLINE: ${{ steps.activate_inline.outcome }}
        run: |
          set -uo pipefail
          comment() { gh issue comment "$ISSUE" -R "${{ github.repository }}" --body "$1" || echo "::warning title=set-up-account::a partial-enrollment alarm notice failed to post on #$ISSUE — the step log is the authoritative record"; }
          # #211: on the resume path store/register were deliberately skipped (their work is done —
          # the resumed handle proves both), so only the resumed stages can be partial.
          if [ "$RESUME" != true ] && [ "$STORE" != success ]; then
            comment "🚨 Enrollment aborted while claiming/storing the credential (store: \`$STORE\`). No usable account was registered; a slot claim ref may have been burned (claims are never released, by design). **Recovery:** re-apply \`set-up-account\` to retry on a fresh slot."
          elif [ "$RESUME" != true ] && [ "$REGISTER" != success ]; then
            comment "🚨 Credential for **$HANDLE** was STORED (secret \`$SECRET\`) but the \`status:pending\` account issue was not created (register: \`$REGISTER\`). The credential is captured with no account record. **Recovery — check the step log first.** If registration was REFUSED because an account issue titled \`$HANDLE\` ALREADY exists — or was created and then RETRACTED because a duplicate landed concurrently (#394: a record counts as registered only if it is re-proven the sole exact-title issue AFTER creation, so the duplicate that would wedge BOTH activation paths is resolved instead of left behind) — do **not** hand-create a second \`$HANDLE\` issue — that is precisely the ambiguous identity both paths refuse to resolve. Instead delete the orphaned \`dispatch-secrets\` secret \`$SECRET\` FIRST (so the pre-existing record cannot be resumed against a credential that is not its own), leave the conflicting issue alone, and re-apply \`set-up-account\`: the existing title is in the slot union, so enrollment allocates a FRESH slot and registers there (this slot's claim ref stays burned by design — claims are never released). Otherwise the register step failed for another reason and no \`$HANDLE\` record exists: create the \`$HANDLE\` issue (status:pending, \`secret_ref: $SECRET\`, and the \`grant_targets:\`/\`models:\` lines) or delete the orphaned secret \`$SECRET\`, then re-apply \`set-up-account\`."
          elif [ "$VALIDATE" != success ]; then
            comment "🚨 **$HANDLE** was stored and the pending issue created, but read_accounts validation failed (\`$VALIDATE\`) — the account body may be malformed, so no policy PR was opened. **Recovery:** fix the \`$HANDLE\` issue body (models / secret_ref), then re-apply \`set-up-account\` — enrollment resumes \`$HANDLE\` (#211) and opens the account_pool PR."
          elif [ "$POLICY_PR" != success ]; then
            comment "🚨 **$HANDLE** is registered \`status:pending\` (secret \`$SECRET\` stored) but the account_pool policy PR was NOT opened (policy-PR: \`$POLICY_PR\`). The account is safely non-allocatable but will never activate until it is in \`policy/repos.toml\` account_pool. **Recovery:** check the step log first — if the grant was REFUSED (#579), the \`grant:<owner>/<repo>\` labels on this request no longer match the targets recorded on the \`$HANDLE\` account issue, or they no longer name \`enabled = true\` policy rows; restore them to exactly that set. If instead the refusal says \`$HANDLE\` is ALREADY in the policy account_pool but no merged, ROW-SCOPED \`account-pool/$HANDLE\` PR accounts for **each authorized row**, the membership of the untraced rows was not established by a checked grant PR — that is deliberate (#616 review finding 1: shape is not provenance; round 4: and a checked PR for a DIFFERENT row is not provenance for this one). Establish it properly: open an \`account-pool/$HANDLE\` PR editing ONLY the granted rows (if the entry is stale, remove it first in its own PR), let it merge, and activation follows. Then re-apply \`set-up-account\` — enrollment resumes \`$HANDLE\` on the same slot and re-drives the PR (#211); or open it manually (head branch \`account-pool/$HANDLE\`, editing ONLY the granted rows) — on merge it activates automatically."
          elif [ "$ACTIVATE_INLINE" != success ]; then
            comment "🚨 **$HANDLE** was stored, registered \`status:pending\`, and its handle was ALREADY in master \`account_pool\` (no policy PR needed), but the INLINE activation FAILED (activate: \`$ACTIVATE_INLINE\`) — the account may still be \`status:pending\` and this request may still be open despite policy being in place, so no false success was claimed. **Recovery:** confirm there is exactly one \`$HANDLE\` account issue and flip it to \`status:available\` (or re-apply \`set-up-account\`); re-merging/re-triggering the account_pool PR also drives the \`activate\` job to flip it. If the log says TWO were found, a duplicate title was filed from OUTSIDE this enrollment — possible at any moment on a public repo, since #394 proves uniqueness only up to registration's own post-create read. Resolve it by RETRACTING THE INTRUDER, not the broker's record: identify the issue this run created (the register step logged its number), then rename the OTHER one out of the \`acctNN\` namespace, drop its \`account\` label and close it, so exactly one \`$HANDLE\` record remains — then re-trigger activation."
          else
            echo "enrollment consistent: $HANDLE pending; activation awaits account_pool PR merge"
          fi

      - name: Cleanup auth state (always)
        if: always()
        run: |
          pkill -f 'codex login' 2>/dev/null || true
          pkill -f 'claude setup-token' 2>/dev/null || true
          rm -rf "$LOGIN_DIR" 2>/dev/null || true

  # #185 phase 2: activate an account ONLY after its account_pool PR merges. Fires on
  # pull_request closed(merged) for an `account-pool/*` head branch, and re-verifies the handle is
  # genuinely in MERGED master account_pool before flipping anything (fail closed) — a merged PR
  # that does not actually add the handle, or has no matching status:pending account issue, activates
  # nothing. #579: that re-verification is EXACT and PER-TARGET against the target set recorded on
  # the account issue (`grant_targets:`), not an existential "some row has it" check — a merged PR
  # whose edit landed on the wrong rows, granted only some of them, or duplicated an entry activates
  # nothing either. Least privilege: issues:write + contents:read only, github.token (no PAT, no
  # secrets, no environment — activation only relabels/closes issues and reads the merged policy).
  activate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'account-pool/')
    runs-on: ubuntu-latest
    concurrency:
      group: set-up-account-activate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      issues: write
      contents: read
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout the merged commit (the post-merge policy) (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # #188: this job runs no installer or third-party CLI, but there is no reason to persist the
          # checkout credential (gh uses GH_TOKEN, not .git/config) — match the repo-wide convention.
          persist-credentials: false

      - name: Activate the pending account now that account_pool merged (fail closed)
        id: activate_merged
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          handle="${HEAD_REF#account-pool/}"
          if ! printf '%s' "$handle" | grep -qE '^acct[0-9a-z]{2,}$'; then
            echo "::error::head ref '$HEAD_REF' does not encode a valid account handle — refusing"; exit 1
          fi
          # Resolve the account issue by EXACT title FIRST (#579): its `grant_targets:` line records
          # which repositories this enrollment was authorized for, and the merged policy is verified
          # against THAT set — an existential "some row has the handle" check would activate an
          # account whose grant landed on the wrong rows. It must exist (only the trust-gated broker
          # creates acctNN issues); if already available this is an idempotent re-trigger (no-op).
          # Require EXACTLY ONE exact-title match, matching the inline activation invariant: a
          # `[...][0]` first-match pick would silently relabel an arbitrary duplicate, so zero OR
          # two+ matches fail closed on ambiguous identity rather than mutating the wrong account
          # (round 2 of #383). #394 stopped registration from being a SOURCE of duplicates (it
          # retracts its own record unless re-proven the sole exact-title issue after creation), but
          # it could not make title uniqueness durable — an acctNN title can be hand-filed by anyone
          # at any later moment, including after that proof. So this gate is not defence in depth
          # against a solved problem: it is the LOAD-BEARING refusal for every duplicate
          # registration cannot see, and it must stay exactly-one. This job also runs the base-ref
          # copy of the file on a different event, so it never assumes registration ran at all.
          mapfile -t nums < <(gh issue list -R "$REPO" --state all --search "\"$handle\" in:title" \
                  --json number,title --jq ".[]|select(.title==\"$handle\")|.number")
          if [ "${#nums[@]}" -ne 1 ]; then
            echo "::error::expected exactly one account issue titled '$handle' in any state, found ${#nums[@]} — refusing to activate (fail closed)"; exit 1
          fi
          num=${nums[0]}
          body=$(gh issue view "$num" -R "$REPO" --json body --jq '.body')
          # Re-verify the MERGED policy against the recorded target set (#579). The checkout IS the
          # merge commit; the shared helper parses policy/repos.toml and requires every authorized
          # target to list the handle EXACTLY once and no other row to list it at all — never the PR
          # title/diff, never an existential check. The issue body crosses in as env DATA, never
          # interpolated into this privileged run: block. A record with no readable `grant_targets:`
          # line cannot be proven and so is never activated (fail closed).
          #
          # #616 review finding 2: MEMBERSHIP IS A ONE-DOCUMENT PROOF, and the activation notice used
          # to claim "every other row was verified unchanged" — which verify_membership cannot see.
          # The two-document verify_grant DID run in the login job, but BEFORE the PR was opened, and
          # feature branches are unprotected: any later push to the branch (or a reused branch
          # carrying an unrelated edit) merged outside that proof, so a PR with the correct scoped
          # membership PLUS edits to other rows' pools or other policy fields could merge and still
          # activate. So the final trust-boundary check is now the same EXACT two-document
          # postcondition, run here against the merged commit's FIRST PARENT — master immediately
          # before this merge, for merge/squash/single-commit-rebase strategies alike, and the
          # correct base even when other policy PRs landed after this one was opened (the PR's own
          # `base.sha` would false-refuse on that). Read through the contents API rather than git so
          # a shallow checkout cannot make it unresolvable. Anything unprovable — an unresolvable
          # parent, an unreadable blob, a diff reaching beyond the granted rows — refuses, leaving
          # the account status:pending for a human.
          if ! parent=$(gh api "repos/$REPO/commits/$MERGE_SHA" --jq '.parents[0].sha') \
             || ! printf '%s' "$parent" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve the first parent of merge commit $MERGE_SHA, so the pre-merge policy cannot be read and the grant's scope cannot be re-proved — refusing to activate $handle (fail closed)"; exit 1
          fi
          # Raw media type + a FILE, never a command substitution: `$(...)` strips trailing newlines,
          # which would make the before/after line counts differ and false-refuse a correct grant.
          before="$RUNNER_TEMP/pre-merge-policy.toml"
          if ! gh api "repos/$REPO/contents/policy/repos.toml?ref=$parent" \
                 -H "Accept: application/vnd.github.raw" > "$before"; then
            echo "::error::could not read policy/repos.toml at the pre-merge commit $parent — refusing to activate $handle (fail closed)"; exit 1
          fi
          # #616 review round 2, BOTH MAJORS. The first-parent read above is master-immediately-before
          # for a merge commit, a squash and a SINGLE-commit rebase — but this repo has
          # `allow_rebase_merge: true`, and for a MULTI-COMMIT rebase the final commit's first parent
          # is an earlier commit OF THE SAME PR, hiding that PR's earlier policy edits from the
          # comparison. And `verify_grant` used to accept a NO-DELTA pair, so a PR that established
          # nothing could activate a credential. Both are closed by proving the PR'S OWN DIFF:
          # `pulls/N/files` is computed against the merge base, so it sees every commit of the PR
          # whatever strategy merged it, and an absent/empty patch is a refusal. Fully paginated —
          # a truncated file listing would let an extra file hide from require_grant_pr_scope, which
          # is the one direction that fails OPEN. `--slurp` keeps `--paginate` a single document.
          files="$RUNNER_TEMP/merged-pr-files.json"
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --slurp \
                 > "$files"; then
            echo "::error::could not read the changed-file listing for merged PR #$PR_NUMBER, so it cannot be proven that the grant edited only policy/repos.toml — refusing to activate $handle (fail closed)"; exit 1
          fi
          HANDLE="$handle" ACCOUNT_BODY="$body" BEFORE_POLICY_FILE="$before" \
            PR_FILES_FILE="$files" python3 - <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location(
              "registry_grant_account", "scripts/grant-account.py")
          grant = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(grant)
          handle = os.environ["HANDLE"]
          with open("policy/repos.toml", encoding="utf-8") as fh:
              policy = fh.read()
          with open(os.environ["BEFORE_POLICY_FILE"], encoding="utf-8") as fh:
              before = fh.read()
          with open(os.environ["PR_FILES_FILE"], encoding="utf-8") as fh:
              pages = json.load(fh)
          changed = [entry for page in pages for entry in page]
          path = "policy/repos.toml"
          try:
              targets = grant.parse_record_line(os.environ["ACCOUNT_BODY"])
              grant.verify_membership(policy, handle, targets)
              grant.verify_grant(before, policy, handle, targets)
              # The merged PR touched EXACTLY the policy document (nothing sits outside the proof)...
              grant.require_grant_pr_scope(int(os.environ["PR_NUMBER"]), changed, path)
              # ...and its OWN diff ADDED this handle and moved nothing else. Strategy-independent,
              # so a multi-commit rebase cannot hide an earlier commit's policy edit behind the
              # first-parent read, and a no-delta PR can never license an activation.
              records = [entry for entry in changed
                         if isinstance(entry, dict) and entry.get("filename") == path]
              if len(records) != 1:
                  raise grant.GrantError(
                      f"merged PR #{os.environ['PR_NUMBER']} carries {len(records)} diffs of {path}, "
                      "expected exactly 1 — refusing")
              # `patch_changed_lines` is the TRUNCATION oracle (#616 review round 4): `--paginate`
              # proves every file RECORD was listed, never that a record's `patch` string is that
              # file's whole diff, and GitHub truncates large patches. The API's own additions +
              # deletions for this file must equal the changed lines the patch carries.
              grant.verify_grant_patch(records[0].get("patch"), handle,
                                       grant.patch_changed_lines(records[0]))
          except grant.GrantError as exc:
              print(f"::error::refusing to activate {handle}: {exc}", file=sys.stderr)
              sys.exit(1)
          # Stated as exactly what the four proofs establish (#616 review round 4 corrected an
          # F-class overclaim here): "byte-identical to the pre-merge policy" is only true of the
          # document at the merge commit's FIRST PARENT, which under a multi-commit rebase is a
          # commit of this same PR — which is why the PR's own merge-base diff is proved separately,
          # position by position.
          print(f"{handle} confirmed granted to exactly {targets} in the merged account_pool; every "
                f"other row is byte-identical to the policy at the merge commit's first parent, and "
                f"PR #{os.environ['PR_NUMBER']}'s own complete merge-base diff touched only {path} "
                f"and added {handle} to account_pool lines while moving no other member")
          PY
          granted=$(printf '%s\n' "$body" | sed -n 's/^grant_targets:[[:space:]]*\(.*\)$/\1/p' | head -1 | tr -d '\r')
          labels=$(gh issue view "$num" -R "$REPO" --json labels --jq '[.labels[].name]|join(" ")')
          case " $labels " in
            *" status:available "*) echo "$handle (issue #$num) already status:available — nothing to do"; exit 0 ;;
            *" status:pending "*) : ;;
            *) echo "::error::issue #$num for $handle is neither pending nor available (labels: $labels) — refusing"; exit 1 ;;
          esac
          gh issue edit "$num" -R "$REPO" --remove-label status:pending --add-label status:available
          # #616 review round 2 (MINOR): this file's header claims the status:pending ->
          # status:available flip "fails the step and then PROVES the flip landed", and no
          # post-mutation read existed — the claim was true of the OTHER transitions in this
          # workflow, not of this one. It is true here now: a label write that reported success but
          # did not land must never be followed by a success notice on the issue.
          post=$(gh issue view "$num" -R "$REPO" --json labels --jq '[.labels[].name]|join(" ")')
          case " $post " in
            *" status:available "*) : ;;
            *) echo "::error::the status:available flip on issue #$num did NOT land (labels: $post) — refusing to report an activation that did not happen (fail closed)"; exit 1 ;;
          esac
          case " $post " in
            *" status:pending "*) echo "::error::issue #$num still carries status:pending after the flip (labels: $post) — the account is in an ambiguous state; refusing (fail closed)"; exit 1 ;;
          esac
          gh issue comment "$num" -R "$REPO" \
            --body "✅ Activated: \`$handle\` is now \`status:available\` for its authorized targets \`$granted\` (account_pool PR #$PR_NUMBER merged; the merged policy was re-proved against the pre-merge commit — the handle appears exactly once in each authorized row, and every other row and field is byte-identical)." || echo "::warning title=set-up-account::the activation notice failed to post — the refusal/outcome above is the authoritative record"
          # Close the linked request issue (request_issue: <n> in the account issue body).
          req=$(printf '%s\n' "$body" \
                  | sed -n 's/^request_issue:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1)
          if [ -n "$req" ]; then
            # PR #595 finding 5 audit: same disposition as the activate path above — the label flip
            # is fail-loud, the request-issue close is a courtesy whose failure leaves the issue OPEN
            # (the safe direction) and is now surfaced as a ::warning rather than swallowed.
            gh issue comment "$req" -R "$REPO" \
              --body "✅ Account **$handle** activated: added to the \`policy/repos.toml\` account_pool of \`$granted\` — and no other row (PR #$PR_NUMBER merged) — and flipped to \`status:available\`. Closing." \
              || echo "::warning title=set-up-account::activation notice comment failed to post on #$req"
            gh issue close "$req" -R "$REPO" \
              || echo "::warning title=set-up-account::could not close request issue #$req (it stays open — close it by hand)"
          fi
