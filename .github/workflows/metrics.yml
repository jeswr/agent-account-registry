# [FABLE-5] Throughput observability + backlog-vs-drain alerting for EVERY maintained target
# (policy/repos.toml [repos.*]: sparq-org/sparq + jeswr/agent-account-registry itself). Runs
# scripts/metrics.py on a cron: collects the maintainer's 6 asks per target (issues open / ready to
# drain / drained-last-hour, PRs open, PR open-rate, PR close-rate) plus derived net_pr_flow +
# review-lane health, APPENDS the snapshot to a bounded ring on the `ledger` data-plane branch
# (LEDGER_REF, data/metrics-history.json) so rates over time are real, evaluates the SUSTAINED
# backlog-growth-vs-drain alert rules, and upserts ONE deduped `throughput-alert` issue per
# (target, classification). CAS-publishes the current snapshot to ledger:`data/metrics.json`; the
# dashboard build copies it to `site/metrics.json` in its sole Pages artifact, and the
# `dashboard-publish` job below KICKS that build as soon as the snapshot exists so the published
# copy tracks THIS workflow's cadence instead of the sum of both (#656 follow-up). The cron offset
# still avoids same-minute ledger CAS contention with the dashboard and groom lanes; their minutes
# are DERIVED rather than restated here (#1046 — ci-latency-alert.py's `schedule_minute_map`).
name: metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '11-59/15 * * * *'

permissions: {}

concurrency:
  group: registry-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: Collect throughput metrics + evaluate backlog-vs-drain alerts
    runs-on: ubuntu-latest
    environment: dispatch-secrets  # post-#101: App secrets live ONLY in this environment
    timeout-minutes: 15
    permissions:
      actions: read       # read review-fix / worker run outcomes (review-lane + worker health)
      contents: write     # CAS-append data/metrics-history.json on the `ledger` branch
      issues: write       # upsert/close the deduped throughput-alert issue(s)
      pull-requests: read # authoritative PR lists + immutable-window event searches
    steps:
      - name: Checkout registry (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Least-privilege cross-owner READ tokens: metrics list/search + actions reads for the sparq
      # target run on an App token scoped to sparq-org/sparq (issues/PRs/actions READ only), and the
      # jeswr-owned registry reads on a jeswr-scoped App token. Both mints are best-effort
      # (continue-on-error): a missing owner token means that target is SKIPPED this tick (never
      # counted as a silent zero), not the whole run failing. The registry's own `github.token`
      # (contents:write, issues:write) does the ledger append + alert upsert.
      - name: Mint sparq-org read token (issues/PRs/actions read)
        id: token-sparq
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: sparq-org
          repositories: sparq
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: Mint jeswr read token (issues/PRs/actions read)
        id: token-jeswr
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: jeswr
          repositories: agent-account-registry
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: Assemble the per-owner read-token map
        id: token-map
        env:
          SPARQ_TOKEN: ${{ steps.token-sparq.outputs.token }}
          JESWR_TOKEN: ${{ steps.token-jeswr.outputs.token }}
        run: |
          set -euo pipefail
          [[ -z "${SPARQ_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$SPARQ_TOKEN"
          [[ -z "${JESWR_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$JESWR_TOKEN"
          python3 - <<'PY'
          import json
          import os

          tokens = {}
          if os.environ.get("SPARQ_TOKEN"):
              tokens["sparq-org"] = os.environ["SPARQ_TOKEN"]
          if os.environ.get("JESWR_TOKEN"):
              tokens["jeswr"] = os.environ["JESWR_TOKEN"]
          # Compact single-line JSON — GITHUB_OUTPUT is line-based; the tokens are masked above.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tokens={json.dumps(tokens, separators=(',', ':'))}\n")
          PY

      - name: Collect metrics, append the ledger time-series, evaluate + upsert alerts
        env:
          # Registry token: ledger append (contents:write) + alert-issue upsert (issues:write).
          REGISTRY_GH_TOKEN: ${{ github.token }}
          # Per-owner READ tokens for cross-target list/window-search/actions reads (masked above).
          TARGET_TOKENS: ${{ steps.token-map.outputs.tokens }}
          REGISTRY_REPO: ${{ github.repository }}
          MAINTAINER_HANDLE: jeswr
        run: |
          set -uo pipefail
          printf '::add-mask::%s\n' "$REGISTRY_GH_TOKEN"
          # Self-test the PURE core (metric computation, rate derivation, every alert rule, dedupe,
          # ledger CAS) before any live call — a broken collector must fail here, not mis-alert.
          python3 scripts/metrics.py --self-test
          # The ring append, dashboard-snapshot CAS, and alert upsert target the LIVE ledger branch
          # and issue tracker; a missing ledger branch fails LOUD (issue #28).
          python3 scripts/metrics.py \
            --policy-file policy/repos.toml \
            --registry-repo "$GITHUB_REPOSITORY" \
            --alert \
            --publish

  # [OPUS-5] WATCH THE WATCHER, half (a): the metrics JOB-FAILURE alert.
  #
  # MEASURED job census across the crons: dispatch.yml = {plan, secrets-guard, claim, plan-alert};
  # groom.yml = {groom, groom-alert}; metrics.yml = {metrics, dashboard-publish}. This workflow was
  # the ONLY cron in the estate with no failure alert, and it is the worst possible one to leave
  # unwatched: it is the sole evaluator of every backlog-vs-drain alert rule and the sole writer of
  # ledger:data/metrics.json. When the `metrics` job dies, the ledger keeps its last good content,
  # dashboard.yml keeps copying that content to site/metrics.json, and the published page renders a
  # complete snapshot with an EMPTY alert stack. Nothing goes red; the dashboard looks healthier
  # than it has ever looked. "No alerts" becomes indistinguishable from "the thing that raises
  # alerts stopped running" — strictly worse than having no dashboard at all.
  #
  # The dashboard keepalive does not cover this either: it re-dispatches workflows whose LAST RUN is
  # stale, and a cron that fires punctually every tick and FAILS every time is never stale.
  #
  # Keys on `needs.metrics.result` — the JOB, deliberately not the workflow rollup, which also
  # carries the alert leg itself. On failure/cancelled it upserts ONE rolling `ops-alert` issue
  # @-mentioning the maintainer through the SAME ALERT_REPO/ALERT_TOKEN routing (locked decision
  # 22c); it auto-closes on an explicit METRICS success. It downloads no artifact and reads only the
  # job RESULT, so no token, ledger content or account data reaches it.
  #
  # This half CANNOT catch a metrics job that never ran (there is no failed job to key on). That is
  # what groom.yml's `metrics-stale` job is for — deliberately in a DIFFERENT workflow on an
  # INDEPENDENT schedule, because a workflow cannot detect its own non-execution.
  metrics-alert:
    name: ALERT (hard METRICS-job failure)
    needs: [metrics]
    # Runs every tick regardless of the metrics result so a healthy tick can auto-close a prior
    # alert; scripts/metrics-alert.py keys on needs.metrics.result — close happens ONLY on an
    # explicit success (a skipped METRICS is not a recovery), and a success tick with no open alert
    # does only a bare `gh issue list`, so a green tick stays cheap and side-effect-free. WITHOUT
    # this always() GitHub implicitly success()-gates the job, and the FAILING tick — the only one
    # that matters — would skip the alert entirely. metrics-alert.py's self-test EVALUATES this
    # condition over every metrics-job outcome, so deleting or inverting it goes red in the gate.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): this job reads ALERT_TOKEN/ALERT_REPO (the private-alert
    # routing secrets), so — like the `metrics` job above and groom.yml's `groom-alert` — it is
    # bound to the default-branch-only `dispatch-secrets` environment where those secrets live. It
    # only ever runs from the default branch (schedule/workflow_dispatch), so the branch policy
    # never starves it.
    environment: dispatch-secrets
    # Repair authority is NOT admission authority: an alert responder proposes work, it never arms
    # or merges anything. Enforced here rather than by intent — no `pull-requests`, no `actions`,
    # no write beyond the one issue. metrics-alert.py's self-test pins this exact mapping.
    permissions:
      contents: read  # minimum for the sparse checkout below — the job runs a script from the repo
      issues: write   # upsert/close the rolling metrics-failure ops-alert issue
    steps:
      # Only the files the script and its self-test actually read. The two workflow YAMLs and
      # scripts/metrics.py are here because metrics-alert.py's --self-test asserts against them —
      # the job `if:`/`needs:` seam, the call sites, the permission blocks, and the cross-file
      # contract that the path this watchdog READS is the path metrics.py WRITES. Those assertions
      # fail LOUD on a missing input rather than quietly skipping, so trimming this list breaks the
      # run instead of silently disarming the checks. All four files are public; no secret material
      # is involved. Pinned, no persisted token.
      - name: Check out ONLY the watchdog's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: |
            scripts/metrics-alert.py
            scripts/metrics.py
            .github/workflows/metrics.yml
            .github/workflows/groom.yml
          sparse-checkout-cone-mode: false

      - name: Alert maintainer that the scheduled METRICS job hard-failed
        id: metrics-alert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          METRICS_RESULT: ${{ needs.metrics.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #39): scripts/metrics-alert.py routes to a
          # maintainer-set PRIVATE ALERT_REPO only when ALERT_TOKEN can write there; otherwise the
          # registry repo under the ambient token. The body carries NO account handles (it reports
          # only the metrics job RESULT + run link), so that fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/metrics-alert.py --self-test
          python3 registry/scripts/metrics-alert.py

  # [OPUS-5] PUBLISH KICK (#656 follow-up) + the pre-existing mutual keepalive, in that order.
  #
  # The snapshot the metrics job just CAS-published to ledger:data/metrics.json is NOT on the site
  # until dashboard.yml copies it into its Pages artifact. While the two ran on independent crons
  # that copy waited for the dashboard's next fire, so the published snapshot inherited BOTH
  # cadences (measured over the 7 days to 2026-07-25: p50 38.0 min / p90 53.7 min stale). This job
  # kicks the dashboard the moment the snapshot exists, which is what makes the publish path
  # CAUSAL rather than hopeful. `reason=metrics-publish` marks it as the causal leg, which the
  # dashboard's publish-decision dedupe never skips.
  #
  # Chosen over an `on: workflow_run:` trigger in dashboard.yml deliberately, on two counts. (1) A
  # workflow_run conclusion aggregates EVERY job in this workflow, so a failure in THIS job would
  # suppress the publish of a perfectly good snapshot; `needs.metrics.result` names the one job
  # whose success actually means "a new snapshot is on the ledger". (2) The dispatch POST is the
  # mechanism this repo already runs in production (the staleness fallback below, and ~46% of this
  # workflow's own runs), whereas the GitHub docs do not specify whether workflow_run fires for an
  # upstream run that was itself started by a GITHUB_TOKEN workflow_dispatch — which is exactly how
  # the keepalive mesh starts this workflow half the time.
  #
  # `needs: metrics` costs this job the metrics job's duration (~1 min) before it can fire; that is
  # the point, and dashboard's own */15 cron still covers the case where the metrics job hangs.
  #
  # When metrics did NOT publish, the pre-existing MUTUAL keepalive still applies: dashboard.yml
  # hosts the fleet's cron-keepalive job, which makes dashboard's OWN schedule a single point of
  # failure — when its cron delivery stalls (observed 2026-07-22: 44+ min overdue, published
  # metrics >1h stale), nothing kicks it. This job rides metrics' independent */15 schedule and
  # re-dispatches ONLY dashboard.yml when stale, so the two schedules cover each other; both must
  # stall simultaneously to wedge. No secrets, actions:write only.
  dashboard-publish:
    name: Kick the dashboard to publish the fresh snapshot (else revive a stale one)
    needs: metrics
    if: always()  # a FAILED metrics job must still reach the staleness keepalive below
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch dashboard.yml for the fresh snapshot, or when its last run is stale
        # `id:` so metrics.py's self-test can EXTRACT and EXECUTE this exact body against a
        # hermetic gh stub: the branch polarity here (publish-kick vs staleness fallback) is
        # invisible to `bash -n` and to actionlint.
        id: dashboard-publish
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_RESULT: ${{ needs.metrics.result }}
        run: |
          set -euo pipefail
          if [ "${METRICS_RESULT}" = success ]; then
            # A fresh snapshot is on the ledger and dashboard.yml is the only thing that can put it
            # on the site. No live-run guard here (unlike the staleness kick below): the dashboard's
            # singleton concurrency group queues this behind any live run, and its own
            # publish-decision job drops the run if another has already deployed this content — so
            # the #559 dup-dispatch storm is closed by the CONSUMER, not by guessing here.
            # `inputs[reason]=`, NOT `reason=`. Verified against an echo server: `gh api -f
            # reason=x` builds the FLAT body {"ref":...,"reason":"x"}, which the dispatch API does
            # not read as an input — the run would start with an EMPTY reason, be indistinguishable
            # from a keepalive kick, and get deduped away by the dashboard's own freshness check.
            # The causal publish would then silently never happen, which is the exact failure this
            # whole change exists to remove. gh's documented nesting syntax is `key[subkey]=value`.
            gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard.yml/dispatches" \
              -f ref=master -f 'inputs[reason]=metrics-publish'
            echo "dashboard-publish: kicked dashboard.yml for the fresh snapshot"
            exit 0
          fi
          echo "dashboard-publish: metrics job result=${METRICS_RESULT} — no new snapshot was" \
               "published; falling back to the staleness keepalive"
          now=$(date -u +%s)
          for spec in dashboard.yml:1500; do
            wf="${spec%%:*}"; limit="${spec##*:}"
            # LIVE-RUN GUARD (#559): a QUEUED or IN_PROGRESS dashboard run counts as FRESH —
            # kicking a live run queues a duplicate its singleton group then runs back-to-back
            # (dashboard runs probe->build->deploy and routinely outlives its created_at limit),
            # feeding exactly the #559 dup-dispatch storm. Same rule as the orchestrator's local
            # keepalive bridge: skip on any live run; only then consult last-run age. Fail-open:
            # an unreadable live check falls through to the age check.
            live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=30" \
                   --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo "")
            if [ -n "$live" ] && [ "$live" -gt 0 ]; then
              echo "keepalive: ${wf} has ${live} queued/in-progress run(s) — live, skipping kick"
              continue
            fi
            last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=1" \
                   --jq '.workflow_runs[0].created_at // empty' || true)
            prev=0
            [ -n "$last" ] && prev=$(date -u -d "$last" +%s)
            age=$(( now - prev ))
            if [ "$age" -gt "$limit" ]; then
              echo "keepalive: ${wf} last ran ${age}s ago (limit ${limit}s) — dispatching"
              gh api -X POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/dispatches" -f ref=master
            else
              echo "keepalive: ${wf} fresh (${age}s <= ${limit}s)"
            fi
          done
