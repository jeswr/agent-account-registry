# [GPT-5.6] REG-4 privilege-separated dispatcher. PLAN executes protected public-target planner
# code with no secrets in its environment; CLAIM treats the PLAN artifact as hostile data before
# any mutation.
#
# The */10 cron below is the SINGLE scheduler for the issue drain AND the cross-provider
# review/fix loop: every review -> fix -> re-review -> arm transition is a durable-marker state
# the sweep re-derives each tick, so the loop's LIVENESS depends on this cron. It was enabled
# after the REG-4 pilot canary passed end-to-end (issues #2407–#2416 flowed through workers;
# PRs #2417–#2421 merged). "Retry next tick" is real only while this schedule stays on.
name: dispatch

on:
  # workflow_dispatch is REQUIRED — it is the worker/review doorbell (see the workflow_run note
  # below and the `doorbell` jobs in worker.yml / review-fix.yml). It ALSO accepts an arbitrary
  # branch/tag ref and GitHub runs the workflow file AT that ref, so a collaborator could manually
  # dispatch a modified branch copy of this workflow. That is why every secret-bearing job here
  # (claim, plan-alert) is bound to the default-branch-only `dispatch-secrets` environment: it is
  # the only server-side lever that survives an attacker-controlled workflow file (issue #101).
  # Because that lever lives in REPO SETTINGS, the `secrets-guard` job below verifies it is
  # actually in effect every tick, fail closed, before any secret-bearing job runs.
  workflow_dispatch:
  schedule:
    # Explicit minutes (not */10): GitHub degrades wildcard schedules under load — measured
    # 2026-07-17: */10 fired at 12:06 and 12:37 then went silent for 25+ min. Explicit-minute
    # schedules are throttled less aggressively, and the off-peak offset (:03 not :00) avoids
    # the top-of-minute stampede. The cron is now the BACKSTOP; the doorbell below is the
    # primary liveness signal.
    - cron: '3,13,23,33,43,53 * * * *'
  # NOTE: this workflow_run trigger is effectively DEAD for pipeline-initiated runs — worker
  # and review-fix runs are started via the repo GITHUB_TOKEN, and GitHub suppresses
  # workflow-triggering events from GITHUB_TOKEN-initiated runs (measured 2026-07-17: zero
  # deliveries). It is kept only for manually-started worker/review runs. The REAL doorbell
  # is the explicit `doorbell` job at the end of worker.yml / review-fix.yml (workflow_dispatch
  # API calls are the documented exception to the suppression). The registry-dispatcher
  # concurrency group coalesces bursts either way.
  workflow_run:
    workflows: [worker, review-fix]
    types: [completed]

permissions: {}

concurrency:
  group: registry-dispatcher
  cancel-in-progress: false

env:
  # Public discovery manifest only. CLAIM requires this set to exactly match enabled policy rows.
  # jeswr/agent-account-registry is onboarded as a SECOND self-managed target (its own pipeline);
  # its issues flow triage -> ready -> worker -> draft PR -> cross-provider review -> arm exactly
  # like sparq. The registry App must be installed on the jeswr owner (the registry worker/review
  # canary runs reaching the model stage confirm it is); CLAIM mints a PER-OWNER token map so the
  # registry-owner disarm/needs-user/deferred-label mutations use the jeswr-scoped token, not the
  # sparq-org one (defects #1,#5 — the single-token mint 404-looped every registry mutation).
  DISPATCH_TARGET_REPOS: '["sparq-org/sparq", "jeswr/agent-account-registry"]'

jobs:
  # MINIMUM INTERVAL BETWEEN EXECUTED TICKS (issue #819). PR #787 cut the snapshot step 6.4x and
  # the tick from 15-28 min to ~7 min, which is right and is NOT being reverted — but tick DURATION
  # was the only thing bounding how often the doorbell could start one (the concurrency group
  # serialises ticks, it does not rate-limit them). Executed ticks/hour went 4-7 all day and then
  # 13 in the 18Z hour; at 18:26:17Z every authenticated read began returning HTTP 403 and the
  # whole pipeline stalled. This job is the floor that #787 should have shipped behind: an explicit
  # minimum interval between EXECUTED ticks, independent of how long a tick happens to take.
  #
  # Budget arithmetic (measured; the full derivation and the numbers it rests on are in
  # scripts/dispatch-tick-floor.py's header, and its self-test asserts the multiplication):
  #   613 requests/executed tick (instrumented, issue #721) x 6 ticks/h = ~3,678 requests/h,
  #   against 4-7 ticks/h (~2.4k-4.3k/h) that ran clean for thirteen hours and 13 ticks/h
  #   (~7,969/h) that broke. The floor therefore makes the DOORBELL STRUCTURALLY UNABLE TO EXCEED
  #   THE SCHEDULE above (`3,13,23,33,43,53` is 6/h).
  #
  # A tick that arrives inside the floor exits as a CLEAN NO-OP: `proceed=false`, exit 0, `plan`
  # and (transitively) `claim` skipped, one API request issued in total. It deliberately does not
  # SLEEP until the floor expires — a sleeping job occupies a runner and holds the
  # `registry-dispatcher` concurrency group for the whole wait, which is the waiter-starvation
  # shape ci-summary.yml documents. Releasing the group in ~30 s means the doorbell ring queued
  # behind it is served immediately.
  tick-floor:
    name: FLOOR (minimum interval between executed ticks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NO `continue-on-error`, at the job or the step level: it discards exactly the exit status
    # that would report a broken floor, and a step can never red its own neutering. The absence is
    # asserted statically by scripts/dispatch-tick-floor.py's self-test, which also asserts the
    # `if:`/`needs:`/outputs wiring below — the seam where every uncaught mutant in this estate has
    # lived.
    permissions:
      actions: read    # LIST the `dispatch-tick` marker artifacts (the executed-tick anchor)
      contents: read   # the sparse checkout below
    outputs:
      proceed: ${{ steps.floor.outputs.proceed }}
    steps:
      - name: Check out ONLY the floor's inputs (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          # KEEP IN SYNC — REQUIRED_FILES in scripts/dispatch-tick-floor.py is asserted against
          # this very block, so a trimmed checkout goes RED instead of making the YAML-seam
          # assertions silently unreachable on the live path.
          sparse-checkout: |
            scripts/dispatch-tick-floor.py
            .github/workflows/dispatch.yml
          sparse-checkout-cone-mode: false

      # The floor's static workflow-shape assertions PARSE the workflow YAML rather than
      # pattern-match it (regex-over-YAML is how five permissive misparses got into the guard).
      # Probe first so the runner image's own PyYAML is used when present and this job keeps zero
      # network dependency on PyPI; the install path is version + sha256 locked to the identical
      # pins pr-gate and the secrets guard use.
      - name: Ensure PyYAML for the floor's workflow-parse assertions
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML already present; no install needed"
            exit 0
          fi
          cat > "$RUNNER_TEMP/floor-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/floor-requirements.txt"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Decide whether this tick may execute
        id: floor
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 registry/scripts/dispatch-tick-floor.py --self-test
          python3 registry/scripts/dispatch-tick-floor.py

      # The anchor the NEXT tick's floor reads. Written here, inside the floor job, BEFORE `plan`
      # can start — so a tick that dies in the snapshot (the #819 outage shape) still counts as
      # executed and still holds the floor. Deriving the anchor from run conclusions instead cannot
      # work: a no-op tick concludes `success` exactly like a real one.
      - name: Record that this tick is EXECUTING
        if: ${{ steps.floor.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/dispatch-tick.txt"

      - name: Upload the executed-tick marker (pinned)
        if: ${{ steps.floor.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-tick
          path: ${{ runner.temp }}/dispatch-tick.txt
          if-no-files-found: error
          retention-days: 1

  plan:
    name: PLAN (unprivileged, secret-free target half)
    needs: [tick-floor]
    # The #819 rate floor. BOTH halves are load-bearing and each defeats a different mutation: the
    # `needs:` edge makes this job WAIT for the anchor to be written, and the `if:` makes it OBEY
    # the decision. Cutting either one restores the unbounded-doorbell shape that exhausted the
    # request budget, so scripts/dispatch-tick-floor.py's self-test evaluates this expression in
    # both directions against a modelled `needs` context — including the empty-string case a
    # deleted output would produce.
    if: ${{ needs.tick-floor.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents:read exists ONLY for (a) the snapshot-helper registry checkout + the authenticated
    # snapshot step it feeds, both of which run BEFORE any target code executes (the token lives
    # in the snapshot step's own env), and (b) the registry checkout in the assemble step, which
    # runs AFTER every target-planner-code step has finished. The hostile target code itself
    # never sees a token (its steps have no token env and persist-credentials is off), and no
    # registry code that runs AFTER target code reads a tree that existed while it ran (the
    # assemble step uses its own later checkout, so the early snapshot copy is tamper-inert).
    permissions:
      contents: read
      # [#1207] READ-ONLY, and only so the snapshot step can LIST + DOWNLOAD the previous tick's
      # `dispatch-etags` artifact through the API instead of via an extracting restore action.
      # It grants no write of any kind, and the token still lives ONLY in the snapshot step's own
      # env — the hostile target planner steps below hold no token and cannot use this.
      actions: read
    steps:
      - name: Resolve the public target manifest
        env:
          TARGET_REPOS: ${{ env.DISPATCH_TARGET_REPOS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dispatch-targets"
          python3 - "$RUNNER_TEMP/dispatch-targets/repos.txt" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          targets = json.loads(os.environ["TARGET_REPOS"])
          if (not isinstance(targets, list) or not targets
                  or len(set(targets)) != len(targets)
                  or any(not isinstance(repo, str) or not re.fullmatch(
                      r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", repo
                  ) for repo in targets)):
              raise SystemExit("public target manifest must be a non-empty unique owner/repo list")
          Path(sys.argv[1]).write_text("\n".join(targets) + "\n", encoding="utf-8")
          PY

      # Registry snapshot-helper checkout — BEFORE the snapshot step (and every target-code
      # step) so the authenticated read runs REGISTRY code with a real self-test
      # (plan-snapshot.py, extracted from the old heredoc after run 29617040167's whole-sweep
      # kill). REG-4 note: this copy is consumed ONLY by the snapshot step below, which
      # precedes all target-code execution; the assemble step keeps its OWN later checkout, so
      # target planner code can never influence registry code that runs after it.
      - name: Checkout registry snapshot helper (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry-snapshot
          persist-credentials: false

      # AUTHENTICATED, registry-inline snapshot — runs BEFORE any target code executes, so the
      # token (repo-scoped github.token, read-only against the public targets) never coexists
      # with hostile target planner code; the planner step below consumes only the local JSON
      # files this writes. Authenticated reads remove the 60/hr shared-runner-IP unauthenticated
      # ceiling. plan-snapshot.py scopes every per-PR failure to the ITEM (an oversized
      # check-run listing skips THAT PR with a recorded reason instead of failing the sweep —
      # the run-29617040167 fix) and reads check runs gate-filtered (check_name=gate, the
      # d2c0dd0 pattern) so merge-queue churn heads with hundreds of runs stay one small page.
      # [sparq#4819 round 2] `id:` so scripts/dispatch-plan.py --self-test can LOCATE this step and
      # refuse the ways it can stop producing while every assertion downstream stays green. The
      # readiness (consumer) seam has been pinned since #4329; this PRODUCER seam was not, and the
      # round-1 review measured four survivors here — the step disabled with `if: false`, its
      # failure swallowed by `continue-on-error:`, its invocation neutralised with `|| true`, and
      # the output file renamed. Each degrades to the fail-safe every-PR-reserves path WITH a
      # warning, so none of them is a correctness hole; all four are silent throughput loss, which
      # is the same class as the defect this whole change closes.
      - name: Snapshot target issues and pull requests (authenticated, registry-inline only)
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ETAG_STORE: ${{ runner.temp }}/etag-store/etags.json
          REGISTRY_REPO: ${{ github.repository }}
          # The branch whose artifacts this run will READ a store from — always the branch this
          # run is itself on, which for every legitimate trigger (schedule, workflow_run, the
          # doorbell) is the default branch. `github.ref_name` is used rather than
          # `github.event.repository.default_branch` because the latter is absent from a
          # `schedule` payload, and an empty value here silently disables the mechanism on
          # exactly the scheduled ticks. Provenance is enforced in plan-snapshot.py: a store
          # produced by a run on any OTHER branch is never read.
          REGISTRY_STORE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 registry-snapshot/scripts/plan-snapshot.py --self-test
          python3 registry-snapshot/scripts/plan-snapshot.py \
            "$RUNNER_TEMP/dispatch-targets/repos.txt" "$RUNNER_TEMP"

      # PUBLISH BEFORE ANY TARGET CODE RUNS. The next step is still registry code and the clone
      # step after it is the first thing that executes anything from a target repo, so the store
      # this tick publishes is one no target code was ever in a position to shape.
      #
      # An UPLOAD, deliberately — never a cache/artifact RESTORE action. Those extract a tarball
      # (`@actions/toolkit` uses `tar -xf ... -P`, i.e. --absolute-names), which is an arbitrary
      # file write, and it would land in this very job before the `github.token`-bearing snapshot
      # step. Uploading writes nothing locally, and the READ side is plan-snapshot.py pulling the
      # previous artifact through the API into memory. Adversarial review of PR #1218.
      #
      # No `if:` and no `continue-on-error:`: a failed snapshot fails the job and never reaches
      # this step, which is correct (only a COMPLETED sweep publishes a store), and
      # scripts/dispatch-plan.py's self-test refuses both spellings at this seam.
      - name: Publish the ETag store for the next tick (pinned, pre-target)
        id: etag-save
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-etags
          path: ${{ runner.temp }}/etag-store/etags.json
          # `warn`, NOT `error`. This is an OPTIMISATION, and it must never be able to kill the
          # tick it optimises: a disk-full runner that could not write the store would otherwise
          # fail PLAN and dispatch nothing. The opposite trap — the store silently stopping and
          # the mechanism degrading to 0% with everything green — is covered on two independent
          # channels instead: plan-snapshot.py emits an explicit `::warning::` when the write
          # fails, and its per-tick "SNAPSHOT conditional reads: N of M ... billable" line reports
          # the realised hit rate, which goes to zero on the very next tick.
          if-no-files-found: warn
          # One tick is 10 minutes; a day is ample, and it bounds what accumulates.
          retention-days: 1

      # Extract the policy-controlled trusted-bot allowlist (issue #111) from the registry policy
      # using REGISTRY code, BEFORE any target planner code runs (the clone/self-test step below is
      # the first to execute target code). The hostile planner step consumes only this pure-data
      # JSON — it never reads the policy itself. CLAIM re-derives the SAME allowlist authoritatively
      # (exact App-bot login + policy trusted_bots) before any launch; PLAN's use of this map is
      # purely ADVISORY — it can admit extra non-"[bot]" logins the policy names, while unlisted
      # "[bot]" authors stay an over-proposal for CLAIM's exact check to settle (PLAN holds no
      # token, so it can never resolve the pipeline's own App bot login itself).
      - name: Extract the policy trusted-bot allowlist (registry code, pre-target)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/dispatch-targets/repos.txt" \
                    registry-snapshot/policy/repos.toml \
                    "$RUNNER_TEMP/trusted-bots.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          import tomllib

          repos_path, policy_path, out_path = sys.argv[1:]
          repos = Path(repos_path).read_text(encoding="utf-8").splitlines()
          with open(policy_path, "rb") as handle:
              policy = tomllib.load(handle)
          rows = policy.get("repos")
          if not isinstance(rows, dict):
              raise SystemExit("registry policy has no repos table")
          allowlist = {}
          for repo in repos:
              if not repo:
                  continue
              row = rows.get(repo, {})
              bots = row.get("trusted_bots", []) if isinstance(row, dict) else []
              if (not isinstance(bots, list)
                      or any(not isinstance(bot, str) or not bot.strip() for bot in bots)):
                  raise SystemExit(f"trusted_bots for {repo} must be a list of non-empty strings")
              allowlist[repo] = sorted(set(bots))
          Path(out_path).write_text(json.dumps(allowlist), encoding="utf-8")
          PY

      - name: Clone protected public targets without credentials
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r repo; do
            target="$RUNNER_TEMP/dispatch-targets/$index"
            git clone --depth 1 "https://github.com/$repo.git" "$target"
            [[ -f "$target/scripts/ready-issues.py" && ! -L "$target/scripts/ready-issues.py" ]]
            [[ -f "$target/scripts/dispatch-plan.py" && ! -L "$target/scripts/dispatch-plan.py" ]]
            python3 "$target/scripts/ready-issues.py" --self-test
            python3 "$target/scripts/dispatch-plan.py" --self-test
            index=$((index + 1))
          done < "$RUNNER_TEMP/dispatch-targets/repos.txt"

      - name: Build ready + deferred issue rows and snapshot pull requests (target planner code)
        # `id:` so dispatch-plan.py's self-test can locate this step and EXECUTE the roleless-report
        # block below (#597 review round 2): its two `if` conditions are workflow python that no
        # test ran, so flipping either one restored silent invisibility with every assertion green.
        id: readiness
        env:
          TARGET_ROOT: ${{ runner.temp }}/dispatch-targets
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/dispatch-targets/repos.txt" "$RUNNER_TEMP" <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          repos_path, out_dir = sys.argv[1:]
          root = Path(os.environ["TARGET_ROOT"])
          repos = Path(repos_path).read_text(encoding="utf-8").splitlines()
          trusted_associations = {"OWNER", "MEMBER", "COLLABORATOR"}
          # Policy-controlled per-repo trusted-bot allowlist (issue #111), extracted from the
          # registry policy by a registry-code step that ran BEFORE any target planner code — so
          # this is pure registry data, never influenced by the target repo being planned.
          trusted_bots_map = json.loads(
              Path(out_dir, "trusted-bots.json").read_text(encoding="utf-8"))

          def snapshot(kind, index):
              # Written by the authenticated registry-inline snapshot step (this step deliberately
              # holds NO token because it executes target planner code — REG-4 separation).
              document = json.loads(
                  Path(out_dir, f"raw-{kind}-{index}.json").read_text(encoding="utf-8"))
              if not isinstance(document, dict) or document.get("complete") is not True \
                      or not isinstance(document.get("items"), list):
                  raise SystemExit(f"target {kind} snapshot is missing or incomplete")
              return document["items"]

          def load_dispatch(path):
              spec = importlib.util.spec_from_file_location("target_dispatch_plan", path)
              if spec is None or spec.loader is None:
                  raise SystemExit("cannot load target dispatch-plan.py")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          def label_names(issue):
              labels = issue.get("labels")
              if not isinstance(labels, list):
                  raise SystemExit("target issue labels are malformed")
              names = []
              for label in labels:
                  name = label.get("name") if isinstance(label, dict) else None
                  if not isinstance(name, str) or not name:
                      raise SystemExit("target issue carries a malformed label")
                  names.append(name)
              return sorted(set(names))

          def trusted(issue, trusted_bots):
              # Advisory, fail-closed author filter (registry issue #111). Collaborator
              # associations (OWNER/MEMBER/COLLABORATOR) and EXACT `trusted_bots` members pass;
              # any other "[bot]"-suffixed login is kept as an ADVISORY over-proposal because
              # PLAN is the unprivileged, hostile-data half (see file header) and cannot resolve
              # the pipeline's own App bot login (no token) — dropping unlisted bots here would
              # silently strand the App's own issues whenever the policy names ANY additional
              # bot. CLAIM is the authority: it re-derives trust EXACTLY against the resolved
              # App bot login + policy allowlist before any worker launches, so the suffix pass
              # only over-proposes rows CLAIM then rejects — it never fails OPEN. Malformed
              # shapes (non-dict issue or nested user in the untrusted snapshot) DENY the item
              # instead of raising: an exception here aborts planning for EVERY repository.
              if not isinstance(issue, dict):
                  return False
              user = issue.get("user")
              author = user.get("login") if isinstance(user, dict) else None
              if not isinstance(author, str):
                  return False
              association = str(issue.get("author_association", "")).upper()
              if association in trusted_associations:
                  return True
              return author in trusted_bots or author.endswith("[bot]")

          def linked_issue_numbers(pulls, repo):
              # Fork PRs must NEVER suppress an issue (registry issue #110). Only a same-repo
              # `sparq-agent/issue-N-*` head is pipeline-owned provenance (a fork PR's head lives
              # on the fork, so its branch text is attacker-controlled); a trusted collaborator's
              # closing keyword is admitted after an explicit author-association check. PLAN is
              # advisory — CLAIM's _linked_open_pr_issues re-derives the SAME gate authoritatively
              # before any launch, so PLAN can only over-suppress rows CLAIM then re-admits.
              linked = set()
              for pull in pulls:
                  if not isinstance(pull, dict):
                      raise SystemExit("target pull-request entry is malformed")
                  head = pull.get("head") or {}
                  ref = head.get("ref", "")
                  body = pull.get("body") or ""
                  if not isinstance(ref, str) or not isinstance(body, str):
                      raise SystemExit("target pull-request fields are malformed")
                  head_repo = (head.get("repo") or {}).get("full_name")
                  association = str(pull.get("author_association", "")).upper()
                  app_pr = (head_repo == repo
                            and re.match(r"^sparq-agent/issue-[1-9][0-9]*-", ref) is not None)
                  if app_pr:
                      linked.update(int(number) for number in re.findall(
                          r"(?:^|/)issue-([1-9][0-9]*)-", ref
                      ))
                  if app_pr or association in trusted_associations:
                      linked.update(int(number) for number in re.findall(
                          r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([1-9][0-9]*)\b", body
                      ))
              return linked

          repositories = []
          for index, repo in enumerate(repos):
              target = root / str(index)
              repo_trusted_bots = set(trusted_bots_map.get(repo, []))
              dispatch = load_dispatch(target / "scripts" / "dispatch-plan.py")
              # `/issues?state=open` returns PR rows too. `raw` stays the ISSUE half — the
              # blocker-union block below, `details`, `roleless_ready` and the deferred lane are
              # all issue-shaped and must not change. The PR half is kept separately and folded
              # into OCCUPANCY only (issue #768).
              snapshot_rows = [issue for issue in snapshot("issues", index)
                               if isinstance(issue, dict)]
              raw = [issue for issue in snapshot_rows if "pull_request" not in issue]
              pr_rows = [issue for issue in snapshot_rows if "pull_request" in issue]
              # NATIVE GitHub dependency edges, UNIONED with the legacy `Blocked-by: #NN` body
              # markers. Until this landed, THIS LINE was the whole of the dispatcher's notion of
              # "blocked": a regex over the issue BODY. GitHub issue dependencies are generally
              # available and the maintainer uses the native UI, so a dependency added that way
              # had ZERO effect on dispatch (sparq issue #4329). MEASURED 2026-07-26 over all
              # 1368 open sparq issues (cursor-paginated, len == GraphQL totalCount): 112 issues
              # carry a native edge (170 edges), and of the 427 issues created since 2026-07-20,
              # 0 carry a native edge and 1 carries a marker — the marker channel is effectively
              # dead for new work while the native channel is the one being written.
              #
              # UNION, never replace: 3 open sparq issues (#2833/#2975/#3817) carry a marker with
              # no native edge. The fail-safe direction is one-way — the readiness engine keys on
              # `open_blockers > 0`, so MISSING an edge dispatches an issue that is genuinely
              # blocked, while OVER-counting one only delays it.
              #
              # `issue_dependencies_summary` rides along in the REST list payload the snapshot
              # step already writes, so this costs ZERO extra requests. Its `blocked_by` counts
              # only OPEN blockers (`total_blocked_by` counts closed ones too) — MEASURED against
              # GraphQL `blockedBy` filtered to state=OPEN over all 1368 open issues: identical
              # sets AND identical per-issue counts, with 16 issues showing
              # total_blocked_by > blocked_by. So a CLOSED blocker never holds its child.
              #
              # >>> blocker-union — EXECUTED by scripts/dispatch-plan.py --self-test. The block is
              # the SCHEDULED path; a pure-python assertion elsewhere cannot see it, and every
              # uncaught mutant in this repo's history has lived at the YAML seam. Removing either
              # sentinel makes that extraction FAIL CLOSED. Keep the block self-contained: `raw`,
              # `repo`, `label_names` and `re` are its only inputs; it produces `open_numbers`,
              # `readiness_input` and `details`.
              open_numbers = {
                  issue.get("number") for issue in raw
                  if isinstance(issue.get("number"), int)
              }

              def native_open_blockers(issue, repo):
                  # ABSENT summary -> 0 (this snapshot carries no native-dependency data, so only
                  # the marker channel can speak). PRESENT-but-malformed -> 1 unknown blocker:
                  # reading an uninterpretable schema as "zero blockers" is the fail-OPEN
                  # direction, so the issue is HELD, loudly, until a human looks.
                  summary = issue.get("issue_dependencies_summary")
                  if summary is None:
                      return 0
                  number = issue.get("number")
                  if not isinstance(summary, dict):
                      print(f"::warning::{repo}#{number}: issue_dependencies_summary is not an "
                            "object — holding the issue (fail-closed)")
                      return 1
                  value = summary.get("blocked_by")
                  if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                      print(f"::warning::{repo}#{number}: issue_dependencies_summary.blocked_by "
                            f"is {value!r}, not a non-negative int — holding the issue "
                            "(fail-closed)")
                      return 1
                  return value

              details = {}
              readiness_input = []
              for issue in raw:
                  number = issue.get("number")
                  body = issue.get("body") or ""
                  if (not isinstance(number, int) or number <= 0 or not isinstance(body, str)):
                      raise SystemExit("target issue fields are malformed")
                  labels = label_names(issue)
                  blockers = re.findall(r"[Bb]locked-by:\s*#([0-9]+)", body)
                  marker_open = sum(int(blocker) in open_numbers for blocker in blockers)
                  readiness_input.append({
                      "number": number,
                      "state": "OPEN",
                      "labels": labels,
                      # `max` IS the union for the only decision made from this number: the engine
                      # holds the issue iff native > 0 or marker_open > 0, i.e. iff max > 0. It is
                      # a lower bound on the cardinality of the union of the two blocker SETS (the
                      # native channel reports a count, not numbers), which can only understate a
                      # delay — never flip a held issue to ready. MEASURED: 0 of 1368 open issues
                      # have the two channels disagreeing on the count.
                      "open_blockers": max(native_open_blockers(issue, repo), marker_open),
                  })
                  details[number] = (issue, labels, body)
              # The GUARD against the native channel going DARK unnoticed: an absent summary reads
              # as 0, which is indistinguishable from "GitHub renamed the field" unless somebody
              # checks. MEASURED: present on 1368/1368 open sparq ISSUES (and 0/104 PR rows, which
              # `raw` already excludes), so "no row carries it" is a schema regression. Printed on
              # EVERY tick including the healthy one — a check that is silent when it passes is a
              # check nobody notices has stopped running.
              if raw and not any(
                      isinstance(issue.get("issue_dependencies_summary"), dict) for issue in raw):
                  print(f"::warning::{repo}: NATIVE BLOCKER CHANNEL IS DARK — none of {len(raw)} "
                        "open issues carries `issue_dependencies_summary`. Native GitHub "
                        "dependencies are being IGNORED and only `Blocked-by: #NN` body markers "
                        "can hold an issue: a maintainer's native dependency edits have no "
                        "effect on dispatch until this is fixed.")
              else:
                  print(f"{repo}: native blocker channel: LIT "
                        f"({sum(1 for row in readiness_input if row['open_blockers'])} of "
                        f"{len(readiness_input)} open issue(s) held by a blocker)")
              # <<< blocker-union

              pulls = snapshot("pulls", index)
              linked = linked_issue_numbers(pulls, repo)
              # [#768] EXECUTED end-to-end by scripts/dispatch-plan.py --self-test, which
              # extracts this STEP'S WHOLE python heredoc and runs it over a synthetic
              # two-target fixture. No `>>> ... <<<` sentinels here on purpose: nothing
              # extracts this range on its own, and a marker implying a guard it does not
              # have is the vacuity class this repo already tracks.
              # PLAN reserved the ISSUE half of every unit of work and never the PR half: the PR
              # rows were filtered out of the readiness input above, so `compute_ready` saw an
              # `area:` free whenever the only thing holding it was an open PR. MEASURED on the
              # live sparq snapshot: the issue half alone holds 39 partition keys, the union with
              # the PR half holds 48, and 7 of PLAN's 9 frontier rows landed in one of the 9 keys
              # only a PR held. CLAIM's busy_packages_of_pulls dropped those 7 afterwards, so they
              # were never double-dispatched — but it dropped them AFTER compute_ready had
              # committed the frontier, and a selected row that is removed later frees its package
              # with NO backfill (issue #113's shape, one layer up). Widening PLAN's occupancy can
              # only ADD holds, never release one, so it cannot fail open.
              #
              # NOT unconditional. `dispatch.yml` plans EVERY target with that target's OWN
              # readiness engine, and a PR row is only safe input to an engine that understands
              # one. sparq's `compute_ready` reserves a PR's declared areas and `ready_candidates`
              # skips any row carrying `pull_request`; the registry's own planner (this repo, the
              # second target) does NEITHER — handed a PR row it would treat it as a dispatch
              # CANDIDATE and launch an impl worker against a pull-request number, and reserve
              # `__global__` for each of the 34 area-less open PRs, taking its own frontier to 0.
              # So the capability is PROBED BY EXECUTION against the loaded planner, never sniffed
              # from a version or an attribute, and a planner that fails the probe keeps exactly
              # today's behaviour and says so loudly. Fail-closed: a probe that raises is a
              # planner we cannot characterise, so it gets no PR rows.
              def pr_row_aware(planner):
                  """Can `planner.compute_ready` be handed PR rows? Two OBLIGATIONS, both run.

                  1. SAFETY — a PR row is never selected as a dispatch candidate. An engine that
                     returns it would have PLAN emit a plan row whose `number` is a PR. Checked
                     with an area-DECLARING and an area-LESS PR row, for the reason below.
                  2. EFFECT — a PR row actually reserves the `area:` keys it declares, so an
                     otherwise-ready issue on that key is held. An engine that ignores PR rows
                     would make this whole block an expensive no-op, which must not pass silently.

                  [#786] SAFETY was FAIL-OPEN with only the area-declaring row. Once an engine
                  reserves a PR's declared areas (obligation 2), the probe PR SHIELDS ITSELF: it
                  reserves `__pr_probe__` in the occupancy pass and is then dropped by its own
                  reservation in the selection pass, so `alone` is empty whether or not the engine
                  has a `pull_request` candidate guard at all. MEASURED against this repository's
                  own engine with the guard deleted and nothing else changed: `alone == []`,
                  `paired == []`, probe verdict ACCEPT — and the same engine plans an AREA-LESS PR
                  row as an issue (`compute_ready([bare]) == [999000003]`). That is not a corner:
                  40 of 40 open PRs on this repository declare no `area:` at all, so the shielded
                  row is the one shape the population never has. The area-less row reserves
                  nothing, so nothing can shield it, and it isolates the candidate guard alone.
                  """
                  probe = ["status:ready", "priority:P0", "role:impl", "area:__pr_probe__"]
                  pr = {"number": 999000001, "state": "OPEN", "labels": list(probe),
                        "open_blockers": 0, "pull_request": {}}
                  rival = {"number": 999000002, "state": "OPEN", "labels": list(probe),
                           "open_blockers": 0}
                  bare = {"number": 999000003, "state": "OPEN", "open_blockers": 0,
                          "labels": ["status:ready", "priority:P0", "role:impl"],
                          "pull_request": {}}
                  try:
                      alone = [row.get("number") for row in planner.compute_ready([pr])]
                      bare_alone = [row.get("number") for row in planner.compute_ready([bare])]
                      paired = [row.get("number") for row in planner.compute_ready([pr, rival])]
                  except Exception as exc:                        # noqa: BLE001 — hostile target
                      return False, f"probe raised {type(exc).__name__}"
                  if alone or bare_alone or 999000001 in paired:
                      return False, "planner DISPATCHES a pull-request row as if it were an issue"
                  if paired:
                      return False, "planner does not RESERVE a pull request's declared area"
                  return True, "reserves PR areas and never dispatches a PR row"

              # [sparq#4819] NO `>>> ... <<<` SENTINELS HERE, ON PURPOSE: nothing extracts this
              # range on its own, and a marker implying a guard it does not have is the vacuity
              # class this repository already tracks. What covers this block is stronger — the
              # WHOLE step heredoc is extracted and EXECUTED by scripts/dispatch-plan.py
              # --self-test (`_run_readiness`), so the CALL SITE below is under test too, which
              # is where every uncaught mutant in this repo's history has lived.
              # THE TWO PARTITION LEGS DISAGREED ABOUT THE SAME PR. CLAIM's
              # `busy_packages_of_pulls` frees a machine-parked (`review:parked`) PR's crates when
              # `_pull_inactivity_decision` proves it a defused draft, and says so every tick
              # (`claim-revalidation free: crate X freed via parked pr#N` — MEASURED 142 events
              # over 57 crates in ONE tick). But THIS leg runs FIRST and COMMITS the frontier, and
              # `occupancy_input` carried only {number,state,labels,open_blockers,pull_request} —
              # no `draft`, no `auto_merge` — so the predicate could not be evaluated where the
              # decision was made. PLAN reserved exactly the crates CLAIM was about to free. The
              # registry's carve-out was live, loud, and DEAD.
              #
              # WHAT IT IS WORTH, AND WHAT THAT NUMBER IS NOT. A round-1 comment here read
              # "frontier 1 -> 9 with the attestation carried" and claimed a verbatim replay as
              # its source. That measured the LEVER — this consumer against a planner that
              # already honoured the field — not the state either PR shipped: sparq's
              # `dispatch-plan.py` did not export `INERT_FIELD`, so a verbatim replay of the
              # merged trees printed `NOT STAMPED (planner declares no inertness contract)` and
              # released nothing. The re-export landed in sparq#4823 round 2; the figure below is
              # a replay of THAT pair. It is a per-tick yield, not a property of this code —
              # releasing a key only moves the frontier when some candidate was waiting on
              # exactly that key, so it swings with the board and a repeat run will differ.
              #
              # MEASURED by replaying this step verbatim (2026-07-28, live sparq snapshot: 1721
              # issue rows / 91 open PRs / 33 `review:parked`, sparq's own engine, this repo's
              # `inertness_attestation` as producer). What is RELEASED is structural and
              # reproduced on every board it was run against: 33 of 33 parked PRs attested inert;
              # PR-held `area:` keys 40 -> 25, 15 fully released with NO key losing a holder that
              # is not itself an attested machine park; `docs` 34 -> 25 and `ci` 30 -> 27 stay
              # held, as the union rule requires; candidates unchanged.
              #
              # NO FRONTIER DELTA IS PINNED HERE, and the omission is deliberate. An earlier
              # revision of this comment hard-coded one; three verbatim replays of this step over
              # the same week returned +7, +2 and +3 while agreeing on the release semantics every
              # time. The spread IS the finding — a released key moves the frontier only if some
              # candidate happened to be waiting on exactly that key — so any single figure here
              # is stale by the next tick and misleads the next reader. For a CURRENT number read
              # the censuses this step already prints every tick:
              #   `parked-release census <repo>: stamped|NOT STAMPED (...); N of M attested inert;
              #    K machine-parked row(s) release their areas: ...`
              #   `partition census <repo>: candidates= frontier= partition-deferred= ...`
              #
              # NOT a second predicate — an ANSWER. `raw-inertness-<i>.json` is written by the
              # AUTHENTICATED registry-inline snapshot step (plan-snapshot.py), which runs before
              # ANY target code executes (REG-4), from the registry's OWN
              # `_pull_inactivity_decision` over the same listing+detail pair CLAIM reads. This
              # step, which is the hostile half, only reads the boolean. Two implementations of
              # "would parking this PR really free its crates?" is the drift that caused the
              # defect; a third would make it worse.
              #
              # FAIL-CLOSED AT EVERY SEAM, AND THE LIST IS EXHAUSTIVE. Missing file, UNREADABLE OR
              # TRUNCATED file, incomplete document, non-dict items, non-decimal key, non-True
              # value, PR absent from the map -> False -> the row keeps its areas, i.e. exactly
              # today's behaviour. Round 2 made the truncated case match these words: it used to
              # raise out of `json.loads` and kill the step for every target. And the field is
              # stamped ONLY on a planner that PROVES it consumes it correctly in BOTH directions
              # (`inert_aware`, probed by execution against the loaded engine — never sniffed from
              # an attribute, the `pr_row_aware` doctrine). A target that has not shipped the
              # consumer is byte-identical to today and says so out loud, with an ANNOTATION.
              #
              # WHAT FAIL-CLOSED DOES *NOT* MEAN HERE. It does not mean the map is unforgeable.
              # The target's `dispatch-plan.py` is `exec_module`d ~250 lines above, BEFORE this
              # read, in this job, on this filesystem — a hostile target can rewrite
              # `raw-inertness-<i>.json` at import time (demonstrated: `0 of 1` -> `2999 of
              # 2999`). PLAN is the unprivileged advisory half by construction; CLAIM re-derives
              # `_pull_inactivity_decision` over its own authenticated read before any launch, so
              # a forged map can only over-propose rows CLAIM then drops. Same fail-direction as
              # the trust and linked-PR filters below.
              inert_map = {}
              inert_path = Path(out_dir, f"raw-inertness-{index}.json")
              if not inert_path.is_file():
                  print(f"::warning::{repo}: no inertness attestation "
                        f"(raw-inertness-{index}.json absent) — every open PR reserves its areas, "
                        "including provably-inert machine-parked drafts CLAIM will free later "
                        "this tick. PLAN and CLAIM will disagree (sparq#4819).")
              else:
                  # UNREADABLE/TRUNCATED DEGRADES, it does not abort. Round-2 review: the words
                  # above claim every seam degrades to today's behaviour, but a truncated or
                  # empty document raised out of `json.loads` and killed the step for EVERY
                  # target repo. `raw-issues-*.json` DOES hard-fail that way and is right to —
                  # a partial issue listing plans the wrong frontier. This document is different
                  # in kind: it is an OPTIONAL enhancement whose ABSENT case already degrades two
                  # lines up, so hard-failing on truncation made "absent" and "half-written" —
                  # the same accident, one fsync apart — behave oppositely. The words and the
                  # behaviour now agree, and the direction is the conservative one: every PR
                  # reserves its areas, exactly as before sparq#4819.
                  try:
                      inert_doc = json.loads(inert_path.read_text(encoding="utf-8"))
                  except (ValueError, OSError, UnicodeDecodeError) as exc:
                      inert_doc = None
                      print(f"::warning::{repo}: inertness attestation is unreadable "
                            f"({type(exc).__name__}) — falling back to every-PR-reserves "
                            "(fail closed, sparq#4819).")
                  if (isinstance(inert_doc, dict) and inert_doc.get("complete") is True
                          and isinstance(inert_doc.get("items"), dict)):
                      # `isdecimal`, NOT `isdigit`. Round-2 review found a real crash: `isdigit()`
                      # admits Unicode digit-but-not-decimal characters — "²" (SUPERSCRIPT
                      # TWO) and every other superscript/circled digit answer True — and `int()`
                      # then raises ValueError out of the comprehension, killing the readiness
                      # step for EVERY target repo. The key is a JSON object key, i.e. attacker-
                      # reachable in any hostile-producer story, and one such key was a total
                      # PLAN outage rather than a dropped row. `isdecimal()` is exactly the set
                      # `int()` accepts, so the guard and the conversion now agree.
                      inert_map = {int(number): value is True
                                   for number, value in inert_doc["items"].items()
                                   if str(number).isdecimal()}
                  elif inert_doc is not None:
                      print(f"::warning::{repo}: inertness attestation is malformed or "
                            "incomplete — falling back to "
                            "every-PR-reserves (fail closed, sparq#4819).")

              def inert_aware(planner):
                  """Does `planner` release a machine-parked area on an ATTESTED row and HOLD it
                  otherwise? Both directions, PROBED BY EXECUTION against the loaded engine.

                  An attribute sniff would pass for a planner that merely declares the constants;
                  what must be true is the BEHAVIOUR, and only the second probe can see it. The
                  refusal direction is checked first and is the one that matters: an engine that
                  frees a machine park with NO attestation is the unconditional-release fix
                  sparq#4819 explicitly forbids, and it must not be handed attestations that make
                  it look sanctioned. Fail-closed: anything unprovable returns (None, why) and the
                  field is not stamped at all, leaving today's behaviour exactly."""
                  field = getattr(planner, "INERT_FIELD", None)
                  label = getattr(planner, "MACHINE_PARK_PR_LABEL", None)
                  if not isinstance(field, str) or not isinstance(label, str):
                      return None, "planner declares no inertness contract"
                  area = "area:__inert_probe__"
                  rival = {"number": 999000012, "state": "OPEN", "open_blockers": 0,
                           "labels": ["status:ready", "priority:P0", "role:impl", area]}
                  holder = {"number": 999000011, "state": "OPEN", "open_blockers": 0,
                            "pull_request": {}, "labels": [area, label]}
                  try:
                      held = [row.get("number") for row in planner.compute_ready(
                          [dict(holder), dict(rival)])]
                      freed = [row.get("number") for row in planner.compute_ready(
                          [dict(holder, **{field: True}), dict(rival)])]
                  except Exception as exc:                        # noqa: BLE001 — hostile target
                      return None, f"probe raised {type(exc).__name__}"
                  if held:
                      return None, ("planner RELEASES a machine-parked area with no attestation "
                                    "— refusing to feed it attestations")
                  if freed != [999000012]:
                      return None, "planner ignores the inertness attestation"
                  return field, (f"releases an attested machine park via `{field}` and holds an "
                                 "unattested one")

              occupancy_input = []
              pr_aware, pr_aware_why = pr_row_aware(dispatch)
              inert_field, inert_why = inert_aware(dispatch)
              if inert_field is None:
                  # THE ANNOTATION ASYMMETRY THAT HID THE FIRST ROUND'S NO-OP. Both `::warning::`
                  # annotations above cover the FILE seams — attestation absent, attestation
                  # malformed. This one, the PLANNER seam, was a plain `print` buried mid-line in
                  # the census. It is also the ONLY degradation that fired: the producer wrote a
                  # complete document, every parked PR attested, and the target's dispatch-plan.py
                  # did not export the two names, so the whole answer was computed and DISCARDED
                  # with no annotation anywhere in the run. Round 1 shipped as a measured no-op
                  # underneath a green run for exactly this reason.
                  #
                  # ALWAYS annotated when it fires, including when nothing attested inert this
                  # tick: a degradation that only announces itself on ticks that had something to
                  # lose is invisible on precisely the ticks where the loss is being established.
                  # The counts ride along so the magnitude is readable without a second query.
                  print(f"::warning::{repo}: PLAN computed an inertness attestation "
                        f"({sum(1 for value in inert_map.values() if value)} of "
                        f"{len(inert_map)} open PR(s) provably inert) and DISCARDED it — "
                        f"{inert_why}. Machine-parked areas stay reserved here while CLAIM frees "
                        "them later this tick, so PLAN and CLAIM disagree (sparq#4819).")
              if pr_aware:
                  for pull in pr_rows:
                      pr_number = pull.get("number")
                      if not isinstance(pr_number, int) or pr_number <= 0:
                          raise SystemExit("target pull-request row is malformed")
                      row = {
                          "number": pr_number,
                          "state": "OPEN",
                          "labels": label_names(pull),
                          "open_blockers": 0,
                          "pull_request": {},
                      }
                      if inert_field is not None:
                          # `inert_map`'s values were normalised to real booleans with `is True`
                          # where the document was parsed; a second `is True` here would be a
                          # redundant guard no mutant can kill, i.e. a guard that looks like
                          # protection and is not. One normalisation point, tested at that point.
                          row[inert_field] = inert_map.get(pr_number, False)
                      occupancy_input.append(row)
                  print(f"{repo}: PLAN occupancy carries {len(occupancy_input)} open pull-request "
                        f"row(s) — {pr_aware_why}")
                  # ALWAYS printed, INCLUDING at zero and including when the field is not stamped:
                  # a carve-out that silently stops firing is indistinguishable from one that has
                  # nothing to free, and this repository has already paid for that twice
                  # (#753/#762). Names every released crate so the throughput/conflict trade
                  # sparq#4819 accepts is auditable per tick rather than argued about.
                  released = sorted(
                      (row["number"], sorted(lb[5:] for lb in row["labels"]
                                             if lb.startswith("area:")))
                      for row in occupancy_input
                      if inert_field is not None and row.get(inert_field) is True
                      and getattr(dispatch, "MACHINE_PARK_PR_LABEL", None) in row["labels"])
                  detail = ", ".join(f"pr#{number}:{'+'.join(areas) or '<none>'}"
                                     for number, areas in released) or "none"
                  print(f"parked-release census {repo}: "
                        f"{'stamped' if inert_field else 'NOT STAMPED'} "
                        f"({inert_why}); {sum(1 for value in inert_map.values() if value)} of "
                        f"{len(inert_map)} open PR(s) attested inert; "
                        f"{len(released)} machine-parked row(s) release their areas: {detail}")
              else:
                  print(f"::warning::{repo}: target readiness engine is NOT pull-request-aware "
                        f"({pr_aware_why}) — PLAN reserves the ISSUE half of every unit of work "
                        f"and never the PR half, so its frontier may offer rows CLAIM will drop "
                        f"with no backfill. {len(pr_rows)} open PR row(s) were NOT reserved.")
              # Apply the trust + linked-PR exclusions BEFORE the frontier is selected (issue #113:
              # post-frontier filters leave dispatchable holes). compute_ready commits to a
              # conflict-free, priority-ordered frontier, so a candidate removed AFTER selection
              # frees its package with NO backfill — one filtered high-priority or global row then
              # suppresses an otherwise-dispatchable lower-priority sibling on that package for the
              # whole tick. Filter the candidate set first, then run the frontier ONCE over the
              # survivors — the same shape the deferred branch below already uses. In-progress rows
              # are KEPT as inputs: compute_ready never selects them (they are busy), but they must
              # still RESERVE their package in its taken-seeding, so dropping an in-progress row
              # that is itself linked/untrusted would free a busy crate and fail OPEN into a
              # double-dispatch. PLAN stays advisory — CLAIM re-derives trust + linkage exactly.
              # `occupancy_input` (the PR half, #768) is prepended for the SAME reason the
              # in-progress rows are kept: it is pure occupancy the engine reserves and never
              # selects. It is deliberately NOT subjected to the trust/linked filters — those
              # decide whether a CANDIDATE may be dispatched, and applying them to an occupant
              # would free a crate an untrusted author's open PR is really holding.
              ready_input = occupancy_input + [
                  row for row in readiness_input
                  if "status:in-progress" in row["labels"]
                  or "status:in-progress-review" in row["labels"]
                  or (row["number"] not in linked
                      and trusted(details[row["number"]][0], repo_trusted_bots))
              ]
              ready = dispatch.compute_ready(ready_input)
              # >>> partition-census — EXECUTED by scripts/dispatch-plan.py --self-test.
              # THE LARGEST REFUSAL IN THIS DISPATCHER HAD NO CENSUS ROW. `compute_ready` admits
              # ONE unit per `area:` package, so it silently discards most of the drainable
              # backlog every tick. MEASURED 2026-07-28 against live sparq-org/sparq (473
              # status:ready issues, 94 open PRs, sparq's own planner + real workspace roots):
              # 452 candidates -> frontier 7. That is 445 refusals per tick, and NOTHING named
              # them: the per-lane summary (#108) starts at `planned`, which is already the
              # post-frontier number, and CLAIM's histogram only ever sees rows that survived.
              # So the fleet-capacity question kept being answered with account arithmetic while
              # the real limiter was invisible — the same missing-edge class as #700/#708, one
              # stage further upstream. Every other cap here names itself every tick; this one
              # now does too, ZERO INCLUDED, so a quiet tick is distinguishable from an
              # uninstrumented one. Derived from the planner's OWN candidate set so the
              # denominator can never drift from the frontier it explains. `log` is stubbed
              # because the candidate walk already printed its per-issue attributions when
              # `compute_ready` ran — re-printing them would double the readiness noise. Costs
              # ZERO additional GitHub API requests: it re-walks the in-memory snapshot only.
              # Its only inputs are `dispatch`, `ready_input`, `ready` and `repo`.
              candidates_fn = getattr(dispatch, "ready_candidates", None)
              if candidates_fn is None:
                  print(f"::warning::{repo}: target planner has no ready_candidates() — "
                        "partition attrition is UNMEASURABLE on this target")
              else:
                  _cands = candidates_fn(ready_input, log=lambda *a, **k: None)
                  _selected = {row.get("number") for row in ready}
                  _contended = {}
                  for _entry in _cands:
                      if _entry[2].get("number") in _selected:
                          continue
                      for _pkg in _entry[3]:
                          _contended[_pkg] = _contended.get(_pkg, 0) + 1
                  _ranked = sorted(_contended.items(), key=lambda kv: (-kv[1], kv[0]))[:8]
                  _top = ", ".join(f"{_k}={_v}" for _k, _v in _ranked) or "none"
                  print(f"partition census {repo}: candidates={len(_cands)} "
                        f"frontier={len(ready)} "
                        f"partition-deferred={max(0, len(_cands) - len(ready))} "
                        f"top-contended: {_top}")
              # <<< partition-census
              # Issue #225: a `status:ready` issue carrying NO role:* label is dropped by the
              # readiness engine (has_role) BEFORE any plan row exists — it shows up in no plan,
              # no diagnostic, and never drains. 117 accumulated before a human noticed. Report
              # the count on EVERY tick, printed even when zero (the same always-printed shape as
              # the review-enumeration exclusion line at PLAN completion below), over the FULL
              # readiness_input so the number is the honest backlog, not the post-trust subset.
              # Advisory only: PLAN never guesses a role (fail-closed) and the plan document is
              # unchanged. A target whose planner predates roleless_ready says so out loud rather
              # than reporting a fabricated zero.
              # >>> roleless-report — EXECUTED by scripts/dispatch-plan.py --self-test. #597 review
              # round 2 (MAJOR): the four assertions on this block were whole-file substring
              # searches, so `if roleless_fn is None:` -> `is not None:` (every target then reports
              # "planner has no roleless_ready()" and enumeration never runs) and `if roleless:` ->
              # `if not roleless:` (reports zero precisely when invisible issues exist) BOTH left
              # the assertion tuple green while fully restoring the bug this PR exists to prevent.
              # These sentinels delimit the block the self-test extracts and runs against a stub
              # planner; removing either one makes that extraction FAIL CLOSED. Keep the block
              # self-contained: `dispatch`, `readiness_input` and `repo` are its only inputs.
              roleless_fn = getattr(dispatch, "roleless_ready", None)
              if roleless_fn is None:
                  print(f"::warning::{repo}: target planner has no roleless_ready() — "
                        "ready-but-roleless issues are NOT counted for this target")
              else:
                  roleless = roleless_fn(readiness_input)
                  if roleless:
                      shown = ", ".join(f"#{number}" for number in roleless[:20])
                      more = f" (+{len(roleless) - 20} more)" if len(roleless) > 20 else ""
                      print(f"::warning::{repo}: {len(roleless)} status:ready issue(s) carry no "
                            f"role:* label and are INVISIBLE to dispatch: {shown}{more}")
                  else:
                      print(f"{repo}: ready-but-roleless issues: 0")
              # <<< roleless-report
              # Deferred-retry candidates (registry decision: a status:deferred issue with no
              # live lease and no linked open PR is retryable). The ready-engine gate is reused
              # by SWAPPING deferred->ready only for readiness computation; the emitted item
              # keeps the REAL labels plus deferred=true, and CLAIM re-validates + flips the
              # label on dispatch. The live-lease filter runs registry-side in the next step.
              taken = set()
              for issue in ready:
                  taken |= dispatch.packages_of(dispatch.labels_of(issue))
              # status:parked (the machine-owned capacity park, park_policy.py) is DELIBERATELY
              # absent here: the deferred-retry lane IS the park's readmission hook — CLAIM
              # re-gates every other label live and its `retry` flip strips status:parked
              # exactly when the allocator proves capacity exists.
              # >>> deferred-retry-filter — EXECUTED by scripts/dispatch-claim.py --self-test.
              # [registry #764] The `needs:*` clause below is not merely a hold: it is the LANE
              # EXIT the absorbing-park retirement uses. `absorbing_park_leg` retires a stuck
              # item by applying the question-class `needs:user`, and THIS line is what turns
              # that label into a released `area:` partition — compute_ready serializes one row
              # per package, so a retired item that stayed in `deferred_input` would keep
              # starving its siblings exactly as before. Deleting the clause silently restores
              # the whole defect while every unit test on the leg stays green, so the block is
              # extracted between these sentinels and RUN against fixtures; removing either
              # sentinel makes that extraction FAIL CLOSED. Its only inputs are
              # `readiness_input`, `linked`, `details`, `trusted` and `repo_trusted_bots`.
              #
              # [registry #1054] THE OWNERSHIP GAP. This filter used to read
              #     if "status:deferred" not in labels or "status:ready" in labels: continue
              # — skipping any deferred row that also carried `status:ready`, on the premise that
              # the ORDINARY ready lane owned it. That premise is false, and provably so in the
              # ONE state where the clause can fire: reaching it requires `status:deferred`, and
              # `status:deferred` is in `ready-issues.BUSY_STATUS`, so `compute_ready` refuses the
              # very same row (`readiness defer #N: busy: status:deferred`). The clause therefore
              # never once prevented a double-selection — by construction no row can be in both
              # `ready` and this candidate set — and its only reachable effect was to make the
              # ready+deferred pair invisible to BOTH lanes at once, each excluding it in the
              # belief that the other held it. MEASURED on the live registry board 2026-07-28:
              # 30 of 32 `status:ready` issues carried the pair, clean ready frontier = 0.
              # The pair's WRITER is closed separately in scripts/triage.py (the classifier was
              # re-stamping `status:ready` onto issues the dispatcher had just deferred); this
              # half makes the deadlock non-recurrent for any pair a HUMAN writes — the maintainer
              # did exactly that to 6 of the 30, and today that gesture achieves nothing at all.
              # The swap below is idempotent when `status:ready` is already present (set union),
              # so an admitted pair is handed to the engine in the same shape as a lone deferred
              # row. This does NOT relax the busy set: `status:deferred` still means busy to the
              # ready lane, and every other gate on this row is re-derived live by CLAIM.
              retry_gated = {"status:blocked", "status:in-progress",
                             "status:in-progress-review", "status:untriaged", "trust:untrusted"}
              deferred_input = []
              for row in readiness_input:
                  labels = set(row["labels"])
                  number = row["number"]
                  if "status:deferred" not in labels:
                      continue
                  if labels & retry_gated or any(l.startswith("needs:") for l in labels):
                      continue
                  if number in linked or not trusted(details[number][0], repo_trusted_bots):
                      continue
                  deferred_input.append({
                      **row,
                      "labels": sorted((labels - {"status:deferred"}) | {"status:ready"}),
                  })
              # <<< deferred-retry-filter
              # [#768] EXECUTED end-to-end by the same whole-heredoc harness.
              # The deferred lane used to be handed `deferred_input` ALONE. `deferred_input` is
              # filtered to `status:deferred` rows and `retry_gated` excludes both in-progress
              # labels, so by construction it contained NO occupant at all — the only occupancy
              # the lane ever saw was `in_progress_packages=taken`, which is the packages of the
              # rows the READY lane just selected. Every in-flight issue and every open PR was
              # therefore FREE in this lane. MEASURED on the live sparq snapshot: 12 of the 17
              # deferred rows PLAN emitted land in a key an open occupant already holds, and 2 of
              # them (#2951 on `workspace`, #4423 on `sparq-zk-compose`) are held ONLY by an
              # in-progress ISSUE — which CLAIM's `busy_packages_of_pulls` cannot see at all,
              # because it enumerates `sparq-agent/*` PR heads and neither key has one. Those two
              # are not "burned at CLAIM with no backfill"; they are launched, putting a second
              # worker on a partition an in-progress issue owns. That is the UNDER-SERIALISED,
              # silently-corrupting direction, so this lane gets the same occupancy the ready lane
              # gets: the PR half (when the planner is PR-aware) and the in-flight issue half,
              # which the engine reserves and never selects.
              in_flight_input = [
                  row for row in readiness_input
                  if "status:in-progress" in row["labels"]
                  or "status:in-progress-review" in row["labels"]
              ]
              deferred_ready = dispatch.compute_ready(
                  occupancy_input + in_flight_input + deferred_input,
                  in_progress_packages=taken)
              # [sparq#4819] Same no-sentinel rule as the attestation block above: the whole
              # heredoc is executed by `_run_readiness`, so this line is asserted on its real
              # output rather than pattern-matched. The READY lane has named its partition attrition every tick since the
              # `partition census` line above landed; this lane, which runs the SAME
              # one-unit-per-package selection over its own candidate set AND inherits the ready
              # lane's `taken` keys on top, printed NOTHING. So "the retry lane offered 2 rows"
              # was indistinguishable from "the retry lane had 2 candidates" and from "the retry
              # lane is broken", and no amount of reading the log could tell them apart. Same
              # shape as the ready census deliberately — same field names, always printed,
              # ZERO INCLUDED — so the two lanes are comparable line-for-line. Costs no API
              # requests: `deferred_input` and `deferred_ready` are already in memory. Its only
              # inputs are `deferred_input`, `deferred_ready`, `taken`, `dispatch` and `repo`.
              _def_selected = {row.get("number") for row in deferred_ready}
              _def_contended = {}
              for _row in deferred_input:
                  if _row.get("number") in _def_selected:
                      continue
                  for _pkg in dispatch.packages_of(dispatch.labels_of(_row)):
                      _def_contended[_pkg] = _def_contended.get(_pkg, 0) + 1
              _def_top = ", ".join(
                  f"{_k}={_v}" for _k, _v in
                  sorted(_def_contended.items(), key=lambda kv: (-kv[1], kv[0]))[:8]) or "none"
              print(f"deferred census {repo}: candidates={len(deferred_input)} "
                    f"frontier={len(deferred_ready)} "
                    f"partition-deferred={max(0, len(deferred_input) - len(deferred_ready))} "
                    f"ready-lane-keys-held={len(taken)} top-contended: {_def_top}")

              routing_doc = dispatch._routing_doc()
              flagged_rows = [(row, False) for row in dispatch.plan_dispatch(ready, routing_doc)]
              flagged_rows += [(row, True)
                               for row in dispatch.plan_dispatch(deferred_ready, routing_doc)]
              items = []
              for row, deferred in flagged_rows:
                  number = row.get("number")
                  issue, labels, body = details[number]
                  user = issue.get("user")
                  author = user.get("login") if isinstance(user, dict) else None
                  if row.get("role") is None or row.get("agent") is None or not row.get("model_chain"):
                      raise SystemExit(f"target planner left {repo}#{number} unresolved")
                  items.append({
                      **row,
                      "labels": labels,
                      "author": author,
                      "body_sha": hashlib.sha256(body.encode()).hexdigest(),
                      "deferred": deferred,
                  })
              items.sort(key=lambda item: (item["priority"], item["number"]))
              target_sha = subprocess.run(
                  ["git", "-C", str(target), "rev-parse", "HEAD"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.strip()
              if not re.fullmatch(r"[0-9a-f]{40}", target_sha):
                  raise SystemExit("target checkout returned an unsafe commit sha")
              repositories.append({"target_repo": repo, "target_sha": target_sha, "items": items})

              # Field-selected PR snapshot + issue-label map for the registry-side review
              # enumeration in the assemble step (avoids a second API sweep there).
              # NB: named pr_snapshot, NOT `snapshot` — that would shadow the snapshot() reader
              # and make the SECOND target's iteration call a list (the exact two-target
              # TypeError that broke the first multi-target sweep, 2026-07-17).
              pr_snapshot = []
              for pull in pulls:
                  head = pull.get("head") or {}
                  user = pull.get("user") or {}
                  pr_snapshot.append({
                      "number": pull.get("number"),
                      "state": pull.get("state"),
                      "draft": pull.get("draft"),
                      # #509/#516: the parked-free coherence gate reads the latch signal; the
                      # snapshot must carry it for plan-time freeing to ever fire. ABSENCE != NULL
                      # (round-6): an upstream row without the key stays keyless here — a plain
                      # .get() would fabricate a "proven unlatched" null from an absent field.
                      **({"auto_merge": pull["auto_merge"]} if "auto_merge" in pull else {}),
                      "body": pull.get("body") or "",
                      "labels": [label.get("name") for label in (pull.get("labels") or [])
                                 if isinstance(label, dict)],
                      "head": {"ref": head.get("ref"), "sha": head.get("sha"),
                               "repo": {"full_name": (head.get("repo") or {}).get("full_name")}},
                      "user": {"login": user.get("login"), "type": user.get("type")},
                  })
              Path(out_dir, f"pulls-{index}.json").write_text(
                  json.dumps(pr_snapshot), encoding="utf-8")
              Path(out_dir, f"issue-labels-{index}.json").write_text(
                  json.dumps({str(number): details[number][1] for number in details}),
                  encoding="utf-8")

          Path(out_dir, "issue-plan.json").write_text(
              json.dumps({"repositories": repositories}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          print(f"PLAN rows: {sum(len(repo['items']) for repo in repositories)} issue item(s)")
          PY

      # The registry is checked out only NOW — after every step that executes target planner code
      # — so hostile target code can never read the registry tree, and no token ever coexists
      # with it in a step environment.
      - name: Checkout registry helpers (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # The mutable data plane (data/leases.json) lives on the unprotected `ledger` branch
      # (issue #28): a master checkout no longer carries fresh lease state. This checkout fails
      # the job LOUDLY if the ledger branch is missing — never plan against a silently-empty
      # lease view.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry-ledger
          ref: ledger
          persist-credentials: false

      # Validate paths, object types, and modes against the canonical data-only allowlist.
      - name: Ledger checkout is data-only (trust guard)
        run: python3 registry/scripts/ledger-invariant.py registry-ledger

      - name: Assemble and validate the v2 plan (registry code only, no tokens, local data)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/plan.json" <<'PY'
          from collections import Counter
          import importlib.util
          import json
          from pathlib import Path
          import re
          import sys
          import time
          from datetime import datetime, timezone

          out_dir, plan_path = sys.argv[1:]
          registry = Path("registry")

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f"cannot load registry helper {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          claim_mod = load("registry_dispatch_claim", registry / "scripts" / "dispatch-claim.py")
          # [OPUS-5 #657] Registry-owned policy, read from the MASTER checkout. `_policy_row`
          # inside review_enrolment_authors validates the whole row, so a malformed or
          # non-canonical review_enrolment_authors list HARD-FAILS this step rather than
          # silently resolving to "nobody is enrolled" — a fail-closed default that is
          # indistinguishable from a typo is exactly how an enrolment silently never happens.
          policy_mod = load("registry_policy_resolve", registry / "scripts" / "policy-resolve.py")
          import tomllib
          with open(registry / "policy" / "repos.toml", "rb") as handle:
              policy_doc = tomllib.load(handle)

          intermediate = json.loads(Path(out_dir, "issue-plan.json").read_text(encoding="utf-8"))
          # Lease state comes from the data-plane `ledger` branch checkout (issue #28) — the
          # master copy under registry/data/ is a frozen tombstone. Fail LOUD if absent: a
          # silently-empty lease view would double-book every account.
          leases_path = Path("registry-ledger") / "data" / "leases.json"
          if not leases_path.is_file():
              raise SystemExit(
                  "ledger-branch checkout is missing data/leases.json — the `ledger` data-plane "
                  "branch is required (issue #28; see data/README.md on master)")
          leases = json.loads(leases_path.read_text(encoding="utf-8")).get("leases") or []
          now = int(time.time())

          review_items = []
          disarm_items = []
          # [#657 enable] DETECTION-ONLY, and deliberately NOT part of `document`. The disarm lane
          # selects candidates on the worker producer shape plus registry #570's exact-App author
          # gate, so it cannot see the enrolled orchestrator class at all — and admitting that
          # class there would waive #570 on a dequeue/redraft/relabel WRITE path, which is an
          # authority escalation rather than a shape widening. So the #42 invariant is OBSERVED for
          # that class instead: these rows are printed and never planned, so nothing downstream
          # (CLAIM's `_apply_disarm_items` above all) can act on them. Keeping them OUT of the plan
          # artifact is the structural half of "detection only" — a field CLAIM cannot read is a
          # field CLAIM cannot act on.
          disarm_observations = []
          snapshot_skips = []
          # [registry #677] Per-repo starvation evidence for the CLAIM-side self-healing sweep:
          # how many READY issue rows the busy partition dropped behind a `__global__` occupant.
          # CLAIM cannot recompute this — the plan carries only the SURVIVORS, so without it
          # "planned == 0" cannot be told apart from "the backlog is empty", and the sweep must
          # never park a holder on an empty backlog.
          partition_starvation = []
          review_exclusions = Counter()
          # [registry #762] The PR-side population census. `review_exclusions` is SIGNALLED-only
          # (it counts a PR that carries a review-loop label), so an UNLABELLED worker draft
          # sitting in the drafted-already-reviewed fall-through left no trace at all — which is
          # half of why the ci-fix lane being structurally unreachable on sparq read as ten days
          # of healthy ticks. This Counter partitions EVERY PR reaching that decision into one
          # disjoint claim_mod.IDLE_CENSUS_BUCKETS entry, with every bucket emitted at zero, so a
          # lane going to zero is a VISIBLE number rather than an absence. Kept separate from
          # review_exclusions on purpose: the two have different denominators and summing them
          # would produce a total that means nothing.
          review_census = Counter()
          for index, repository in enumerate(intermediate["repositories"]):
              repo = repository["target_repo"]
              owner, name = repo.split("/", 1)
              pulls = json.loads(Path(out_dir, f"pulls-{index}.json").read_text(encoding="utf-8"))
              # Per-PR CI/merge status from the authenticated snapshot, interpreted by the PURE
              # dispatch-claim helpers (hostile-tolerant: malformed records degrade to unknown,
              # and unknown never emits a repair/disarm item).
              pr_status = {}
              raw_skips = []
              status_path = Path(out_dir, f"raw-prstatus-{index}.json")
              if status_path.is_file():
                  raw_status = json.loads(status_path.read_text(encoding="utf-8"))
                  if (isinstance(raw_status, dict) and raw_status.get("complete") is True
                          and isinstance(raw_status.get("items"), dict)):
                      pr_status = {
                          int(number): claim_mod.pr_ci_status(record)
                          for number, record in raw_status["items"].items()
                          if str(number).isdigit()
                      }
                      if isinstance(raw_status.get("skips"), list):
                          raw_skips = raw_status["skips"]
              # PLAN-side per-item snapshot skips (run 29617040167): a PR whose CI/merge
              # snapshot was oversized/unreadable carries a reason instead of killing the
              # sweep. Two tiers (PR #60 round-1): a pre-detail skip has NO pr_status
              # record (every snapshot-derived admission stands down); a check-runs-* skip
              # ships a DEGRADED record too — pr_ci_status forces gate=missing on it, so
              # the gate-dependent admissions (ci-fix, stranded) stand down while the
              # detail-derived ones (needs-rebase, the #42 disarm net) still evaluate.
              # CLAIM folds these rows into the dispatch summary.
              for skip in raw_skips:
                  if not isinstance(skip, dict):
                      continue
                  skip_number = skip.get("pr_number")
                  skip_reason = skip.get("reason")
                  if not isinstance(skip_number, int) or not isinstance(skip_reason, str):
                      continue
                  print(f"SNAPSHOT skip {repo}#{skip_number}: {skip_reason}")
                  snapshot_skips.append(
                      {"repo": repo, "pr_number": skip_number, "reason": skip_reason})
              issue_labels = {
                  int(number): labels for number, labels in json.loads(
                      Path(out_dir, f"issue-labels-{index}.json").read_text(encoding="utf-8")
                  ).items()
              }
              # Registry-recorded provenance is the ROOT OF TRUST: a PR with no record here is
              # never enumerated for review (fail closed). The target model has no registry token.
              # Records live on the `ledger` data-plane branch (issue #96 — master's required
              # `gate` check rejects every direct contents-API PUT, so post-outage records land
              # ONLY there); the master-checkout copies remain the legacy fallback for
              # pre-outage records (<= sparq#2542). Iterated legacy-first so a ledger record
              # for the same PR wins any collision.
              provenance = {}
              pattern = re.compile(rf"{re.escape(owner)}--{re.escape(name)}--pr([1-9][0-9]*)\.json")
              for provenance_dir in (registry / "orchestration" / "provenance",
                                     Path("registry-ledger") / "orchestration" / "provenance"):
                  if not provenance_dir.is_dir():
                      continue
                  for record_path in sorted(provenance_dir.iterdir()):
                      match = pattern.fullmatch(record_path.name)
                      if not match:
                          continue
                      try:
                          provenance[int(match.group(1))] = json.loads(
                              record_path.read_text(encoding="utf-8"))
                      except (OSError, json.JSONDecodeError):
                          continue
              # Human-owned holds (review:needs-user / needs:user on the PR, needs:* on the
              # source issue) are excluded inside the enumerator, as are label-terminal states.
              # The MACHINE-owned status:parked on a source issue is deliberately NOT excluded
              # (park_policy.py): it is a soft hold on NEW implementation dispatch only — an
              # existing PR keeps flowing through review/fix. Round-budget exhaustion is NOT
              # excluded here either: CLAIM re-derives the live round count and applies the
              # terminal transition itself, so a PR whose final outcome mutation crashed
              # converges loudly. `review_exclusions` collects every SIGNALLED
              # (review:changes / review:needs / review:parked, plus issue #464's CONFLICTING
              # base — a DIRTY PR signals on its own, whatever its labels) exclusion reason for
              # the one aggregate line at
              # PLAN completion (park-policy defect 3: "0 review item(s)" can never again
              # coexist silently with signalled worker PRs).
              # [OPUS-5 #657] The MASTER-protected half of orchestrator-PR admission. Read from
              # the `registry` checkout (master), NEVER from the `registry-ledger`
              # checkout: provenance records live on ledger precisely because master's required
              # gate rejects direct PUTs, so the record half is a low-authority per-PR gesture
              # and this list is the reviewed half that bounds which logins it can ever name.
              # Reading it from ledger would collapse both halves onto one authority and make
              # the pair pointless. Absent/empty => enrolment OFF => the shape gates stand.
              enrolled_authors = policy_mod.review_enrolment_authors(repo, policy_doc)
              review_items.extend(claim_mod.enumerate_review_items(
                  repo, pulls, provenance, leases, issue_labels, now, pr_status=pr_status,
                  exclusions=review_exclusions, enrolled_authors=enrolled_authors,
                  census=review_census))
              # Armed-SHA-mismatch safety invariant (issue #42): CLAIM disarms these FIRST each
              # sweep, re-deriving every precondition live (matching SHAs are never disarmed).
              disarm_items.extend(claim_mod.enumerate_disarm_items(
                  repo, pulls, pr_status, provenance))
              # ...and the SAME invariant over the class that enumerator cannot see, as an
              # OBSERVATION. Same `enrolled_authors` the review enumerator just used, so the
              # observed population is exactly the admitted one.
              disarm_observations.extend(claim_mod.enumerate_disarm_observations(
                  repo, pulls, pr_status, provenance, enrolled_authors))
              # Deferred-retry items with a still-live lease are dropped registry-side, then the
              # busy-area union over ALL open worker PRs (issue #27) keeps impl items out of any
              # crate with an in-flight review-loop PR. The busy partition reads the SAME
              # provenance linkage and the SAME per-PR arm state as the enumerator above
              # (round-2 P1/P2, coherent-detail-confirmed since round 4): the original
              # provably-inert DRAFT carve-out is unchanged. Issue #509 composes an additional
              # terminal-label reason, but PR-backed occupancy frees only when the NEWER
              # pr_status detail record (the pulls listing predates the per-PR reads) exists,
              # matches the listing head, says armed exactly False, and the raw row exposes no
              # auto_merge dict. Missing/head-mismatched/armed detail stays BUSY, as does a live
              # unparked PR; labels on the stale listing alone never free. Terminal issue-only
              # leases and orphan claims are safe to omit. A PR with missing/divergent linkage
              # still reserves fail-closed. CLAIM re-proves each item's crate
              # against the LIVE pull listing again right before launch (dispatch-claim.py
              # revalidate_items_against_live_pulls closes the PLAN->CLAIM window).
              # [round-5 P1] `leases`/`now` feed the CROSS-LANE lease partition: any live
              # sibling lease (impl `<repo>#<issue>`, `review:`/`fix:`) on an item's package
              # defers it — the lanes share ONE crate-ownership view (the same ledger the
              # enumerator's superseded-until-sibling-resolves exclusion reads).
              # [registry #677] `starvation` is filled BY the filter, at the branch that makes
              # each drop decision — never recounted afterwards from a different view.
              starvation = {}
              # [registry #758] The assemble leg is where the frontier actually dies, and it had
              # no counter: `frontier_size` downstream is assigned the POST-filter count, so the
              # whole loss sat between "the frontier was wide" and "nothing was planned". The
              # per-reason / per-HELD-AREA census is filled BY the filter, at the branch that makes
              # each drop decision — never re-derived here from the surviving rows, which cannot
              # see which reservation ate the others.
              partition_census = {}
              rows_before_assemble = len(repository["items"])
              repository["items"] = claim_mod.filter_busy_area_items(
                  claim_mod.filter_deferred_items(repository["items"], repo, leases, now),
                  repo, pulls, issue_labels, provenance, pr_status, leases, now,
                  starvation=starvation, census=partition_census)
              # BRACE-FREE by construction: GitHub's secret masker rewrites `{`/`}` to `***` in log
              # output, so a JSON dump of this census would arrive corrupted. Flat key=value only.
              print("assemble-census " + " ".join(
                  [repo, "rows_before=" + str(rows_before_assemble),
                   "deferred=" + str(partition_census.get("total", 0)),
                   "kept=" + str(partition_census.get("kept", 0))]
                  + ["reason." + reason + "=" + str(count) for reason, count
                     in sorted((partition_census.get("by_reason") or {}).items())]
                  + ["area." + area + "=" + str(count) for area, count
                     in sorted((partition_census.get("by_held_area") or {}).items())]
                  + ["holder.pr" + holder + "=" + str(count) for holder, count
                     in sorted((partition_census.get("by_holder") or {}).items())]))
              # Recorded ONLY for a genuinely starved lane: nothing survived AND rows were dropped
              # behind the serializing partition. A healthy or empty lane records nothing, so the
              # sweep on the CLAIM side has no starvation to act on at all.
              if starvation.get("kept") == 0 and starvation.get("deferred", 0) > 0:
                  print(f"PARTITION STARVATION {repo}: 0 issue item(s) planned behind "
                        f"{starvation['deferred']} row(s) deferred by a __global__ occupant")
                  partition_starvation.append(
                      {"repo": repo, "deferred": starvation["deferred"]})

          snapshot_skips.sort(key=lambda skip: (skip["repo"], skip["pr_number"]))
          document = {
              "schema": "registry-dispatch-plan/v5",
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repositories": intermediate["repositories"],
              "review_items": review_items,
              "disarm_items": disarm_items,
              "snapshot_skips": snapshot_skips,
              "partition_starvation": partition_starvation,
          }
          # GLOBAL (repo, pr_number) order via the SHARED, self-tested helper (sol r2 on
          # #233): per-repo policy-order assembly inverts lexicographically with a second
          # active target; the sort must be the exact code the self-test exercises.
          claim_mod.normalize_plan_order(document)
          # PLAN-side inline set-equality checks (CLAIM repeats a stricter independent
          # re-validation of the artifact as hostile data before any mutation).
          if set(document) != {"schema", "generated_at", "repositories", "review_items",
                               "disarm_items", "snapshot_skips", "partition_starvation"}:
              raise SystemExit("plan schema top-level fields are invalid")
          if document["schema"] != "registry-dispatch-plan/v5":
              raise SystemExit("plan schema version is invalid")
          expected_item_fields = {"number", "priority", "package", "role", "model_chain",
                                  "agent", "escalate", "labels", "author", "body_sha", "deferred"}
          for repository in document["repositories"]:
              if set(repository) != {"target_repo", "target_sha", "items"}:
                  raise SystemExit("plan repository fields are invalid")
              for item in repository["items"]:
                  if set(item) != expected_item_fields:
                      raise SystemExit("plan item fields are invalid")
          # [OPUS-5 #657] This set is a hand-maintained REPLICA of dispatch-claim.REVIEW_ITEM_FIELDS
          # and it silently drifted the moment the enumerator gained a field: the producer emitted
          # `self_attested`, this replica did not list it, and EVERY plan tick would have died here
          # with "plan review item fields are invalid". The replica stays (this guard deliberately
          # re-derives nothing from the module it is guarding), but dispatch-claim's self-test now
          # parses this literal out of the workflow and asserts set equality with
          # REVIEW_ITEM_FIELDS, so the next field addition fails a unit test instead of a tick.
          expected_review_fields = {"pr_number", "head_sha", "state", "impl_provider", "repo",
                                    "package", "security", "self_attested", "context"}
          for item in document["review_items"]:
              if set(item) != expected_review_fields:
                  raise SystemExit("plan review item fields are invalid")
          expected_disarm_fields = {"pr_number", "head_sha", "reviewed_sha", "repo"}
          for item in document["disarm_items"]:
              if set(item) != expected_disarm_fields:
                  raise SystemExit("plan disarm item fields are invalid")
          expected_skip_fields = {"repo", "pr_number", "reason"}
          for item in document["snapshot_skips"]:
              if set(item) != expected_skip_fields:
                  raise SystemExit("plan snapshot skip fields are invalid")
          for item in document["partition_starvation"]:
              if set(item) != {"repo", "deferred"}:
                  raise SystemExit("plan partition starvation fields are invalid")
          # Full structural validation with the same validator CLAIM uses (strictly stronger
          # than a hand-rolled inline copy, and available here because the registry is local).
          claim_mod.validate_plan(document)
          Path(plan_path).write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"PLAN complete: "
                f"{sum(len(repo['items']) for repo in document['repositories'])} issue item(s), "
                f"{len(review_items)} review item(s), {len(disarm_items)} disarm item(s), "
                f"{len(snapshot_skips)} snapshot skip(s)")
          # Park-policy defect 3: ONE aggregate exclusion line, printed on EVERY plan, so a
          # "0 review item(s)" tick can never coexist silently with signalled worker PRs.
          # "signalled", not "labeled", since issue #464: a CONFLICTING base is a signal in its
          # own right, so the count now covers DIRTY PRs that carry no review:* label at all.
          exclusion_detail = ", ".join(
              f"{reason}={count}" for reason, count in sorted(review_exclusions.items()))
          print(f"review-enumeration excluded {sum(review_exclusions.values())} signalled "
                f"worker PR(s): {exclusion_detail or 'none'}")
          # [registry #762] ONE census line on EVERY plan, listing every bucket including the
          # zeros. A per-stage rate cannot express a MISSING EDGE (#753); only a population
          # partition can, and only if the empty buckets are printed too — an absent bucket and
          # a zero bucket must not look the same.
          census_detail = ", ".join(
              f"{bucket}={count}" for bucket, count in sorted(review_census.items()))
          print(f"review-enumeration census over {sum(review_census.values())} drafted "
                f"already-reviewed worker PR(s): {census_detail or 'none'}")
          # [#657 enable] The detection-only #42 emission for the enrolled orchestrator class, on
          # EVERY plan — one ::warning:: per live violation plus a census line that prints even at
          # zero, so an unresolved detection is re-stated every tick instead of being reported once
          # and going quiet. Emission only: `disarm_observations` never entered `document`, so
          # CLAIM cannot read it and no write path exists for this class.
          for observation_line in claim_mod.format_disarm_observations(disarm_observations):
              print(observation_line)
          PY

      - name: Upload immutable plan artifact (pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 1

  # SECRET-EXFIL SETTINGS GUARD (issue #101, review round 1 on the #101 PR). The
  # `dispatch-secrets` environment binding on CLAIM / plan-alert below is enforced by REPO
  # SETTINGS, not by this file — GitHub silently AUTO-CREATES a referenced environment with no
  # deployment-branch policy, so an unconfigured binding is a default-ALLOW no-op (repo-scope
  # secrets stay readable by a modified workflow copy dispatched at an attacker ref). This job
  # verifies both load-bearing settings every tick, fail closed, BEFORE any secret-bearing job:
  #   (1) EMPTY REPO SCOPE — this job is deliberately NOT bound to the environment, so its
  #       `secrets` context is exactly what a stripped-binding attacker copy would see;
  #       asserting it holds nothing beyond the ephemeral github_token proves the stripped-file
  #       exfil path yields nothing (key NAMES only are ever read or printed);
  #   (2) DEFAULT-BRANCH-ONLY ENVIRONMENT — `dispatch-secrets` must exist with a CUSTOM
  #       deployment-branch policy naming exactly the default branch (branch type only), so a
  #       kept-binding copy at any other ref is refused server-side.
  # Until the maintainer applies both settings, this fails every tick and CLAIM/plan-alert are
  # SKIPPED: dispatch pauses loudly (default-DENY) instead of running in the prior silent
  # default-allow window. The guard is read-only (`gh api` GETs; asserted by its self-test).
  secrets-guard:
    name: GUARD (verify secret-exfil settings, fail closed)
    # THE #819 RATE FLOOR, applied to this job too (issue #1208). Both halves are load-bearing and
    # each defeats a different mutation — the `needs:` edge makes this job WAIT for the floor's
    # decision, the `if:` makes it OBEY it — exactly as on `plan`. Asserted in BOTH directions
    # (including the empty-string a deleted output produces) by scripts/dispatch-tick-floor.py's
    # `_test_workflow_seam`.
    #
    # THIS DOES NOT WEAKEN THE GATE, AND THE REASON IS STRUCTURAL: on a tick the floor holds, the
    # jobs this guard gates DO NOT RUN ANYWAY. `claim` needs [plan, secrets-guard] with no `if:`,
    # and `plan` is gated on the same floor output, so a held tick already skips CLAIM; `plan-alert`
    # requires `needs.secrets-guard.result == 'success'`, and a SKIPPED job's result is `skipped`,
    # never `success`, so it skips too. The guard verifying settings on a held tick therefore
    # protects nothing — it is pure observation — while costing an authenticated read from the one
    # bucket that is currently the binding constraint on dispatch throughput. On an EXECUTING tick
    # this job runs exactly as before and gates exactly as before.
    #
    # WHY IT MATTERS: `github.token` is ONE 5000/hr bucket shared repo-wide. MEASURED 2026-07-29
    # 07:00-08:10Z (#1208): 41 dispatch runs started, 5 dispatched anything, and 69% of executable
    # ticks were budget-deferred. Every deferred ring still paid for this job's settings reads
    # against the bucket it was deferring to protect — and, when the budget was already gone, went
    # RED reporting an "availability" failure that motivated re-ringing it. A held tick now costs
    # this job nothing and produces no red row, and it self-clears with no human: a deferred tick
    # writes NO anchor (#1190), so the first doorbell ring after `x-ratelimit-reset` executes and
    # this guard verifies then.
    needs: [tick-floor]
    if: ${{ needs.tick-floor.outputs.proceed == 'true' }}
    # NO `continue-on-error` HERE, EVER (issue #618; closes the #276 advisory window opened
    # 2026-07-18 while #275's secret migration ran — that migration merged 2026-07-19). Job-level
    # `continue-on-error: true` is what made this fail-CLOSED control fail-OPEN: it does not merely
    # keep the RUN green, it makes this job resolve as SUCCESS for dependency purposes, so BOTH
    # downstream gating idioms are defeated at once — CLAIM's plain `needs: secrets-guard` AND
    # plan-alert's `needs.secrets-guard.result == 'success'`. Measured on run 30141528651: GUARD
    # job conclusion `failure`, CLAIM ran, ALERT ran, run conclusion `success`. The guard had been
    # red on EVERY tick since 2026-07-22T12:43Z (first tick after #528 merged) with no signal
    # anywhere. `scripts/dispatch-secrets-guard.py --self-test` statically asserts that this job
    # carries no truthy `continue-on-error` at the job OR step level and that every
    # secret-consuming job in this file is gated on it — see guard_gate_verdict there. If a
    # non-blocking diagnostic is ever wanted, add a SEPARATE advisory job; never make this one
    # both.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # actions:read is LOAD-BEARING (review round 2 on the #101 PR): the environment and
      # deployment-branch-policy REST reads in dispatch-secrets-guard.py require Actions
      # repository read on the fine-grained GITHUB_TOKEN, and an explicit permissions map sets
      # everything unlisted to none — without this line both GETs fail on EVERY tick, turning
      # the guard into a permanent denial (CLAIM/plan-alert stay skipped even once the
      # maintainer settings are correct). The guard's self-test statically asserts this map
      # stays exactly this least-privilege pair.
      actions: read
      contents: read  # minimum for the sparse checkout below
    steps:
      - name: Check out the guard script + this workflow (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          # The workflow files feed the self-test's static assertions: dispatch.yml for the
          # guard job's load-bearing `actions: read` permission (see the permissions map
          # above); set-up-account.yml for the broker's pre-claim slot-union contract (sol
          # round 6 on the #275 PR: the union must enumerate ACCTNN_TOKEN names at BOTH the
          # repo scope and the dispatch-secrets environment, fully paginated, BEFORE the
          # irreversible acct-claims ref is created); the WHOLE workflows directory plus
          # scripts/worker-live.sh for the derived binding-map contract (sol round 17 on the
          # #275 PR: every secret-consuming job repo-wide must be dispatch-secrets-bound, and
          # the broker store + rotation write-back must keep `--env dispatch-secrets`).
          # scripts/worker-pr.py + policy/repos.toml feed the human-arm TRUST-SURFACE derivation
          # (issue #618 defect 2): #528 added a self-test assertion that reads BOTH files without
          # extending this list, so on every dispatch tick the derivation resolved to an EMPTY
          # surface and reported all 22 privileged scripts — the guard script itself included — as
          # "outside the human-arm trust surface", while the SAME self-test passed in the
          # full-checkout pr-gate. Both files are READ here, never imported or executed: the
          # surface constant is extracted with `ast`, so nothing in worker-pr.py runs in this job.
          # scripts/grant-account.py is a TRANSITIVE input (the 2026-07-25 dispatch halt): the
          # self-test EXECUTES set-up-account.yml's reconcile `run:` body, and #616 made that body
          # load grant-account.py by repository-relative path to derive a resumed enrollment's
          # authorized target set. Absent from this list the load raised FileNotFoundError, the body
          # took its (correct) `grant cannot be proven` refusal branch, and the guard's
          # credential-existence assertions failed for a reason that had nothing to do with the
          # contract — which, now that #621 rightly made this guard GATING, skipped CLAIM on every
          # tick. The guard now DERIVES this dependency from the executed body's own text
          # (executed_body_inputs_declared_verdict), so the next step that loads a script goes red in
          # pr-gate instead of halting dispatch. It is read by the EXECUTED BODY, never by the guard
          # module itself.
          # KEEP THIS LIST IN SYNC — SELF_TEST_LIVE_INPUTS in scripts/dispatch-secrets-guard.py is
          # asserted against this very block every tick, so a new live-file dependency that is not
          # added here goes RED instead of silently degrading a check to vacuous.
          sparse-checkout: |
            scripts/dispatch-secrets-guard.py
            scripts/gh_403.py
            scripts/worker-live.sh
            scripts/worker-pr.py
            scripts/grant-account.py
            policy/repos.toml
            .github/workflows/
          sparse-checkout-cone-mode: false

      # The guard's static workflow-shape assertions PARSE the workflow YAML rather than pattern-match
      # it (retro-review of #621: five permissive misparses came from regex-over-YAML, and two
      # mutations of the gate wiring left the whole suite green). PyYAML is therefore a hard
      # requirement of `--self-test` here, exactly as it already is in pr-gate.yml. Probe FIRST: when
      # the runner image already provides it this step is a no-op and the guard keeps ZERO network
      # dependency on PyPI. Only when it is absent do we install — version + sha256 locked to the
      # identical pins pr-gate uses, because a REQUIRED fail-closed control must never depend on a
      # mutable release.
      - name: Ensure PyYAML for the guard's workflow-parse assertions
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML already present; no install needed"
            exit 0
          fi
          cat > "$RUNNER_TEMP/guard-requirements.txt" <<'REQ'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r "$RUNNER_TEMP/guard-requirements.txt"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Verify empty repo-scope secrets + default-branch-only environment policy
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          # Unbound-job secrets context: in the verified end state this holds ONLY the ephemeral
          # github_token. The guard inspects and prints key NAMES exclusively, never values
          # (asserted by sentinel checks in its self-test).
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 registry/scripts/dispatch-secrets-guard.py --self-test
          python3 registry/scripts/dispatch-secrets-guard.py

  claim:
    name: CLAIM (validate, lease, launch)
    needs: [plan, secrets-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SECRET-EXFIL GUARD (issue #101). This job holds the App private key, every repository secret
    # (toJSON(secrets)), the per-account ACCT*_TOKEN credentials, the alert token, and a write
    # GITHUB_TOKEN. Because `workflow_dispatch` (top of file) accepts an arbitrary ref and GitHub
    # runs the file AT that ref, a collaborator could dispatch a modified branch copy of this
    # workflow and exfiltrate all of it. An in-file `if:` on the ref cannot stop that — the
    # attacker controls the whole file at their ref. A protected environment is the only lever
    # that survives, because it is enforced by repo settings, not the workflow file: bind this
    # job to `dispatch-secrets`, whose deployment-branch policy admits the DEFAULT BRANCH ONLY.
    # A run from any other ref then either (a) keeps this line and is refused by the branch
    # policy, or (b) strips it and sees EMPTY secrets (they live in the environment, not at repo
    # level) — no exfiltration either way. Every legitimate trigger runs from the default branch
    # (schedule; workflow_run; the doorbell rings `gh workflow run dispatch.yml` with no --ref),
    # so none are starved. REQUIRED maintainer settings for this to bite: create the
    # `dispatch-secrets` environment, restrict its deployment branches to a CUSTOM policy naming
    # ONLY the default branch, and MOVE every repo-scope secret into it (this job reads
    # toJSON(secrets), so EVERY repo-scope secret is in its blast radius). Those settings live
    # outside this file, so the `secrets-guard` job verifies them every tick and this job runs
    # only after it passes (review round 1 on the #101 PR): until the settings are applied — and
    # again if they ever regress — no secret-bearing job runs (default-DENY, loud red tick),
    # never a silent default-allow window.
    environment: dispatch-secrets
    permissions:
      actions: write
      contents: write
      issues: write   # write: upsert the rolling worker-availability alert issue (usage-alert.py)
    steps:
      - name: Download PLAN artifact (pinned)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dispatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan

      - name: Checkout registry helpers (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false

      # Provenance + verdict records live on the unprotected `ledger` data-plane branch
      # (issue #96): master's required `gate` check rejects every direct contents-API PUT, so
      # post-outage records exist ONLY at this ref. CLAIM's fail-closed re-reads (provenance
      # re-validation, round verdicts) consult this checkout first, then the master copy for
      # pre-outage records. Fails the job LOUDLY if the ledger branch is missing.
      - name: Checkout the data-plane ledger branch (pinned, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ledger
          ref: ledger
          persist-credentials: false

      # Validate paths, object types, and modes against the canonical data-only allowlist.
      - name: Ledger checkout is data-only (trust guard)
        run: python3 registry/scripts/ledger-invariant.py ledger

      # The deferred-retry label flips, review needs-user escalations, missed-fix markers, and the
      # armed-SHA-mismatch DISARMS (issue #42) are TARGET mutations, so CLAIM mints its own
      # target-scoped App token(s). PER-OWNER MINT (defects #1,#5): the manifest now has two
      # DISTINCT owners (sparq-org, jeswr), so a single token scoped to targets[0]=sparq-org would
      # 404 every jeswr-owned registry disarm/needs-user/deferred-flip and defer it forever — the
      # exact issue-#42 disarm window the sweep exists to close would have no automated retraction
      # on the trust-surface repo. We mint one App token per distinct owner and hand CLAIM a
      # {owner: token} JSON map (_target_token resolves per repo owner). Each mint is
      # continue-on-error: a missing install for one owner only skips THAT owner's mutation paths;
      # the other owner's dispatch + the issue dispatch for both continue.
      # The scoping itself is groom.py --print-owner-repos --target-repos-env (issue #273): the
      # same SELF-TESTED resolver groom/curate/conflict-resolver already use, reading the manifest
      # instead of policy. It collects EVERY manifest repo per owner — not one representative name,
      # which would scope that owner's token to a single repo and 404 every mutation on the
      # owner's OTHER manifest repos (a supported manifest shape the exact-owner-set assertion
      # does not constrain) — and it still fails LOUD unless the manifest owners are exactly
      # {sparq-org, jeswr}, so adding an owner without a mint step dies here instead of silently
      # dropping that owner's token. Repo names are not secret; tee keeps the scope in the log.
      - name: Resolve distinct target owners (per-owner token mint)
        id: owners
        env:
          TARGET_REPOS: ${{ env.DISPATCH_TARGET_REPOS }}
        run: |
          set -euo pipefail
          python3 registry/scripts/groom.py --print-owner-repos \
            --target-repos-env TARGET_REPOS | tee -a "$GITHUB_OUTPUT"

      - name: Mint sparq-org target-scoped App token (issue/PR mutations only)
        id: app-token-sparq
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: sparq-org
          repositories: ${{ steps.owners.outputs.sparq_names }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mint jeswr target-scoped App token (issue/PR mutations only)
        id: app-token-jeswr
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_ADMIN_APP_ID }}
          private-key: ${{ secrets.REGISTRY_ADMIN_APP_KEY }}
          owner: jeswr
          repositories: ${{ steps.owners.outputs.jeswr_names }}
          permission-issues: write
          permission-pull-requests: write

      # Assemble the {owner: token} JSON map from whichever mints succeeded. A masked, single-line
      # step output; missing owners are simply absent (their mutations defer, never wrong-owner).
      - name: Assemble the per-owner target token map
        id: token-map
        env:
          SPARQ_TOKEN: ${{ steps.app-token-sparq.outputs.token }}
          JESWR_TOKEN: ${{ steps.app-token-jeswr.outputs.token }}
        run: |
          set -euo pipefail
          [[ -z "${SPARQ_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$SPARQ_TOKEN"
          [[ -z "${JESWR_TOKEN:-}" ]] || printf '::add-mask::%s\n' "$JESWR_TOKEN"
          python3 - <<'PY'
          import json
          import os

          tokens = {}
          if os.environ.get("SPARQ_TOKEN"):
              tokens["sparq-org"] = os.environ["SPARQ_TOKEN"]
          if os.environ.get("JESWR_TOKEN"):
              tokens["jeswr"] = os.environ["JESWR_TOKEN"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              # Compact single-line JSON — GITHUB_OUTPUT is line-based; the tokens are masked above.
              output.write(f"tokens={json.dumps(tokens, separators=(',', ':'))}\n")
          PY

      # Least-exposure filter (audit-2026-07-17): only this tiny inline step ever sees the full
      # secrets map; the probe step below receives ONLY the ACCT_* worker-token subset via a file.
      #
      # NO `continue-on-error` HERE (registry #639, the ledgergate #612 applied to the dashboard job
      # and this one did not). This is the PRODUCER of the only measurement input dispatch has, and
      # this is the lane that SPENDS capacity: a laundered failure here used to leave no ACCT_* file,
      # `_load_secrets` returned `{}` for an unreadable one, every metered account was fail-closed
      # omitted, and the probe-EXEMPT accounts were still emitted — so the map stayed NON-EMPTY, no
      # wholesale-outage detector fired, and dispatch launched workers against an unmeasured fleet.
      # The filter is a pure local transform of `toJSON(secrets)`; it fails only on a real defect, and
      # a real defect must stop the tick loudly rather than degrade it silently.
      # `id:` so account-usage.py's --self-test can EXTRACT and EXECUTE this exact body and assert
      # this step carries no truthy `continue-on-error` (both are invisible to actionlint).
      - name: Materialize the ACCT_* worker-token subset for the probe
        id: acct-secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/acct-secrets.json" <<'PY'
          import json
          import os
          import re
          import sys

          path = sys.argv[1]
          allow = re.compile(r"ACCT[A-Z0-9]+_TOKEN")
          data = json.loads(os.environ["ALL_SECRETS"])
          subset = {key: value for key, value in data.items()
                    if isinstance(value, str) and allow.fullmatch(key)}
          # Create atomically 0600 (O_EXCL: fresh runner temp, the file must not pre-exist) so the
          # token subset is never even transiently readable under the runner's default umask.
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as handle:
              json.dump(subset, handle)
          PY

      - name: Probe live account usage (usage-aware dispatch; tokens never printed)
        # `id:` so account-usage.py's --self-test can EXTRACT and EXECUTE this exact step body
        # (registry #639, mirroring #612 round 2 finding 4): `bash -n` and actionlint cannot see shell
        # polarity, so dropping a `!` below — a nonzero probe left classified `ok` — survives the
        # whole suite unless the body is actually run.
        id: usage-probe
        continue-on-error: true   # a probe failure must never block dispatch — it falls back to the static cap
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          SECRETS_FILE: ${{ runner.temp }}/acct-secrets.json
          # A failed materialization leaves NO ACCT_* file, and account-usage._load_secrets returns
          # {} for an unreadable one — the probe would then exit 0 having silently measured nothing.
          # The filter's own outcome therefore gates the status (registry #639; the materialization is
          # no longer continue-on-error, so in production this can only read `success` — it is kept
          # because RESTORING `continue-on-error: true` must not silently re-open the laundering).
          SECRETS_STEP_OUTCOME: ${{ steps.acct-secrets.outcome }}
          # Reactive backoff for probe-exempt providers (decision 2026-07-17, registry issue #29):
          # the salt maps catalog handles to the salted hashes in data/model-health.json so active
          # rate-limit backoffs land on the exempt usage entries. This job runs registry code only
          # (same posture as the claim step's PROVENANCE_SALT below) — the salt never enters a job
          # that executes target code. A missing salt or unreadable ledger fails OPEN (backoff
          # disabled, exemption intact) with a loud ::warning:: line.
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
        run: |
          set -uo pipefail
          # LEDGERGATE (registry #639), the discipline #612 applied to the published page and not to
          # this lane. The old body was `... || printf '{}' > usage.json`: a failure was LAUNDERED into
          # an empty-but-valid document with nothing recording that measurement had not happened.
          # The outcome now travels with the snapshot as `usage-probe.json`, and it is derived from
          # POSITIVE checks on the inputs rather than inferred from a neighbour's exit status.
          outcome=ok
          detail=probe-succeeded
          if [ "${SECRETS_STEP_OUTCOME}" != "success" ]; then
            outcome=failed
            detail=secret-materialization-failed
          fi
          # A `success` step outcome does not prove the filter WROTE anything: a materialization body
          # replaced by `true` reports success and leaves no file, _load_secrets returns {} for an
          # unreadable one, and the probe then exits 0 having measured nothing. So the subset file is
          # checked POSITIVELY, not merely inferred.
          if [ "$outcome" = ok ] && [ ! -s "${SECRETS_FILE}" ]; then
            outcome=failed
            detail=secret-file-missing
          fi
          # ...and a subset with no USABLE token is measurement-equivalent to no file: every
          # non-exempt account is fail-closed omitted for want of a token.
          #
          # #612 review round 4 (MAJOR), restated here because this lane spends real capacity: the
          # substring test `grep -q '"ACCT'` proves NEITHER valid JSON NOR a non-empty token —
          # `{"ACCT01_TOKEN":""}` and the truncated `{"ACCT01_TOKEN":` both pass it, and _load_secrets
          # then yields an empty token or (on JSONDecodeError) `{}`. A substring cannot express "at
          # least one ACCT*_TOKEN key whose value is a non-empty string", so the subset is PARSED.
          # The predicate is account-usage._usable_secret_refs, unit-tested there, and this body's
          # verdicts are asserted against dashboard.yml's for the identical fixture set so the two
          # lanes cannot drift.
          #
          # The no-token-bytes-in-the-log constraint is kept BY CONSTRUCTION: the validator's only
          # stdout is one of the three fixed words ok/empty/malformed, that stdout is captured into a
          # variable and never echoed, every failure is caught so there is no traceback to echo a
          # fragment of the document, and its stderr is discarded anyway.
          #
          # SCOPING (as #612 recommended): an all-exempt fleet (openai/codex only — issue #29) needs
          # no token at all, so a zero-usable-token subset would be a legitimate steady state and this
          # guard would degrade dispatch unnecessarily. The catalog is anthropic-majority by
          # construction (every non-exempt account needs a token), so today that configuration does
          # not exist; account-usage.py's own gate is conditioned on the catalog containing >=1
          # non-exempt account, and if that configuration ever becomes real, condition this guard the
          # same way rather than weakening it.
          subset_state=$(python3 -c '
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  document = json.load(handle)
          except Exception:
              print("malformed")
              sys.exit(0)
          if not isinstance(document, dict):
              print("malformed")
              sys.exit(0)
          usable = [key for key, value in document.items()
                    if re.fullmatch(r"ACCT[A-Z0-9]+_TOKEN", str(key))
                    and isinstance(value, str) and value.strip()]
          print("ok" if usable else "empty")
          ' "${SECRETS_FILE}" 2>/dev/null) || subset_state=malformed
          if [ "$outcome" = ok ] && [ "$subset_state" != ok ]; then
            outcome=failed
            detail=secret-subset-empty
            if [ "$subset_state" != empty ]; then
              # Unparseable, truncated, or not a JSON object at all. Distinguished from `empty`
              # because it is a different production defect (a broken filter, a truncated write)
              # and both tokens are fixed literals — neither can carry document bytes.
              detail=secret-subset-malformed
            fi
          fi
          if [ "$outcome" = ok ] && ! python3 registry/scripts/account-usage.py --self-test; then
            outcome=failed
            detail=probe-self-test-failed
          fi
          if [ "$outcome" = ok ] && ! python3 registry/scripts/account-usage.py \
              > "$RUNNER_TEMP/usage.json" 2> "$RUNNER_TEMP/usage-probe.stderr"; then
            outcome=failed
            detail=probe-exited-nonzero
          fi
          if [ "$outcome" != ok ]; then
            # The same empty snapshot as before — but now it arrives LABELLED as unmeasured, so
            # usage-alert raises the wholesale-probe-failure alert with the CAUSE instead of inferring
            # "no data", and no consumer can read it as a fleet-wide "available".
            printf '{}' > "$RUNNER_TEMP/usage.json"
          fi
          # `outcome`/`detail` are step-local literals from the fixed sets above — never
          # attacker-influenced text — so this printf cannot emit malformed JSON. Same schema and
          # vocabulary as dashboard.yml's sidecar (issue #219), one contract, two producers.
          printf '{"schema":"account-usage-probe/v1","outcome":"%s","detail":"%s","attempted_at":%s}\n' \
            "$outcome" "$detail" "$(date -u +%s)" > "$RUNNER_TEMP/usage-probe.json"
          # Privacy (locked decision 22b): the public log never carries account counts; a wholesale
          # probe failure is surfaced by the fail-loud usage-alert step below, not by this line.
          # Only explicitly ::warning::-prefixed diagnostics (sanitized by construction — no
          # handles/counts) are re-surfaced from stderr; everything else stays discarded. The file may
          # not exist when the probe never ran (a refused materialization), hence the guard.
          [ -f "$RUNNER_TEMP/usage-probe.stderr" ] && \
            { grep -a '^::warning::' "$RUNNER_TEMP/usage-probe.stderr" || true; }
          echo "usage-probe: snapshot written (outcome=${outcome} detail=${detail})"

      # Capacity model (2026-07-17): persist the live anthropic-ratelimit-unified-* LIMIT headers
      # into the account issues' front-matter so per-account tier limits stop being "TBD".
      # Best-effort; the allocator ignores the extra `limits:` line entirely.
      - name: Persist probed tier limits to the account catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
        run: python3 registry/scripts/account-usage.py --persist-limits "$RUNNER_TEMP/usage.json"

      - name: Strictly validate, CAS claim, and dispatch live workers + review/fix runs
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          # Per-owner target App-token map (defects #1,#5): _target_token(repo) resolves the token
          # for repo's OWNER. Same App across owners, so the bot slug is identical; take it from
          # whichever mint succeeded.
          TARGET_GH_TOKENS: ${{ steps.token-map.outputs.tokens }}
          BOT_LOGIN: ${{ (steps.app-token-sparq.outputs.app-slug || steps.app-token-jeswr.outputs.app-slug) && format('{0}[bot]', steps.app-token-sparq.outputs.app-slug || steps.app-token-jeswr.outputs.app-slug) || '' }}
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_ALERT_TOKEN: ${{ github.token }}
          # Privacy routing (locked decision 22c): a maintainer-set ALERT_REPO (+ ALERT_TOKEN
          # with access to it) sends account-enumerating ops alerts to a PRIVATE repo instead of
          # this public registry; unset falls back to REGISTRY_REPO + the workflow token.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
          # Salt for the provenance account-hash comparison (locked decision 22a). This job runs
          # registry code only — the salt never enters a job that executes target code.
          PROVENANCE_SALT: ${{ secrets.PROVENANCE_SALT }}
          WORKFLOW_REF: ${{ github.ref_name }}
          WORKER_USAGE_FILE: ${{ runner.temp }}/usage.json
          # Zero-dispatch visibility (registry #28/#32): dispatch-claim writes a compact
          # {planned, dispatched, defer_reasons} summary here (no issue numbers/handles) for the
          # step below to render + record.
          DISPATCH_SUMMARY_FILE: ${{ runner.temp }}/dispatch-summary.json
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GH_TOKEN"
          # Re-mask each per-owner token value defensively (already masked at mint assembly).
          python3 - <<'PY'
          import json
          import os
          for tok in json.loads(os.environ.get("TARGET_GH_TOKENS", "{}") or "{}").values():
              if tok:
                  print(f"::add-mask::{tok}")
          PY
          python3 registry/scripts/dispatch-claim.py \
            --plan plan/plan.json \
            --policy-file registry/policy/repos.toml \
            --registry-repo "$GITHUB_REPOSITORY" \
            --registry-root registry \
            --ledger-root ledger \
            --bot-login "$BOT_LOGIN" \
            --workflow-ref "$WORKFLOW_REF"

      # Zero-dispatch visibility (registry #28) + model-access health (#32): every tick that
      # PLANNED work writes a health record — `zero-dispatch` when nothing launched, dispatch
      # SUCCESS when something did (review defect #5: consecutiveness is over the tick sequence,
      # and a productive tick both resets the run and closes the alert via `decide`). A claim that
      # ABORTED before writing even the early plan summary records `claim-abort` (review defect
      # #6, counted as a zero-dispatch tick); dispatch-claim writes the plan-derived summary
      # BEFORE claim-side work so a mid-claim abort still surfaces as planned>0/launched-0.
      # A truly empty frontier (planned == 0 AND an empty defer histogram) records `idle` (issue
      # #341 — see below); a snapshot-skip-only tick (issue #109) is degraded and records
      # zero-dispatch.
      # NOTE (issue #205): an open zero-dispatch alert is recovered on the decide side even when
      # the fleet has aged out of the window (model-health.py classify_records + open-alert
      # markers), so an unrecorded empty tick no longer leaves the alert open forever — but that
      # recovery had to wait out the full 48 h window. Issue #341: a completed tick that found an
      # EMPTY ready frontier is positive evidence that "launched nothing while work was ready" is
      # no longer true, so it records the fleet `idle` class and the alert recovers on the spot.
      # NOT a `success` (that would fabricate fleet-health evidence for the aged-out park exit) and
      # NOT once per tick (model-health.py's fleet_idle_is_redundant suppresses the write while the
      # fleet's newest record is already `idle`, so the ~288 idle ticks per window cannot evict the
      # per-provider health signal the outage/transient/capped detectors read).
      # always() so a claim FAILURE (exactly when nothing launches) is still surfaced. No issue
      # numbers or account handles are emitted.
      - name: Surface + record the dispatch-tick health state
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          DISPATCH_SUMMARY_FILE: ${{ runner.temp }}/dispatch-summary.json
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
        run: |
          set -uo pipefail
          python3 - "$DISPATCH_SUMMARY_FILE" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as handle:
                  summary = json.load(handle)
          except (OSError, ValueError):
              summary = None
          planned = (summary or {}).get("planned", 0)
          dispatched = (summary or {}).get("dispatched", 0)
          reasons = (summary or {}).get("defer_reasons", {})
          reasons = reasons if isinstance(reasons, dict) else {}
          # Issue #28: ready-frontier size + lease-ledger health, so this line tells an empty
          # frontier apart from a ledger failure (both otherwise read as a green 0-dispatch tick).
          frontier_size = (summary or {}).get("frontier_size", planned)
          ledger = (summary or {}).get("ledger", "ok")
          zero = isinstance(planned, int) and planned > 0 and dispatched == 0
          productive = isinstance(planned, int) and planned > 0 and \
              isinstance(dispatched, int) and dispatched > 0
          # No summary at all = the claim aborted before even the early plan-summary write
          # (validation/API/setup); that is a zero-dispatch-shaped tick, not a quiet one.
          abort = summary is None and os.environ.get("CLAIM_OUTCOME") == "failure"
          # Issue #109: a tick can carry NO ready-frontier work (planned == 0) yet still be
          # DEGRADED — plan-snapshot census/check-run failures fold into the defer histogram
          # (snapshot_skip_reasons) without ever becoming `planned` items, so the planned>0 gate
          # above would misrecord such a snapshot-skip-only tick as a quiet `none`, contradicting
          # the claim that snapshot degradation is visible. Any nonempty defer histogram with
          # nothing dispatched is degradation the same zero-dispatch class must surface; a truly
          # empty frontier (no histogram) still records nothing.
          degraded = isinstance(dispatched, int) and dispatched == 0 and bool(reasons)
          # Issue #108: per-lane health, so a productive WORKER launch can no longer mark the tick
          # healthy while a safety disarm or an entire review/fix lane failed. The disarm lane
          # consumes no account/lease, so it is invisible to the fleet planned/dispatched counts
          # above — a disarm ERROR (a stale auto-merge latch that could not be retracted) is
          # safety-critical and MUST alert on its own. A review/fix lane that planned work, launched
          # nothing, AND hit hard errors is a genuine stall (as opposed to plain capacity
          # contention, which is `deferred`, not `error`). Any of these records the SAME
          # `zero-dispatch` health class the fleet signal uses (ready work that did not launch), so a
          # persistent stall accumulates over consecutive ticks and pages — while a healthy tick
          # (every planned lane launched, no disarm error) still records `success` and closes it.
          lanes = (summary or {}).get("lanes", {})
          lanes = lanes if isinstance(lanes, dict) else {}
          def _lane(name):
              lane = lanes.get(name, {})
              return lane if isinstance(lane, dict) else {}
          def _n(lane, key):
              value = lane.get(key, 0)
              return value if isinstance(value, int) else 0
          disarm_failed = _n(_lane("disarm"), "error") > 0
          def _lane_stalled(name):
              lane = _lane(name)
              return _n(lane, "planned") > 0 and _n(lane, "launched") == 0 \
                  and _n(lane, "error") > 0
          review_stalled = _lane_stalled("review")
          fix_stalled = _lane_stalled("fix")
          lane_unhealthy = disarm_failed or review_stalled or fix_stalled
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          # Every tick with a summary emits the frontier/ledger health line (issue #28) — an
          # empty frontier (frontier_size=0) is now visibly distinct from a ledger failure
          # (ledger=error), which the claim step also fails loud on when nothing dispatched.
          if summary is not None and step_summary:
              with open(step_summary, "a", encoding="utf-8") as out:
                  out.write(f"dispatch tick: frontier_size={frontier_size}, "
                            f"ledger={ledger}, dispatched={dispatched}\n\n")
          if (zero or degraded) and step_summary:
              with open(step_summary, "a", encoding="utf-8") as out:
                  out.write("### ⚠️ Zero-dispatch tick\n\n")
                  if isinstance(planned, int) and planned > 0:
                      out.write(f"Planned **{planned}** ready item(s) but launched **0**. "
                                "Defer-reason histogram:\n\n")
                  else:
                      # Issue #109: no ready-frontier work, but the tick is degraded — the defer
                      # histogram carries plan-snapshot failures that stood down this tick.
                      out.write("No ready-frontier work, but the tick is **degraded** "
                                "(plan-snapshot failures stood down). Defer-reason histogram:\n\n")
                  for reason, count in sorted(reasons.items(), key=lambda kv: (-kv[1], kv[0])):
                      out.write(f"- `{reason}`: {count}\n")
                  if not reasons:
                      out.write("- (no per-item defer reason captured)\n")
          # Issue #108: surface a lane stall that the fleet dispatched>0 count would otherwise hide,
          # so the masked safety failure is human-visible on the tick it happens (not just after the
          # consecutive-tick page).
          if lane_unhealthy and not zero and step_summary:
              with open(step_summary, "a", encoding="utf-8") as out:
                  out.write("### ⚠️ Lane stall masked by other lanes\n\n")
                  if disarm_failed:
                      out.write(f"- safety **disarm** errored on "
                                f"{_n(_lane('disarm'), 'error')} item(s) — a stale auto-merge "
                                "latch could not be retracted\n")
                  if review_stalled:
                      out.write("- **review** lane planned work but launched nothing "
                                "(every item errored)\n")
                  if fix_stalled:
                      out.write("- **fix** lane planned work but launched nothing "
                                "(every item errored)\n")
          # Issue #341: a QUIET tick — the claim step ran to SUCCESS, the ready frontier was empty
          # (planned == 0, dispatched == 0) and nothing deferred, so there is no histogram and
          # `degraded`/`lane_unhealthy` above are both false. That is a POSITIVE observation
          # ("there was nothing to launch"), which is why it is derived from the claim step's own
          # outcome rather than from the fallback below: a claim that FAILED, or a summary that
          # never landed, is an absence of information and must stay unrecorded.
          # HONESTY NOTE on `not observed_reasons`: it is DELIBERATELY redundant with `degraded` (a
          # nonempty histogram with dispatched == 0 is already classified `zero` one line down,
          # which wins). It is kept because this predicate must state its OWN precondition — a later
          # narrowing of `degraded` must not silently turn a deferring tick into a quiet one — but
          # it is not an independently reachable branch, and the self-test does not pretend it is.
          # ROUND 1 REVIEW: `idle` must be built from the RAW summary, never from the defaulted
          # `planned`/`dispatched`/`reasons` above. Those defaults (0/0/{}) exist to keep the
          # zero/degraded classes conservative when a field is missing, but they are absences of
          # information — reusing them here made `{}`, `[]`, `{"planned": 0}` and a non-mapping
          # histogram all fabricate a positive empty-frontier observation that recovers an open
          # zero-dispatch alert. So require a MAPPING that actually CARRIES the schema
          # (_write_dispatch_summary always emits all three), with real counts: `bool` is an `int`
          # subclass and `planned: false` is a schema violation, not a count of zero.
          def _observed_count(field):
              value = summary.get(field) if isinstance(summary, dict) else None
              return value if isinstance(value, int) and not isinstance(value, bool) else None
          observed_reasons = summary.get("defer_reasons") if isinstance(summary, dict) else None
          quiet = os.environ.get("CLAIM_OUTCOME") == "success" \
              and _observed_count("planned") == 0 and _observed_count("dispatched") == 0 \
              and isinstance(observed_reasons, dict) and not observed_reasons
          # Emit a marker file the record step reads (keeps the record invocation out of this
          # inline python so the salted-hash discipline stays in model-health.py). A lane stall or a
          # failed safety disarm counts as a zero-dispatch tick even when the fleet dispatched>0.
          # `none` is the FAIL-CLOSED fallback (no summary, an unclassifiable tick, or the marker
          # file missing entirely on the shell side): it records nothing at all.
          state = "zero" if (zero or lane_unhealthy or degraded) else "abort" if abort \
              else "ok" if productive else "idle" if quiet else "none"
          with open(os.environ["RUNNER_TEMP"] + "/dispatch-tick-state", "w",
                    encoding="utf-8") as flag:
              flag.write(state)
          PY
          # This step runs IN the job that produced the tick outcome, so its own
          # $GITHUB_RUN_ATTEMPT IS the producing attempt the recorder's idempotency key expects
          # (review round 1 of #425): a re-run of this job re-evaluates the tick — a genuinely
          # new outcome under the same GITHUB_RUN_ID that must append, and does, because the
          # fresh attempt changes the key.
          state="$(cat "$RUNNER_TEMP/dispatch-tick-state" 2>/dev/null || echo none)"
          case "$state" in
            zero)
              python3 registry/scripts/model-health.py record \
                --provider fleet \
                --exit-class zero-dispatch \
                --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
              ;;
            abort)
              python3 registry/scripts/model-health.py record \
                --provider fleet \
                --exit-class claim-abort \
                --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
              ;;
            ok)
              # dispatch-success record: resets the consecutive zero-tick run + closes the alert
              python3 registry/scripts/model-health.py record \
                --provider fleet \
                --exit-class success \
                --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
              ;;
            idle)
              # empty-frontier record (issue #341): recovers an open zero-dispatch alert without
              # waiting out the 48 h window, and WITHOUT claiming the dispatcher launched anything.
              # model-health.py suppresses this write while the fleet's newest record is already
              # `idle`, so a permanently-quiet fleet writes one record, not one per tick.
              python3 registry/scripts/model-health.py record \
                --provider fleet \
                --exit-class idle \
                --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
              ;;
          esac

      # FAIL-LOUD maintainer alert: opposite posture to the fail-closed dispatcher. Runs even if the
      # claim step above skipped everything (all accounts capped), so degraded throughput is never
      # silent. The account pool + margin come from policy/repos.toml READ INSIDE the script (never
      # env/log lines — privacy d22b), and classify() mirrors usage_eligible's fail-closed posture,
      # so a WHOLESALE probe failure (empty usage.json) always fires the alert. Upserts ONE rolling
      # `ops-alert` issue @-mentioning the maintainer; never blocks dispatch.
      - name: Alert maintainer if worker accounts are unavailable
        if: always()
        continue-on-error: true
        # `id:` so account-usage.py's --self-test can assert the probe-status wiring against THIS step
        # (registry #639): the sidecar has exactly one consumer in this job, so DELETING the env line
        # below silently reverts the alert to inferring an outage from an empty map — which is the
        # inference the sidecar exists to replace, and no test that only runs the scripts can see it.
        id: usage-alert
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          WORKER_USAGE_FILE: ${{ runner.temp }}/usage.json
          # The probe's persisted outcome (registry #639). `probe_empty = not usage` cannot tell "the
          # fleet is idle" from "nothing was measured", and it MISSES a partial failure entirely; the
          # sidecar states the outcome and the CAUSE. Fail-closed when the variable is set: an absent
          # or stale sidecar is treated as UNMEASURED (degraded), never as a healthy probe.
          USAGE_PROBE_STATUS_FILE: ${{ runner.temp }}/usage-probe.json
          POLICY_FILE: registry/policy/repos.toml
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c, issue #107): the per-account alert body enumerates
          # account handles, so it is emitted ONLY over a VERIFIED private route — a maintainer-set
          # ALERT_REPO together with an ALERT_TOKEN that can write there. Any fallback to this PUBLIC
          # registry repo (route unset OR half-configured) redacts handles to aggregate counts.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/usage-alert.py --self-test
          python3 registry/scripts/usage-alert.py

  # FAIL-LOUD alert for a HARD PLAN failure (issue #38). Every always()/ops-alert step above lives
  # INSIDE the claim job, which is `needs: plan` — so when PLAN itself fails or is cancelled (e.g.
  # sustained snapshot 403s), claim is SKIPPED and none of them run: a persistent PLAN failure means
  # ZERO dispatching fleet-wide yet presents only as skipped jobs on a cron nobody watches. This
  # standalone job keys on `needs.plan.result` and, on failure/cancelled, upserts a rolling
  # `ops-alert` issue @-mentioning the maintainer via the SAME ALERT_REPO/ALERT_TOKEN routing the
  # account-availability alert uses (locked decision 22c). The JOB runs every tick; it is the
  # SCRIPT that decides, so a healthy tick auto-closes any prior open plan-alert (as of #778 that
  # needs BOTH stages green, not PLAN alone). No token or snapshot data reaches this job
  # (it downloads no PLAN artifact); it only reads the plan/claim JOB RESULTS.
  #
  # #778 extends the same argument to CLAIM. GitHub does NOT run a job's `if: always()` steps once
  # the JOB itself is cancelled (its own `timeout-minutes`, or a run-level cancel), and CLAIM hosts
  # the CAS lease claim, the worker launch AND the `always()` per-tick telemetry recorder (#756).
  # Measured on run 30245515435: PLAN success, then CLAIM cancelled at exactly 1200 s
  # (timeout-minutes 15 + GitHub's 5-minute post-cancel grace); the CAS-claim step never finished
  # and the telemetry step never ran. The run-level conclusion was `cancelled` — identical to the
  # 116/117 cancellations in that window that were FREE concurrency coalescing with zero started
  # jobs, so no run-conclusion aggregate can see it. Worse: PLAN had SUCCEEDED, so the PLAN-only
  # decision CLOSED any open alert on the very tick CLAIM died mid-write. Hence `needs: claim` and
  # CLAIM_RESULT below — the ONLY way to observe a cancelled job is from outside it.
  plan-alert:
    name: ALERT (hard PLAN/CLAIM termination)
    # `claim` is a dependency purely to READ its result. `always()` keeps this job running when
    # claim fails/cancels/skips. It costs ~6 s serialized after CLAIM (measured ALERT median 6.4 s
    # over 25 runs) on a ~595 s tick.
    needs: [plan, secrets-guard, claim]
    # Runs every tick regardless of the PLAN/CLAIM results so a healthy tick can auto-close a prior
    # alert; scripts/plan-alert.py keys on needs.plan.result + needs.claim.result — close happens
    # ONLY when BOTH are an explicit success (a skipped stage is not a recovery, review r1; and a
    # green PLAN must not close an alert while CLAIM is what died, #778), and a success tick with
    # no open alert does only a bare `gh issue list`, so a green tick stays cheap and
    # side-effect-free.
    # secrets-guard gate (issue #101 review round 1): this job mounts ALERT_TOKEN/ALERT_REPO, so
    # it must NOT run while the secret-exfil settings are unverified — a guard failure skips it
    # (fail closed; the guard-red tick is itself the loud signal).
    if: ${{ always() && needs.secrets-guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECRET-EXFIL GUARD (issue #101): this job reads ALERT_TOKEN/ALERT_REPO (the private-alert
    # routing secrets), so it is reachable by the same arbitrary-ref workflow_dispatch exfil
    # vector as CLAIM. Bind it to the same default-branch-only `dispatch-secrets` environment
    # where those secrets live. It only ever runs from the default branch (schedule/workflow_run/
    # doorbell), so the branch policy never starves it.
    environment: dispatch-secrets
    permissions:
      contents: read  # minimum for the sparse checkout below — the job runs a script from the repo
      issues: write   # upsert/close the rolling plan-failure ops-alert issue
    steps:
      # Codex r4 privilege review: the job DOES need a checkout (the alert logic lives in
      # scripts/plan-alert.py), but only that one file — sparse-checkout scopes the working copy
      # to it, pinned and with no persisted token, so nothing else from the repo reaches this job.
      - name: Check out ONLY scripts/plan-alert.py (pinned, sparse, no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
          persist-credentials: false
          sparse-checkout: scripts/plan-alert.py
          sparse-checkout-cone-mode: false

      - name: Alert maintainer that the dispatch PLAN job hard-failed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REPO: ${{ github.repository }}
          PLAN_RESULT: ${{ needs.plan.result }}
          # #778: the CLAIM result is the ONLY in-run signal that the lease/launch half of the
          # tick died. Its `always()` telemetry step cannot report its own cancellation.
          CLAIM_RESULT: ${{ needs.claim.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER_HANDLE: jeswr
          # Privacy routing (locked decision 22c): scripts/plan-alert.py routes to a maintainer-set
          # PRIVATE ALERT_REPO only when ALERT_TOKEN can write there (usage-alert.py's audited
          # _alert_route semantics, issue #39); otherwise the registry repo. The body carries no
          # account handles (a PLAN failure is target-planner-side), so that fallback is safe.
          ALERT_REPO: ${{ secrets.ALERT_REPO || vars.ALERT_REPO || '' }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN || '' }}
        run: |
          set -uo pipefail
          python3 registry/scripts/plan-alert.py --self-test
          python3 registry/scripts/plan-alert.py
