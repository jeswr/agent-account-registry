name: Set up new account
description: Register a new model account via web sign-in (maintainer only)
title: "set up new account: <openai|anthropic>"
labels: []
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [anthropic, openai]
    validations: {required: true}
  # [#579] AUTHORIZATION, not documentation. `account_pool` in policy/repos.toml is the
  # credential-authorization boundary (policy-resolve validates it, select-and-claim.claim()
  # filters on it, worker.yml re-checks it), so enrollment grants the new account ONLY to the
  # repositories this request explicitly names. The carrier is a LABEL rather than a form field
  # because the broker RE-READS it live immediately before the policy write — the sign-in can take
  # ~13 minutes, and a target removed during that window must fail closed (a body field would be a
  # second source of truth that could disagree with the labels the broker actually enforces).
  - type: markdown
    attributes:
      value: |
        **Before adding `set-up-account`, label this issue with its authorized targets.** Add one
        **`grant:<owner>/<repo>`** label per repository this account may be used by (each must be an
        `enabled = true` row of `policy/repos.toml` — e.g. `grant:jeswr/agent-account-registry`).
        With no `grant:` label the broker refuses to enroll: an account is never granted to every
        repository by default.
  - type: markdown
    attributes:
      value: "Then add the **`provider:openai`/`provider:anthropic`** and **`set-up-account`** labels. The broker will comment a sign-in URL (encrypted to your GPG key); sign in and the token is captured + stored as a secret automatically. The account is registered `status:pending` and activates only when its `account_pool` PR — which touches ONLY the rows you granted — merges."
