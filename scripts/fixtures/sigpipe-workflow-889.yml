# POSITIVE CONTROL for _workflow_run_shell (registry issue #889). DATA, never executed and never
# dispatched: it lives under scripts/fixtures/ rather than .github/workflows/, so GitHub never sees
# it AND the "zero hits across .github/workflows/*.yml" assertion needs no exemption for its own
# evidence — the same rule sigpipe-shapes-879.txt / sigpipe-repro-879.bash follow for scripts/*.sh.
#
# It carries TWELVE countable `producer | early-exiting consumer` shapes in pipefail-ON shell — four
# in plainly-scoped bodies, five behind a `set +o pipefail` that does not actually apply to them,
# two re-enabled on the SAME line as the shape, and one behind a `set +o pipefail` that is merely
# quoted TEXT — and FOUR that must NOT be counted because pipefail really is off where they sit.
# worker-live.sh asserts the exact total, which pins BOTH directions at once: one that returned none
# (or that lost the `run:` walk entirely) undercounts, and one that dropped the pipefail state
# machine overcounts.
name: sigpipe shape control (not a real workflow)
on: workflow_dispatch
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      # pipefail ON, stated. Both shapes below are counted (2).
      - name: pipefail on
        run: |
          set -euo pipefail
          first=$(printf '%s\n' "$body" | head -1)
          if printf '%s' "$probe" | grep -q 'HTTP 404'; then echo found; fi

      # pipefail UNSTATED. Assumed ON, because `shell: bash` (and every explicit `shell: bash` step)
      # runs with -o pipefail: a body that never says otherwise must fail closed into the guard, not
      # out of it. Counted (1) — awk scores a segment once, so the `sed`+`head` line is one hit.
      - name: pipefail unstated
        run: |
          n=$(gh api "repos/o/r/issues" | sed -n 's/^x:[[:space:]]*//p' | head -1)

      # Deliberately DISABLED, exactly like fingerprint-accounts.yml's `rl()` helper. NOT counted:
      # with pipefail off a SIGPIPEd producer cannot set the pipeline's status, so the shape is out
      # of the class rather than merely tolerated.
      - name: pipefail off
        run: |
          set +e +o pipefail   # tolerate 401/no-header responses
          rl() { grep -i "^x-ratelimit-$1:" /tmp/h.txt | head -1; }

      # Disabled and then RE-ENABLED. The shape before the re-enable is exempt, the one after it is
      # counted (1) — so the exemption can never be implemented as a whole-body skip.
      - name: pipefail off then on again
        run: |
          set +o pipefail
          tolerated=$(printf 'a\nb\n' | head -1)
          set -o pipefail
          counted=$(printf 'a\nb\n' | head -1)

      # --- BYPASS CONTROLS (review r1 of #924). Each of the five steps below contains a
      # `set +o pipefail` that does NOT disable pipefail for the outer shell — it is text in a
      # heredoc, or it is scoped to a construct that never runs / never leaks its options out — and
      # then an outer pipeline that IS vulnerable. Every one of those outer pipelines must be
      # counted (5). Under a flat "any line starting with `set`" state machine all five scored 0,
      # which is the fail-OPEN direction: real 141-class shapes reported as clean. ---

      # (a) heredoc: the `set` line is DATA being written to another file. QUOTED and UNQUOTED
      # delimiters are separate steps, not two heredocs in one, because each body resets the scope
      # state — sharing a step would leave the second form scored by the first one's latch and its
      # branch of the delimiter regex would then be free to be wrong.
      - name: disable buried in a quoted-delimiter heredoc
        run: |
          set -euo pipefail
          cat <<'INNER' > /tmp/inner.sh
          set +o pipefail
          INNER
          counted=$(printf 'a\nb\n' | head -1)

      - name: disable buried in an unquoted-delimiter heredoc
        run: |
          set -euo pipefail
          cat <<INNER > /tmp/inner.sh
          set +o pipefail
          INNER
          counted=$(printf 'a\nb\n' | head -1)

      # (b) function body that is never called (and would not leak its options if it were, until
      # called — the point is that the definition alone changes nothing).
      - name: disable inside an uncalled function
        run: |
          set -euo pipefail
          never_called() {
            set +o pipefail
          }
          counted=$(printf 'a\nb\n' | head -1)

      # (c) a branch that does not execute.
      - name: disable inside a false conditional
        run: |
          set -euo pipefail
          if false; then
            set +o pipefail
          fi
          counted=$(printf 'a\nb\n' | head -1)

      # (d) a subshell: `set` in a subshell is local to it and never reaches the parent.
      - name: disable inside a subshell
        run: |
          set -euo pipefail
          (
            set +o pipefail
          )
          counted=$(printf 'a\nb\n' | head -1)

      # --- SAME-LINE RE-ENABLE CONTROLS (review r2 of #924). `set -o pipefail` takes effect for the
      # REST OF ITS OWN LINE, so the pipeline after the separator runs WITH pipefail and is in the
      # 141 class. A per-LINE state machine blanked the whole line under the pre-re-enable state and
      # scored 0 for both steps below — fail-OPEN, and invisible to the step above because that one
      # puts its vulnerable pipeline on the NEXT line. Each step below must be counted (2 total):
      # the `tolerated=` line is genuinely exempt, the same-line one is not. Both normal separators
      # are covered, since a splitter could plausibly know one and not the other. ---
      - name: re-enabled by `&&` on the same line as the vulnerable pipeline
        run: |
          set +o pipefail
          tolerated=$(printf 'a\nb\n' | head -1)
          set -o pipefail && counted=$(printf 'a\nb\n' | head -1)

      - name: re-enabled by `;` on the same line as the vulnerable pipeline
        run: |
          set +o pipefail
          tolerated=$(printf 'a\nb\n' | head -1)
          set -o pipefail; counted=$(printf 'a\nb\n' | head -1)

      # ...and splitting a line into commands must not hand the DISABLE direction a new bypass: the
      # splitter knows nothing of quoting, so a `set +o pipefail` sitting inside a string is TEXT,
      # and honouring it would blank the rest of the body — the same fail-OPEN the scope rules above
      # exist to stop. Anchoring a disable to the FIRST command of its line is what keeps that out,
      # and the pipeline below must be counted (1).
      - name: quoted disable mid-line is text, not a state change
        run: |
          set -euo pipefail
          echo 'a; set +o pipefail b'
          counted=$(printf 'a\nb\n' | head -1)
